<style>
/* Agent 折腾志 — 终端笔记本
 *
 * 配色不用「黑底荧光绿」那套终端刻板印象，而是取调好的 dotfile 主题的感觉：
 * 纸底带极淡的绿灰偏色，强调色是沉下来的青（deep teal），高分条目用琥珀作信号色。
 * 语义色（青=强调，琥珀=精选，红=失败）和中性色分开，互不借用。
 *
 * 字体全部走系统栈：Artifact 的 CSP 挡外链字体，内嵌 data URI 又会让页面膨胀到几百 KB，
 * 而中文正文本来就该用 PingFang / 苹方这一类本地字体。识别度靠等宽数据面、字重跨度和字距做。
 */

:root {
  color-scheme: light dark;

  --paper: #f4f6f3;
  --surface: #fbfcfa;
  --surface-2: #eceee9;
  --ink: #191d1b;
  --ink-soft: #4b544f;
  --ink-mute: #78827c;
  --line: #dde1dc;
  --line-soft: #e8ebe6;
  --accent: #0d7a68;
  --accent-soft: #d8ece7;
  --signal: #b35c07;
  --signal-soft: #f6e6d2;
  --danger: #a63328;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;

  --rule: #191d1b;
  --rail: 232px;
  --gutter: 3.25rem;
  --radius: 3px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111513;
    --surface: #171c19;
    --surface-2: #1e2421;
    --ink: #e4e9e5;
    --ink-soft: #a9b3ad;
    --ink-mute: #7c877f;
    --line: #29302c;
    --line-soft: #212724;
    --accent: #4ecdb6;
    --accent-soft: #16302b;
    --signal: #e79a4d;
    --signal-soft: #33251440;
    --danger: #e0796c;
    --rule: #39423d;
  }
}

/* 用户手动切换主题时，data-theme 必须压过上面的媒体查询——两个方向都要压。 */
:root[data-theme="dark"] {
  --paper: #111513;
  --surface: #171c19;
  --surface-2: #1e2421;
  --ink: #e4e9e5;
  --ink-soft: #a9b3ad;
  --ink-mute: #7c877f;
  --line: #29302c;
  --line-soft: #212724;
  --accent: #4ecdb6;
  --accent-soft: #16302b;
  --signal: #e79a4d;
  --signal-soft: #33251440;
  --danger: #e0796c;
  --rule: #39423d;
}

:root[data-theme="light"] {
  --paper: #f4f6f3;
  --surface: #fbfcfa;
  --surface-2: #eceee9;
  --ink: #191d1b;
  --ink-soft: #4b544f;
  --ink-mute: #78827c;
  --line: #dde1dc;
  --line-soft: #e8ebe6;
  --accent: #0d7a68;
  --accent-soft: #d8ece7;
  --signal: #b35c07;
  --signal-soft: #f6e6d2;
  --danger: #a63328;
  --rule: #191d1b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--paper);
  /* 极淡的方格纸底纹。只有一层，别喧宾夺主。 */
  background-image: radial-gradient(circle at 1px 1px, var(--line-soft) 1px, transparent 0);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius);
}

.app {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 clamp(1rem, 3vw, 2.5rem) 5rem;
}

/* ---------- 报头 ---------- */

.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.75rem 1.25rem;
  padding: 2.5rem 0 1.25rem;
  /* 暗色下 --ink 接近纯白，2px 实线会变成一条很吵的亮带，压到中性描边色。 */
  border-bottom: 2px solid var(--rule);
}

.wordmark {
  margin: 0;
  font-size: clamp(1.5rem, 3.4vw, 2.1rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.wordmark .prompt {
  color: var(--accent);
  font-family: var(--mono);
  font-weight: 500;
  margin-right: 0.35em;
}

.tagline {
  color: var(--ink-mute);
  font-size: 0.82rem;
  letter-spacing: 0.02em;
  margin: 0;
  flex: 1 1 16rem;
}

.masthead-meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

.theme-toggle {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.2rem 0.55rem;
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-soft);
}

.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- 主体骨架 ---------- */

.frame {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  gap: 2.5rem;
  align-items: start;
}

.rail {
  position: sticky;
  top: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
  padding-top: 1.75rem;
  max-height: calc(100vh - 2.5rem);
  overflow-y: auto;
}

.rail-block { display: flex; flex-direction: column; gap: 0.5rem; }

.rail-label {
  margin: 0;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

.view-btn,
.chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  width: 100%;
  padding: 0.28rem 0.5rem;
  border-radius: var(--radius);
  font-size: 0.85rem;
  color: var(--ink-soft);
  text-align: left;
}

.view-btn:hover,
.chip:hover { background: var(--surface-2); color: var(--ink); }

.view-btn[aria-pressed="true"],
.chip[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

.chip .count {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

.chip[aria-pressed="true"] .count { color: var(--accent); }

.tag-list { max-height: 13rem; overflow-y: auto; }

.rail-empty { margin: 0; padding: 0.2rem 0.5rem; font-size: 0.8rem; color: var(--ink-mute); }

/* 话题不是工具，视觉上也要分开：话题用方括号包住，像个标记而不是产品名。 */
#topics .chip .label::before { content: "["; color: var(--ink-mute); }
#topics .chip .label::after { content: "]"; color: var(--ink-mute); }
#topics .chip .label { font-family: var(--mono); font-size: 0.78rem; }

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.cal-day {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 2px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

.cal-day[data-has="yes"] { background: var(--accent-soft); color: var(--accent); }
.cal-day[aria-pressed="true"] { outline: 1.5px solid var(--accent); }
.cal-day:hover { color: var(--ink); }

/* ---------- 内容流 ---------- */

.content { min-width: 0; padding-top: 1.75rem; }

.day-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem 1rem;
  margin-bottom: 0.75rem;
}

.day-date {
  margin: 0;
  font-family: var(--mono);
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}

.day-count {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-mute);
}

.day-note {
  margin: 0 0 2rem;
  padding: 0.85rem 1rem 0.85rem 1.1rem;
  border-left: 2px solid var(--accent);
  background: var(--surface);
  color: var(--ink-soft);
  font-size: 0.9rem;
  max-width: 62ch;
}

.day-note strong { color: var(--ink); font-weight: 600; }

.entries { display: flex; flex-direction: column; }

.entry {
  display: grid;
  grid-template-columns: var(--gutter) minmax(0, 1fr);
  gap: 0 1rem;
  padding: 1.4rem 0;
  border-top: 1px solid var(--line-soft);
}

.entry:first-child { border-top: none; }
.entry[data-read="true"] { opacity: 0.5; }
.entry[data-read="true"]:hover { opacity: 1; }

.entry-gutter {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.4rem;
  padding-top: 0.15rem;
}

.entry-rank {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

/* 评分用 5 段竖条，比星星更像仪表、也更容易一眼比较高低。 */
.meter { display: flex; gap: 2px; }

.meter i {
  display: block;
  width: 4px;
  height: 11px;
  border-radius: 1px;
  background: var(--line);
}

.meter i[data-on="1"] { background: var(--accent); }
.entry[data-pick="true"] .meter i[data-on="1"] { background: var(--signal); }

.entry-title {
  margin: 0 0 0.3rem;
  font-size: 1.06rem;
  font-weight: 650;
  line-height: 1.4;
  letter-spacing: -0.008em;
  text-wrap: balance;
}

.entry-title a { text-decoration: none; }
.entry-title a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

.pick-flag {
  display: inline-block;
  margin-right: 0.45rem;
  padding: 0.08rem 0.34rem;
  border-radius: 2px;
  background: var(--signal-soft);
  color: var(--signal);
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  vertical-align: 0.16em;
}

.why {
  margin: 0 0 0.5rem;
  color: var(--accent);
  font-size: 0.92rem;
  font-weight: 500;
  max-width: 64ch;
}

.summary {
  margin: 0 0 0.65rem;
  color: var(--ink-soft);
  font-size: 0.93rem;
  max-width: 66ch;
}

.entry-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 0.7rem;
  font-family: var(--mono);
  font-size: 0.71rem;
  color: var(--ink-mute);
}

.entry-meta .sep { color: var(--line); }

.tool-tag {
  padding: 0.05rem 0.35rem;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--ink-soft);
}

/* 条目上的话题标签：虚线框，和实线的工具标签区分 */
.topic-tag {
  padding: 0.05rem 0.35rem;
  border: 1px dashed var(--line);
  border-radius: 2px;
  color: var(--ink-mute);
}

.thin-flag { color: var(--signal); }

.entry-actions { display: flex; gap: 0.6rem; margin-left: auto; }

.act {
  font-family: var(--mono);
  font-size: 0.71rem;
  color: var(--ink-mute);
  padding: 0.05rem 0.3rem;
  border-radius: 2px;
}

.act:hover { color: var(--accent); background: var(--surface-2); }
.act[aria-pressed="true"] { color: var(--signal); font-weight: 600; }

.empty {
  padding: 4rem 0;
  color: var(--ink-mute);
  text-align: center;
  font-size: 0.9rem;
}

/* ---------- 信源面板 ---------- */

.panel { display: flex; flex-direction: column; gap: 1.25rem; }

.panel-intro { margin: 0; color: var(--ink-soft); font-size: 0.9rem; max-width: 62ch; }

.table-wrap { overflow-x: auto; }

table.sources {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

table.sources th,
table.sources td {
  text-align: left;
  padding: 0.5rem 0.7rem 0.5rem 0;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: top;
}

table.sources th {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 500;
  white-space: nowrap;
}

table.sources td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.sources td.kind { white-space: nowrap; }
table.sources td.desc { color: var(--ink-mute); font-size: 0.8rem; min-width: 18rem; }

.state {
  display: inline-block;
  padding: 0.05rem 0.4rem;
  border-radius: 2px;
  font-family: var(--mono);
  font-size: 0.68rem;
}

.state[data-s="ok"] { background: var(--accent-soft); color: var(--accent); }
.state[data-s="warn"] { background: var(--signal-soft); color: var(--signal); }
.state[data-s="bad"] { background: var(--signal-soft); color: var(--danger); }

.hidden { display: none !important; }

@media (max-width: 860px) {
  .frame { grid-template-columns: 1fr; gap: 1.5rem; }
  /* 手机上先看文章，再看筛选器。
   * 不换序的话要先划过搜索框、四个视图、二十多个工具标签和日历，
   * 约一屏半的筛选器之后才见到第一篇文章——而手机上绝大多数人是来扫今天有什么的。 */
  .content { order: -1; padding-top: 1.25rem; }
  .rail { position: static; max-height: none; padding-top: 0; border-top: 1px solid var(--line); }
  .rail-label { padding-top: 0.5rem; }
  .tag-list { max-height: 9rem; }
  .entry { grid-template-columns: 1fr; gap: 0.5rem; }
  .entry-gutter { flex-direction: row; align-items: center; gap: 0.6rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>

 / Agent / 委派，每一级的信任凭证必须是可验证的证据（测试变绿、Diff），不是模型说一句「已完成」。委派前先让 AI 出规格文档：他要的「旧数据缺字段静默按 normal 处理」被 AI 理解成了加载时报警告，在 Spec 里改一句话就纠正了，等写成代码再改要跨好几个文件返工。另记了两个 Qoder 的坑：Agent/Experts 模式在建任务时锁定、中途不能切，编辑历史消息会触发工作区文件回滚。","whyRead":"他把两行的小改动丢给 Agent，等它分析完项目结构反而比自己手写慢三倍——信任阶梯不只要会往上爬。","rating":4,"tools":["qoder"],"topics":["vibe-coding","spec-driven","context-engineering"],"publishedAt":"2026-07-26T14:26:24.000Z","author":"用户3789982212128","preScore":17},{"id":"b9ad79dd7c7410dc","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/rossiXYZ/p/22084795","titleOriginal":"【Agentic RL / 强化学习 / OPD】OpenClaw-RL 源码阅读笔记 --- (15)--- Combine模式 - 罗西的思考","titleZh":"OpenClaw-RL 源码笔记（15）：RL 奖励和 OPD 教师信号怎么合进同一次 PPO 更新","summaryZh":"openclaw-combine 模式的源码拆解。架构上是继承而非重写：Combine server 直接继承 OPD server，hint 提取、teacher log-probs、top-K 蒸馏原样复用，只重写了样本提交的两个方法。关键选择是混 advantage 而不是混 loss，作者给的理由是 PPO 的 clip 作用在概率比 r_t 上、不是作用在 A 上。再往下是三路分发：只有 hint、只有 eval 分数、两者都有、两者都无，各自构造什么样本、产生什么方向的梯度，以及 w_rl / w_opd 该怎么调。","whyRead":"两种训练信号不是混 loss 而是混 advantage——作者解释了为什么 PPO 的 clip 语义决定了只能这么选。","rating":4,"tools":["openclaw"],"topics":[],"publishedAt":"2026-08-03T12:49:00.000Z","author":"","preScore":11}],"reviewed":36,"dropped":31,"stats":{"sources":218,"fetched":471,"shortlisted":36,"rejected":435,"thin":179,"enriched":102,"enrichAttempted":216,"failedSources":6},"errors":[{"source":"小众软件论坛搜索","error":"部分查询失败（15/30）"},{"source":"掘金搜索","error":"部分查询失败（1/30）"},{"source":"陶叔 taoshu.in","error":"fetch failed"},{"source":"犀利豆的博客","error":"The operation was aborted due to timeout"},{"source":"范叶亮的博客","error":"HTTP 503"},{"source":"SkyWT","error":"HTTP 503"},{"source":"樵夫的小站","error":"HTTP 503"},{"source":"东方星痕","error":"HTTP 503"}]},{"date":"2026-08-03","generatedAt":"2026-08-03T06:20:00.000Z","dailyNote":"今天入围 19 条，收得下的只有 2 条，因为名单被两种「连载」灌满了：SegmentFault 上一套《OpenCode 源码详解》系列教程一天占了 5 席，自称「内容核实自 opencode.ai/docs 和 DeepWiki」——那不是读源码，是转述文档；iT 邦幫忙的铁人赛 Day1/Day2/Day3 又是一批入门介绍。剩下的大头是产品自荐：Octo、多 agent 编排平台、上下文压缩插件，都写得不 跑的两篇，中间我把昨夜攒下的候选补评了一轮，六点这一轮只抓到 89 条新内容、规则入围 1 条，读完没收——那条是掘金上一篇「AI Agent 记忆系统」的体系化综述，正文被 Cloudflare 挡住只剩目录，从「认知科学到工程实现」的章节结构看更像讲义而不是谁真动过手，宁可空手。SegmentFault 这个新接的源第一次出货，量不小但杂：27 条候选里有 MonkeyCode 的两篇广告、阿里云数据库软文、「效率飙升 10 倍」这类标题党、下载教程和课程推广，最后只留了 7 篇。另有一篇拆微软效率报告的写得不错，但作者自己没动手，按「得真的动过手」这条线还是拿掉了。最值得先读的仍是「装了 Hermes Agent 三个月」——凌晨一点半开着三个窗口来回切，问题解决了才想起来「我只是想让 AI 帮我写个周报而已」。","items":[{"id":"8e5520d70124b295","source":"SegmentFault 搜索","kind":"search","url":"https://segmentfault.com/a/1190000048025422","titleOriginal":"两天真实体验，Claude Code+ MiniMax-M3 比 CC+ DeepSeek编程强太多","titleZh":"账号被封之后：Claude Code 配 MiniMax-M3 比配 DeepSeek 强太多","summaryZh":"Claude Code 账号彻底被封后作者一路找替代：第一选择 CC + DeepSeek，编程能跑但低级问题不断，编译错误和 yaml 反复出错；中间试过 GitHub Copilot CLI 和 Cursor CLI，都能用但价格比 CC 贵一截，性价比不够；转折点是顺手试了 MiniMax，编程能力有惊喜。两天真实体验的对比。","whyRead":"被封号之后的替代方案实测，三条路都走过一遍才给的结论。","rating":5,"tools":["claude-code","copilot-cli","cursor"],"topics":[],"publishedAt":"2026-07-14T07:31:31.000Z","preScore":12},{"id":"e013d1978427a254","source":"SegmentFault 搜索","kind":"search","url":"https://segmentfault.com/a/1190000048068273","titleOriginal":"装了Hermes Agent三个月，我终于搞明白前端该怎么选了","titleZh":"装了 Hermes Agent 三个月，我终于搞明白前端该怎么选了","summaryZh":"凌晨一点半，作者盯着三个同时打开的窗口发呆：左边 Open WebUI 刚生成一张 Mermaid 流程图，中间 Hermes Web 管理端在排查 Skill 调用报错，右边终端滚着 Python 依赖日志。来回切了半小时问题是找到了，但他突然想问自己——我到底在干什么？我只是想让 AI 帮我写个周报而已。文章从这个「装完 Agent 反而不知道该打开哪个界面」的迷茫出发，梳理前端形态该怎么选。","whyRead":"装完一堆 agent 之后那种「界面太多反而更慢了」的具体样子，很少有人肯写出来。","rating":5,"tools":["hermes"],"topics":["skills"],"publishedAt":"2026-07-23T12:13:45.000Z","preScore":9},{"id":"d067ce925a9c9757","source":"枫言枫语","kind":"blog","url":"https://justinyan.me/post/6679","titleOriginal":"主观体感对比 Fable 5 vs Opus 5 vs Codex 5.6 Sol vs Kimi K3","titleZh":"四家顶配订阅同时在手，他把 Fable 5 / Opus 5 / Codex 5.6 / Kimi K3 排了个序","summaryZh":"同时养着 Claude、ChatGPT Pro、Kimi 三家顶配订阅后的排序：Fable 5 xHigh 最强，常能一次出可用产出；Opus 5 讨论需求要来回多轮，被降级成 Fable 的 subagent 用；Codex 5.6 Sol 居中但极耐用，本月折算 API 单价冲到 1.4 万美元仍没跑满；Kimi K3 智商接近 Codex，但 5 小时限额触发太快，扛不住 最值得先读的是「我的 AI 助手疯了，30 分钟停不下来」——agent 陷进沉没成本时长什么样，写得比任何局限性总结都具体。","items":[{"id":"9dfff7fb6ffd4efd","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1230827","titleOriginal":"我的 Agent 使用心路历程","titleZh":"我的 Agent 使用心路历程：从 NanoClaw 一路摸到 Agent SDK","summaryZh":"作者第一个上手的是 NanoClaw，看中它代码量少、主逻辑读得懂，后来因为多通道和容器化对自己没必要而弃用。顺着它跑在 claude-agent-sdk 上这条线，发现 Claude Code 和 Claude Desktop 也是同一套底座，Codex 和 OpenCode 各有自己的 SDK，但负责的东西是同一批：Session 管理、模型调用、Agent Loop。","whyRead":"从「用工具」到「看懂工具底下是什么」的一条真实路径，不是教程写法。","rating":5,"tools":["claude-code","claude-desktop","codex","hermes","nanoclaw","openclaw","opencode"],"publishedAt":"2026-07-29T12:45:44.000Z","author":"sumtsui","preScore":9,"topics":["agent-sdk"]},{"id":"2e45e22d433b8ee3","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1229795","titleOriginal":"CLI、MCP、Skills 同时在场 —— 从 8 个 Agent 源码看到的","titleZh":"CLI、MCP、Skills 同时在场：读了 8 个 Agent 的源码之后","summaryZh":"关于 MCP、Skills、CLI 谁更好该怎么选的讨论已经来回几波，但大多停留在定性层面。作者的做法是直接去读 Codex、Claude Code、OpenClaw、Hermes 等 8 个 Agent 的源码，看它们实际怎么把这三样东西同时摆在一起、各自承担什么。","whyRead":"同类话题里少有的源码级横向对比，不是又一篇「三者区别是什么」。","rating":5,"tools":["claude-code","codex","gemini-cli","hermes","openclaw","opencode"],"publishedAt":"2026-07-25T14:42:36.000Z","author":"Loocor","preScore":7,"topics":["mcp","skills"]},{"id":"be9dbc2659827468","source":"sjdhome blog","kind":"blog","url":"https://sjdhome.com/posts/tmux-agent-watch/","titleOriginal":"借鉴 Herdr，让 Claude 从头到尾写出一个 tmux AI Agent 监控器","titleZh":"让 Claude 从头到尾写出一个 tmux 的 AI Agent 监控器","summaryZh":"作者 tmux 里常年开着好几个 agent：一个 session 在改 bug，一个在整理笔记，还有一个跑长任务。人可以去干别的，但得隔一会儿把窗口挨个切一遍，看谁跑完了、谁卡在权限确认框上。他先试过 Stop hook 发系统通知、让 agent 往 IRC 发消息，都不解决本质问题——他要的是当前状况，而通知只反映某个时间点的状况。","whyRead":"并行开多个 agent 之后必然撞上的问题，以及一个想清楚了才动手的解法。","rating":5,"tools":["claude-code"],"publishedAt":"2026-07-23T16:00:00.000Z","preScore":7,"topics":[]},{"id":"f1911aa1dbc80392","source":"毛英龙的数字花园","kind":"blog","url":"https://blog.rnm.gv.uy/2026/07/20/ai-agent-sunk-cost-trap/","titleOriginal":"我的 AI 助手疯了，30 分钟停不下来","titleZh":"我的 AI 助手疯了，30 分钟停不下来","summaryZh":"起因很小：有道云笔记 CLI 有个 bug 会把报错堆栈写进笔记。助手 2 分钟定位根因、5 分钟加了防御层，问题本已解决。然后它说「我想从根本上解决这个 CLI 的不稳定性」——提议用纯 Python 写 MCP SSE 客户端直连私有协议，20 分钟写了 12K 代码，POST 超时、换 URL 404、换 header 还是超时。正常人此时该换路，它的选择是再加三个方案：抓包分析、逆向 Web API、反编译客户端。","whyRead":"agent 陷进沉没成本时长什么样，这篇写得比任何「局限性」总结都具体。","rating":5,"tools":["claude-code"],"publishedAt":"2026-07-20T15:00:00.000Z","preScore":8,"topics":["mcp"]},{"id":"dd0baac597d40845","source":"创见思考","kind":"blog","url":"https://www.fengcan.net/ai-memory-sole-writer/","titleOriginal":"给 AI 管记忆的第二课：一个人怎么当三家智能体的唯一写入者","titleZh":"给 AI 管记忆的第二课：一个人怎么当三家智能体的唯一写入者","summaryZh":"上一篇的铁律是「记忆只能有一本账」，但退场的那几家并没有死，仍在干活、仍会发现值得记住的事实。作者日常用三个编程智能体：Claude Code 主力干重活写记忆，Codex 跑独立小任务，Kimi Code 是新买的。三家各有各的指令文件格式和技能加载路径。这一轮解决的是一套核心指令怎么同步、技能包怎么不走样、新发现怎么回流到唯一那本账——落地方案是一个 canonical 目录放 Dropbox 跨设备同步，生成四份产物。","whyRead":"多 agent 并用的记忆管理，作者说「坑的形状比结论本身更值钱」，确实如此。","rating":5,"tools":["claude-code","codex","kimi-code"],"publishedAt":"2026-07-19T14:09:09.000Z","preScore":6,"topics":["skills","claude-md"]},{"id":"2e7d3b4c47a68b17","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1228000","titleOriginal":"做 DeepSeek Agent 近一个月，同步下 Orca 的进展","titleZh":"做 DeepSeek 原生 Agent 一个月：880 次提交，Rust 从 3.9 万行涨到 18 万行","summaryZh":"作者同步 Orca 的一个月进展：代码全部由 codex、claude code 和 Orca 自己写，他只做两件事——提需求和定质量门禁。门禁包括 2300 多个测试、20 个契约测试套件把 agent loop / 审批 / provider / shell 会话 / 子代理 / workflow 的边界锁死，以及需求必须先落 spec 再落 plan 才准动手，目前攒了 25 篇设计和 60 篇实施计划。","whyRead":"「让 agent 写全部代码」的规模化答案不是提示词技巧，是质量门禁。这篇给了具体数字。","rating":5,"tools":["claude-code","codex"],"publishedAt":"2026-07-17T06:10:53.000Z","author":"echoVic","preScore":8,"topics":["spec-driven"]},{"id":"abb00c7d558574c6","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/07/15/obsidian-as-ide/","titleOriginal":"使用 Obsidian 作为 AI 时代的 IDE：Karpathy「Wiki as Codebase」的落地实践——Claudian、CLAUDE.md 与 Vault Lint","titleZh":"把 Obsidian 当 AI 时代的 IDE：Karpathy「Wiki as Codebase」的落地实践","summaryZh":"作者把 Karpathy 那句「Obsidian is the IDE, LLM is the programmer, wiki is the codebase」真的落了地：Obsidian 加 Claudian 插件，vault 根目录放 CLAUDE.md schema，把设计决策、AI 对话历史、DB schema、跨服务上下文都沉淀成可以 Lint 的知识网络。文末给了一次跨度两周、15 个决策、13 个 commit 的重构实战，外加两条能直接扔给 Claudian 的 Vault Lint prompt。","whyRead":"「上下文该放哪」这个问题，这是我见过最完整的一套答案，而且带实战数据。","rating":5,"tools":["claude-code","claudian"],"publishedAt":"2026-07-15T21:23:41.000Z","preScore":12,"topics":["claude-md"]},{"id":"0c36841c8d82d17f","source":"宝玉xp","kind":"blog","url":"https://baoyu.io/blog/2026-07-12/caveman-token-saving-test","titleOriginal":"“母病速归”式 AI：号称省 65% Token，实测只有 8.5%","titleZh":"「母病速归」式 AI：号称省 65% token，实测只有 8.5%","summaryZh":"宝玉把那种要求 AI 尽量少说话的 Skill 叫「电报体 Skill」，类比小时候学写电报文——母亲生病让哥哥回家，最省能压到「母病速归」四个字，再少就传不清了。他实测了这类号称大幅省 token 的 Skill，宣称 65%，实际只有 8.5%。","whyRead":"一个流传很广的省 token 说法被拿去实测，结果差了近八倍。","rating":5,"tools":["claude-code"],"publishedAt":"2026-07-12T00:00:00.000Z","preScore":6,"topics":["skills"]},{"id":"de81c7d074cb514a","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/ai-go-hub/p/22135559","titleOriginal":"从 PHP 到 AI + Golang，程序员自救转型手记（四十六）：再次优化基类 - 妙码生花","titleZh":"从 PHP 到 AI + Golang 转型手记（四十六）：再次优化基类","summaryZh":"一个 PHP 全栈工程师用 claude code、codex、deepseek、豆包等工具从零学 Go、做 ai-go-admin 开源项目的连载，已经写到第 46 期。本期讲基控制器、基服务、基仓储的再次优化，其中列表数据有序性这件事很多项目根本没做、甚至不知道有这个概念。","whyRead":"带着 AI 学一门新语言并且真做出东西，连载 46 期的人不多。","rating":4,"tools":["claude-code","codex"],"publishedAt":"2026-08-01T09:42:00.000Z","preScore":7,"topics":[]},{"id":"ba1b2f7d65c2ba3e","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1231355#reply9","titleOriginal":"在浏览器里跑真· Linux 读我的博客，这波操作什么水平？🔥","titleZh":"在浏览器里跑真·Linux 读我的博客，全程 Vibe Coding","summaryZh":"作者一直想给博客加个终端版入口，去年嫌麻烦鸽了，上个月全程跟 AI 聊天写代码给捣鼓了出来。现在能在浏览器里用 WASM 版 Linux 内核访问博客，是真的 busybox + shell + wget，能 cat 文章、看评论、联网。他给上游提了 issue 作者第二天就修了，后来又做了个轻量 JS 版让手机也能跑。AI 写了设备驱动、网络网关和交互脚本。","whyRead":"「去年嫌麻烦鸽了，今年 AI 帮我做完了」——很多人的 2026 都是这个剧本。","rating":4,"tools":[],"publishedAt":"2026-07-31T16:08:58.000Z","preScore":7,"topics":["vibe-coding"]},{"id":"4c3f2e85ae245286","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1231338","titleOriginal":"我把 Claude Code 的 statusline 和主题配置整理成了一个可版本化仓库","titleZh":"把 Claude Code 的 statusline 和主题配置做成一个可版本化的仓库","summaryZh":"作者的痛点很具体：对话一长交代过的任务就滚出视野，目录、worktree、分支、Git 状态散在不同命令里，主题改完没法同步回滚。于是把 statusline 和主题抽成独立仓库 claude-code-config，让状态栏常驻显示最近一条指令、当前 worktree 和分支、conflict/stash/modified/staged 的计数，以及模型和用量。","whyRead":"配置即代码这件事在 Claude Code 上到底怎么落地，这是一份能直接抄的答案。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-31T13:43:50.000Z","author":"ichanne","preScore":16,"topics":[]},{"id":"82026fbe87c4ae57","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1231245","titleOriginal":"用 Claude Code 抢了一个还没发售的游戏的 wiki 站，上线 4 天开始出数据了","titleZh":"用 Claude Code 抢注了一个还没发售的游戏的 wiki 站，上线四天开始出数据","summaryZh":"盯上一款 8 月 10 号进 Early Access 的 Steam 游戏，趁搜索词还没人做，注册精确匹配域名做第三方攻略站。Astro Starlight + Cloudflare Pages 免费层，34 个全静态页面，从选词到上线约两天，全程 Claude Code 干活。游戏有免费序章可实测，内容不靠洗通稿；上线第三天被 Google Safe Browsing 误判成欺骗性网页，作者把新域名加游戏关键词撞上假下载站分类器的过程也写了。","whyRead":"从选词、建站到被搜索引擎误伤，一条完整的实验链路，连翻车都记下来了。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-31T06:56:38.000Z","author":"sutree900","preScore":6,"topics":[]},{"id":"1739914059371bc7","source":"陈少文","kind":"blog","url":"https://www.chenshaowen.com/blog/openspec-spec-driven-development-for-ai.html","titleOriginal":"OpenSpec：给 AI 编程加一层轻量规格契约","titleZh":"OpenSpec：给 AI 编程加一层轻量规格契约","summaryZh":"OpenSpec 不教 AI 新的编程技巧，而是在人和 AI 之间加一层「同意层」——写代码之前先把要做什么写成纸面约定。设计上分两部分：Specs 是描述系统当前行为的 Markdown，按能力组织在 openspec/specs/ 下作为唯一事实来源；Changes 是每项工作一个文件夹，内含 proposal、design、tasks 和 delta specs 四个产物。","whyRead":"规格驱动开发喊了很久，这是一个结构讲得足够具体、能照着搭的实现。","rating":4,"tools":["claude-code","cursor","gemini-cli"],"publishedAt":"2026-07-31T00:00:00.000Z","preScore":7,"topics":["spec-driven"]},{"id":"7c60d31a70d1bcd8","source":"elmagnifico","kind":"blog","url":"https://elmagnifico.tech/2026/07/30/Agent-IDE-Compare/","titleOriginal":"Cursor、Claude、Codex深度体验、对比","titleZh":"Cursor、Claude、Codex 深度体验与对比","summaryZh":"作者把三个工具都用了一遍做横向对比。Cursor 用得最多，理解和使用门槛以程序员为基准，但默认套餐上下文只有 260K 而别人都 1M+，大需求容易跑过，好在内置了压缩上下文和长期记忆会自动衔接。作者的判断是 Cursor 没有 Claude 和 Codex 激进，更偏向为已有工程和程序员协作服务，对现有工作流改动小，适合循序渐进切到 agent 工作流；它想主推的 Agent 模式反而对既有工程不如 IDE 模式好用。","whyRead":"三家横评里少见的、带具体参数和使用倾向判断的一篇。","rating":4,"tools":["cursor","claude-code","codex"],"publishedAt":"2026-07-29T16:00:00.000Z","preScore":12,"topics":[]},{"id":"9b49a7456614794e","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1230837","titleOriginal":"深入 Cursor 架构：一个 AI 编辑器是如何被「流式」重塑的","titleZh":"深入 Cursor 架构：一个 AI 编辑器是怎么被「流式」重塑的","summaryZh":"开篇就声明这不是怎么用 Cursor 的教程，而是纯架构视角的复盘。作者先做第一性原理推导，认为 AI 原生编辑器被流式、低延迟、上下文三个约束框死，再看 Cursor 用 Agent 状态机和多进程隔离两个核心机制怎么回应，最后落到一个飞轮和一处代价。","whyRead":"想知道 AI 应用的难点到底在哪，比读功能对比有用得多。","rating":4,"tools":["cursor"],"publishedAt":"2026-07-29T13:45:58.000Z","author":"xdlkc","preScore":10,"topics":[]},{"id":"4b5ce4655dab1d79","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/07/28/claude-code-tools-ask-user-question/","titleOriginal":"Claude Code Tools 研究系列（一）—— AskUserQuestion：把「AI 提问」变成结构化交互原语","titleZh":"Claude Code Tools 研究系列（一）：AskUserQuestion 把提问变成结构化交互原语","summaryZh":"作者之前用 Java 写过一个乞丐版 Claude Code，觉得它的 tools 设计得非常精巧，于是打算逐个研究。开篇聊 AskUserQuestion——它不是让模型输出一段问题字符串等回复，而是把问题渲染成交互式选择面板。解决的核心问题是人机对齐效率：用户从打字回答变成点选项，响应时间大幅缩短；模型拿到的是明确枚举值，不用再解析自然语言，歧义也就收敛了。","whyRead":"从「自己实现过一遍」的视角拆 Claude Code 的工具设计，角度很少见。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-28T22:22:00.000Z","preScore":9,"topics":[]},{"id":"e6944ebdd9631613","source":"israynotarray","kind":"blog","url":"https://israynotarray.com/ai/20260727/3871780834/","titleOriginal":"Claude Code 中輸入 /model 找不到你要的模型？試試這小技巧吧！","titleZh":"Claude Code 里 /model 找不到你要的模型？这有个小技巧","summaryZh":"Claude Code 的 /model 指令列表通常只给 Default、Opus（1M context）、Fable、Sonnet、Opus 4.8 这几项，出了新模型或者想用列表外的模型时就选不到。文章给了一个绕过列表直接指定模型的办法。","whyRead":"两分钟能读完的小技巧，但卡过这一下的人不少。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-27T02:18:28.000Z","preScore":6,"topics":[]},{"id":"511aede7e1cd79c7","source":"又耳笔记","kind":"blog","url":"https://youerning.top/post/opencode/opencode-sharing/","titleOriginal":"AI 编程助手的'不务正业' — OpenCode 免费额度与自定义 Agent 实战","titleZh":"OpenCode 的两个「不务正业」用法：免费额度和自定义 Agent","summaryZh":"作者装 OpenCode 本来是为了写代码，用了几个月发现最惊喜的反而是两个不务正业的用法。一是免费额度慷慨到不登录也有免费模型，200K 上下文对服务器运维绰绰有余；二是它的 Agent 机制让他自定义了一个只会搜索的 agent，某种程度上能代替搜索引擎。文中也给了接自己 API Key 和订阅 Go 计划的选择。","whyRead":"把编程 agent 拿去干运维和搜索，是那种用出来才知道的路子。","rating":4,"tools":["opencode"],"publishedAt":"2026-07-26T11:00:26.000Z","preScore":7,"topics":[]},{"id":"418da908f6aea21a","source":"ISLAND","kind":"blog","url":"https://youngxhui.top/2026/07/opencodex-third-party-models/","titleOriginal":"opencodex：让 Codex 和 Claude Code 跑在任意 LLM 上","titleZh":"opencodex：让 Codex 和 Claude Code 跑在任意 LLM 上","summaryZh":"opencodex 是个本地代理，把 Codex 的 Responses API 翻译成任意 LLM provider 的协议。装完三行命令就能让 Codex CLI、Codex App、SDK 改道用 Claude、Gemini、DeepSeek、Grok、GLM、Qwen 甚至本地 Ollama，Claude Code 那边同样可以换任意模型，不用等官方支持。streaming、tool 调用、reasoning token、图片生成都双向工作，默认透传原有登录，随时可以再加别的模型。","whyRead":"被官方模型绑定这件事，有人写了个代理层直接绕过去了。","rating":4,"tools":["codex","claude-code"],"publishedAt":"2026-07-22T00:00:00.000Z","preScore":8,"topics":[]},{"id":"2269b337541a08d2","source":"TonyBai","kind":"blog","url":"https://tonybai.com/2026/07/20/introducing-cc-session-migrate/","titleOriginal":"我开源了 cc-session-migrate ：让 Claude Code 会话在多台机器之间自由迁移","titleZh":"我开源了 cc-session-migrate：让 Claude Code 会话在多台机器之间搬家","summaryZh":"Claude Code 的会话存在本地 ~/.claude/，换台机器 claude --resume 就是 No sessions found，上午在 MacBook 上理清的架构下午到服务器就断了。作者用 Go 写了 csm，做三件事：跨机器拉取会话并能无缝续接、把多个开发节点当集群管理、自动备份到 S3。直接 scp 整个目录会覆盖别的机器上的会话，这是它要解决的。","whyRead":"多机开发的人几乎都撞过这堵墙，而这是少见的把它真正做成工具的。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-19T21:00:00.000Z","preScore":12,"topics":[]},{"id":"d16b0b080681fc98","source":"明立非(Mingnify)的博客","kind":"blog","url":"https://mingnify.com/zh/blog/p/chat-work-codex-differences-use-cases/","titleOriginal":"Chat、Work、Codex 的区别和使用场景","titleZh":"Chat、Work、Codex 的区别和使用场景","summaryZh":"ChatGPT 和 Codex 合并后界面里出现了 Chat、Work、Codex 三种模式。作者给了一个最小定位：Chat 是对话和思考入口，适合提问讨论探索；Work 是知识工作和非编程任务的 Agent，适合整理资料、处理文档、产出方案；Codex 是项目和本地环境里的 Agent，围绕文件、代码、终端和验证推进任务。按工作方式可分成对话式 AI 和 AI Agent 两类，这个划分也顺带解释了为什么会有 Work 模式、额度怎么算、记录为什么有时同步有时不同步。","whyRead":"三个模式到底该用哪个，官方没讲清楚的部分这篇讲清楚了。","rating":4,"tools":["codex","chatgpt-desktop"],"publishedAt":"2026-07-19T16:00:00.000Z","preScore":6,"topics":[]},{"id":"f7fcbbf6411dd598","source":"XINDOO的博客","kind":"blog","url":"https://zxs.io/article/2201","titleOriginal":"浅谈 Loop Engineering 与组织运作的相似性","titleZh":"浅谈 Loop Engineering 与组织运作的相似性","summaryZh":"作者的一句话结论是：所谓 Loop Engineering，其实是把组织管理的老规律用 AI 时代的新语言重新说了一遍。他先梳理造词速度——Prompt Engineering 的思维链、少样本刚练熟，Context Engineering 就来了，重点从怎么写提示词变成怎么往上下文里塞对的东西；Context 还没玩明白 Harness 又成了高频词；现在又冒出 Loop Engineering。而且这次是几路一线同时在提：Claude Code 负责人 Boris Cherny 说自己已经不写 Prompt 而是写 Loop，Karpathy 反复强调必须把自己从 Loop 的执行过程里移出去。","whyRead":"对着满天飞的新词，有人把它翻译回了你本来就懂的东西。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-19T13:26:48.000Z","preScore":6,"topics":["context-engineering","loop-engineering"]},{"id":"17f25f2f8d28bf37","source":"TonyBai","kind":"blog","url":"https://tonybai.com/2026/07/19/agentic-engineering-thorsten-ball-amp-interview/","titleOriginal":"“皇帝的新衣”一年后：对话Thorsten Ball谈Agentic编程","titleZh":"《皇帝的新衣》一年后：对话 Thorsten Ball 谈 Agentic 编程","summaryZh":"一年前 Thorsten Ball 那篇《皇帝没穿新衣》提出一个反直觉的发现：不需要向量检索、不需要代码索引、不需要复杂的 Apply 模型，给大模型读文件、列文件、搜索文件三个工具，它就能在代码库里如鱼得水。这篇是一年后的回访，作者已从 Sourcegraph 转去做 Amp。","whyRead":"Agentic 编程叙事的起点之一，作者本人回头看当初的判断站不站得住。","rating":4,"tools":["amp","claude-code","cursor","zed"],"publishedAt":"2026-07-18T23:00:00.000Z","preScore":7,"topics":[]},{"id":"18dbe6ba6efcf93c","source":"TonyBai","kind":"blog","url":"https://tonybai.com/2026/07/18/introducing-tabqueue/","titleOriginal":"告别标签页焦虑：我让 AI 帮我做了个浏览器插件 TabQueue","titleZh":"告别标签页焦虑：我让 AI 帮我做了个浏览器插件 TabQueue","summaryZh":"作者描述自己的日常：早上刷 Hacker News 开五个标签，中午逛 GitHub 再开几个，晚上浏览器里躺着八十多个标签，每一篇都「回头要看」所以不敢关。于是做了 TabQueue，把标签页变成有序的阅读队列，支持一键收纳、按域名分组、逐个消化、自动归档。","whyRead":"一个真实的个人痒点，从难受到做出东西的完整过程。","rating":4,"tools":[],"publishedAt":"2026-07-17T23:00:00.000Z","preScore":8,"topics":["vibe-coding"]},{"id":"4e1132033b2efa45","source":"RYANUO的博客","kind":"blog","url":"https://ryanuo.cc/posts/grill-me-vs-superpowers","titleOriginal":"grill-me vs Superpowers：两种 Agent Skills 路线的全面对比","titleZh":"grill-me vs Superpowers：两条 Agent Skills 路线的全面对比","summaryZh":"Agent Skills 生态里绕不开的两个名字：Matt Pocock 的 grill-me 和 obra 的 Superpowers。很多人当成二选一，作者认为更准确的说法是它们在「动手前对齐」这件事上重叠，但产品形态、强制程度、覆盖生命周期差别很大。grill-me 是一组审讯式规划 skill，核心问题是「你真的想清楚了吗」，输出的是共享理解、默认可以不落盘；Superpowers 是一整套软件工程方法论加可组合 skills，核心问题是「如何按纪律从想法走到可合并分支」，输出的是设计文档到计划的完整链条。","whyRead":"两套 Skills 到底该选哪个，这篇把定位、机制、工作流都摊开了。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-17T18:00:00.000Z","preScore":13,"topics":["skills"]},{"id":"60c39618403a8a5f","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1228009","titleOriginal":"高强度使用各种 AI Agent 开发了好几个小玩具后发现了一个问题：各家的 Agent 在项目中到处拉一坨坨名叫 Skill、Rule、MCP 的屎","titleZh":"各家 Agent 在项目里到处拉 Skill、Rule、MCP，我受不了了","summaryZh":"因为各家 Agent 都有额度和时间限制，同一个项目往往要跨多个 Agent 开发。于是同一个 Skill 要在 .github 放一份、.claude 放一份、各家自己约定的根目录和入口文件再放几份，改一处要同步好几个地方。作者进一步指出问题的根子：有些资源本来是外部资源，却被各家按私有结构复制进了项目。","whyRead":"多 Agent 并用的人都在忍这件事，这篇把它说清楚了。","rating":4,"tools":[],"publishedAt":"2026-07-17T06:29:06.000Z","author":"bearbest","preScore":8,"topics":["mcp","skills","agents-md","claude-md"]},{"id":"0a16a0110c9063ba","source":"Android Performance","kind":"blog","url":"https://androidperformance.com/2026/07/17/SmartPerfetto-Six-Week-Update/","titleOriginal":"SmartPerfetto 2026.06.04-07.17 六周更新复盘：从 v1.0.28 到 v1.1.1","titleZh":"SmartPerfetto 六周更新复盘：150 个提交、13 个版本","summaryZh":"作者复盘自己的项目从 v1.0.28 到 v1.1.1 这六周，合入约 150 个提交、发布 13 个版本。上一篇的主线是把四条 Agent 运行时都跑通，这六周的主线是把四条运行时收敛到同一套契约之下，同时在分析体验、场景知识、公共生态三个方向扩展。文中用仓库内约定的统计命令给出了可量化的前后对比指标。","whyRead":"多 agent 运行时怎么收敛到一套契约，这是带六周真实提交数据的复盘。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-16T16:00:00.000Z","preScore":7,"topics":["skills"]},{"id":"9c4bdfe597204a8d","source":"轶哥博客","kind":"blog","url":"https://www.wyr.me/post/764","titleOriginal":"AI写标书踩过的那些坑","titleZh":"AI 写标书踩过的那些坑","summaryZh":"作者和做投标的用户一起梳理 AI 招投标流程，总结出六个坑：把「生成完成」当成「标书完成」、盯标只做关键词推送、让一个 Agent 从读标做到查标、做了大纲没做响应矩阵、把标书检查做成全文润色、每个项目都从头教一遍。一位电力行业投标负责人说他们的招标文件动不动上百页，过去光梳理要求就要几天；改成先让 Agent 把每条需要响应的内容列出来再进入写作和报价后，容易遗漏的资质响应明显少了。作者的建议是从零开始的话先做标书检查。","whyRead":"非编程的 Work Agent 落地案例，六个坑每个都长着真实业务的形状。","rating":4,"tools":[],"publishedAt":"2026-07-16T14:19:29.000Z","preScore":7,"topics":["agents-md"]},{"id":"02f2b826933e487c","source":"zhheo","kind":"blog","url":"https://blog.zhheo.com/p/94w0byur.html","titleOriginal":"screenpipe：开源本地的 AI 记忆引擎，让电脑更懂你","titleZh":"screenpipe：本地跑的开源 AI 记忆引擎","summaryZh":"作者在 B 站刷到能自动总结每天做了什么的日报助手，觉得需求成立——每天在无数标签页、聊天窗口、文档之间切换，下班时经常想不起来干了什么。但这类工具基本都是云服务，屏幕录像、音频、操作记录全传到别人服务器。于是去 GitHub 翻开源本地替代方案，找到了 YC 支持的 screenpipe。","whyRead":"「让电脑记得我今天干了什么」这件事，隐私优先的那条路走得通吗。","rating":4,"tools":["cursor","cline","claude-desktop"],"publishedAt":"2026-07-15T16:00:00.000Z","preScore":6,"topics":["mcp"]},{"id":"de2633c8121be343","source":"创见思考","kind":"blog","url":"https://www.fengcan.net/teach-dictation-my-terms/","titleOriginal":"让听写工具学会我的术语","titleZh":"让听写工具学会我的术语","summaryZh":"作者用了一阵 Typeless，口述变文字做得顺滑，但攒下两个疙瘩：转录历史锁在云端没有统一导出，以及他把「拍西艾」改回 PCI、「马乏凯泰」改回玛伐凯泰改了一次又一次，工具一次也没记住。于是想自己做一个，调研一圈发现已经有人造好了——CapsWriter-Offline，六千多星，识别全程在本地，拔掉网线照常工作。准的道理在于 Qwen3-ASR 的解码器本身是个 1.7B 语言模型，边听声学特征边写通顺的话，标点自带、中英夹杂不乱，再配音素级热词表。","whyRead":"「订阅照付、数据归人、个性化无从谈起」——换成本地方案的完整心路。","rating":4,"tools":[],"publishedAt":"2026-07-15T13:29:57.000Z","preScore":7,"topics":["vibe-coding"]},{"id":"73e10b4751f2baaf","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7661303393304313866","titleOriginal":"深入 Claude Code 的 CLAUDE.md","titleZh":"深入 Claude Code 的 CLAUDE.md：它 <script>
/* 纯逻辑：过滤、统计、状态存取。不碰 DOM，好写测试。
 * 构建时会和 ui.js 一起内联进页面；test/tinker-logic.test.mjs 直接读这个文件求值来测。 */

const STORE_KEY = 'tinker.state.v1';

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    return { read: raw.read || {}, starred: raw.starred || {} };
  } catch {
    return { read: {}, starred: {} };
  }
}

function saveState(state) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch {
    // 隐私模式下 localStorage 会抛。读写失败只损失「已读」记录，页面本身照常可用。
  }
}

/** 把日文件摊平成一维条目流，附上所属日期。 */
function flatten(days) {
  const out = [];
  for (const day of days) {
    for (const item of day.items || []) out.push({ ...item, date: day.date });
  }
  return out;
}

/**
 * 统计某一维度（tools / topics）下每个标签有多少条目。
 * 工具和话题分开统计，因为它们在侧栏是两组独立的筛选器。
 */
function facetCounts(items, facet) {
  const counts = new Map();
  for (const item of items) {
    for (const id of item[facet] || []) counts.set(id, (counts.get(id) || 0) + 1);
  }
  return [...counts.entries()].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1));
}

function matchesQuery(item, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return [item.titleZh, item.titleOriginal, item.summaryZh, item.whyRead, item.source, item.author]
    .some((v) => v && String(v).toLowerCase().includes(q));
}

/**
 * @param {object} opts view: all|unread|starred, tool: 工具 id 或 null, date: 日期或 null
 */
function filterItems(items, opts, state) {
  const { view = 'all', tool = null, topic = null, query = '', date = null } = opts || {};
  return items.filter((item) => {
    if (date && item.date !== date) return false;
    if (tool && !(item.tools || []).includes(tool)) return false;
    if (topic && !(item.topics || []).includes(topic)) return false;
    if (view === 'unread' && state.read[item.id]) return false;
    if (view === 'starred' && !state.starred[item.id]) return false;
    return !query || matchesQuery(item, query);
  });
}

/** 源的健康度。连续失败 3 次以内算抖动，7 次以上要人工处理。 */
function sourceState(status) {
  const n = (status && status.consecutiveFailures) || 0;
  if (n === 0) return { s: 'ok', label: '正常' };
  if (n < 7) return { s: 'warn', label: `失败 ${n} 次` };
  return { s: 'bad', label: `连续失败 ${n} 次` };
}

function lastNDates(latest, n) {
  const out = [];
  const base = Date.parse(latest + 'T00:00:00Z');
  for (let i = n - 1; i >= 0; i -= 1) out.push(new Date(base - i * 86400000).toISOString().slice(0, 10));
  return out;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { flatten, facetCounts, filterItems, matchesQuery, sourceState, lastNDates };
}

/* 渲染与交互。依赖 logic.js 里的纯函数和页面内嵌的 __TINKER__ 数据。 */

(function () {
  const data = JSON.parse(document.getElementById('tinker-data').textContent);
  const { days, sources, status, names, generatedAt } = data;
  const label = (facet, id) => (names[facet] && names[facet][id]) || id;
  const allItems = flatten(days);
  const state = loadState();
  const REMOTE_PREFIX = 'tinker:';
  const MIGRATED_KEY = 'tinker.server-sync.v1';
  const PENDING_KEY = 'tinker.pending-sync.v1';
  let pendingChanges = loadPending();
  let syncReady = false;
  let syncInFlight = null;

  const ui = { view: 'all', tool: null, topic: null, query: '', date: null, panel: false };

  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  /* ---------- 云端状态 ---------- */

  function hasOwn(object, key) {
    return Object.prototype.hasOwnProperty.call(object, key);
  }

  function loadPending() {
    try {
      const parsed = JSON.parse(localStorage.getItem(PENDING_KEY) || '{}');
      return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
    } catch {
      return {};
    }
  }

  function savePending() {
    try { localStorage.setItem(PENDING_KEY, JSON.stringify(pendingChanges)); } catch { /* 忽略 */ }
  }

  function stateRequest(method, body) {
    const options = {
      method,
      credentials: 'same-origin',
      headers: { accept: 'application/json' },
    };
    if (body !== undefined) {
      options.headers['content-type'] = 'application/json';
      options.body = JSON.stringify(body);
    }
    return Promise.resolve().then(() => fetch('/api/state', options)).then((response) => (
      response.json().catch(() => ({})).then((payload) => {
        if (!response.ok) throw new Error(payload.error || '云端同步失败');
        return payload;
      })
    ));
  }

  function mergePending(id, change) {
    const current = pendingChanges[id] || {};
    if (hasOwn(change, 'read')) current.read = change.read;
    if (hasOwn(change, 'starred')) current.starred = change.starred;
    pendingChanges[id] = current;
  }

  function queueRemoteChange(id, change) {
    mergePending(id, change);
    savePending();
    if (syncReady) flushPending();
  }

  function pendingList() {
    return Object.keys(pendingChanges).map((localId) => {
      const change = { localId, id: REMOTE_PREFIX + localId };
      if (hasOwn(pendingChanges[localId], 'read')) change.read = pendingChanges[localId].read;
      if (hasOwn(pendingChanges[localId], 'starred')) change.starred = pendingChanges[localId].starred;
      return change;
    });
  }

  function samePatch(current, sent) {
    return current
      && (!hasOwn(sent, 'read') || current.read === sent.read)
      && (!hasOwn(sent, 'starred') || current.starred === sent.starred)
      && Object.keys(current).length === Object.keys(sent).length - 2;
  }

  function flushPending() {
    if (syncInFlight) return syncInFlight;
    const snapshot = pendingList();
    if (!snapshot.length) return Promise.resolve();

    let succeeded = false;
    syncInFlight = Promise.resolve().then(() => {
      let chain = Promise.resolve();
      for (let i = 0; i < snapshot.length; i += 200) {
        const changes = snapshot.slice(i, i + 200).map(({ localId, ...change }) => change);
        chain = chain.then(() => stateRequest('PUT', { changes }));
      }
      return chain;
    }).then(() => {
      for (const sent of snapshot) {
        if (samePatch(pendingChanges[sent.localId], sent)) delete pendingChanges[sent.localId];
      }
      savePending();
      succeeded = true;
    }).catch(() => {
      // 保留本机状态与待同步队列；下次操作或刷新时继续补传。
    }).finally(() => {
      syncInFlight = null;
      if (succeeded && Object.keys(pendingChanges).length) flushPending();
    });
    return syncInFlight;
  }

  function addLocalMigration() {
    for (const id of Object.keys(state.read)) {
      if (!hasOwn(pendingChanges[id] || {}, 'read')) mergePending(id, { read: true });
    }
    for (const id of Object.keys(state.starred)) {
      if (!hasOwn(pendingChanges[id] || {}, 'starred')) mergePending(id, { starred: true });
    }
    savePending();
  }

  function replaceWithRemote(remote) {
    state.read = {};
    state.starred = {};
    for (const remoteId of Array.isArray(remote.read) ? remote.read : []) {
      if (remoteId.startsWith(REMOTE_PREFIX)) state.read[remoteId.slice(REMOTE_PREFIX.length)] = true;
    }
    for (const remoteId of Array.isArray(remote.starred) ? remote.starred : []) {
      if (remoteId.startsWith(REMOTE_PREFIX)) state.starred[remoteId.slice(REMOTE_PREFIX.length)] = true;
    }
    saveState(state);
  }

  function initializeSync() {
    let remote;
    return stateRequest('GET').then((result) => {
      remote = result;
      let migrated = false;
      try { migrated = localStorage.getItem(MIGRATED_KEY) === '1'; } catch { /* 忽略 */ }
      if (!migrated) addLocalMigration();
      if (!Object.keys(pendingChanges).length) return undefined;
      return flushPending().then(() => {
        if (Object.keys(pendingChanges).length) throw new Error('仍有状态等待同步');
        return stateRequest('GET').then((latest) => { remote = latest; });
      });
    }).then(() => {
      replaceWithRemote(remote);
      try { localStorage.setItem(MIGRATED_KEY, '1'); } catch { /* 忽略 */ }
      syncReady = true;
      render();
    }).catch(() => {
      syncReady = true;
    });
  }

  function setItemState(id, key, value) {
    if (value) state[key][id] = true; else delete state[key][id];
    saveState(state);
    queueRemoteChange(id, { [key === 'read' ? 'read' : 'starred']: value });
  }

  /* ---------- 主题 ---------- */

  const themeBtn = $('#theme');
  themeBtn.addEventListener('click', () => {
    const now = document.documentElement.getAttribute('data-theme');
    const dark = now ? now === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('tinker.theme', dark ? 'light' : 'dark'); } catch { /* 忽略 */ }
  });
  try {
    const saved = localStorage.getItem('tinker.theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch { /* 忽略 */ }

  /* ---------- 侧栏 ---------- */

  function renderRail() {
    const views = $('#views');
    views.textContent = '';
    const unread = allItems.filter((i) => !state.read[i.id]).length;
    const starred = allItems.filter((i) => state.starred[i.id]).length;
    for (const [key, label, count] of [
      ['all', '全部', allItems.length],
      ['unread', '未读', unread],
      ['starred', '收藏', starred],
    ]) {
      const b = el('button', 'view-btn');
      b.append(el('span', null, label), el('span', 'count', String(count)));
      b.setAttribute('aria-pressed', String(!ui.panel && ui.view === key));
      b.addEventListener('click', () => { ui.view = key; ui.panel = false; render(); });
      views.append(b);
    }
    const src = el('button', 'view-btn');
    src.append(el('span', null, '信源与健康度'), el('span', 'count', String(sources.length)));
    src.setAttribute('aria-pressed', String(ui.panel));
    src.addEventListener('click', () => { ui.panel = !ui.panel; render(); });
    views.append(src);

    // 工具和话题是两组独立筛选器，可以叠加（比如「Claude Code」+「MCP」）。
    for (const facet of ['tools', 'topics']) {
      const box = $(`#${facet}`);
      box.textContent = '';
      const key = facet === 'tools' ? 'tool' : 'topic';
      const rows = facetCounts(allItems, facet).slice(0, 20);
      if (!rows.length) {
        box.append(el('p', 'rail-empty', '本期没有'));
        continue;
      }
      for (const [id, count] of rows) {
        const b = el('button', 'chip');
        b.append(el('span', 'label', label(facet, id)), el('span', 'count', String(count)));
        b.setAttribute('aria-pressed', String(ui[key] === id));
        b.addEventListener('click', () => { ui[key] = ui[key] === id ? null : id; ui.panel = false; render(); });
        box.append(b);
      }
    }

    const cal = $('#calendar');
    cal.textContent = '';
    if (!days.length) return;
    const have = new Map(days.map((d) => [d.date, (d.items || []).length]));
    for (const date of lastNDates(days[0].date, 28)) {
      const b = el('button', 'cal-day', date.slice(8));
      const n = have.get(date);
      b.dataset.has = n ? 'yes' : 'no';
      b.title = n ? `${date}：${n} 篇` : `${date}：无`;
      b.setAttribute('aria-pressed', String(ui.date === date));

      b.addEventListener('click', () => { ui.date = ui.date === date ? null : date; ui.panel = false; render(); });
      cal.append(b);
    }
  }

  /* ---------- 条目 ---------- */

  function meter(rating) {
    const m = el('span', 'meter');
    m.setAttribute('aria-label', `评分 ${rating} / 5`);
    for (let i = 1; i <= 5; i += 1) {
      const bar = el('i');
      if (i <= rating) bar.dataset.on = '1';
      m.append(bar);
    }
    return m;
  }

  function entryNode(item, rank) {
    const node = el('article', 'entry');
    node.dataset.read = String(Boolean(state.read[item.id]));
    if (item.rating >= 5) node.dataset.pick = 'true';

    const gutter = el('div', 'entry-gutter');
    gutter.append(el('span', 'entry-rank', String(rank).padStart(2, '0')), meter(item.rating || 0));
    node.append(gutter);

    const main = el('div');

    const h = el('h3', 'entry-title');
    if (item.rating >= 5) h.append(el('span', 'pick-flag', '今日精选'));
    const a = el('a', null, item.titleZh || item.titleOriginal);
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    // 点标题即视为已读：这是唯一一个「用户真的去看了」的可靠信号。
    a.addEventListener('click', () => { setItemState(item.id, 'read', true); render(); });
    h.append(a);
    main.append(h);

    if (item.whyRead) main.append(el('p', 'why', item.whyRead));
    if (item.summaryZh) main.append(el('p', 'summary', item.summaryZh));

    const meta = el('div', 'entry-meta');
    meta.append(el('span', null, item.source));
    if (item.author) { meta.append(el('span', 'sep', '·'), el('span', null, item.author)); }
    meta.append(el('span', 'sep', '·'), el('span', null, (item.publishedAt || item.date || '').slice(0, 10)));
    for (const t of item.tools || []) meta.append(el('span', 'tool-tag', label('tools', t)));
    for (const t of item.topics || []) meta.append(el('span', 'topic-tag', label('topics', t)));
    if (item.thin) {
      const f = el('span', 'thin-flag', '⚠ 仅标题');
      f.title = '抓不到正文，摘要只依据标题撰写';
      meta.append(f);
    }

    const actions = el('div', 'entry-actions');
    const star = el('button', 'act', state.starred[item.id] ? '★ 已收藏' : '☆ 收藏');
    star.setAttribute('aria-pressed', String(Boolean(state.starred[item.id])));
    star.addEventListener('click', () => {
      setItemState(item.id, 'starred', !state.starred[item.id]);
      render();
    });
    const read = el('button', 'act', state.read[item.id] ? '标为未读' : '标为已读');
    read.addEventListener('click', () => {
      setItemState(item.id, 'read', !state.read[item.id]);
      render();
    });
    actions.append(star, read);
    meta.append(actions);

    main.append(meta);
    node.append(main);
    return node;
  }

  /* ---------- 信源面板 ---------- */

  function renderPanel() {
    const wrap = $('#panel');
    wrap.textContent = '';
    const yields = new Map();
    for (const item of allItems) yields.set(item.source, (yields.get(item.source) || 0) + 1);

    wrap.append(el('p', 'panel-intro',
      `共 ${sources.length} 个信源。「近 30 天入选」为 0 的源不代表坏了——`
      + '个人博客本来就月更，而且只有真正聊 agent 的那几篇才会进来。连续失败 7 次以上的才需要处理。'));

    const table = el('table', 'sources');
    const head = el('tr');
    for (const t of ['信源', '类型', '状态', '近 30 天入选', '说明']) head.append(el('th', null, t));
    // Element.append() 返回 undefined，不能链式取回刚追加的节点。
    // 之前写的是 table.append(el('thead')).lastChild.append(head)，直接抛 TypeError，
    // 整个信源面板从上线起就打不开——而我一次都没点过那个按钮。
    const thead = el('thead');
    thead.append(head);
    table.append(thead);
    const body = el('tbody');
    const kindLabel = { search: '按词搜索', forum: '论坛', aggregator: '聚合', weekly: '周刊', blog: '个人博客' };
    for (const s of [...sources].sort((a, b) => (yields.get(b.name) || 0) - (yields.get(a.name) || 0))) {
      const tr = el('tr');
      const nameCell = el('td');
      const link = el('a', null, s.name);
      link.href = s.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
      nameCell.append(link);
      const st = sourceState(status[s.name]);
      const badge = el('span', 'state', st.label);
      badge.dataset.s = st.s;
      const stateCell = el('td');
      stateCell.append(badge);
      tr.append(nameCell, el('td', 'kind', kindLabel[s.kind] || s.kind), stateCell,
        el('td', 'num', String(yields.get(s.name) || 0)), el('td', 'desc', s.desc || ''));
      body.append(tr);
    }
    table.append(body);
    const scroll = el('div', 'table-wrap');
    scroll.append(table);
    wrap.append(scroll);
  }

  /* ---------- 总渲染 ---------- */

  function render() {
    renderRail();
    const panel = $('#panel');
    const stream = $('#stream');
    panel.classList.toggle('hidden', !ui.panel);
    stream.classList.toggle('hidden', ui.panel);
    if (ui.panel) { renderPanel(); return; }

    stream.textContent = '';
    const shown = filterItems(allItems, ui, state);
    if (!shown.length) {
      stream.append(el('p', 'empty', '这个筛选下还没有内容。换个工具标签或日期看看。'));
      return;
    }

    const byDate = new Map();
    for (const item of shown) {
      if (!byDate.has(item.date)) byDate.set(item.date, []);
      byDate.get(item.date).push(item);
    }
    for (const [date, items] of byDate) {
      const day = days.find((d) => d.date === date);
      const head = el('div', 'day-head');
      head.append(el('h2', 'day-date', date), el('span', 'day-count', `${items.length} 篇`));
      stream.append(head);
      if (day && day.dailyNote && !ui.tool && !ui.topic && !ui.query) {
        const note = el('p', 'day-note');
        note.append(el('strong', null, '编者按　'), document.createTextNode(day.dailyNote));
        stream.append(note);
      }
      const list = el('div', 'entries');
      items.forEach((item, i) => list.append(entryNode(item, i + 1)));
      stream.append(list);
    }
  }

  const search = $('#search');
  let timer = null;
  search.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { ui.query = search.value.trim(); ui.panel = false; render(); }, 140);
  });

  $('#generated').textContent = `更新于 ${new Date(generatedAt).toLocaleString('zh-CN', { hour12: false })}`;
  render();
  initializeSync();
})();

</script>
