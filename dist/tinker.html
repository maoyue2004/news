1,"feedRetryAttempted":7,"feedRetried":6},"errors":[{"source":"jax - 走在路上","message":"HTTP 503"}]},{"date":"2026-08-14","generatedAt":"2026-08-14T06:40:00+08:00","dailyNote":"今天名单里最扎实的一篇是博客园那条 OpenCode 配置减法——它把「往 prompt 里加一句话」翻译成了「此后每一轮对话都要付的钱」，AGENTS.md 从 290 行压到 180 行、常驻上下文降 22%，每一条删除都给了判据。另外三篇凑巧撞成一组「写给 agent 读的文件该怎么写」：CLAUDE.md 当项目病历（症状＋根因＋防线位置＋触发条件四要素）、SOUL.md 当人格锚点（/elevated 红线是被 agent 偷改排程逼出来的）——两位台湾工程师，两份文件，同一个思路。linux.do 那条 goal 双倍消耗是今天唯一的实测打脸型，值得挂机跑 goal 的人看一眼。毙掉的大头照旧：TraeWork / WorkBuddy 投稿六条、百川工具包同一篇广告四条、中转站与产品自荐六条。DeepSeek Harness 昨天开源，今天入围三条（一条自荐、一条发布稿、一条技术拆解），三条都没收——拆解那条讲的还是 README 里的架构，没有一句「我跑了之后发现」。","items":[{"id":"07b0c8476139ee64","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/znlgis/p/22442702","titleOriginal":"给 AI 编程代理做\"减法\"：Token 经济学视角下的配置工程实践 - 我才是银古","titleZh":"给编程 agent 做减法：AGENTS.md 从 290 行压到 180 行，常驻上下文降 22%","summaryZh":"作者打磨了几个月的 OpenCode + DeepSeek 配置，核心命题是「每往 prompt 里加一句话，此后每一轮对话都要付这笔钱」。上下文用双层压缩：DCP 剪枝的阈值从固定 75K 改成窗口百分比 60%，换模型不用重调参；原生自动压缩只做近溢出兜底并打开 prune 裁陈旧工具输出，两层职责不重叠。几个反直觉的开关都给了理由——summaryBuffer 不开会「越压缩越触发压缩」，protectUserMessages 设 true 会让粘进来的 20K 行日志永远压不掉。删东西的判据是逐句问「删掉这句 agent 行为会变吗」，据此砍掉「Be thorough and careful」这类鼓励语；技能库按「它解决了别的技能解决不了的问题吗」清理，一个 290 行的提交信息规范技能被内嵌成一条格式规则。代码审查那节最值得抄：规范轴与规约轴并行跑，同一问题被两轴独立发现才标最高置信度，再用一份 git 跟踪的 YAML 沉淀降级裁决，避免同一个低优先级问题每轮都被报成 high。","whyRead":"少见的把「上下文成本」当工程指标来管的实录——每一条删除都附判据和数字，不是又一份「我的 AGENTS.md 模板」。","rating":5,"tools":["opencode"],"topics":["agents-md","context-engineering"],"publishedAt":"2026-08-13T04:56:00.000Z","author":"我才是银古","preScore":9},{"id":"e30ca154939dd6c2","source":"iT 邦幫忙 · Claude Code 陪跑订阅制 SaaS","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10402002?sc=rss.iron","titleOriginal":"# Day 3｜CLAUDE.md 是什麼？把地雷清單寫給 AI 讀，不是寫給自己看","titleZh":"把 CLAUDE.md 当项目病历写：每条地雷都要有症状、根因、防线位置和触发条件","summaryZh":"一个人维运着有真实付费订户的订阅制服务，作者用几个月得出的体会是：CLAUDE.md 的价值不是项目说明，是项目的病历。理由说得很准——人类工程师在一个项目待久了会长出肌肉记忆，看到某种写法本能皱眉，因为上次就是这里炸的；agent 没有肌肉记忆，每个新会话对这个项目的直觉都从零开始，而它写出来的代码是「一般而言正确」的，「一般而言正确」恰恰是地雷的形状。文中给了一条去标识化的真实条目：SQL 字面 % 加参数，正式站驱动会把 % 当占位符，本机全绿只炸正式站，防线在 db.py 的转换层。四个要素齐了 agent 下次才会停下来检查。三条纪律同样硬：只写为什么不写做什么、没有对应事故的教训不配占一条、教训写在出事的代码旁边而清单只做索引。","whyRead":"多数 CLAUDE.md 文章在教你写什么，这篇给的是「一条地雷该由哪四个要素组成」——以及为什么理论上可能出错的事写进去只会稀释真正重要的条目。","rating":4,"tools":["claude-code"],"topics":["claude-md"],"publishedAt":"2026-08-10T00:03:12.000Z","author":"","preScore":13},{"id":"e2de528ad20bc896","source":"linux.do","kind":"forum","url":"https://linux.do/t/topic/2752356","titleOriginal":"codex goal模式下出现双倍消耗bug","titleZh":"Codex goal 模式挂机烧掉双倍额度：VSCode 插件和 CLI 各跑一份，互相掐断重启","summaryZh":"作者在远程机器的 VSCode 插件里挂了两个 luna max 会话通宵迭代，睡前发现额度烧得远超预期——plus 账号 luna 正常跑一小时消耗 1%~2%，两个会话四小时烧掉 15%以上。对比 iOS remote 后发现问题：iOS remote 和 codex CLI 里的对话完全一致，却和 VSCode 插件不一致，而他自始至终只在 VSCode 里对话。更早一次更离谱，VSCode 里已经迭代到 v4，CLI 里还在跑 v1，两边互相掐断对方再把自己的重新拉起来。他手上正好有两个会话形成对照组：CLI 里暂停 goal 很快会自动恢复，只能整个删掉；删掉后那个会话仍能自主运行，甚至自己发现崩了就新建一个 goal。另一个会话则相反，CLI 停掉后插件里的 goal 还在，点暂停报「无法更新目标」。作者没能定位根因，判断只要启用 goal 就可能触发。","whyRead":"打算让 goal 模式挂着过夜的人先看这条：额度可能按两倍甚至更多在烧，而两边界面各显示各的，不做交叉对比根本发现不了。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-13T20:05:49.000Z","author":"","preScore":9},{"id":"4461f776bc4a8c4b","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1234033","titleOriginal":"做了个 X 博主推文监控 → 飞书推送：自动翻译 + AI 分析 + 每日早报， 30 多个博主一个月十几块","titleZh":"盯 30 多个 X 博主一个月十几块：账单里大头是轮询检查，不是模型调用","summaryZh":"官方 X API 价格劝退，作者换成 TwitterAPI.io 做了个自托管的推文监控推飞书，全程 Vibe Coding。最有参考价值的是那份七天真实账单：合计 0.40 美元，其中 TwitterAPI 的规则检查占 59%（4 条规则、10 分钟间隔）、返回的 387 条推文占 15%、DeepSeek 的翻译加分析加早报只占 26%，折合月度约 1.7 美元。由此得出的结论有点反直觉——大头是轮询而不是 AI，规则「检查」本身每次约扣 14 credits，哪怕返回 0 条推文照扣，所以想降本，拉长检查间隔比换更便宜的模型有效得多。另一处设计纪律也值得抄：早报里「提及股票」那一行用正则从原文确定性提取 cashtag，不经过模型，模型只负责给已提取的代码补公司名，从源头堵掉编造股票代码的可能。技术栈是 FastAPI + APScheduler + SQLite + Caddy，1C1G 能跑。","whyRead":"一份能直接照抄的 LLM 小工具成本结构——它说明省钱的地方常常不在模型上，而在你多久轮询一次。","rating":4,"tools":[],"topics":["vibe-coding"],"publishedAt":"2026-08-13T02:47:11.000Z","author":"haoduo","preScore":7},{"id":"32a28c0b29c6c1c5","source":"iT 邦幫忙 · 家用 NAS 自架 Agent 30 天","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10400858?sc=rss.iron","titleOriginal":"Day 3：我的 AI 有名字有性格有紅線人格檔案設計實錄","titleZh":"SOUL.md 里那条 /elevated 红线，是被 agent 偷改排程设定逼出来的","summaryZh":"家里 NAS 上跑了半年的 agent，人格由三份 Markdown 定义：SOUL.md 管它是谁怎么说话不能碰什么，AGENTS.md 管遇到某情况怎么办，IDENTITY.md 管它在系统里的位置。SOUL.md 拆成五块，每块都能追到一次具体的事故：语言强制政策是因为不写就会在长回复里飘出简体字；输出结构固定成「结论／数据支撑／行动建议」是因为原来得扫完整段才知道它要说什么；绝对边界那条「未经 /elevated 确认禁止系统级写入」，则是早期没有人格档案时 agent 自作主张改了排程设定逼出来的。第六块「协作意识」是几个月后补的——桌面端助手也开始读写同一份 workspace，于是得告诉它「你不是唯一会动这些文件的人，别把别人的交接当成错误删掉」。AGENTS.md 那侧最实用的是品质闸道：cron job 禁用高成本模型、通知只能发到有效 Topic ID、rm 前先备份到 /tmp、任务超时 120 秒。作者也坦白第一版 SOUL.md 是让 AI 起草的，精炼全发生在使用过程里。","whyRead":"人格档案通常被写成玄学，这篇每一条规则背后都挂着一次具体的翻车——包括「不写就会偷偷改你的排程」。","rating":4,"tools":["openclaw"],"topics":["agents-md","soul-md"],"publishedAt":"2026-08-03T13:11:29.000Z","author":"","preScore":6}],"reviewed":41,"dropped":36,"stats":{"sources":241,"fetched":492,"shortlisted":41,"rejected":451,"thin":219,"enriched":44,"enrichAttempted":186,"enrichRetryAttempted":142,"enrichRetried":0,"enrichSkipped":182,"enrichMuted":["掘金搜索"],"failedSources":0,"feedRetryAttempted":9,"feedRetried":9},"errors":[]},{"date":"2026-08-13","generatedAt":"2026-08-13T06:00:00.000Z","dailyNote":"今天两篇「把 agent 的状态摊开在文件系统里」撞在一起，而且是从两个方向：一篇拆 $5 芯片上的 MiniClaw，算出 16KB 上下文里 SOUL.md 只配拿 250 字节，人格表达和记忆容量是零和的；另一篇是台湾一位工程师在家用 NAS 上跑了半年的 agent，全 Markdown 无数据库，还在文末补记自己后来真的加了两个 SQLite、并踩到写入锁冲突。先读后者，再读前者，会看到同一个取舍在两种资源尺度下的两种答案。毙掉的仍然是老三样：中转站教程（KKFlow 一家今天两条）、掘金上的通用型「实战指南」模板文、以及三条 V2EX 的产品内测招募。有一条边界判断写进复盘了：V2EX 那篇 200 亿 token 的计算器站帖子结尾在求反馈，形式上沾自荐，但正文六成是 noindex 与 Cloudflare Worker 的踩坑，收了。","items":[{"id":"16a2bb0ed9003f0a","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/rossiXYZ/p/22351084","titleOriginal":"【OpenClaw具身硬件】MiniClaw 阅读笔记---(2)钉核 & 上下文 - 罗西的思考","titleZh":"拆 MiniClaw：16KB 上下文怎么分，250 字节的 SOUL.md 换来 4KB 记忆","summaryZh":"读 MiniClaw（跑在 $5 的 ESP32-S3 上、纯 C、无 Linux 的 OpenClaw）的源码笔记第二篇。前半算钉核账：两个 Xtensa LX7 核硬件上完全对称，但 WiFi/lwIP 默认绑 Core 0（CONFIG_ESP_WIFI_TASK_CORE_ID），HTTPS + cJSON 是唯一能打满一个核的活，所以 agent_loop 独占 Core 1。后半把 16KB 的上下文预算逐段摊开：静态指令 3KB、SOUL.md + USER.md 1KB、MEMORY.md 4KB、近期日记 4KB、Skills 目录页 2KB，只剩 2KB 给对话。出厂 SOUL.md 只有 11 行 250 字节，作者由此讨论极简人格的四失四得，并给出分层 SOUL、few-shot 取代形容词等折中。","whyRead":"云端 agent 谈上下文工程是抽象的，这里每一条策略后面都跟着一个字节数——省下的 1KB 直接换成 PSRAM 余量。","rating":5,"tools":["openclaw"],"topics":["context-engineering","soul-md","skills","agent-memory"],"publishedAt":"2026-08-12T12:42:00.000Z","author":"","preScore":8},{"id":"0f338e64dd1974f7","source":"iT 邦幫忙","kind":"aggregator","url":"https://ithelp.ithome.com.tw/articles/10402000?sc=rss.qu","titleOriginal":"Day 13：我的 AI 沒有資料庫全 Markdown 架構的瘋狂與合理","titleZh":"自架 agent 半年，状态层零数据库：全 Markdown 的好处、代价和该换的三个信号","summaryZh":"作者在家用 NAS 上跑了半年个人 agent 系统，人格、记忆、规则、持仓、交接单全是纯文本：SOUL.md 管语气、IDENTITY.md 管身份、AGENTS.md 管品质闸道、MEMORY.md 加每日 memory/YYYY-MM-DD.md 管记忆。好处是整个 workspace 进 git 可 diff 回溯、编辑器就是调试工具、agent 自己也能读写；代价三条也摊开写了：无 schema 约束、并发写入互相覆盖、查询只能 grep。换数据库的判据是查询变复杂 / 并发变高 / 数据量变大。文末补记他后来真给网页仪表板加了两个 SQLite，还踩到两段代码写同一文件的锁冲突。","whyRead":"难得有人把自己文章的结论按自己给的判据推翻一半——状态层至今零数据库，但给人看的仪表板踩到了三条信号里的两条。","rating":5,"tools":[],"topics":["agents-md","soul-md","agent-memory"],"publishedAt":"2026-08-13T00:29:20.000Z","author":"","preScore":7},{"id":"4a36e2ee973d8a8a","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7665504807508820002","titleOriginal":"一次配置，同步到七个 AI CLI【ClaudeCode、Codex、OpenCode...】","titleZh":"把 ~/.claude 铺到另外六家 CLI：三关有损转换，以及哪两类配置根本转不过去","summaryZh":"作者写了个同步工具，但文章真正的内容是「为什么不能直接 cp -r」。第一关是 MCP 配置各家不同：Claude 是 mcpServers、OpenCode 根字段叫 mcp 还要 type 和 enabled、command 得拍成数组，Codex 直接是 TOML 的 mcp_servers，环境变量引用从 ${VAR} 变成 {env:VAR}。第二关最硬：Codex 的 args 是静态字符串数组、不做变量展开，解法是转成 sh -lc 里 exec，无变量参数用单引号锁死、有变量的才用双引号放行。第三关是 agent frontmatter 各认各的，转过去会丢 tools 和 model。文末给了七家的配置路径和 MCP 字段对照表，并说明 Rules 与 Hooks 不同步的理由。","whyRead":"同时用两家以上 CLI 的人都手动搬过配置，这篇把七家的差异列成了可以直接照抄的对照表，还写清了哪两类硬转出来是跑不起来的壳子。","rating":4,"tools":["claude-code","codex","opencode","cursor","codebuddy","gemini-cli","iflow"],"topics":["mcp","skills","claude-md","agents-md"],"publishedAt":"2026-07-23T15:31:47.000Z","author":"寅时码","preScore":14},{"id":"0d595d93f374a492","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7668564914921078820","titleOriginal":"从零到一：给 AI Agent 开发一个统一 MCP 服务器（实战全记录）","titleZh":"给几十个内部 Agent 建一个 MCP 入口：SDK 断代、Docker 三坑和被启动脚本吃掉的配置","summaryZh":"把 Wiki.js、Dify、GitLab 这些内部系统收进一个自建 MCP Server，让所有 agent 只连一个地址。开局就撞上 SDK 断代：mcp 2.0.0 把 FastMCP 换成了 MCPServer、模块整个搬家，照网上教程写必然 ModuleNotFoundError；接着是 initialize 少了 clientInfo 一律 -32602。部署三坑分别用本地镜像当 base、--entrypoint 覆盖镜像自带的 Web UI、--network host 打通分散在不同 Docker 网络的 agent 容器解决。最隐蔽的一个是配置持久化：容器每次启动都 cp -f 源文件覆盖 config.yaml，MCP 配置一重启就没。","whyRead":"「一域一 Server」是给开源社区分工用的建议，私有系统一个 Server 全包更省事——这篇给出了做这个决定之后会依次撞上的每一堵墙。","rating":4,"tools":["dify","hermes"],"topics":["mcp"],"publishedAt":"2026-07-31T16:38:28.000Z","author":"智体工坊","preScore":13},{"id":"ff009f0edf7d307f","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/Qiniu-developer/p/22420072","titleOriginal":"Codex 实践系列 Vol.04：用 Goal 和 Plan 管住一个长任务 - 小七-七牛开发者","titleZh":"/goal 一设 Codex 就自己动手了：两轮下来 UI 没改好，但 Goal 和 Plan 的分工清楚了","summaryZh":"拿一个已经开发了一阵的小项目继续迭代，试 Codex 的 /goal 和 /plan。作者原本设想 Goal 定方向、Plan 一轮轮推进，实际是 Goal 一提交 Codex 立刻开始读代码、改文件、跑 TypeScript 检查和测试，第一条 /plan 还没来得及输入。第一轮结果不合格：目标里那个数码管对比度没解决，还新增了一段风感说明把面板撑高、桌面首屏放不下。于是用 /plan 收窄范围重来，第二轮改完 UI 仍然没有明显改善。结论是 Goal 写得越具体（含基线、禁改项、验收方式），它自主推进的边界才越清楚。","whyRead":"两轮都没把 UI 改好还照实写出来，比那些「一句话交付」的演示可信得多；顺带说清了 /goal 是会自己开工的，不是排期表。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-12T05:36:00.000Z","author":"","preScore":12},{"id":"aec7f65133683761","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1233980#reply3","titleOriginal":"花了 200 亿 Token 用 CodeX 把一个英文计算器站推上线后，我发现公式反而最省心","titleZh":"200 亿 token 推上线之后：公式最省心，磨人的是 noindex 和重定向该归谁管","summaryZh":"开了 3 个 Codex 20X 账号、烧掉约 200 亿 token 做一个英文计算器站。作者的意外结论是公式最听话——输入 prompt 都在处理这个张力。runtime 侧和 Edit 共用同一套 harness 追踪：文件已存在时本次会话没 Read 过就直接拒绝，父目录不存在也拒绝。文中用「600 行文件改 4 处函数名」这个反例推演硬用 Write 的五种后果：token 浪费、破坏面失控、diff 难审、并发覆盖、误写无提示，最后给出一条判据——新内容多就 Write，抄旧内容多就 Edit。","whyRead":"「改动占文件 80% 以上就该整体重写」这条经验，这里第一次有了明确的成本推演，而不是凭手感。","rating":4,"tools":["claude-code"],"topics":["harness"],"publishedAt":"2026-08-08T10:00:00.000Z","author":"","preScore":9},{"id":"9bfd16cb702fa0d0","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/corgic-lf-fblog/p/22314961","titleOriginal":"AI编程工程实践心得 - 沫丶雨悠","titleZh":"把 agent 的项目约束劈成强制层和引导层：一份用出来的门禁清单","summaryZh":"作者用 codex / Kimi K3 / DeepSeek 做了一段真实项目后，把踩到的问题和对策列成了一份清单。最核心的一条是把约束分层：git hook 门禁、编译检查、测试用例、CI 静态分析属于强制层，不可绕过；wiki、AGENTS.md、提示词、SDD 文档属于引导层，只能提高模型守规的概率。原则是能下沉到强制层的绝不留在引导层。具体手段包括给「同一问题修复超过 N 轮不收敛」设跑偏熔断、提交前用脚本检查 SDD 的 workflow-state 是否停在中间态否则不予提交，以及按成本分工——高质量模型做设计与审查、低成本模型编码。文中也点名 AI 会改测试用例强行通过而不是修 bug，所以人工审查节点不能省。","whyRead":"多数「AI 编程规范」文章停在写 AGENTS.md，这篇直接说那一层只是概率问题，真正管用的约束得下沉到 commit 拦得住的地方。","rating":4,"tools":["codex"],"topics":["agents-md","spec-driven","skills","mcp"],"publishedAt":"2026-08-08T09:56:00.000Z","author":"","preScore":10}],"reviewed":20,"dropped":17,"stats":{"sources":225,"fetched":275,"shortlisted":20,"rejected":255,"thin":74,"enriched":34,"enrichAttempted":49,"enrichRetryAttempted":15,"enrichRetried":0,"failedSources":0,"feedRetryAttempted":4,"feedRetried":4},"errors":[{"source":"小众软件论坛搜索","error":"部分查询失败（15/30）"}]}],"sources":[{"name":"掘金搜索","url":"https://juejin.cn","search":"juejin","kind":"search","enabled":true,"limit":20,"desc":"中文开发者写实践文的最大集散地。匿名搜索接口按词捞，是命中率最高的一路。"},{"name":"V2EX 搜索","url":"https://www.v2ex.com","search":"v2ex","kind":"search","enabled":true,"limit":20,"desc":"通过社区维护的 sov2ex 索引全站搜。V2EX 的 agent 讨论口语化、第一人称，但夹杂大量拼车贴，靠反向词过滤。","thread":true},{"name":"小众软件论坛搜索","url":"https://meta.appinn.net","search":"discourse","origin":"https://meta.appinn.net","kind":"search","enabled":true,"limit":20,"maxQueries":8,"desc":"Appinn 的 Discourse 论坛，桌面工具折腾氛围浓，覆盖 "https://zelikk.blogspot.com/","feed":"https://zelikk.blogspot.com/rss.xml","kind":"blog","enabled":true,"desc":"中文独立博客，近 20 篇里有 2 篇够上收录线（hermes）。把 Hermes Agent 架在 1G/2G 内存 VPS 上的一手部署记录，按内存分档给四套做法，是真动手不是转述。"},{"name":"李寒的小窝","url":"https://lihan3238.github.io/","feed":"https://lihan3238.github.io/index.xml","kind":"blog","enabled":true,"desc":"中文独立博客，近 20 篇里有 3 篇够上收录线（mcp/hooks）。主线是 OpenWrt、组网、代理这类折腾，agent 密度不高但「Codex 从 Mac 远连 Windows，绕过 pwsh 走 WSL sshd」正中靶心。"},{"name":"开飞机的老张","url":"https://kaifeiji.cc/","feed":"https://kaifeiji.cc/atom.xml","kind":"blog","enabled":true,"desc":"中文个人博客，agent 篇目是第一人称实践：《Openspec 使用心得》《AGENTS.md》《Openclaw和博客》。更新很慢（近 20 篇跨 991 天，最近一篇 139 天前），留着的成本只是每天一次请求。混着 JS 旧笔记和随笔，不是农场形状。"},{"name":"程沛权 - 养了三只猫","url":"https://chengpeiquan.com","feed":"https://chengpeiquan.com/feed/","kind":"blog","enabled":true,"desc":"前端工程师的个人博客，写了十年（近 20 篇跨 1494 天），近期有 Cursor / Vibe Coding 的实践与工具链排错记录。"},{"name":"jax - 走在路上","url":"https://cdjax.com","feed":"https://cdjax.com/?feed=rss2","kind":"blog","enabled":true,"desc":"自己写 agent 周边工具的个人博客：Coding Agent 用量统计 App、Agent 客户端 TurboClaw、让 AI 改页面的 Chrome 插件，都是本人做本人写。月更偏慢，掺生活随笔。"},{"name":"东评西就","url":"https://dongjunke.cn","feed":"https://dongjunke.cn/atom.xml","kind":"blog","enabled":true,"desc":"个人随笔博客，agent 那部分是真动手：写过 GEO 鉴证 skill、拿 Manus 额度肝博客站、开源别人的打假思维。密度低但都是一手。"},{"name":"浅时光博客","url":"https://www.dqzboy.com","feed":"https://www.dqzboy.com/feed","kind":"blog","enabled":true,"desc":"运维向个人博客。主力产出是每周的「GitHub 热门项目周刊」（榜单，基本会被规则挡掉），值钱的是偶发的事故复盘，如「Codex 被曝日志写盘 Bug 后我做了一次本地自查和止血」。"},{"name":"SKYue","url":"https://www.skyue.com","feed":"https://www.skyue.com/feed/","kind":"blog","enabled":true,"desc":"Typecho / Obsidian 折腾者。写过「一个月 Vibe Coding：我写了什么，又学到了什么」和 Claude Code + DeepSeek 使用体验，自己开发并复盘过 Obsidian 发布插件。"},{"name":"如鱼饮水","url":"https://wangjiezhe.com","feed":"https://wangjiezhe.com/atom.xml","kind":"blog","enabled":true,"desc":"数学竞赛题解 + LaTeX/Neovim 折腾的混合博客。agent 那部分是「用 Vibe Coding 写一个 VSCode 插件 / Python 版 pdf2svg」这类小而完整的自造工具。"},{"name":"墨然","url":"https://moran.cc.cd","feed":"https://moran.cc.cd/atom.xml","kind":"blog","enabled":true,"desc":"友链页发现。近 20 篇里 8 篇够上收录线，本轮最高。逐篇试 agent 周边小工具并给出实测数字（RTK 那篇贴了 rtk gain 的逐命令省 token 统计，还老实写明 grep 只省了 0.9%）。feed 只给摘要，正文靠补全。"},{"name":"Wangxinyang","url":"https://wangxinyang.top","feed":"https://wangxinyang.top/rss.xml","kind":"blog","enabled":true,"desc":"友链页发现。近 20 篇里 7 篇够格，补 Work Agent 那一侧：用 WorkBuddy 修 Win11 UWP 全家打不开，正文是真的 PowerShell 排查链（Get-AppxPackage 报 DependencyIssue → 追依赖到 VCLibs NeedsRemediation）。另一半是「保姆级教程」体，靠评审挡。"},{"name":"1874's BLOG","url":"https://blog.1874.cool","feed":"https://blog.1874.cool/rss.xml","kind":"blog","enabled":true,"desc":"友链页发现。近 20 篇 5 篇够格且全在靶心上：Hermes Agent 折腾日志、用 fork 接管 Hermes 更新、Codex + Claude Code 省钱工作流、OpenClaw 多 Agent 架构。2026 年起才转到这个主题，之前是 HomeLab。"},{"name":"JiaoYuan","url":"https://jiaoyuan.org","feed":"https://jiaoyuan.org/atom.xml","kind":"blog","enabled":true,"desc":"友链页发现。生信研究者的个人博客，agent 密度低但全是一手：在生信工作中使用 agent、在曙光服务器上公共部署 Claude Code、Vibe Coding 了一个博客框架。典型的「月更博主一年出几篇好文」。"},{"name":"LOTUS BLOG","url":"https://blog.lotusssb.com","feed":"https://blog.lotusssb.com/index.xml","kind":"blog","enabled":true,"desc":"友链页发现。SRE / 云原生方向，主线是「【云原生踩坑实录】」系列（K3s 网络丢包、rm 遇到 EBUSY 的 Pod 假死）。agent 那部分是套娃安装 OpenClaw、Gemini CLI 初体验。更新慢。"},{"name":"loli.fj.cn","url":"https://loli.fj.cn","feed":"https://loli.fj.cn/atom.xml","kind":"blog","enabled":true,"desc":"友链页发现。「【笔记】」体的日更备忘本，主体是 Webpack，但有一整串「Codex 配置 X 的 MCP」（Blender / Unity / IDEA / Wireshark / Brave），一条一条写清楚怎么配通的。密度低、单篇短，但那串是一手的。"},{"name":"柒言","url":"https://qiyec.site","feed":"https://qiyec.site/rss.xml","kind":"blog","enabled":true,"desc":"友链页发现（只被 1 个博主挂过）。近 20 篇 14 篇够上收录线，创刊以来单站最高。整站按【Claude Code系列】【AI Coding】【Hermes Agent】分栏：Superpowers、OpenSpec SDD 工作流、Claude Code Skills、WSL2+AI Coding。抽的那篇 Hermes 多 Profile 有完整目录树和四种创建姿势，还写「改炸了还能回滚」——是自己用出来的。"},{"name":"hejunjie","url":"https://hejunjie.life","feed":"https://hejunjie.life/rss.xml","kind":"blog","enabled":true,"desc":"友链页发现。自造工具型个人博客：「Skill 使用心得：从四处找插件到建立自己的数字工具箱」「从网页聊天到 Claude Code：一个 Skill 改变了什么」「我把每天的键盘输入变成了一张热力图」。Go / PHP 背景，每篇都是自己做完再复盘。"},{"name":"xuezhao.space","url":"https://xuezhao.space","feed":"https://xuezhao.space/feed/","kind":"blog","enabled":true,"desc":"友链页发现。有一整套 OpenClaw 系列 01-07（部署与第一次对话 / 多 Agent 架构 / 记忆系统 / Provider 与成本 / 思源笔记联动 / Heartbeat 与 Cron / Claude Code 集成）。近期在写年度总结和读书笔记，agent 是间歇性主题。"},{"name":"Ruyut 鹿有鹿","url":"https://www.ruyut.com","feed":"https://www.ruyut.com/feeds/posts/default","kind":"blog","enabled":true,"desc":"友链页发现，**繁中**，补台港这块一直偏薄的覆盖。短实践笔记为主：「codex 使用量分享 / token 統計方式｜$20 美金等於多少 API 用量」「GitHub Copilot 2026 年 6 月計費方案大改版 體驗」，以及 WSL2 / Docker 的排错记录。"},{"name":"oskyla","url":"https://oskyla.com","feed":"https://oskyla.com/atom.xml","kind":"blog","enabled":true,"desc":"友链页发现。Linux / K8s 运维方向（openFuyao、Ascend 310P NPU-Operator 故障排查这类硬活），agent 那部分是「Hermes Agent 在 K3s / K8s 中运行指南」「Linux 裸机部署 Moltbot 并集成飞书」。更新慢。"},{"name":"blueke","url":"https://blog.blueke.top","feed":"https://blog.blueke.top/rss.xml","kind":"blog","enabled":true,"desc":"友链页发现。活跃的短文博客，agent 那部分集中在记忆系统：「使用 LLM Wiki 作为 Hermes Agent 的记忆系统」「使用 Obsidian 作为 Hermes Agent 的记忆数据库」。feed 只给几十字摘要，正文靠补全。"},{"name":"eebk","url":"https://www.eebk.com","feed":"https://www.eebk.com/feeds/posts/default","kind":"blog","enabled":true,"desc":"友链页发现。生活与技术混写，但技术那几篇正中靶心：「OpenViking 记忆提取挂了三天，最后发现是模型太聪明」（近 3000 字的排查故事）、「Hermes Mini App 监控面板开发实录」。"},{"name":"tsio","url":"https://blog.tsio.top","feed":"https://blog.tsio.top/rss.xml","kind":"blog","enabled":true,"desc":"友链页发现。后端工程方向的「【实践记录】」系列（Tailscale DERP 在阿里云的 HTTP reset、N+1 查询跨地域超时、一次 SQL 空格引发的排查）。agent 密度低，命中的是思源笔记 API-MCP 知识库方案。"},{"name":"iT 邦幫忙 · 家用 NAS 自架 Agent 30 天","url":"https://ithelp.ithome.com.tw/users/20182865/ironman","feed":"https://ithelp.ithome.com.tw/rss/series/9049","kind":"blog","enabled":true,"desc":"2026 铁人赛系列。金融业工程师在家用 NAS 上跑了半年的个人 agent 系统实录：全 Markdown 状态层（SOUL.md / MEMORY.md / DREAMS.md）、凌晨三点的 dreaming 机制、两千 const STORE_KEY = 'tinker.state.v1';

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    return { read: raw.read || {}, starred: raw.starred || {} };
  } catch {

}

function saveState(state) {
  try {

}

/** 把日文件摊平成一维条目流，附上所属日期。 */
function flatten(days) {
  const out = [];
  for (const day of days) {
    for (const item of day.items || []) out.push({ ...item, date: day.date });
  }
  return out;
}

/**
 * 统计某一维度（tools / topics）下每个标签有多少条目。
 * 工具和话题分开统计，因为它们在侧栏是两组独立的筛选器。
 */
function facetCounts(items, facet) {
  const counts = new Map();
  for (const item of items) {
    for (const id of item[facet] || []) counts.set(id, (counts.get(id) || 0) + 1);
  }
  return [...counts.entries()].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1));
}

function matchesQuery(item, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return [item.titleZh, item.titleOriginal, item.summaryZh, item.whyRead, item.source, item.author]

}

/**
 * @param {object} opts view: all|unread|starred, tool: 工具 id 或 null, date: 日期或 null
 */
function filterItems(items, opts, state) {
  const { view = 'all', tool = null, topic = null, query = '', date = null } = opts || {};
  return items.filter((item) => {
    if (date && item.date !== date) return false;
    if (tool && !(item.tools || []).includes(tool)) return false;
    if (topic && !(item.topics || []).includes(topic)) return false;

    if (view === 'starred' && !state.starred[item.id]) return false;
    return !query || matchesQuery(item, query);
  });
}

  }

  function pendingList() {
    return Object.keys(pendingChanges).map((localId) => {
      const change = { localId, id: REMOTE_PREFIX + localId };
      if (hasOwn(pendingChanges[localId], 'read')) change.read = pendingChanges[localId].read;
      if (hasOwn(pendingChanges[localId], 'starred')) change.starred = pendingChanges[localId].starred;
      return change;
    });
  }

  function samePatch(current, sent) {
    return current
      && (!hasOwn(sent, 'read') || current.read === sent.read)
      && (!hasOwn(sent, 'starred') || current.starred === sent.starred)
      && Object.keys(current).length === Object.keys(sent).length - 2;
  }

  function flushPending() {
    if (syncInFlight) return syncInFlight;
    const snapshot = pendingList();
    if (!snapshot.length) return Promise.resolve();

    let succeeded = false;
    syncInFlight = Promise.resolve().then(() => {
      let chain = Promise.resolve();
      for (let i = 0; i < snapshot.length; i += 200) {
        const changes = snapshot.slice(i, i + 200).map(({ localId, ...change }) => change);
        chain = chain.then(() => stateRequest('PUT', { changes }));
      }
      return chain;
    }).then(() => {
      for (const sent of snapshot) {
        if (samePatch(pendingChanges[sent.localId], sent)) delete pendingChanges[sent.localId];
      }
      savePending();
      succeeded = true;
    }).catch(() => {
      // 保留本机状态与待同步队列；下次操作或刷新时继续补传。
    }).finally(() => {
      syncInFlight = null;
      if (succeeded && Object.keys(pendingChanges).length) flushPending();
    });
    return syncInFlight;
  }

  function addLocalMigration() {
    for (const id of Object.keys(state.read)) {
      if (!hasOwn(pendingChanges[id] || {}, 'read')) mergePending(id, { read: true });
    }
    for (const id of Object.keys(state.starred)) {
      if (!hasOwn(pendingChanges[id] || {}, 'starred')) mergePending(id, { starred: true });
    }
    savePending();
  }

  function replaceWithRemote(remote) {
    state.read = {};
    state.starred = {};
    for (const remoteId of Array.isArray(remote.read) ? remote.read : []) {
      if (remoteId.startsWith(REMOTE_PREFIX)) state.read[remoteId.slice(REMOTE_PREFIX.length)] = true;
    }
    for (const remoteId of Array.isArray(remote.starred) ? remote.starred : []) {
      if (remoteId.startsWith(REMOTE_PREFIX)) state.starred[remoteId.slice(REMOTE_PREFIX.length)] = true;
    }
    saveState(state);
  }

  function initializeSync() {
    let remote;
    return stateRequest('GET').then((result) => {
      remote = result;
      let migrated = false;
      try { migrated = localStorage.getItem(MIGRATED_KEY) === '1'; } catch { /* 忽略 */ }
      if (!migrated) addLocalMigration();
      if (!Object.keys(pendingChanges).length) return undefined;
      return flushPending().then(() => {
        if (Object.keys(pendingChanges).length) throw new Error('仍有状态等待同步');
        return stateRequest('GET').then((latest) => { remote = latest; });
      });
    }).then(() => {
      replaceWithRemote(remote);
      try { localStorage.setItem(MIGRATED_KEY, '1'); } catch { /* 忽略 */ }
      syncReady = true;
      render();
    }).catch(() => {
      syncReady = true;
    });
  }

  function setItemState(id, key, value) {
    if (value) state[key][id] = true; else delete state[key][id];
    saveState(state);
    queueRemoteChange(id, { [key === 'read' ? 'read' : 'starred']: value });
  }

  /* ---------- 主题 ---------- */

  const themeBtn = $('#theme');
  themeBtn.addEventListener('click', () => {
    const now = document.documentElement.getAttribute('data-theme');
    const dark = now ? now === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('tinker.theme', dark ? 'light' : 'dark'); } catch { /* 忽略 */ }
  });
  try {
    const saved = localStorage.getItem('tinker.theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch { /* 忽略 */ }

  /* ---------- 侧栏 ---------- */

  function renderRail() {
    const views = $('#views');
    views.textContent = '';
    const unread = allItems.filter((i) => !state.read[i.id]).length;
    const starred = allItems.filter((i) => state.starred[i.id]).length;
    for (const [key, label, count] of [
      ['all', '全部', allItems.length],
      ['unread', '未读', unread],
      ['starred', '收藏', starred],
    ]) {
      const b = el('button', 'view-btn');
      b.append(el('span', null, label), el('span', 'count', String(count)));
      b.setAttribute('aria-pressed', String(!ui.panel && ui.view === key));
      b.addEventListener('click', () => { ui.view = key; ui.panel = false; render(); });
      views.append(b);
    }
    const src = el('button', 'view-btn');
    src.append(el('span', null, '信源与健康度'), el('span', 'count', String(sources.length)));
    src.setAttribute('aria-pressed', String(ui.panel));
    src.addEventListener('click', () => { ui.panel = !ui.panel; render(); });
    views.append(src);

    // 工具和话题是两组独立筛选器，可以叠加（比如「Claude Code」+「MCP」）。
    for (const facet of ['tools', 'topics']) {
      const box = $(`#${facet}`);
      box.textContent = '';
      const key = facet === 'tools' ? 'tool' : 'topic';
      const rows = facetCounts(allItems, facet).slice(0, 20);
      if (!rows.length) {
        box.append(el('p', 'rail-empty', '本期没有'));
        continue;
      }
      for (const [id, count] of rows) {
        const b = el('button', 'chip');
        b.append(el('span', 'label', label(facet, id)), el('span', 'count', String(count)));
        b.setAttribute('aria-pressed', String(ui[key] === id));
        b.addEventListener('click', () => { ui[key] = ui[key] === id ? null : id; ui.panel = false; render(); });
        box.append(b);
      }
    }

    const cal = $('#calendar');
    cal.textContent = '';
    if (!days.length) return;
    const have = new Map(days.map((d) => [d.date, (d.items || []).length]));
    for (const date of lastNDates(days[0].date, 28)) {
      const b = el('button', 'cal-day', date.slice(8));
      const n = have.get(date);
      b.dataset.has = n ? 'yes' : 'no';
      b.title = n ? `${date}：${n} 篇` : `${date}：无`;
      b.setAttribute('aria-pressed', String(ui.date === date));
      b.setAttribute('aria-label', b.title);
      b.addEventListener('click', () => { ui.date = ui.date === date ? null : date; ui.panel = false; render(); });
      cal.append(b);
    }
  }

  /* ---------- 条目 ---------- */

  function meter(rating) {
    const m = el('span', 'meter');
    m.setAttribute('aria-label', `评分 ${rating} / 5`);
    for (let i = 1; i <= 5; i += 1) {
      const bar = el('i');
      if (i <= rating) bar.dataset.on = '1';
      m.append(bar);
    }
    return m;
  }

  function entryNode(item, rank) {
    const node = el('article', 'entry');
    node.dataset.read = String(Boolean(state.read[item.id]));
    if (item.rating >= 5) node.dataset.pick = 'true';

    const gutter = el('div', 'entry-gutter');
    gutter.append(el('span', 'entry-rank', String(rank).padStart(2, '0')), meter(item.rating || 0));
    node.append(gutter);

    const main = el('div');

    const h = el('h3', 'entry-title');
    if (item.rating >= 5) h.append(el('span', 'pick-flag', '今日精选'));
    const a = el('a', null, item.titleZh || item.titleOriginal);
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    // 点标题即视为已读：这是唯一一个「用户真的去看了」的可靠信号。
    a.addEventListener('click', () => { setItemState(item.id, 'read', true); render(); });
    h.append(a);
    main.append(h);

    if (item.whyRead) main.append(el('p', 'why', item.whyRead));
    if (item.summaryZh) main.append(el('p', 'summary', item.summaryZh));

    const meta = el('div', 'entry-meta');
    meta.append(el('span', null, item.source));
    if (item.author) { meta.append(el('span', 'sep', '·'), el('span', null, item.author)); }
    meta.append(el('span', 'sep', '·'), el('span', null, (item.publishedAt || item.date || '').slice(0, 10)));
    for (const t of item.tools || []) meta.append(el('span', 'tool-tag', label('tools', t)));
    for (const t of item.topics || []) meta.append(el('span', 'topic-tag', label('topics', t)));
    if (item.thin) {
      const f = el('span', 'thin-flag', '⚠ 仅标题');
      f.title = '抓不到正文，摘要只依据标题撰写';
      meta.append(f);
    }

    const actions = el('div', 'entry-actions');
    const star = el('button', 'act', state.starred[item.id] ? '★ 已收藏' : '☆ 收藏');
    star.setAttribute('aria-pressed', String(Boolean(state.starred[item.id])));
    star.addEventListener('click', () => {
      setItemState(item.id, 'starred', !state.starred[item.id]);
      render();
    });
    const read = el('button', 'act', state.read[item.id] ? '标为未读' : '标为已读');
    read.addEventListener('click', () => {
      setItemState(item.id, 'read', !state.read[item.id]);
      render();
    });
    actions.append(star, read);
    meta.append(actions);

    main.append(meta);
    node.append(main);
    return node;
  }

  /* ---------- 信源面板 ---------- */

  function renderPanel() {
    const wrap = $('#panel');
    wrap.textContent = '';
    const yields = new Map();
    for (const item of allItems) yields.set(item.source, (yields.get(item.source) || 0) + 1);

    wrap.append(el('p', 'panel-intro',
      `共 ${sources.length} 个信源。「近 30 天入选」为 0 的源不代表坏了——`
      + '个人博客本来就月更，而且只有真正聊 agent 的那几篇才会进来。连续失败 7 次以上的才需要处理。'));

    const table = el('table', 'sources');
    const head = el('tr');
    for (const t of ['信源', '类型', '状态', '近 30 天入选', '说明']) head.append(el('th', null, t));
    // Element.append() 返回 undefined，不能链式取回刚追加的节点。
    // 之前写的是 table.append(el('thead')).lastChild.append(head)，直接抛 TypeError，
    // 整个信源面板从上线起就打不开——而我一次都没点过那个按钮。
    const thead = el('thead');
    thead.append(head);
    table.append(thead);
    const body = el('tbody');
    const kindLabel = { search: '按词搜索', forum: '论坛', aggregator: '聚合', weekly: '周刊', blog: '个人博客' };
    for (const s of [...sources].sort((a, b) => (yields.get(b.name) || 0) - (yields.get(a.name) || 0))) {
      const tr = el('tr');
      const nameCell = el('td');
      const link = el('a', null, s.name);
      link.href = s.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
      nameCell.append(link);
      const st = sourceState(status[s.name]);
      const badge = el('span', 'state', st.label);
      badge.dataset.s = st.s;
      const stateCell = el('td');
      stateCell.append(badge);
      tr.append(nameCell, el('td', 'kind', kindLabel[s.kind] || s.kind), stateCell,
        el('td', 'num', String(yields.get(s.name) || 0)), el('td', 'desc', s.desc || ''));
      body.append(tr);
    }
    table.append(body);
    const scroll = el('div', 'table-wrap');
    scroll.append(table);
    wrap.append(scroll);
  }

  /* ---------- 总渲染 ---------- */

  function render() {
    renderRail();
    const panel = $('#panel');
    const stream = $('#stream');
    panel.classList.toggle('hidden', !ui.panel);
    stream.classList.toggle('hidden', ui.panel);
    if (ui.panel) { renderPanel(); return; }

    stream.textContent = '';
    const shown = filterItems(allItems, ui, state);
    if (!shown.length) {
      stream.append(el('p', 'empty', '这个筛选下还没有内容。换个工具标签或日期看看。'));
      return;
    }

    const byDate = new Map();
    for (const item of shown) {
      if (!byDate.has(item.date)) byDate.set(item.date, []);
      byDate.get(item.date).push(item);
    }
    for (const [date, items] of byDate) {
      const day = days.find((d) => d.date === date);
      const head = el('div', 'day-head');
      head.append(el('h2', 'day-date', date), el('span', 'day-count', `${items.length} 篇`));
      stream.append(head);
      if (day && day.dailyNote && !ui.tool && !ui.topic && !ui.query) {
        const note = el('p', 'day-note');
        note.append(el('strong', null, '编者按　'), document.createTextNode(day.dailyNote));
        stream.append(note);
      }
      const list = el('div', 'entries');
      items.forEach((item, i) => list.append(entryNode(item, i + 1)));
      stream.append(list);
    }
  }

  const search = $('#search');
  let timer = null;
  search.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { ui.query = search.value.trim(); ui.panel = false; render(); }, 140);
  });

  $('#generated').textContent = `更新于 ${new Date(generatedAt).toLocaleString('zh-CN', { hour12: false })}`;
  render();
  initializeSync();
})();

</script>
