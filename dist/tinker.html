<style>
/* Agent 折腾志 — 终端笔记本
 *
 * 配色不用「黑底荧光绿」那套终端刻板印象，而是取调好的 dotfile 主题的感觉：
 * 纸底带极淡的绿灰偏色，强调色是沉下来的青（deep teal），高分条目用琥珀作信号色。
 * 语义色（青=强调，琥珀=精选，红=失败）和中性色分开，互不借用。
 *
 * 字体全部走系统栈：Artifact 的 CSP 挡外链字体，内嵌 data URI 又会让页面膨胀到几百 KB，
 * 而中文正文本来就该用 PingFang / 苹方这一类本地字体。识别度靠等宽数据面、字重跨度和字距做。
 */

:root {
  color-scheme: light dark;

  --paper: #f4f6f3;
  --surface: #fbfcfa;
  --surface-2: #eceee9;
  --ink: #191d1b;
  --ink-soft: #4b544f;
  --ink-mute: #78827c;
  --line: #dde1dc;
  --line-soft: #e8ebe6;
  --accent: #0d7a68;
  --accent-soft: #d8ece7;
  --signal: #b35c07;
  --signal-soft: #f6e6d2;
  --danger: #a63328;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;

  --rule: #191d1b;
  --rail: 232px;
  --gutter: 3.25rem;
  --radius: 3px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111513;
    --surface: #171c19;
    --surface-2: #1e2421;
    --ink: #e4e9e5;
    --ink-soft: #a9b3ad;
    --ink-mute: #7c877f;
    --line: #29302c;
    --line-soft: #212724;
    --accent: #4ecdb6;
    --accent-soft: #16302b;
    --signal: #e79a4d;
    --signal-soft: #33251440;
    --danger: #e0796c;
    --rule: #39423d;
  }
}

/* 用户手动切换主题时，data-theme 必须压过上面的媒体查询——两个方向都要压。 */
:root[data-theme="dark"] {
  --paper: #111513;
  --surface: #171c19;
  --surface-2: #1e2421;
  --ink: #e4e9e5;
  --ink-soft: #a9b3ad;
  --ink-mute: #7c877f;
  --line: #29302c;
  --line-soft: #212724;
  --accent: #4ecdb6;
  --accent-soft: #16302b;
  --signal: #e79a4d;
  --signal-soft: #33251440;
  --danger: #e0796c;
  --rule: #39423d;
}

:root[data-theme="light"] {
  --paper: #f4f6f3;
  --surface: #fbfcfa;
  --surface-2: #eceee9;
  --ink: #191d1b;
  --ink-soft: #4b544f;
  --ink-mute: #78827c;
  --line: #dde1dc;
  --line-soft: #e8ebe6;
  --accent: #0d7a68;
  --accent-soft: #d8ece7;
  --signal: #b35c07;
  --signal-soft: #f6e6d2;
  --danger: #a63328;
  --rule: #191d1b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--paper);
  /* 极淡的方格纸底纹。只有一层，别喧宾夺主。 */
  background-image: radial-gradient(circle at 1px 1px, var(--line-soft) 1px, transparent 0);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius);
}

.app {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 clamp(1rem, 3vw, 2.5rem) 5rem;
}

/* ---------- 报头 ---------- */

.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.75rem 1.25rem;
  padding: 2.5rem 0 1.25rem;
  /* 暗色下 --ink 接近纯白，2px 实线会变成一条很吵的亮带，压到中性描边色。 */
  border-bottom: 2px solid var(--rule);
}

.wordmark {
  margin: 0;
  font-size: clamp(1.5rem, 3.4vw, 2.1rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.wordmark .prompt {
  color: var(--accent);
  font-family: var(--mono);
  font-weight: 500;
  margin-right: 0.35em;
}

.tagline {
  color: var(--ink-mute);
  font-size: 0.82rem;
  letter-spacing: 0.02em;
  margin: 0;
  flex: 1 1 16rem;
}

.masthead-meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

.theme-toggle {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.2rem 0.55rem;
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-soft);
}

.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- 主体骨架 ---------- */

.frame {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  gap: 2.5rem;
  align-items: start;
}

.rail {
  position: sticky;
  top: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
  padding-top: 1.75rem;
  max-height: calc(100vh - 2.5rem);
  overflow-y: auto;
}

.rail-block { display: flex; flex-direction: column; gap: 0.5rem; }

.rail-label {
  margin: 0;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

.view-btn,
.chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  width: 100%;
  padding: 0.28rem 0.5rem;
  border-radius: var(--radius);
  font-size: 0.85rem;
  color: var(--ink-soft);
  text-align: left;
}

.view-btn:hover,
.chip:hover { background: var(--surface-2); color: var(--ink); }

.view-btn[aria-pressed="true"],
.chip[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

.chip .count {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

.chip[aria-pressed="true"] .count { color: var(--accent); }

.tag-list { max-height: 13rem; overflow-y: auto; }

.rail-empty { margin: 0; padding: 0.2rem 0.5rem; font-size: 0.8rem; color: var(--ink-mute); }

/* 话题不是工具，视觉上也要分开：话题用方括号包住，像个标记而不是产品名。 */
#topics .chip .label::before { content: "["; color: var(--ink-mute); }
#topics .chip .label::after { content: "]"; color: var(--ink-mute); }
#topics .chip .label { font-family: var(--mono); font-size: 0.78rem; }

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.cal-day {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 2px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

.cal-day[data-has="yes"] { background: var(--accent-soft); color: var(--accent); }
.cal-day[aria-pressed="true"] { outline: 1.5px solid var(--accent); }
.cal-day:hover { color: var(--ink); }

/* ---------- 内容流 ---------- */

.content { min-width: 0; padding-top: 1.75rem; }

.day-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem 1rem;
  margin-bottom: 0.75rem;
}

.day-date {
  margin: 0;
  font-family: var(--mono);
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}

.day-count {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-mute);
}

.day-note {
  margin: 0 0 2rem;
  padding: 0.85rem 1rem 0.85rem 1.1rem;
  border-left: 2px solid var(--accent);
  background: var(--surface);
  color: var(--ink-soft);
  font-size: 0.9rem;
  max-width: 62ch;
}

.day-note strong { color: var(--ink); font-weight: 600; }

.entries { display: flex; flex-direction: column; }

.entry {
  display: grid;
  grid-template-columns: var(--gutter) minmax(0, 1fr);
  gap: 0 1rem;
  padding: 1.4rem 0;
  border-top: 1px solid var(--line-soft);
}

.entry:first-child { border-top: none; }
.entry[data-read="true"] { opacity: 0.5; }
.entry[data-read="true"]:hover { opacity: 1; }

.entry-gutter {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.4rem;
  padding-top: 0.15rem;
}

.entry-rank {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

/* 评分用 5 段竖条，比星星更像仪表、也更容易一眼比较高低。 */
.meter { display: flex; gap: 2px; }

.meter i {
  display: block;
  width: 4px;
  height: 11px;
  border-radius: 1px;
  background: var(--line);
}

.meter i[data-on="1"] { background: var(--accent); }
.entry[data-pick="true"] .meter i[data-on="1"] { background: var(--signal); }

.entry-title {
  margin: 0 0 0.3rem;
  font-size: 1.06rem;
  font-weight: 650;
  line-height: 1.4;
  letter-spacing: -0.008em;
  text-wrap: balance;
}

.entry-title a { text-decoration: none; }
.entry-title a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

.pick-flag {
  display: inline-block;
  margin-right: 0.45rem;
  padding: 0.08rem 0.34rem;
  border-radius: 2px;
  background: var(--signal-soft);
  color: var(--signal);
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  vertical-align: 0.16em;
}

.why {
  margin: 0 0 0.5rem;
  color: var(--accent);
  font-size: 0.92rem;
  font-weight: 500;
  max-width: 64ch;
}

.summary {
  margin: 0 0 0.65rem;
  color: var(--ink-soft);
  font-size: 0.93rem;
  max-width: 66ch;
}

.entry-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 0.7rem;
  font-family: var(--mono);
  font-size: 0.71rem;
  color: var(--ink-mute);
}

.entry-meta .sep { color: var(--line); }

.tool-tag {
  padding: 0.05rem 0.35rem;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--ink-soft);
}

/* 条目上的话题标签：虚线框，和实线的工具标签区分 */
.topic-tag {
  padding: 0.05rem 0.35rem;
  border: 1px dashed var(--line);
  border-radius: 2px;
  color: var(--ink-mute);
}

.thin-flag { color: var(--signal); }

.entry-actions { display: flex; gap: 0.6rem; margin-left: auto; }

.act {
  font-family: var(--mono);
  font-size: 0.71rem;
  color: var(--ink-mute);
  padding: 0.05rem 0.3rem;
  border-radius: 2px;
}

.act:hover { color: var(--accent); background: var(--surface-2); }
.act[aria-pressed="true"] { color: var(--signal); font-weight: 600; }

.empty {
  padding: 4rem 0;
  color: var(--ink-mute);
  text-align: center;
  font-size: 0.9rem;
}

/* ---------- 信源面板 ---------- */

.panel { display: flex; flex-direction: column; gap: 1.25rem; }

.panel-intro { margin: 0; color: var(--ink-soft); font-size: 0.9rem; max-width: 62ch; }

.table-wrap { overflow-x: auto; }

table.sources {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

table.sources th,
table.sources td {
  text-align: left;
  padding: 0.5rem 0.7rem 0.5rem 0;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: top;
}

table.sources th {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 500;
  white-space: nowrap;
}

table.sources td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.sources td.kind { white-space: nowrap; }
table.sources td.desc { color: var(--ink-mute); font-size: 0.8rem; min-width: 18rem; }

.state {
  display: inline-block;
  padding: 0.05rem 0.4rem;
  border-radius: 2px;
  font-family: var(--mono);
  font-size: 0.68rem;
}

.state[data-s="ok"] { background: var(--accent-soft); color: var(--accent); }
.state[data-s="warn"] { background: var(--signal-soft); color: var(--signal); }
.state[data-s="bad"] { background: var(--signal-soft); color: var(--danger); }

.hidden { display: none !important; }

@media (max-width: 860px) {
  .frame { grid-template-columns: 1fr; gap: 1.5rem; }
  /* 手机上先看文章，再看筛选器。
   * 不换序的话要先划过搜索框、四个视图、二十多个工具标签和日历，
   * 约一屏半的筛选器之后才见到第一篇文章——而手机上绝大多数人是来扫今天有什么的。 */
  .content { order: -1; padding-top: 1.25rem; }
  .rail { position: static; max-height: none; padding-top: 0; border-top: 1px solid var(--line); }
  .rail-label { padding-top: 0.5rem; }
  .tag-list { max-height: 9rem; }
  .entry { grid-template-columns: 1fr; gap: 0.5rem; }
  .entry-gutter { flex-direction: row; align-items: center; gap: 0.6rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>

rating":5,"tools":["codex","coze"],"topics":[],"publishedAt":"2026-09-06T11:51:00.000Z","author":"","preScore":9},{"id":"c814fd916663dc1f","source":"iT 邦幫忙 · 三個介面一套工作流","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10408212?sc=rss.iron","titleOriginal":"Day 23｜Claude 幫我把個人網頁更新了，順便把履歷照片藏在刮刮樂底下","titleZh":"Day 23：让 Claude Code 重排个人网站，顺手做了张刮刮乐履历","whyRead":"两个「不设也不报错、画面也看不出异状」的 Hugo 开关，一个会让当天发的文在 CI 上整篇不建置，另一个把阅读时间算掉五分之四。","summaryZh":"把 2023 年那套四格导览改成五格、顺手重写履历的一天。刮刮乐那段是逐条拆原作的坑：画布写死 3000×5000 单层 RGBA 就要 57 MiB，clearRect 挖离散方块滑快了会留虚线，mouseup 绑在画布上拖出去就收不到；他的版本只盖照片不盖履历（履历仍是 Markdown），换成 Pointer Events + setPointerCapture、圆头线段连点、getImageData 最多每 250 毫秒算一次且每 64 像素抽一个，JS 挂掉就直接显示照片。两个静默开关：timeZone 不写，front matter 没时区的日期按 UTC 算，台湾早上八点前发的文在 UTC 的 CI 上是未来日期、buildFuture 默认 false 于是线上少一篇；hasCJKLanguage 不开，最长那页 6187 字只算成 1031 词。git 写操作他坚持自己跑，skill 只负责读 diff 写 commit 讯息。","rating":4,"tools":["claude-code"],"topics":["skills"],"publishedAt":"2026-09-06T23:55:29.000Z","author":"","preScore":12},{"id":"57a3ff3095dc26c6","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7681797570142027819","titleOriginal":"WorkBuddy 开放平台上线：开发者接入 Connector 前，先看这 3 个真实踩过的坑","titleZh":"接 WorkBuddy Connector 踩的三个坑：版本号、默认语言、SKILL.md 字段","whyRead":"第三个坑是跨生态迁移的通病——按 Claude 那套 SKILL.md 的习惯只写 name + description，到别家平台会被直接拒。","summaryZh":"作者把自己的产品接进腾讯 WorkBuddy 的 Connector 时手工打包踩的三条，都是规范文档里写了但最容易被跳过的。一是 minWorkbuddyVersion 要取所用全部特性里的最高版本号：同时用 auth_mode: token（≥4.23.0）和双语示例字段（≥4.24.0）却只写了 4.23.0，低版本客户端会拉到一份声称兼容、实际不兼容的配置，而自己测不出来——你的客户端通常是最新的。二是默认的 description 字段官方模板约定填英文，回退链是 description_zh \u003e description_en \u003e description，中文团队顺手把主字段填成中文，命中回退链末端时展示就会错位，且不报错。三是 SKILL.md 的 frontmatter：Claude 生态习惯只写 name + description，WorkBuddy 要 display_name 两份、description 三份，外加白名单内的 category、version、author，照搬大概率缺字段被拒。开头那段是平台上线通稿，正文三条是他这两天的一手记录。","rating":4,"tools":["workbuddy"],"topics":["mcp","skills"],"publishedAt":"2026-09-05T14:01:31.000Z","author":"smartbid老贺","preScore":13},{"id":"bbb0f37d71c5486d","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7680183953518690338","titleOriginal":"DeepSeek Harness 从零上手：从认识到写出第一个插件","titleZh":"DeepSeek Harness 从零写到第一个插件：卡住的点和调试路径","whyRead":"它讲清了 dsh 的工具为什么要拆成 schema 和 render 两层——给程序看的权威结果，和给模型看的展示内容，本来就是两回事。","summaryZh":"同一天名单里有两篇 DSH 上手记，这篇是真动手写了插件的那篇。它把「一切皆插件」落到架构事实上：dsh 建在 Cordis 插件系统上，模型、工具、技能、会话、沙箱、存储、Agent Loop、调度、连 UI 本身都是插件，扩展能力不需要改源码；插件之间靠 services 和 events 协作，声明依赖 tools 服务之后 Cordis 会等它就绪再加载。工具定义拆两层——schema 声明入参返回值的形状，render 把返回值投影成模型真正看到的内容，于是换展示样式不必动计算逻辑。最后给的调试路径是可以照做的：先 dsh --profile web --patch ... --dump-config 确认 patch 图层进了配置树，再真实 boot 一次抓 stdout 里 apply() 那行，稳定之后才走 dsh plugin add 装 bundle。","rating":4,"tools":["dsh","cordis"],"topics":["skills","harness","agent-loop"],"publishedAt":"2026-09-01T06:36:22.000Z","author":"前端梦工厂","preScore":13},{"id":"66d0394f4f34d006","source":"SegmentFault 搜索","kind":"search","url":"https://segmentfault.com/a/1190000048213169","titleOriginal":"抓包分析Codex的交互细节","titleZh":"抓包 Codex：报文里为什么一次工具调用都没有","whyRead":"答案不在 Codex 而在协议这一层——搜索是在模型服务端跑的，所以你在本地抓包永远看不到那次调用。","summaryZh":"作者问 Codex「华为最新的手机是哪一款」，按常理它得调两次工具：一次取系统当前日期，一次联网搜索。可抓 Codex 与 DeepSeek 之间的报文，一次工具调用都没有发出去，结果就回来了。拆下来是两件事：当前日期不需要调工具，Codex 作为 agent 本来就把环境信息写进了第二次请求的报文里，模型直接读得到；联网搜索则是 Responses API 的 web_search 内置工具，执行发生在模型服务端，本地这一侧当然抓不到。顺带看见的还有一个细节：在一个新会话里发第一条消息时，Codex 会向模型发两次请求，第一次只是让它给这个会话起个标题，并且要求以 JSON 结构化输出。属于「抓包 Codex」那个系列，前一篇扒的是它的提示词怎么写。全文不长，但它回答的是一个很容易被误读成「模型偷懒没调工具」的现象：看不见调用，不等于没有调用，只是那次调用没经过你这一端。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-26T09:03:35.000Z","author":"","preScore":7}],"reviewed":30,"dropped":24,"stats":{},"errors":[]},{"date":"2026-09-06","generatedAt":"2026-09-05T22:55:00.000Z","dailyNote":"今天先读 Luenci 那篇，理由是它给的是负面结果：两条各自省下 5.8% 和 8.8% token 的 AGENTS.md 约定，叠在一起反而比基线多烧 7.2%，而且作者顺手把「这份数据什么时候会骗你」也写下来了（父 Trace 会重复计子调用、虚拟滚动只抓到 79 条里的 37 条）。其余四篇凑巧都在讲同一件事的不同层次——边界：两个 agent 之间要有自审、交接单和退件，prompt 里要禁止把 Lighthouse 的通用建议当根因，菜单上的字要当资料而不是指令，插件出错只回滚它自己。毙掉的大头是掘金那批换标题反复发的「怎么选 AI 工具」软文（今天一口气来了三条，落点是去某个技能商店搜一下），以及同一位作者写给 TypeScript 和 Python 工程师的两份同款 OpenClaw.NET 上手指南、三条 V2EX 自荐帖。掘金今天仍是 155 条 100% 抓不到正文，隔了二十分钟错时补全救回 65 条，其中 6 条在入围名单里——读完之后一条都没收，但至少是读完之后不收的。","items":[{"id":"7d4b1da0e2929589","source":"Luenci的技术博客","kind":"blog","url":"https://luenci.com/en/posts/langsmith-agents-md-context-optimization/","titleOriginal":"AI协同 | 从 LangSmith 到 AGENTS.md：一次 Agent 上下文优化实践","titleZh":"把省 token 的约定写进 AGENTS.md：两条规则单独用都省，一起用多烧 7.2%","summaryZh":"作者先用 LangSmith 把编码 agent 的执行链路摊开，确认上下文膨胀发生在哪一轮：累计输入是每轮输入之和，一段很早进上下文的无关输出会被后面每一轮重复计进去。据此往 AGENTS.md 里写两类约定——探索前先定证据、路线和停止条件（减少无效往返），以及限制工具返回的内容量。第一轮整版对照跑 6 次，累计输入 448003 → 355938（-20.6%）、模型调用 22 → 19，但三个任务里 schema 迁移那个反而涨了 33.6%。第二轮把两类规则拆开各跑 24 次：只减往返 -5.82%，只过滤工具输出 -8.78%，两条一起用是 +7.20%。文中另记了三处会让这类数据说谎的口径坑：LangSmith 的项目统计和父 Trace 已经汇总过子调用、虚拟滚动脚本只取到页面 79 条 Trace 里的 37 条、缓存命中的内容仍然算逻辑输入。","whyRead":"难得有人把负面结果写完整：两条各自省 token 的规则叠起来变成倒亏，而且他连「哪一步的数字不能相加」都标了出来。","rating":5,"tools":["codex","langsmith"],"topics":["agents-md","context-engineering"],"publishedAt":"2026-09-05T00:00:00.000Z","author":"","preScore":13},{"id":"bcd9cb12f3ddc45f","source":"方格子 vocus 标签","kind":"search","url":"https://vocus.cc/article/6a963d1efd89780001c38fae","titleOriginal":"AI Agent 工作流怎麼設計？我讓 Google Antigravity 與 OpenAI Codex 開始互相退件","titleZh":"让 Antigravity 和 Codex 互相退件：自审、交接单、申诉，三样都写进流程","summaryZh":"起点很实际：一支三分钟短影音全交给 Codex 一条龙做，顺利时吃掉 Plus 可用量的两成，不顺时接近一半。于是把前段素材（操作 Gemini Notebook 出摘要）挪给额度相对充裕的 Antigravity，Codex 专心做审核与后制。作者的结论是拆成两半并不等于协作——如果 Antigravity 做完只丢一句「完成了」，那只是把半成品往下游传递的速度自动化了。所以他给前段加了三层约束：交件前先自审口播音色、内容方向、短影音节奏和事先定义的规格，自己判断不过就重做；用 HANDOFF.md 交接；Codex 可以退件，Antigravity 可以对退件提出不同意见，ChatGPT 当仲裁。他明确拒绝给「省了 87.3%」这类数字，并指出目前最大的瓶颈是自己：通知谁做完、谁被退件仍要人肉转发，所以下一步不是全自动，是先把流程跑熟。","whyRead":"他没有给出漂亮的省额度百分比，反而说清了为什么两个 AI 各做一半不叫协作，以及瓶颈最后为什么落在人身上。","rating":4,"tools":["codex","antigravity"],"topics":["multi-agent"],"publishedAt":"2026-09-01T07:52:10.692Z","author":"","preScore":18},{"id":"6de1f8d9c589c718","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1239689#reply0","titleOriginal":"一句话用 Codex + 浏览器 MCP 解决网站性能问题","titleZh":"让 Codex 自己跑 Lighthouse 找根因：79 → 98 分，TBT 828ms 降到 49ms","summaryZh":"作者给自己的 Next.js 小项目做性能优化，接上浏览器 MCP 之后让 Codex 直接读 Lighthouse、Performance trace、Console、Network 和 DOM。流程是先只跑一次 Lighthouse 存下 JSON 基线、不许改代码，再按 TBT 和 trace 找 long task，比对服务端 HTML 与 hydration 之后的 DOM，追到具体源码和业务函数，确认原因后才让它分阶段改，每一步都重跑测试和 Lighthouse。prompt 里写死了两条约束：结果按「现象 → 证据 → 假设 → 验证方法」整理，以及不要把 Lighthouse 的通用建议直接当成根因。最后查出来的根因是服务端缓存的游戏数据和客户端首次生成的数据不一致，导致 hydration 失败，页面上 170 个格子被整个重新渲染。本地 production build 的结果：Lighthouse 79 → 98，TBT 828.5ms → 49ms，传输体积 474KiB → 185KiB。","whyRead":"值钱的不是接了 MCP，是那句 prompt 里的两条禁令——先存基线不许动代码，别把工具的通用建议当根因。","rating":4,"tools":["codex"],"topics":["mcp"],"publishedAt":"2026-09-05T08:02:32.000Z","author":"","preScore":10},{"id":"17e7958b9b3d2152","source":"iT 邦幫忙 · Codex 做 LINE Bot 上线","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10407596?sc=rss.iron","titleOriginal":"Day 24 - AI 看得懂菜單，為什麼還不能直接上線？我和 Codex 替飲品推薦加上的幾道保護","titleZh":"菜单拍照推荐饮料：从「能 Demo」到「敢上线」中间隔着的六道检查","summaryZh":"上一版 Bot 已经能让 Gemini 读菜单挑三杯饮料、用 LINE 卡片回覆，作者接着问的是它为什么还不能交给别人用：使用者传一张超大图怎么办、图片要不要保存、副档名写 JPG 就一定是图片吗、菜单上的文字会不会反过来改写模型的规则、Gemini 看不清价格会不会自己补一个、API 回传成功怎么确认 LINE 真的切到了新服务。于是上线版流程变成七步：取得图片 → 限制下载大小 → 确认真实图片格式 → 把图片当资料不让内容改写规则 → 要求 Gemini 回传固定 JSON → 程式再次清理与验证 → 组成 Flex Message，Gemini 只负责其中一段，前后仍然是普通程式在把关。另一个决定是不留图：图片只经过 Cloud Run 记忆体，不写 Firestore 也不进 Cloud Storage，日志只记大小、MIME type、是否辨识为菜单和最后推了几杯。","whyRead":"把「能演示」和「敢交给用户」之间那几步逐条写出来了，包括最容易被跳过的一条：菜单上的字是资料，不是指令。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-09-04T15:04:11.000Z","author":"","preScore":7},{"id":"735463676729b9d9","source":"极客兔兔","kind":"blog","url":"https://geektutu.com/post/geekagent-day16.html","titleOriginal":"从零实现 GeekAgent —— Day16 插件框架","titleZh":"GeekAgent Day16：插件和 Skills / MCP 的差别不在能注册什么，在出错时炸多大","summaryZh":"前 15 天每加一项能力都要回主程序改 import、初始化和 handleCommand 的 case，Day16 补一层插件约定：启动时扫描 plugins/*/plugin.ts 自动加载，插件在 onStart 拿到上下文自己注册命令、工具或起服务，在 onExit 释放资源。作者用一张表把插件和技能 / MCP / RAG 摆在一起比：后者由主程序显式 import、代码写错会让主程序整个崩，插件加载或钩子抛错只回滚它自己注册的那部分，其余插件照常启动；耦合也从「import 关系明确」变成「只依赖 SDK 接口」。两个验证目录：echo 注册 /echo 命令，web 在 8787 端口起 HTTP 服务，并复用主程序已有的命令分发、记忆召回和工具循环，用 SSE 返回流式结果。当天源码净增 411 行（新增 420、删除 9）。文末「没做什么」写明：不能热加载热卸载，插件仍与主进程共享权限和故障范围，Web 模式没有远程确认和断线重连。","whyRead":"同一个系列第四次动扩展机制，这次把插件和 Skills / MCP 的分界讲清楚了——差别在加载方式和失败半径，不在它能注册什么。","rating":4,"tools":[],"topics":["harness","mcp","skills","rag"],"publishedAt":"2026-09-03T12:00:00.000Z","author":"","preScore":8}],"reviewed":33,"dropped":28,"stats":{"fetched":481,"shortlisted":33,"thin":232,"enrichMuted":["掘金搜索"],"reenriched":65},"errors":[]},{"date":"2026-09-04","generatedAt":"2026-09-03T22:30:00.000Z","dailyNote":"今天扎堆的话题是「搬家」：把记忆插件从摘要改成只存事实、把 47 条会话从旧电脑搬到新电脑、把记忆库从第三方插件搬回官方实现，三篇讲的是同一件难事的三个层次。先读陈珙那篇——少见的把 MCP Server 当生产系统写的记录，认证、防注入、token 预算三样各有一段能抄的代码。另外今天补了一个拖了五天的洞：掘金连续五天 100% 抓不到正文（今天入围名单 23 条里有 6 条只有标题），隔了半小时重来一次，60 条里救回 40 条——最后一篇「手写一个最小版 Claude Code」就是这么捞回来的，那 40 条里其余的基本是「Cursor 平替怎么选」这类换五个标题反复发的稿子。毙掉的主要是产品自荐（V2EX 一天三条：EO2Weave、MemAuthority、easy-agent-team），以及一篇顶着「实测提升 90%」标题、通篇却是综述加引用列表的多 Agent 指南。","items":[{"id":"8ab98036f3780285","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/skychen1218/p/22808174","titleOriginal":".NET AI 实战：用 MCP 把 Claude Code 变成数据库 DBA - 陈珙","titleZh":"把自研 SQL Server 诊断平台开成 MCP 出口：11 个只读工具的设计账","summaryZh":"作者给自己做的数据库诊断平台 DBPilot 加了一条 MCP 出口，让 Claude Code 直接查慢 SQL、死锁和缺失索引，全文按原理 → Server → Client → 集成 → 演示走完整条链路。代码是 .NET 的 ModelContextProtocol.AspNetCore，注册只有三步（AddMcpServer + WithHttpTransport + MapMcp），工具靠 [McpServerTool] 特性扫描程序集自动登记。值得抄的是几条设计决策：模块默认关闭、ApiKey 为空宁可不注册；认证先各自 SHA256 再 FixedTimeEquals，用定长时间比较堵掉时序侧信道；11 个工具全部只读，列表类只回 SQL 头部 500 字符、单次最多 50 行，让模型自己决定哪条值得再调详情工具取全文；工具的 [Description] 被当成写给 LLM 看的 API 文档，明写「instanceId 从 list_instances 拿」；返回里的 SQL 文本一律当数据不当指令，这条防注入规则有专门的单测守着。","whyRead":"把 MCP Server 当生产系统写的记录很少见：认证、提示注入、token 预算三件事各有一段具体做法和一行能抄的代码。","rating":5,"tools":["claude-code"],"topics":["mcp"],"publishedAt":"2026-09-03T08:36:00.000Z","author":"","preScore":11},{"id":"969ee97040fb68a5","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/yolkvat/p/22830956/dsh-project-memory-v030-to-v040-evolution","titleOriginal":"dsh-project-memory v0.3.0到v0.4.0：从项目记忆到开发工作流记忆的演进 - 风fffff","titleZh":"记忆插件的减法：把摘要和签名整个删掉，体积 -30%、检索 187ms 变 9ms","summaryZh":"作者维护的 dsh 项目级记忆插件迭代到 v0.4.0，这篇写三个小版本各解决了什么、方案怎么选。核心结论是摘要型记忆有天然缺陷：20KB 的 README 被 LLM 压成几句话是有损压缩，模型据此判断反而被误导；代码符号层的 summary 字段同样既不保准又和进了上下文的源码重复，「记忆插件在上下文积累的过程中慢慢变成了拖累」。于是符号层只留完整声明行加行号，不存任何解释——存储 -30%、检索从 187ms 降到 9ms。文章还把没选的路各算了一遍账：tree-sitter 全量 AST 每语言 1-2MB WASM、冷启动从 80ms 涨到 500ms+，LSP 要起进程、跨语言各自维护，向量检索加 RAG 混合召回成本高而边际收益低。v0.4.0 的新东西是 TaskBridge，让会话断掉之后模型知道自己上次在做什么。","whyRead":"同类文章都在讲记忆怎么加，这篇讲的是删：哪一类记忆是在替模型重复思考，删掉之后数字变成什么样。","rating":5,"tools":["dsh"],"topics":["agent-memory"],"publishedAt":"2026-09-03T13:24:00.000Z","author":"","preScore":12},{"id":"8d870c65d3ef6638","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/ailanlan/p/22827183","titleOriginal":"WorkBuddy 跨设备迁移实战：47 条会话无缝续接的全流程缝合术 - 慵懒的小景","titleZh":"换电脑把 47 条 WorkBuddy 会话搬过去：旧路径藏在五层里，光转义就有八种写法","summaryZh":"一次真实的跨设备迁移记录：旧机用户名 yanjing、工作空间在 D 盘，新机是 Administrator 和 E 盘，47 条历史会话要能续接。作者先把 .workbuddy 目录逐项列出哪些迁哪些不迁——sessions.json 只是 UI 状态不迁，真正的会话索引在 workbuddy.db 的 sessions 表里；整库覆盖会冲掉新机已有的会话（实测踩过，9 条被冲的会话是从 jsonl 里捞回来的）。真正的坑是旧路径残留分布在五层：数据库 cwd 字段、按路径生成的 38 个 projects 目录名、jsonl 正文、pyvenv.cfg、以及技能里的 iconLocalPath。其中 jsonl 那层最脏，同一条路径有标准反斜杠、双反斜杠、正斜杠、小写盘符共八种变体，只替换一种会「怎么清都清不干净」。最后整套缝合流程交给 AI 自己跑完。","whyRead":"本地优先的 agent 把状态摊在五个地方，这篇把每一层该怎么处理列成了表——换机之前照着走一遍能省一天。","rating":4,"tools":["workbuddy"],"topics":["agent-memory","skills","mcp"],"publishedAt":"2026-09-03T08:13:00.000Z","author":"","preScore":12},{"id":"c252b702e28badc3","source":"zhheo","kind":"blog","url":"https://blog.zhheo.com/p/5r2g9ie4.html","titleOriginal":"OpenClaw 2.0：稳定性提升不少，我还迁移了我的记忆系统","titleZh":"OpenClaw 8.1 升级实录：会话进了 SQLite，记忆从第三方插件搬回官方实现","summaryZh":"作者从 RC 阶段就跟着升级 OpenClaw 8.1（官方叫 2.0），这篇记的是升级本身和一次记忆系统搬家。底层最大的改动是会话和 transcript 从文件存储换成 SQLite，官方专门给了降级警告——回滚到旧版本之后新建的 session 在旧版里看不见，升级前必须备份。使用侧的变化是引导式 Onboarding 能直接复用机器上已有的 Codex / ChatGPT / Claude CLI 登录状态，Control UI 重做后长对话不再卡、刷新页面不丢上下文。记忆那一半是重点：他把 memory-lancedb-pro 迁到官方的 memory-core，理由不是插件不好，而是 QMD 退役、官方接管核心路径之后跨对话召回和 session rewind 这些能力第三方追不上。迁移的关键动作是去重——4000 条记忆里六成是重复的，直接倒进去没意义。","whyRead":"第三方记忆插件比官方好用的时候，什么时候该迁回去？这篇给的理由是「官方接管了核心路径」，不是功能对比。","rating":4,"tools":["openclaw","codex","claude-code"],"topics":["agent-memory","memory-md"],"publishedAt":"2026-09-03T04:20:10.000Z","author":"","preScore":12},{"id":"ccc05e7248769958","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1239329#reply0","titleOriginal":"Codex 按 Ctrl+Shift+V 粘贴两次？用 AutoHotkey 解决","titleZh":"Codex Desktop 粘贴两次：用 AutoHotkey 接管快捷键，别去伪造修饰键抬起","summaryZh":"Windows 上的 Codex Desktop 按 Ctrl+Shift+V 会把同一段内容粘两次，Ctrl+V 正常。作者翻到 openai/codex 仓库里两份报告（#26199 仍是 Open、#27161 虽已关闭但 26.831.2377.0 版本仍能复现），成因看起来是这个快捷键同时被分配给了「启动或停止语音模式」。他不等官方修，用 AutoHotkey v2 接管：只在 ChatGPT.exe 窗口激活时生效，先保存完整剪贴板，再把剪贴板赋值给自己以去掉 HTML 和字体格式，然后发一次普通 Ctrl+V，最后恢复原剪贴板。文章值钱的是中间那个坑：触发时物理 Ctrl 和 Shift 还按着，直接 Send 会被输入法当成切换操作；他试过 Send(\"{Ctrl up}{Shift up}\") 伪造抬起，副作用更多，最后改成两行 KeyWait 等你真的松手再粘贴。","whyRead":"同一个快捷键被两处逻辑抢的经典形状，而绕开它的正确姿势不是伪造按键抬起，是等物理键真的松开。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-09-03T14:29:12.000Z","author":"","preScore":10},{"id":"f6b7cdb7e442f926","source":"iT 邦幫忙 · Codex 做 LINE Bot 上线","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10407237?sc=rss.iron","titleOriginal":"Day 23 - 每次站在咖啡店櫃檯前都選不出來：我讓 LINE Bot 看菜單幫我推薦飲料","titleZh":"让 LINE Bot 看菜单推三杯：需求不写「做 OCR」，写「把选择减到三个」","summaryZh":"作者和 Codex 一起给自己的 LINE 咖啡机器人加了一个功能：拍一张菜单，Bot 最多回三杯推荐。需求写法是这篇的重点——他没有把需求写成「帮我做 OCR」，而是「看懂这是不是饮品菜单、找出照片里真的存在的品项、最多推荐三杯不同方向的选择、给出品名价格和推荐理由」，因为抄完整张菜单等于让人再读一次，选择困难一点没少；三杯是刚好能比较又不会重新陷入纠结的数量。工程上卡住他的不是相机按钮，是图片在哪：LINE 的 webhook 送来的不是图片本身，只有一条 {\"type\":\"image\",\"id\":...}，真正的内容要拿这个 message ID 再去 Get content 接口取，取回来交给 Gemini 做图像理解。交互上他留了「拍菜單」这个文字入口弹出拍摄和相簿两个按钮，其实直接传图也认——入口只是给第一次用的人看的。","whyRead":"同一个功能，把需求写成「做 OCR」和写成「帮我把选择减到三个」，做出来完全是两个东西。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-09-03T12:06:52.000Z","author":"","preScore":6},{"id":"57c209d4bae9e130","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7678208515275276315","titleOriginal":"手写一个最小版 Claude Code：从任务拆解到 Agent Loop 转起来","titleZh":"手写一个最小版 Claude Code：两个工具、四种消息、一个 while 循环","summaryZh":"作者用 LangChain 把一个能跑的编程 Agent 从头串了一遍：接到「建个 react+vite 的 todolist」，先让 LLM 自己拆成三步（脚手架、写组件、装依赖跑起来），每步对应一个工具——最小版的工具盘就是 fs 读写文件加 cli 执行命令两个。文章讲清楚了三处容易含糊的地方：bindTools 是那个开关，不绑工具 LLM 只会回一段伪代码；四种 Message 各自代表谁在说话，AIMessage 带 tool_calls、ToolMessage 带 tool_call_id，LLM 靠这个 id 对账「这个结果是我刚才哪个调用产生的」；以及 while 循环怎么把这些接起来转下去。最后留了个自己踩的坑：工具函数是 async 的，忘了 await 拿到的是 Promise 不是数据，而 Agent 里到处是这种地方。","whyRead":"「Claude Code 拆到底就是 LLM + fs + cli」这句话，这篇把它拆到能照着写一遍的粒度。","rating":4,"tools":["claude-code"],"topics":["agent-loop"],"publishedAt":"2026-08-26T09:23:00.000Z","author":"两只羊ovo","preScore":12}],"reviewed":63,"dropped":56,"stats":{"fetched":396,"shortlisted":23,"thin":180,"enrichMuted":["掘金搜索"],"reenriched":40},"errors":[]},{"date":"2026-09-03","generatedAt":"2026-09-02T22:29:21.903Z","dailyNote":"今天名单被两类东西压着：厂商的 Agent 记忆软文（PolarDB-X 一家三条，博客园还有一条百智云）和掘金那 175 条只剩标题的条目，后者第四天补全熔断，一条都没法核实，一律没收。真正的收获在两个「摸边界」的稿子上——Docker Sandboxes 那两篇把云 metadata 端点默认被拒、以及 sbx secret 和 sandbox-persistent.sh 是两种信任模型量了出来，先读网络策略那篇。另一头是 V2EX 那条烧掉 100 刀的多 agent 复盘：它形状最不体面，却是今天唯一一篇写清楚「照搬人类团队流程」贵在哪的。毙掉的里面有两条可惜的——skill 软链接管理器和 dsh 的 Discord 适配器，两篇的踩坑都是真的，但结尾都落在「装一下试试」。","items":[{"id":"510a06ee5d486258","source":"SegmentFault 搜索","kind":"search","url":"https://segmentfault.com/a/1190000048196158","titleOriginal":"Docker Sandboxes 的网络策略：balanced 挡住了什么，怎么放行一条例外","publishedAt":"2026-08-24T01:15:04.000Z","author":"","preScore":9,"titleZh":"Docker Sandboxes 的网络策略：balanced 挡住了什么，怎么放行一条例外","whyRead":"balanced 不是「基本全开」——云平台那个回答「我是谁、我的凭证是什么」的 metadata 端点默认就在拒绝名单里。","summaryZh":"作者把 Docker Sandboxes 三档网络预设里居中的 balanced 摊开量了一遍：初始化后本机生成 197 条 allow 规则，覆盖模型 API、PyPI、npm、GitHub 和容器 Registry；但默认拒绝的那一半更值得看——宿主机 localhost 直接连不上（curl 返回 000）、example.com 是 403，局域网私有地址、VS Code 与微软的遥测域名，以及云平台通用的 metadata 端点 169.254.169.254 和 metadata.google.internal 全部走 default deny。排查用 sbx policy log，同一个域名会出现两条，一条是 HTTP 层被 403、一条是 DNS 查询本身被切断；放行用 sbx policy allow network --sandbox \u003cname\u003e \u003chost\u003e，立刻生效不必重启。还有一条提醒：kit 会额外加规则，他机器上几个 OpenCode sandbox 各自多一条 kit 的 allow，不算在全局那 197 条里。","rating":5,"tools":["docker-sandboxes","opencode"],"topics":[]},{"id":"549b646ad222b439","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/rossiXYZ/p/22764207","titleOriginal":"【OpenClaw具身硬件】ZeroClaw 源码阅读笔记（3）--- RAG - 罗西的思考","publishedAt":"2026-09-02T13:36:00.000Z","author":"","preScore":9,"titleZh":"ZeroClaw 源码笔记（3）：一个项目里两套 RAG，一套连 embedding 都不要","whyRead":"硬件数据手册的检索为什么不上向量，作者把这笔省下来的账逐条算给你看。","summaryZh":"读 ZeroClaw（100% Rust 的具身硬件 AI 框架）源码的第三篇，主题是检索层。第一个发现是项目里其实有两套互不调用的 RAG：HardwareRag 在 src/rag/mod.rs，负责把硬件数据手册切块、解析引脚别名再注入系统提示，纯关键词词频加开发板加分，不带 embedding；Memory 检索管线在 src/memory/，管对话和知识，走 cache → FTS5 → vector 三阶段，embedding 默认是 Noop。工程取舍逐条列了出来：数据手册只有几十到几百个 chunk，关键词够用，省掉启动时跑 embedding 的开销；三阶段按 cache 命中 0ms、FTS 毫秒级、向量几十到几百毫秒排序，先便宜后贵，BM25 已经很高时早停跳过向量；chunker 两边共用，512 token 按标题分段、段落兜底。还点出文件注释写着「可选语义检索」，而 embedding 那条路径在当前代码里并未实现。","rating":4,"tools":["openclaw","zeroclaw"],"topics":["rag","agent-memory"]},{"id":"8d2f79cd3c0e0baf","source":"极客兔兔","kind":"blog","url":"https://geektutu.com/post/geekagent-day15.html","titleOriginal":"从零实现 GeekAgent —— Day15 MCP 工具接入","publishedAt":"2026-09-02T10:00:00.000Z","author":"","preScore":12,"titleZh":"从零实现 GeekAgent Day15：接 MCP 客户端，顺便说清它和 Skills 差在哪","whyRead":"Skills 和 MCP 看着都在给 agent 加工具，作者用一张表说清了两者根本不在同一层。","summaryZh":"从零写 agent 系列的第 15 天，接 MCP 客户端。开篇先拆一个容易混的问题：Day 11 的 Skills 和 MCP 都会改变模型看到的工具清单，但 Skill 是按任务组织目录里已经写明的指令和本地工具，MCP 是连上 server 之后调 tools/list 现问「你有哪些工具」——一个事先知道，一个握手后才知道，所以 server 能独立于 agent 增删工具。实现只走 stdio 传输（Node 的 spawn 起子进程，不碰 OAuth 和远程 HTTP），server 返回的工具按 mcp_\u003c服务名\u003e_\u003c工具名\u003e 注册进 Day 4 那张表，沿用 Day 8 的权限策略默认每次询问。当天源码新增 314 行、删除 3 行，其中 52 行是用来验证协议的教学 server。结尾「没做什么」一节把边界交代得很干净：不接 resources / prompts / sampling，不处理工具热更新和断线重连，server 崩了要重启 agent。","rating":4,"tools":[],"topics":["mcp","skills"]},{"id":"06dbd7f2bd3db0c1","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/ahfuzhang/p/22807976","titleOriginal":"体验向量数据库 qdrant - ahfuzhang","publishedAt":"2026-09-02T07:37:00.000Z","author":"","preScore":8,"titleZh":"给百万行祖传 C# 建知识库：换掉 weaviate 之前，先看看 codex 到底在用什么检索","whyRead":"问答助手又慢又差，查下去发现 agent 一直在跑 BM25——因为文档导入时压根没算向量。","summaryZh":"作者想靠一个企业知识库快速摸清公司百万行 C# 祖传代码，第一版用 weaviate，做出来的问答助手又慢、结果又差；顺着思考过程查下去才发现 codex 是在 weaviate 里用 BM25 检索的——因为他图导入方便把整份文档直接塞了进去，没有先为文档计算向量。换成 qdrant 之后查询速度和质量都明显好转。部署细节给得很全：qdrant v1.15.4 的 docker 跑法（6333 是 http、6334 是 grpc，用 QDRANT__SERVICE__API_KEY 设 key），官方 mcp-server-qdrant 没有现成镜像要自己 clone 了 build，靠内置 FastEmbed 下 BAAI/bge-small-zh-v1.5 算中文向量。他还点出这个官方 MCP 服务的两个问题：不校验 API KEY，部署完等于拿 qdrant 的 key 裸奔；每次启动都重新下模型。两处他都 fork 修了并放出了镜像。","rating":4,"tools":["codex"],"topics":["mcp","rag"]},{"id":"d247af0bbf5cdfce","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1238942#reply44","titleOriginal":"5X 的 Codex 一天半烧完了，晒晒我的智障多 agent 工作流","publishedAt":"2026-09-02T07:16:15.000Z","author":"","preScore":13,"titleZh":"照大厂流程给五个 agent 排班，100 刀一天半烧完，返工一点没少","whyRead":"把人类团队那套需求评审验收原样搬给 agent，钱是怎么烧掉的这篇写得很具体。","summaryZh":"一篇很诚实的失败复盘。作者充了 100 刀 codex，一个项目里塞了产品、测试、运营、后端、桌面端五个 agent，想把流程做得正规一点：需求先丢给运营 agent 调研，产品出方案，测试写用例，齐了后端和桌面端才开始写代码；写完还要挨个过审——测试审一遍、产品审一遍、UI 审一遍、UX 再单独审一遍，UI 和 UX 他当时还拆成了两个 agent。结果这几个 agent 审起来一个比一个能说，「不符合用户心智」「交互路径太长」「边界情况没覆盖」，而它们提的问题最后基本都得他自己动手改：返工没少，他还多了个给 agent 当裁判的活儿。钱主要烧在上下文上，每个 agent 都得喂历史记录，一次几百条 message，光对齐需求就来回好几轮。一天半烧完，项目卡在半路，他自己给出的三个疑问是：到底是这套官僚流程本身有病，是该让 agent 并行干而不是串行开会，还是单纯额度买少了。","rating":4,"tools":["codex"],"topics":["multi-agent"]},{"id":"2e0874dc3b9f1041","source":"方格子 09-01T22:40:00.000Z","dailyNote":"今天名单大半被 DeepSeek Harness 包了，但十几条里绝大多数是版本更新播报、架构科普和插件自荐，真动过手的只有两条：一条把它装出 C 盘、连撞六个坑，一条查清了它上下文过 80% 就吞对话的原因——压缩恢复只认 provider 报的 context overflow，不认 stop_reason=length。这两条也是今天建议先读的。另一头是 Skill 扎堆：怎么读懂一份 SKILL.md、技能凭什么不只是更长的 prompt、免费方案下一套 skill 光加载要吃掉多少 token，三个角度各留一条。毙掉的主要是产品自荐帖和 DSH 的对比科普——它们和真折腾讲的是同一个东西，区别只在落点是「你来装一下」还是「我装的时候撞了什么」；掘金今天又熔断，201 条里 163 条只剩标题，那批一条没收。","items":[{"id":"ee19390a6381c48b","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7675831371631050795","titleOriginal":"DeepSeek Harness 踩坑记录：最初我只是不想把它装到 C 盘，没想到……","titleZh":"把 DeepSeek Harness 装出 C 盘的六道关：npm 卡死、pnpm 拦构建脚本、cmd 尾随空格","summaryZh":"作者要把 dsh 装进 E 盘的独立沙盒（C 盘只剩 30G、虚拟机磁盘 I/O 敏感），折腾一天记下六关。npm 11 解析 dsh 客户端包之间互相约束的 peerDependencies 时指数级回溯，两次都确定性卡死在 placeDep dsh-client-ui-layout 这一行，换 pnpm 一次装完 531 个包；pnpm 11 默认拦截依赖的构建脚本，而 package.json 里的 onlyBuiltDependencies 白名单只对 workspace 根项目生效，直接 pnpm add 远程包时得写进 pnpm-workspace.yaml；node-pty 自带预编译，VS Build Tools 和 Python 都不用装；cmd 的尾随空格让进程打印完地址就消失，改用 PowerShell 直接 spawn；环境变量 DEEPSEEK_API_KEY 存在时 Web UI 的 Key 输入框被锁死；最后翻源码确认 DSH_HOME 的优先级。他也写清了适用范围：C 盘够用就走默认 ~/.dsh，这套折腾是给需要完整隔离迁移的场景准备的。","whyRead":"官方那行 npx 一条命令，只要换个安装目录就有六个坑，每一个都附了原因和自己验证过的解法。","rating":5,"tools":["dsh"],"topics":[],"publishedAt":"2026-08-20T11:59:55.000Z","author":"张炯炯","preScore":12},{"id":"37003e1d5068c462","source":"iT 邦幫忙 · AI Code Reviewer 養成","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10406605?sc=rss.iron","titleOriginal":"Day 24｜把 Claude Code 搬上瀏覽器：一場 Session 一顆容器","titleZh":"把 Claude Code 搬上浏览器：一场 Session 一颗容器，以及两份同义变量名的代价","summaryZh":"前 23 天他把一个 code review 审查员的能力（Skill 判断、行为评测、容器与防火墙边界、Trace 和 MITM 观测）都堆在自己那台笔电上，Day 24 要把这四层变成每一场 Session 的默认值：Session 的真身是容器，可写层用完丢弃，对话记录留在容器外的使用者空间，下次还能接回来。第一次在浏览器按下「建立 Session」就卡住——没有错误讯息，也进不了终端，实际是容器里的启动脚本卡在一道 read，等一个没有键盘的服务永远不会送进去的输入。他选择让原脚本接受环境变量，而不是在控制平面里把那些步骤重写一遍；但控制平面另取了一套变量名，两边的对照一漂，选单就不会被跳过、启动也不会报错，只会停在「建立中」。后来加「录制范围」时忘了同步送变量，同样的形状又来一次。分工因此写死成一句：能力的做法留在原本那份脚本里，控制平面只决定要不要。","whyRead":"最难查的不是报错，是那种不报错的失败——画面停在「建立中」，容器里的脚本正在等一个永远不会来的键盘输入。","rating":5,"tools":["claude-code"],"topics":["skills"],"publishedAt":"2026-09-01T10:10:00.000Z","author":"","preScore":7},{"id":"0b64c779fa7bd0a4","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1238749","titleOriginal":"记一次 DeepSeek harness 吞对话的解决过程 [dsh 压缩机制问题]","titleZh":"dsh 上下文过 80% 就吞掉对话：压缩只认 context overflow，不认 stop_reason=length","summaryZh":"M1 Pro 32G 上跑 dsh 0.1.1-rc.2，模型走本地 unsloth desktop mlx（Ornith-1.5-9B-MLX-4bit，35328 上下文）。现象是上下文用到 80% 以上之后，发出去的 prompt 直接消失，agent 什么都不返回。他从两头查：dsh 日志里没收到有效响应，而 unsloth 那侧其实是有响应的，只是 stop reason 为 length；UI 上 32k 的上下文已经逼近 30k 也始终没触发压缩，手动 compact 同样没反应。随后请 Codex 去翻官方讨论（deepseek-harness#5123），坐实了两件事：dsh 的压缩时机本来就偏晚，而且只有 provider 明确报出 context overflow 时才会进 overflow-compaction recovery，stop reason=length 根本不走这条路。解法是把 compaction-basic 的 thresholdRatio 降到 0.70 提前压缩，兼容性那一半只能等官方。","whyRead":"同一个现象两个病因，而第二个是 dsh 的恢复路径只认一种报错——本地模型接口报的那种它不认。","rating":5,"tools":["codex","dsh"],"topics":["context-engineering"],"publishedAt":"2026-09-01T11:48:36.000Z","author":"wxjback","preScore":7},{"id":"3f7fcc21c74691d7","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/CrazyJinn/p/22798093","titleOriginal":"3句话，AI给我生成了一个galgame - CrazyJinn","titleZh":"3 句话 + 21 个 Skill + 无数人工微调，AI 帮我做了一个 galgame","summaryZh":"一个几乎全部资产都是 AIGC 的 galgame，demo 和源码都放出来了：LLM 用 GLM，harness 是 Claude Code，美术 GPT Image 2.0、配音 Qwen3-TTS、配乐 SeedMusic、环境音效 AudioFly，引擎 Godot，剧情关系放进 Neo4j。作者开篇先把自己的标题拆了——真正的标题该是「3 句话 + 21 个 Skill + 无数人工微调」，AI 确实参与了绝大部分生产，但离能自主完成游戏开发还差得远。他给的解释是：LLM 目前只在编程领域真正进入工业生产，因为编程语言的语义空间被语言规范、类型系统和运行环境严格限制，而「一个温柔的女孩有多温柔」「昏暗的房间有多暗」没有唯一答案；问题从来不在生成，在生成之后没人能告诉你它对不对。顺手记了个 plugin 的坑：从 Marketplace 装容易读不到项目根目录下的 setting，得手工把 agent / skills / script 拷进项目目录。","whyRead":"他自己把标题拆穿了：AI 生成早就不是瓶颈，「生成之后怎么知道它对不对」才是。","rating":5,"tools":["claude-code"],"topics":["skills"],"publishedAt":"2026-09-01T15:29:00.000Z","author":"","preScore":6},{"id":"3b2fe73ed25a154b","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/29/claude-code-agent-loop-10-finale/","titleOriginal":"Claude Code Agent Loop 研究系列（10）—— 从自动循环到通用 Agent Loop","titleZh":"Claude Code Agent Loop 收尾：把权限、hooks、状态机和子代理拼回一个循环","summaryZh":"十篇拆解之后的合拢篇，不再增加新机制，只把权限、hooks、工具调度、状态机、streaming、错误恢复、interrupt 和 sub-agent 重新拼成完整的 Agent Loop，留下五条结论。一，loop 是自动循环，用户按一次回车之后中间通常无人参与，只有工具需要权限批准或用户主动 interrupt 时才停。二，loop 的核心是一套显式状态机而不是五行 while：每轮结束都会记下一步该走正常调用、重试、压缩还是恢复，所以出错不在当轮的 try/catch 里层层重试，而是回到主循环由下一轮处理。三，工具执行失败会被转成 tool_result 交给模型，主循环要恢复时会被转成 transition 交给下一轮——错误在这里是可以继续处理的状态，loop 更像主动自救的 recovery engine 而不是 error handler。四，自动运行有权限批准、interrupt、maxTurns 三道保险，分别管执行前确认、运行中制动和最终硬上限。五，主代理和 sub-agent 调用的是同一套 queryLoop，只靠 agentId 区分身份。","whyRead":"把十篇拆解压成五句话：loop 不是 while 循环而是状态机，而错误在这套设计里是一种可以继续往下处理的数据。","rating":4,"tools":["claude-code"],"topics":["agent-loop","hooks","subagent"],"publishedAt":"2026-08-29T10:00:00.000Z","author":"","preScore":9},{"id":"6b71cb5ff38b6fe4","source":"极客兔兔","kind":"blog","url":"https://geektutu.com/post/geekagent-day11.html","titleOriginal":"从零实现 GeekAgent —— Day11 技能系统（Skills）","titleZh":"从零实现 GeekAgent Day11：技能不是更长的 prompt，它还改写工具清单","summaryZh":"手写 agent 连载的第 11 天做技能系统，当天源码新增 254 行、删除 15 行。他先把 skills 和 AGENTS.md 摆在一起比：AGENTS.md 管整个项目、每轮请求都加载、不改变工具列表；技能管当前任务，用 /use 加载、/unuse 卸载，而且能增加或筛选工具。差别落在一个很具体的例子上——在 AGENTS.md 里写「只读代码，不要修改」，模型仍然看得见 write 和 patch，那只是一条行为要求；而加载 explore 技能之后程序只把 ls、glob、read 发给模型，模型根本看不到修改工具，另一边 code-review 技能还能带上原本不存在的 git_diff。实现上一个技能就是一个目录：SKILL.md 上半部分写描述和内置工具白名单，下半部分是给模型的任务指令，可选的 tools.ts 导出技能自带的工具。文末照例列了「没做什么」：一次只能加载一个技能，技能状态不随会话保存。","whyRead":"AGENTS.md 里写「只读代码不要修改」，模型照样看得见 write；加载技能才是真的把改写工具从清单里拿走。","rating":4,"tools":[],"topics":["skills","agents-md"],"publishedAt":"2026-08-30T13:30:00.000Z","author":"","preScore":10},{"id":"1ba0e95791321bba","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/Raiden-xin/p/22787689","titleOriginal":"别急着翻译 SKILL.md：我做了一个专门拆解 Skill 设计的工具 - Raiden_xin","titleZh":"读一份 SKILL.md 该看的五件事：从「写了什么」到「为什么这样写」","summaryZh":"作者写了个拆解 Skill 设计的工具，文章讲的是这套判据本身。出发点是：难懂的往往不是英文，是藏在文字背后的工作流——一条「Read all contextFiles before implementation」直译过来等于没说，值得追问的是它在防什么（防模型只看当前任务就动手），以及它隐含的权责划分（外部系统决定该读哪些文件，AI 负责完整读取），也就是把 Context Discovery 和 Context Consumption 分开了。他列出分析一份 Skill 至少要看懂的五件事：它到底要解决什么问题，能力边界要从触发条件、输入、步骤和输出里判断；AI 收到之后会怎么行动，很多 Skill 表面是说明文实际是一张流程图；谁说了算，用户要求、项目文件、CLI 状态、Artifact 和 MUST 规则不是同一等级，没写明冲突优先级执行结果就会随模型漂移；什么叫完成，Completion Definition 和 Completion Evidence 是两件事，只有定义没有证据最后仍会退化成「AI 觉得差不多了」；以及哪些设计值得换个场景继续用。","whyRead":"同一份 Skill 里用户要求、项目文件、CLI 状态和 MUST 规则不是一个等级，没写清冲突时听谁的，执行结果就会随模型漂移。","rating":4,"tools":[],"topics":["skills"],"publishedAt":"2026-09-01T03:20:00.000Z","author":"","preScore":12},{"id":"d1b81c20a6b4e21b","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7678068332773113907","titleOriginal":"Cline配置MCPServer：UV和UVX无法识别","titleZh":"Cline 里 uv/uvx「无法识别」：根因不在 PATH，在 VSCode 解析 shell 环境失败","summaryZh":"在 Cline 的 mcp_settings.json 里用 uv / uvx 装 MCP Server 一直报「无法识别」。作者按怀疑顺序一条条排：~/.zshrc 里的 PATH 确实写了，终端里 uvx 也跑得动；把 command 换成绝对路径 /Users/liuqx/.local/bin/uv 之后 MCP Server 立刻注册成功，由此确定问题出在 VSCode 没加载到系统环境变量。重启后右下角冒出真正的线索：Unable to resolve your shell environment，错误码 9。官方文档解释 VSCode 从图形界面启动时拿不到系统环境变量，会另起一个小进程去解析 shell 环境，建议注释掉 NVM 这类耗时操作或调长解析时间——两条照做都没用，问 AI 给的答案也和官网一致。最后在 Cursor 论坛的同类帖子里看到有人是环境变量文件里存在无效配置；他备份后清空 .zshrc，报错消失，再让 AI 写脚本逐条验证，果然有几行指向已改路径或已卸载的软件。","whyRead":"PATH 配了、终端里 uvx 跑得动、换绝对路径也能用——真正坏的是 shell 配置里几行早已失效的旧路径。","rating":4,"tools":["cline"],"topics":["mcp"],"publishedAt":"2026-08-26T05:46:12.000Z","author":"Evelyn_","preScore":12},{"id":"e545218f53140c87","source":"iT 邦幫忙 · 英语家教 Skill 设计实录","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10403503?sc=rss.iron","titleOriginal":"Day 15 價格平民，童叟無欺低成本版skill製作","titleZh":"把英语家教 Skill 搬到 Claude 免费版：三份文件光加载就吃掉 9250 tokens","summaryZh":"这份 skill 的受众是高中生，多半没有 Pro 方案甚至没有电脑，所以作者试着做一个能在网页端免费方案上跑的低成本版，先把成本逐项量了一遍（按大约 2 字元 1 token 折算）：出题本身 185 字元约 90 tokens，答错后的四步骤检讨 853 字元约 425 tokens，一题答错的完整循环约 515 tokens，答对因为不用完整解释只要 140 tokens 左右；而每次对话开场就要载入的 SKILL.md、INTERACTION-RULES.md、VAULT-RULES.md 三份合计 18499 字元约 9250 tokens，如果 hub 的完整选单也留在 context 里，再加 22706 字元约 11350 tokens，合起来逼近 20600 tokens。也就是说免费用户的额度大头花在固定加载而不是答题上。文件读写那一半的解法后来被他自己推翻并当场加了注记：Claude 网页版的 project 无法被 AI 自主覆盖，错题本只能另找出路。","whyRead":"他把固定成本和每题成本分开算了一遍，结论是贵的不是题目，是每次开场都要重新载入的那几份文件。","rating":4,"tools":["claude"],"topics":["skills"],"publishedAt":"2026-08-17T20:14:02.000Z","author":"","preScore":7}],"reviewed":50,"dropped":41,"stats":{"sources":280,"fetched":513,"shortlisted":50,"rejected":463,"thin":246,"enriched":80,"enrichAttempted":250,"enrichRetryAttempted":170,"enrichRetried":0,"enrichSkipped":122,"enrichMuted":["掘金搜索"],"failedSources":0,"feedRetryAttempted":3,"feedRetried":3},"errors":[{"source":"掘金搜索","message":"部分查询失败（1/29）"}]},{"date":"2026-09-01","generatedAt":"2026-08-31T22:17:57.985Z","dailyNote":"今天名单被 Harness 这个题包了半张：昨天刚收过一篇拆 Claude Code 的，今天又来两篇——一篇从 Cordis 的插件树讲 DSH 的运行时组合，一篇从「我自己做的 agent 为什么没那几个产品稳」问起。两篇角度不撞，就都留了。真正建议先读的是 Mayx 那篇：全程只用国内免费模型，最后靠替换浏览器的 WebSocket 对象把一款关服游戏整个搬进了网页。毙掉的还是老三样——掘金的对比评测型推广稿、SegmentFault 上一水儿的 DSH 上手指南、以及两条落点写得明明白白的插件自荐帖（其中一条把多 agent 的管理痛点写得很好，可惜结尾是「欢迎试一下我的 Agent TUI Manager」）。","items":[{"id":"7dbd028619689481","source":"Mayx的博客","kind":"blog","url":"https://mabbs.github.io/2026/09/01/vibe-coding2.html","titleOriginal":"Vibe Coding 新体验（2）","publishedAt":"2026-08-31T16:00:00.000Z","author":"","preScore":12,"titleZh":"用免费混元把关服麻将搬进浏览器：连 .proto 都是 AI 逆出来的","whyRead":"最狠的一步是替换掉浏览器的 WebSocket 对象，让客户端以为自己连上了真服务器，游戏和服务端一起跑在网页里。","summaryZh":"作者全程只用腾讯混元 Hy3 这类国内免费模型，一口气做了两件事。一是把博客的功能提成 JS 函数挂进浏览器控制台，再按 WebMCP 规范包一层交给 AI 调用；过程中撞上 Chrome 的 registerTool 并不像文档说的那样返回 Promise，AI 严格照文档写的 .then() 当场报错，只能手动套一层 Promise 才跑通。二是给一款即将关服的 Unity3D 立直麻将做离线快照：AI 认出它走 WebSocket+Protobuf，先只按编码规则用 Python 把服务端重放出来，接着把服务端整个搬进浏览器——替换掉浏览器的 WebSocket 对象，让客户端以为自己连上了真服务器。作者后来又追问客户端里到底有没有 .proto，结果它连接口定义文件都逆了出来，于是顺势往下做完整对局引擎和人机。","rating":5,"tools":[],"topics":["vibe-coding","webmcp"]},{"id":"f66704445c2c5253","source":"SegmentFault 搜索","kind":"search","url":"https://segmentfault.com/a/1190000048214398","titleOriginal":"我让本地 Qwen3.8 27B 搭了一个内网穿透服务","publishedAt":"2026-08-26T17:34:31.000Z","author":"","preScore":8,"titleZh":"让本地 Qwen3.8 27B 自己打通内网穿透：100 分钟，五个坑全在文档里","whyRead":"全程没用 SSH——它自己发现 ECS 装了云助手，改走 RunCommand 上机，还绕过了 aliyun CLI 官方文档里那个 404 的下载地址。","summaryZh":"作者把 BF16 的 Qwen3.8 27B 下到本地，用 DeepSeek Harness 调用、推理档位拉到 xhigh，交给它一件真活：用 frp 把本机 SGLang 服务穿透到阿里云 ECS。约 100 分钟后从 ECS 公网口请求 /v1/models 拿到了模型列表。正文是它自己整理并脱敏的操作记录，五个坑都很具体：aliyun CLI 文档里的 latest 裸文件名返回 404，要带 .tgz；ECS 没有可用密钥对，它改走云助手 RunCommand；CreateKeyPair 的私钥字段叫 PrivateKeyBody，认错会解析成空文件；照文档下的 arm64 包在 x86_64 上报 cannot execute binary file；frp 0.70 的配置换成了顶层平铺加 [[proxies]] 数组。","rating":5,"tools":["dsh"],"topics":[]},{"id":"60ba93dbea89e61e","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/ai-old-six/p/22772381","titleOriginal":"DeepSeek Harness 的价值不在 Loop，而在运行时组合 - AI小老六","publishedAt":"2026-08-31T04:44:00.000Z","author":"","preScore":9,"titleZh":"DSH 的价值不在那条 Loop，在 Cordis 把配置变成运行中的插件图","whyRead":"顺手澄清了一条很容易被当成安全边界的东西：Cordis 的 inject 约束不是沙箱，同进程插件照样碰得到 Node API。","summaryZh":"作者认为 DSH 值得研究的不是那条「组 prompt、调模型、执行工具、回填结果」的四步主循环——做 demo 时那就够了——而是它把 Agent 的组合关系做成了运行时系统：Cordis 管「系统现在由什么组成」，Session Log 管「系统刚才做过什么」，Agent Loop 夹在两条事实线中间。前者把多层配置装配成一棵运行中的插件树，Bundle、Runtime Profile、Patch、Agent Preset 各管一层，再用 Context/Realm 定依赖可见性、Fiber 记一次挂载的资源所有权、Effect 收拢监听器和句柄；后者先追加事实，再由 deriveMessages() 投影出模型可见的历史，流式 chunk 和 turn/step 统计不进上下文，compaction 以 replacement 节点追加。代价也写得直白：日志格式迁移、存储与隐私治理都会变重，而日志只能证明模型请求过一次外部操作，不保证重放安全。","rating":4,"tools":["dsh","cordis"],"topics":["subagent","context-engineering","harness","agent-loop"]},{"id":"3ca16c6b31adc5d6","source":"方格子 vocus 标签","kind":"search","url":"https://vocus.cc/article/6a92e3c5fd89780001ffb2e8","titleOriginal":"看起來都只是 while loop，為什麼成熟的 Agent Harness 就是比較會做事？","publishedAt":"2026-08-30T13:47:33.903Z","author":"","preScore":6,"titleZh":"同样一个 while loop，为什么成熟 Harness 就是更会做事","whyRead":"作者把自己「工具描述全塞进 system context 反而更差」那次失败，接到了渐进式揭露和时间感知同一条线上。","summaryZh":"作者从「我接了一样的 LLM、有工具有记忆，Agent loop 看起来也差不多，为什么跑起来就是没有 Codex、Claude Code、Hermes、OpenClaw 稳」这个疑问出发，把 Harness 归到一条 Observation → Action → Environment 的回路上。两处是他自己踩出来的：一是时间感知，模型参数训练完就定型，runtime 不注入 datetime.now() 它连今年是哪年都不知道，搜索结果的新旧也就判不了，而 repo branch、任务进度、外部服务状态其实都是同一类问题；二是他曾把所有工具描述和 SOP 全塞进 system context，以为知道得越多越完整，结果大量无关描述既吃上下文又干扰推理，只好借渐进式揭露的思路，先只暴露有哪些能力、真要用时再加载。结论是 Prompt、Memory、Skill、Tool、Validator 各是这条回路上不同的控制变量，重要的不是挑哪一个。","rating":4,"tools":["claude-code","codex","openclaw","hermes"],"topics":["skills","context-engineering","harness","agent-loop"]},{"id":"0cbfaff945e7fa4b","source":"极客兔兔","kind":"blog","url":"https://geektutu.com/post/geekagent-day10.html","titleOriginal":"从零实现 GeekAgent —— Day10 项目指令与长期记忆","publishedAt":"2026-08-29T13:30:00.000Z","author":"","preScore":12,"titleZh":"从零实现 Agent 第 10 天：AGENTS.md 和 memory 到底该各管什么","whyRead":"一张表把「项目说明书」和「运行时便签」的七项差别摆开——谁写、进不进版本库、占多少上下文，全都不一样。","summaryZh":"GeekAgent 系列第 10 天补两种跨会话信息，重点全在讲清它们的分工。AGENTS.md 是项目说明书：由人手写、随代码一起提交、每轮请求完整带上，改完下次启动生效，文件多长就占多少上下文。memory 是模型自己调 memory_write 记下的便签：落在 .geekagent/memory.json，已被 gitignore，不提前交给模型，只能用 memory_search 按关键词取回、最多返回 10 条。作者点破的那句是关键——如果把全部 memory 也塞进每次请求，它和 AGENTS.md 就没有区别了，所以一个始终可见、一个按需出现。当天源码相对 Day 9 新增 128 行、删除 13 行，净增 115 行，文末还列了六条验收步骤和三项明确没做的事（不合并多级指令、记忆只能追加、搜索只匹配关键词不理解语义）。","rating":4,"tools":[],"topics":["agents-md","agent-memory"]}],"reviewed":44,"dropped":39,"stats":{"sources":278,"fetched":406,"shortlisted":44,"rejected":362,"thin":151,"enriched":95,"enrichAttempted":177,"enrichRetryAttempted":82,"enrichRetried":0,"enrichSkipped":36,"enrichMuted":["掘金搜索"],"failedSources":1,"feedRetryAttempted":1,"feedRetried":1},"errors":[{"source":"酷酷的白","message":"HTTP 403"}]},{"date":"2026-08-31","generatedAt":"2026-08-30T22:20:39.827Z","dailyNote":"今天名单被 DeepSeek Harness 包了一半，但真正值得先读的是 V2EX 那条事故帖：agent 想删自己笔误建的 work 目录，macOS 大小写不敏感，删掉的是真实的 Work，git 历史和全部未提交改动一起没了。紧接着读博客园那篇 AGENTS.md 的取舍——它贴出来的全局规则里「文件系统安全」那一段，正好是前一条事故的解药。另一条重头是 Innei 用一天迁完一万多行 CSS 的实录：大模型写迁移手册、小模型当 worker、worktree 隔离并行，300 多条提交、体积腰斩、烧掉三十多亿 token，是今天唯一把数字给全的一篇。毙掉的主要是三类：掘金上那批「本文基于源码快照进行静态分析、未执行构建与测试」的机器报告，SegmentFault 上四篇同一口径、结尾一律指向某家云厂商教程的 DSH 指南，以及照例的插件自荐帖。iT 邦幫忙两个铁人赛系列今天合计入围 16 条，各只取了一条最好的。","items":[{"id":"afb263f1c4da4f63","source":"iT 邦幫忙 · Claude Code 陪跑订阅制 SaaS","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10402026?sc=rss.iron","titleOriginal":"# Day 26｜自動巡檢代理：讓 Claude Code 當夜班值班工程師","titleZh":"让 Claude Code 当夜班值班工程师：只给提案权，不给生效权","summaryZh":"作者给自己的一人公司订阅制服务挂了三条排程任务：清晨的程式码巡检（扫全库找违反专案惯例的写法、可疑逻辑、缺测试的新增码）、早晨的同类服务动态观察、上午的资料管线健检（确认每天的回补排程真的补到了、数量级正常、没有静默失败）。每条跑完把报告推到一个独立的报告分支，发现值得修的问题时修正提案也推到独立工作分支，永远不直接碰主分支——因为主分支的变更会自动部署到正式站，让一个没人监督的自动程序拥有改变正式服务行为的权力，在任何规模的组织里都是事故配方，一人公司尤其如此，出事时连第二双眼睛都没有。所以权限结构是：代理有完整的读和提案权，生效权为零。挑什么值得排一条夜班任务有两条标准：失败必须是静默的（会大声报错的东西告警系统会通知，不需要巡检），核对必须是机械的、判断是稀少的。真实收获是某次资料健检抓到一条回补管线写入 0 笔、流程却显示成功的静默失败。","whyRead":"无人值守 agent 的权限结构写得很实——报告和修正提案都推到独立分支，生效权为零。","rating":5,"tools":["claude-code"],"topics":[],"publishedAt":"2026-08-31T00:06:27.000Z","author":"","preScore":9},{"id":"d227b6592fb18659","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1238217#reply47","titleOriginal":"记一次 GLM 开发严重事故，花了 8 亿 token，买了个教训","titleZh":"记一次 GLM 开发严重事故：一条 rm -rf 删掉整个工作区，8 亿 token 换个教训","summaryZh":"作者周末新开一个项目，Codex 负责 brainstorm 和 PRD，Trellis 负责 agent 之间的开发衔接，Zcode 负责实现，跑了一天很顺，代码只在本地 git、没推 GitHub。Phase 14.4 期间 agent 执行了一条 `rm -rf /Users/…/Documents/work`，本意是清掉自己路径笔误产生的空目录；macOS 文件系统大小写不敏感，实际删掉的是真实的 `Documents/Work`——整个仓库、git 历史、全部未提交改动、`.trellis` 任务记录、supabase 迁移和文档一起没了，也没有 Time Machine 备份。帖子里附了 agent 自己写的事故报告全文。作者给出四条教训：谨慎开完全访问，改用带「帮我批准」的 harness；开发目录单独放，删了也不心疼；每次都 push；国产模型的跑分谨慎看待。","whyRead":"事故报告里写明了根因——macOS 文件系统大小写不敏感，agent 想删的是 work，删掉的是 Work。","rating":5,"tools":["codex","zcode","trellis"],"topics":["harness"],"publishedAt":"2026-08-30T13:04:36.000Z","author":"","preScore":8},{"id":"06ffd18f3f687c06","source":"Innei","kind":"blog","url":"https://innei.in/posts/tech/css-to-stylex-migration","titleOriginal":"从纯 CSS 到 StyleX：AI 加持下的一万行 CSS 迁移实践","titleZh":"一天迁完一万多行 CSS：大模型写手册，小模型照着做","summaryZh":"作者把一个只有一份总样式表、超过一万行 CSS 的项目，用一天整体迁到按组件划分的 StyleX。次序是：先和 Codex 探讨方案并做最小 PoC 验证，扫一遍风险点和 App 特化的边界 case，清掉死代码，再建追踪表逐模块推进。执行阶段用 Codex 的 Multi-Agent——由 5.6-Sol 牵头写一份可复用的模块迁移手册，小模型 Luna（Thinking Effort 设为 High）当 worker 照着做，用 worktree 让多个 worker 互不干扰，完成后交主 worker 合并冲突、主分支做最终 UI 验证，不过就打回重迁。每个阶段产出迁移前后的截图对比验收文档，共留下 300 多条 UI 提交。结果：CSS 产物从 215.7 kB 降到 102.3 kB，Luna 一共烧掉 30 多亿 token。","whyRead":"把「大模型写迁移手册、小模型当 worker、worktree 隔离并行」这套分工完整记了下来，还给了体积和 token 两个数。","rating":5,"tools":["codex"],"topics":["multi-agent","worktree"],"publishedAt":"2026-08-30T08:45:43.000Z","author":"","preScore":8},{"id":"38c7e397d3718a02","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/gdutxiaoxu/p/22761146","titleOriginal":"经常用 Codex 后，我发现 AGENTS.md 只该管一件事 - 程序员徐公","titleZh":"经常用 Codex 后，我发现 AGENTS.md 只该管一件事","summaryZh":"作者的结论是模型变强之后反而该删 prompt：过去把「先看什么、再搜什么、怎么改、怎么回复」一条条写进全局 AGENTS.md，结果模型总被过期的项目细节和互相打架的要求拖住。现在全局只留四类内容——协作习惯、目标驱动、真实性与验证、安全边界。一条规则该放哪，问三个问题：换个项目还成立吗（成立才配进全局）、是不是只在一类任务里出现（是就做成 Skill，用时再加载）、能不能只靠模型自觉（不能就交给权限、沙箱、CI 或 Hook 强制）。项目命令、目录结构、依赖版本、业务术语一律下放到项目根目录那份。文中贴出的全局版本里「文件系统安全」写得最细：`rm -rf`、`git clean`、`git reset --hard`、`find -delete` 只有用户明确提出并确认目标后才能执行。","whyRead":"给了三个问题决定一条规则该放哪，并把改造后的全局 AGENTS.md 全文贴了出来。","rating":4,"tools":["codex"],"topics":["agents-md","skills","hooks"],"publishedAt":"2026-08-30T03:50:00.000Z","author":"","preScore":10},{"id":"890b49e7b1979af9","source":"iT 邦幫忙 · 30 天拆解 AI Agent","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10405482?sc=rss.iron","titleOriginal":"AI Agent 25Claude Code 架構拆解：完整 Coding Harness 的重點，不是更會寫 Code","titleZh":"拆 Claude Code 的 Harness：Agent Loop 很小，复杂度全长在它周围","summaryZh":"这是「30 天拆解 AI Agent」系列开始拆真实系统的第一篇。作者的第一个结论是：不管 Claude Code 外面挂了多少东西，最内层仍然是 messages → Model → Tool Call → Tool Result → Model 这个很小的循环，和系列第 2 天讲的基本 loop 没有本质差别；真正值得学的是 production engineering 几乎全部发生在 loop 周围。复杂度从模型开始能影响真实仓库那一刻长出来，系统必须回答一串问题：它能看到哪些档案、哪些工具可以出现在这一轮、哪个 tool call 可以直接执行、哪些 side effect 必须先问、shell 跑在哪个环境、专案指令从哪来、context 满了怎么办、子 agent 看得到什么、hook 什么时候介入、背景工作怎么追踪、外部 MCP 能力怎么加进来——这些都不是模型权重能解决的。","whyRead":"版本钉在 v2.1.88，逐层回答的是「这一层在挡哪一种 failure」，不是「它有哪些功能」。","rating":4,"tools":["claude-code"],"topics":["harness","agent-loop","mcp","claude-md"],"publishedAt":"2026-08-27T15:01:42.000Z","author":"","preScore":8},{"id":"6389d70a16fa0ff1","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7677159752017068073","titleOriginal":"多Agent协作的5个工程坑：契约、状态、目标、并发、异常","titleZh":"多 Agent 协作的 5 个工程坑：契约、状态、目标、并发、异常","summaryZh":"作者做过一个多模态内容生产平台，从小说创作到剧本化、分镜设计、视觉资产管理、视频生成，整条链路五六个 agent 串行加并行。早期版本二十多本小说跑下来失败率不低，而没有一次是单个 agent 能力不够：小说 agent 输出的章节候选，剧本 agent 不认格式直接崩；分镜 agent 在分镜里写了新的角色服装描述，资产 agent 的角色资产库还是旧的，等发现时已经生成二十张图、全部重做；视频 agent 自己觉得「完成了」，分镜 agent 检查后说少了三个镜头；两个 agent 同时操作同一个角色资产，一个的修改被另一个直接覆盖。作者的体会是多 agent 系统的大部分工作量在 agent 之间的协调机制上，而不是单个 agent 的能力上；对应给出的解法是在业务链路之外单开一层协调层，做契约校验（Schema 验证）、共享状态库（资产状态管理）和统一验收标准。文末有脱敏说明，注明失败率数字和内部模块名已泛化。","whyRead":"二十多本小说跑下来的失败，没有一个是单个 agent 能力不够，全出在 agent 之间的交接上。","rating":4,"tools":[],"topics":["multi-agent"],"publishedAt":"2026-08-24T07:16:45.000Z","author":"钟知了","preScore":9},{"id":"97ae87fe115b3065","source":"方格子 vocus 标签","kind":"search","url":"https://vocus.cc/article/6a8acc4ffd8978000193e255","titleOriginal":"DSH 生態系一週漲了 5 倍星星，GitHub 側欄的授權標籤騙了我兩次","titleZh":"DSH 生态系一周涨了 5 倍星：GitHub 侧栏的授权标签两个方向都会骗人","summaryZh":"DeepSeek 8 月 13 日开源 DSH 之后，官方插件市集还没开，社群已经自己长出一批衍生专案——作者摊开 10 支比较，其中 oh-dsh、awesome-deepseek-harness、dsh-web-ui 三支的创建时间还早于官方开源日。他把这 10 支分成四种补位逻辑：补位型（桌面应用、TUI、Windows 一键启动）、扩充型（浏览器介面、把 session 先锁在 Minimal 工具集的设定层）、知识型（橙皮书和 handbook 两份社群手册）、目录型（两份精选清单）。真正的发现在授权那一栏：GitHub 侧栏的授权标签两个方向都会骗人，10 支里真正不能商用的只有 2 支，但光看侧栏找不出是哪两支。作者也把话说在前面：功能描述取自各专案 README 自述，未逐一实测。另一条提醒是官方自己把 DSH 标成 developer preview，README 原文全大写写着接口会有破坏性变更，这批衍生专案全长在这个地基上，现在挑一支用挑的是尝鲜不是稳定依赖。","whyRead":"逐个翻完 LICENSE 才发现，光看 GitHub 侧栏那个授权标签，找不出真正不能商用的是哪两支。","rating":4,"tools":["dsh"],"topics":["harness","agent-loop"],"publishedAt":"2026-08-23T23:00:22.445Z","author":"","preScore":7}],"reviewed":56,"dropped":49,"stats":{"sources":278,"fetched":347,"shortlisted":56,"rejected":291,"thin":106,"enriched":72,"enrichAttempted":118,"enrichRetryAttempted":84,"enrichRetried":38,"enrichSkipped":36,"enrichMuted":["掘金搜索"],"failedSources":2,"feedRetryAttempted":3,"feedRetried":2},"errors":[{"source":"Watermelonabc的Blog","message":"HTTP 404"},{"source":"日习一技","message":"HTTP 503"}]},{"date":"2026-08-30","generatedAt":"2026-08-29T22:40:00.000Z","dailyNote":"今天供给塌了一半：掘金 112 条正文一条都没抓到（限流熔断，第二轮重试也是零），入围名单只剩 12 条，是创刊以来最短的一天。这 12 条里三条是掘金的「只有标题」条目，按不许编造那条一律不看；再毙掉五条同一族的东西——把 GitHub 仓库 README 做成中文整理的、正文反复指回同一家云厂商的「五平台实操对比」、转述 Anthropic 那篇 Warp 文章的读后感、结尾在拉公众号和技术群的 Skill 评测、V2EX 的插件自荐帖。最后收了 4 篇，四个平台各一篇，全是 4 分，没有精选。最值得先读的是铁人赛那篇 Codex CLI 与 App 之争：终端明明白白打印「生成成功、405615 字节、尺寸正确」，在 App 里把图打开才看见图标压在中文字上——所有技术检查都过了的东西，仍然可能是不能交付的。","items":[{"id":"338dc4a64ea737c4","source":"方格子 vocus 标签","kind":"search","url":"https://vocus.cc/article/6a92e5cbfd89780001000aab","titleOriginal":"從 SDGs 知識圖卡到 YouTube 影片：練習設計一條 AI 教材工作流","titleZh":"12 张图卡做成 4 分钟影片再上架 YouTube：「每张精准 20 秒」是怎么锁住的","summaryZh":"一位老师把备课流程整条交给 AI 走了一遍：先用 ChatGPT 把 SDGs 里的「大麦克指数」拆成 12 张知识图卡（ChatGPT 单次绘图不得超过 10 张，所以分两次画），再让 Claude Code 把图卡做成一支 4 分钟的简报影片。最值得看的是它怎么满足「每张 20 秒」这个 PechaKucha 式的硬约束：Claude Code 先用 PowerPoint 把 12 张投影片输出成 PNG 并逐张看图理解内容（投影片里的文字只是页码，内容全在图上），写完繁中旁白后用 edge-tts 的台湾女声 zh-TW-HsiaoChen 配音，实测每段语音长度后压进 19.6 秒、只做 1.05–1.14 倍的轻微调速，剩下的时间补静音，再用 ffmpeg（经 imageio-ffmpeg 免安装取得）逐段合成串接，最后按语音实际节奏切出 74 句 SRT。上架那一步先用 Chrome 里的 Claude 扩充程序，遇到连接问题后改用 Claude 内建浏览器才走完，公开状态和标题都是它反问作者后填的。","whyRead":"「20 秒一张」这种硬时间约束怎么真的落地，全篇最实的就是那一段：语音压到 19.6 秒、只敢调速 1.05–1.14 倍、其余补静音。","rating":4,"tools":["claude-code","claude"],"topics":[],"publishedAt":"2026-08-29T15:23:51.817Z","author":"","preScore":7},{"id":"2da04fdb2e5af8ff","source":"iT 邦幫忙 · Codex 做 LINE Bot 上线","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10405902?sc=rss.iron","titleOriginal":"Day 18 - Codex CLI 和 App 該怎麼選？從只看終端輸出，到真正看見成品","titleZh":"Codex CLI 和 App 怎么选：终端说「生成成功」，把图打开才发现图标压住了中文","summaryZh":"作者在铁人赛第 18 天插播一篇工具选型。他做 LINE Cafe Bot 的 Rich Menu 时，程序生成了一张符合规格的 PNG，终端打印的是 Generated rich-menu.png (405615 bytes)，尺寸正确、小于 1 MB，TypeScript 构建和单元测试全过；改用 Codex App 把图直接打开，才看见咖啡杯和问号图示压在中文字上——一张技术上合格、视觉上不能交付的图差点就部署出去了。由此他给出的分法不是初阶／进阶，而是两种验收视野：在 CLI 里他自然会问「指令成功没有、测试过没有、部署状态正常没有」，而且终端里的操作留得下可重复的指令，还能用 codex exec --json 把过程输出成 JSONL 接进脚本和 CI；到了 App 他会多问一层「画面看起来对吗、这次改了哪些档案、成品和需求一致吗」，因为对话、档案、终端结果、Git diff 和视觉预览都在同一个空间里。他现在的做法是先在 CLI 快速确认环境和问题，等进入需要视觉验收的阶段再回 App。","whyRead":"不是功能对比，是一次「所有技术检查都通过但成品不能交付」的实例——它把「看得见成品」论证成了开发流程的一部分，而不是最后补做的动作。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-29T11:36:53.000Z","author":"","preScore":7},{"id":"9660a9dfec59dba1","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/grey-wolf/p/22749811","titleOriginal":"windows codex更新失败如何处理 - 三国梦回","titleZh":"Windows 上 Codex 更新不动：应用内更新报错、商店装不上，最后靠 MSIX 手装","summaryZh":"一次很小但很完整的排查记录。作者家里那台电脑改过注册表、禁掉了各种自动更新，Codex 的应用内更新直接报错；转去 Microsoft Store 网页下载，拿到的是 ChatGPT Installer.exe，打开只提示「已经安装了」。参考别人的文章找到官方 MSIX 包地址 persistent.oaistatic.com/codex-app-prod/ChatGPT-x64.msix（下下来约 780 MB），他没有直接装——先查了这个域名，又在官方的 learn.chatgpt.com Windows 部署文档里找到一模一样的地址才敢用，这一段是全篇最值得抄的谨慎。双击 MSIX 点更新之后界面毫无反应（他吃完饭回来还是原样），改用 PowerShell 跑 Add-AppxPackage -Path \u003cmsix\u003e 才拿到真正的失败原因：老版本进程还开着。用 Get-Process ChatGPT,Codex 找出来关掉再装即可，文末还留了一段下载加安装的一键脚本。","whyRead":"图形界面点了更新没反应、也不报错，换成 Add-AppxPackage 才看见真正的原因是老进程没关——这条命令是全篇的关键。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-29T01:03:00.000Z","author":"","preScore":8},{"id":"b11251320ba6b8c8","source":"Joway's Blog","kind":"blog","url":"https://blog.joway.io/posts/software-engineering-with-ai-coding/","titleOriginal":"尽职编程：AI Coding 时代的个体产出差异的来源","titleZh":"都用一样的模型和 Agent，代码产出的方差为什么反而更大了","summaryZh":"作者的观察是：大家用着近乎相同的模型、设备和 Agent，代码产出水平的方差反而比以前更大。他把差异归到一种他称为「尽职编程」的工作方法——AI 有能力做完一百件子事，但没能力决定该做哪一百件，那部分上下文在老板的沟通里、在你的工作经验里、甚至在常识和对未来的预判里，而你给它的提示词只有几十个字。他见过最可怕的做法，是让 AI 自己决定要做哪一百件事然后全做完；他自己的判据是「代码不是你写的，但技术评审时别人提的问题你得答得出来」。为此他每天大部分时间花在理解 AI 的设计上：让 AI 画架构图、写设计文档，尤其是让它写一份「面向产品经理」的文档，这样连技术语言都不用读就能理解实现，还能顺手丢给产品经理。最后他给了一个把主观努力变成客观痕迹的办法：在主仓库加一个 Codex 自动 Review 插件，会把代码库 clone 下来结合上下文看修改的副作用，而且它的 Agent 上下文和你自己的完全独立——你执意要在 GET 接口里改数据，Claude Code 会顺着你，这个 Review Agent 不知道你的固执，所以不会。","whyRead":"他给「靠谱」下了个能执行的定义，还给出一个把它变成客观痕迹的办法：一个上下文和你完全独立、因此不会顺着你的 Review Agent。","rating":4,"tools":["claude-code","codex"],"topics":[],"publishedAt":"2026-08-29T00:00:00.000Z","author":"","preScore":7}],"reviewed":12,"dropped":8,"stats":{"sources":276,"fetched":339,"shortlisted":12,"rejected":327,"thin":171,"enriched":19,"enrichAttempted":137,"enrichSkipped":143,"enrichMuted":["掘金搜索"],"failedSources":2},"errors":["Watermelonabc的Blog — HTTP 404（连续第 5 天）","犀利豆的博客 — The operation was aborted due to timeout"]},{"date":"2026-08-29","generatedAt":"2026-08-28T22:40:00.000Z","dailyNote":"今天是拆源码的一天，两篇 5 分都在讲「这东西内部到底怎么摆的」：七牛那位把 dsh 的 13147 个 commit 和 227 个 npm 包摊开，看它两个月里怎么一次次回答「新能力该放哪一层」；犀利豆的 Agent Loop 系列走到第 9 篇，讲清了子代理不是另一套 loop、是同一个 queryLoop 递归调用，靠一个 agentId 分流十几处行为——包括子代理不读你的 CLAUDE.md、结束不触发 Stop hook 这两件很容易想当然想反的事。另外三篇是「机制」的另一半：Agent 输出为空原来是思考把单次 token 额度用光了，Windows 上 codex 沙盒报错原来是文件夹的 owner 还挂在旧电脑的用户上，WorkBuddy 点不动的签到按钮原来只是一次带本地 token 的 HTTP 请求。毙掉的大头还是老三样——同一个标题在掘金被发了 4 遍的改写稿、结尾填中转站地址的「三个坑」教程、把演讲和别人的产品转述一遍的方法论长文。另有两条是这本刊物一直在挡的形状：Codex 重置雷达那篇机制讲得挺好，落点是「来体验一下我的小程序」；DataZen 那篇开头的痛点很真，中段变成了功能清单。","items":[{"id":"76fac665fa71059d","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/Qiniu-developer/p/22743908","titleOriginal":"拆解 dsh 系列：从源码和版本变化看 DeepSeek Harness 的设计取舍 - 小七-七牛开发者","titleZh":"拿 13147 个 commit 和 227 个 npm 包，还原 dsh 发版前那两个月","summaryZh":"作者把 deepseek-ai/deepseek-harness 的完整 Git 历史和 npm 上 227 个 @deepseek-ai/dsh-* 包的发布记录对着读，还原 dsh 从 0.0.1-rc.1 到 0.1.1-rc.2 的演进（截止 commit b150a551b8）。几个能对得上的数字：首个 commit 是 6 月 10 日，到 0.1.1-rc.2 共 13147 个 commit、44 位提交者；第一个公开 rc 出现在 8 月 11 日，此时仓库已经攒了 214 个包，也就是说公开版本号出现前架构就基本搭完了。7 月最后一周单周 3575 个 commit，进入 rc 之后提交量下行、fix 对 feat 的占比持续上升。rc.1 还带着明显的内测痕迹：README 自称 coding agent、装法是 clone 仓库跑 scripts/install.sh、完整 Session Log 默认上传（要手动设 DSH_TELEMETRY_DISABLED=1 才关）、反馈渠道是内部微信群。rc.3 那次「新增 70 个包、移除 60 个」看着像大重构，逐个对下来相当一部分只是改名。作者的落点是：这一串 rc 一直在回答同一个问题——一项新能力该放在哪一层、和核心保持什么关系。","whyRead":"不是读文档讲架构，是拿 commit 数、包数和版本 diff 把「产品定位从 Coding Agent 改成 Agent Harness」这件事量出来了。","rating":5,"tools":["dsh"],"topics":["mcp","subagent","harness"],"publishedAt":"2026-08-28T09:37:00.000Z","author":"","preScore":11},{"id":"f69508de212cf7cc","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/28/claude-code-agent-loop-09-sidechain/","titleOriginal":"Claude Code Agent Loop 研究系列（09）—— Sidechain：从子代理到 agentId 分流","titleZh":"子代理不是另一套 loop：同一个 queryLoop 递归一次，靠 agentId 分流十几处行为","summaryZh":"系列第 9 篇，回答一个直觉容易搞反的问题：Claude Code 的子代理走的是独立的 SubagentLoop，还是同一个 loop 换个上下文？答案是后者——主 loop 遇到 Agent tool_use 时构造一个新的 toolUseContext（新 agentId、messages 清空、换 subagent 自己的 system prompt），然后递归调同一个 queryLoop，子代理跑完把结果当一条 tool_result 塞回主 loop，所以 sub-agent 里还能再起 sub-sub-agent。代价是代码里要区分「我是谁」，方案是一个 flag：主 loop 的 agentId 是 undefined，子代理是一个 UUID，loop 里几十处 if (!agentId) 由此分流。作者把分流的行为逐条列了出来，其中几条很容易想当然想反：子代理不加载你的用户 CLAUDE.md、结束不触发 Stop hook、不做手机端的 Haiku 摘要、不清理 MCP 连接（清了会影响主 loop 复用）。落盘也是分开的：主 loop 写 ~/.claude/projects/\u003c项目\u003e/\u003csessionId\u003e.jsonl，子代理写 .claude/subagents/agent-\u003cagentId\u003e.jsonl，主文件里只留最终那条 tool_result，中间过程一律不进。","whyRead":"「子代理不读你的 CLAUDE.md、结束不触发 Stop hook」这两条，是写 hook 和写项目约定的人最容易搞反、又最难自己发现的地方。","rating":5,"tools":["claude-code"],"topics":["mcp","subagent","claude-md","hooks","agent-loop"],"publishedAt":"2026-08-28T10:00:00.000Z","author":"","preScore":8},{"id":"06cb41bedba61b48","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7674038015743918115","titleOriginal":"从空输出到续思考：我改造 Agent Harness 的一次实践","titleZh":"Agent 跑完一个字都没输出：思考把单次 token 额度用光了","summaryZh":"作者要把 Agent 塞进自己的业务系统，现成的编码 Agent 嵌不进去，于是自己写了一层轻量 Harness 负责加载 Skill、注册工具、驱动多轮执行。跑起来遇到一个症状很误导人的故障：模型接口正常、前面的工具都调用成功，最终结果却是空的。查日志三个字段说清了原因——finish_reason=length、reasoning_content 很长、正文长度 0。支持深度思考的模型里，思考和答案共用同一份 completion token 额度，任务一复杂，模型还没开始写答案额度就用完了。两个最直接的解法他都否了：关掉思考会影响复杂规则解析的质量，调大额度则可能让模型继续拿去思考，而且单次请求变慢，可能在返回 length 之前先撞上整个 Agent 的超时。他转去看成熟编码 Agent 怎么处理——OpenCode 靠工具驱动的多轮调用，每轮都是一份新额度，但纯思考阶段就耗尽时救不回来；ReasoniX 则识别 finish_reason=length，把已生成的正文和 reasoning_content 带进下一次调用让模型接着写。他最后照后者做，再叠上工具边界保护和确定性校验。","whyRead":"「模型想了很多但什么都没说」这个症状看起来像接口挂了，实际是一道能靠 finish_reason 一眼认出来的额度题。","rating":4,"tools":["claude-code","reasonix","opencode"],"topics":["skills","harness"],"publishedAt":"2026-08-15T12:44:38.000Z","author":"小小顾同学","preScore":16},{"id":"4e599d0838f1ef69","source":"iT 邦幫忙 · Codex 做 LINE Bot 上线","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10405750?sc=rss.iron","titleOriginal":"Day 17 - 不是越強越好：我用 Codex SolTerraLuna 做完四次實作後，學會先看任務的形狀","titleZh":"同一个 LINE Bot 上四次实作换三个模型：选模型看的是任务的形状，不是排名","summaryZh":"铁人赛过半，作者停下来复盘：他用 Codex 的 Sol、Terra、Luna 三个模型给同一个 LINE Cafe Bot 做了四次功能，结论是「由强到弱选一条直线」这个直觉是错的，真正该看的是任务的形状——需求还模糊吗？过程中有多少取舍？完成条件能不能列清楚？能不能拆成一段段验证？主动提醒那次他选 Sol，因为表面只有一句「週六下午两点提前一小时提醒我」，拆开却牵着自然语言时间、Firestore、Cloud Tasks、Cloud Run、OIDC、LINE Push、失败重试和防重复通知，每个决定都影响下一段；偏好记忆那次边界清楚但要跨资料模型和云端服务，交给 Terra 最舒服，而且它没有因为能做更多就把第一版做复杂（只存用户明确说出口的偏好，不去猜聊天纪录）；Datetime Picker 那次验收条件能逐条写出来，Luna 推得最快。最后他提醒选对模型不等于做完：Cloud Build 成功不代表新版真的部署到了 Cloud Run，Rich Menu 的图片一定要打开看，因为档案产生成功不代表图示没压住文字。","whyRead":"四次真做出来的功能撑着的一份选型判据，而且他把「模型帮你分析，但交付与否由部署状态和真机流程说了算」这条守住了。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-28T17:10:11.000Z","author":"","preScore":14},{"id":"74f183035bd5f7ca","source":"iT 邦幫忙 · Claude Code 陪跑订阅制 SaaS","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10402021?sc=rss.iron","titleOriginal":"# Day 22｜用 Claude Code 實作容錯模式的實際過程","titleZh":"Claude Code 读完现有代码反问了一句，把我没想清楚的失败定义逼了出来","summaryZh":"作者倒带重放一次协作过程：他给的初始指令停在业务规则那一层（所有调 LLM 的地方要容错，失败不能中断排程，要退回纯数据的基本版），刻意不说在哪个档案加 try/except——他的经验是描述越接近实作，越容易把自己还没想清楚的实作偏见一起塞进去。Claude Code 读完专案里现有的几处 LLM 呼叫后反问了一个问题：失败的定义包不包括「API 成功回应但内容格式不符」？现有代码里有一处解析失败会往外抛例外。这一问命中了他没想清楚的边界——他脑中的失败只有逾时和错误码，而「成功地回传垃圾」这个失败模式是被这个反问逼出来的。边界定清之后它做了三件事：把模式抽成统一的包装函式并对齐专案惯例、找出所有呼叫 LLM 的位置逐一改接（包括两处他自己都忘了的旧功能）、给每处 fallback 补测试。作者由此列了一张分工表：定义业务规则和拍板归他，发现规格漏洞和全场扫荡归 agent——大范围重构漏改一两处是人类的常态，而漏掉的那处不会报错。","whyRead":"把 agent 当「一面会找碴的镜子」：它对现况的盘点比你的记忆可靠，而规格和现实不一致的地方正是 bug 的出生地。","rating":4,"tools":["claude-code"],"topics":[],"publishedAt":"2026-08-29T00:02:31.000Z","author":"","preScore":10},{"id":"2f78ac122f3115ee","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/grey-wolf/p/22743305","titleOriginal":"windos上codex沙盒报错问题记录 - 三国梦回","titleZh":"Windows 上 codex 沙盒一直要提权：文件夹的 owner 还挂在旧电脑的用户上","summaryZh":"作者在 IDEA 插件、codex cli 和 codex 桌面版同时开着的项目里遇到一个磨人的报错：helper_unknown_error: setup refresh had errors。他给的是 workspace_write 权限，按理说读写项目目录不该失败，但每次都失败，失败后 agent 会转去申请提权执行，得他手动批准一次，又慢又烦。他当时以为是三个程序在同一个项目下打架。复现时才想起去看沙盒日志（C:\\Users\\xxxx\\.codex.sandbox\\sandbox.2026-08-27.log），并把日志直接丢给 codex 自己分析：它需要改 U:\\work 的 ACL 但改不动，因为运行时没有那个目录的 owner 权限。查下去 owner 是一个本机查不到的用户 id——他这台电脑是新买的，文件从旧电脑整个拷过来，owner 还是旧机器上的那个用户。把 owner 改成当前用户就好了。","whyRead":"换新电脑拷贝整个工作目录的人都可能踩到，而报错文本（setup refresh had errors）和真正的原因之间隔着一层沙盒日志。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-28T09:15:00.000Z","author":"","preScore":12},{"id":"46038192bf0fd0ae","source":"atbug.com","kind":"blog","url":"https://atbug.com/docker-sandboxes-quickstart/","titleOriginal":"Docker Sandboxes 上手：从安装到第一次跑 Agent","titleZh":"Docker Sandboxes 装完十分钟能跑，真正费事的是让 sandbox 里的模型登上号","summaryZh":"五篇实测系列的第一篇，作者在 Apple Silicon 的 Mac 上把 Coding Agent 跑进一台随手能删的微虚拟机。安装路径很短：brew trust docker/tap、brew install docker/tap/sbx、sbx login，然后 sbx daemon start、sbx policy init balanced，进项目目录 sbx run opencode——到跑通不到十分钟。费事的在后面：sandbox 不继承宿主机账号，模型凭据一个都不带过去，SuperGrok 这类订阅还得单独走 /connect，而默认的 balanced 网络策略正好挡住 xAI 的认证域名，要显式放行 *.x.ai:443、api.x.ai:443、auth.x.ai:443、accounts.x.ai:443 才连得上。隔离边界他也划清楚了：自己的内核、文件系统、网络和 Docker Engine，宿主机都碰不到；但你主动挂进去的项目目录是例外，Agent 在里面读写和你本人权限一样，不受额外限制。前置条件是 Apple Silicon 加 macOS 14，Intel Mac 不支持，Kimaki、omp 这些第三方 agent 也还接不上。他最后的判断很克制：装完能人机协作改同一棵树，还不到无人值守的程度。","whyRead":"把「给 agent 一个能删掉的环境」这件事的真实成本摊开了——难的不是装，是凭据和网络策略这两道不写在快速开始里的关。","rating":4,"tools":["docker-sandboxes","opencode"],"topics":[],"publishedAt":"2026-08-13T15:02:12.000Z","author":"","preScore":6},{"id":"6147e3b864252688","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7677514853838258176","titleOriginal":"每天自动签到 WorkBuddy 积分，我用\"接口直签\"彻底解决了","titleZh":"文字型 agent 点不动桌面按钮，那就绕过界面直接调它背后的接口","summaryZh":"作者想把 WorkBuddy 每天领 100 积分的签到自动化，第一条路当场撞死：WorkBuddy 的自动化引擎本质是文字型 AI 代理，工具只有读文件、跑命令、访问网页和调技能，看不见客户端窗口，也没有点击桌面 UI 的能力，「让 AI 每天帮我点三下」从一开始就不成立。他转去看签到本身——那只是一次带本地登录 Token 的 HTTP 请求。登录态是明文 JSON，在 AppData\\Local\\CodeBuddyExtension\\Data\\Public\\auth 下，里面有 accessToken 和 domain；他特意点明实测域名是 www.codebuddy.cn，网上流传的 copilot.tencent.com 会 404。状态查询走 /v2/billing/meter/checkin-activity-status，领取走 /v2/billing/meter/daily-checkin，已签会返回 code:10001。脚本用 Python 标准库写，先查状态再领、token 只打印脱敏形态。最后一个转折值得记：他一开始用 WorkBuddy 自己的 AI 自动化每天 09:00 触发，后来担心 AI 服务或自动化引擎没拉起来就废掉一天，改成了 Windows 系统定时任务，并另写一份本地 log 兜住「到底跑没跑」。","whyRead":"两个结论都反直觉：agent 的自动化引擎看不见你的屏幕；而定时这件事交给 agent 反而不如交给操作系统。","rating":4,"tools":["codebuddy","workbuddy"],"topics":[],"publishedAt":"2026-08-25T03:27:29.000Z","author":"TOTOROSIR","preScore":16},{"id":"809db517c4864e11","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7676355110214762559","titleOriginal":"Codex 实战 30 天：从 CLI 装机到自动化流水线，我沉淀的完整工作流（附配置）","titleZh":"把「注意性能」换成「内存占用 \u003c 100MB」，Codex 就自己选了流式方案","summaryZh":"一份 30 天的工作流复盘，值钱的是三处具体做法。一是 AGENTS.md 当员工守则写，而且要短：他试过 200 行的百科全书版，模型抓不住重点，该守的规则反而守不住，现在稳定在 40 行以内、每条都是一句话能说清的硬约束——第一条「改动最小化，包括不做格式化」是拿一次教训换的，模型曾把整个项目的单引号换成双引号，diff 里三千行噪音把真正的改动淹没了。二是把重复指令固化成脚本：scripts/ship.sh 依次跑 ruff、pytest -x、提交，指令简化成一句「完成功能后运行 ship.sh」，额外收益是它没法跳过测试，因为 -x 让测试失败就中断。三是任务模板固定四行——目标、约束、验收、完成后动作。他给导出 CSV 那个任务写的验收是「覆盖空结果/单页/10 万行三种场景，10 万行场景内存占用断言 \u003c 100MB」，一次通过，包括那个内存断言；他的解释是以前写「注意性能」模型会直接忽略，因为没法验证，而能跑测试的断言它就必须认真对待。","whyRead":"「把模糊要求翻译成可验证的断言」这条，配着那个内存断言的例子看，是这篇里最能直接抄走的一句。","rating":4,"tools":["codex"],"topics":["agents-md"],"publishedAt":"2026-08-22T11:16:20.000Z","author":"word","preScore":13}],"reviewed":43,"dropped":34,"stats":{"sources":276,"fetched":474,"shortlisted":43,"rejected":431,"thin":119,"enriched":156,"enrichAttempted":207,"enrichRetryAttempted":83,"enrichRetried":32,"enrichMuted":[],"failedSources":3,"feedRetryAttempted":6,"feedRetried":5},"errors":["Watermelonabc的Blog — HTTP 404","eebk — 无法识别的 feed 格式","jax - 走在路上 — HTTP 503"]},{"date":"2026-08-28","generatedAt":"2026-08-28T06:40:00.000Z","dailyNote":"今天扎堆的是「WorkBuddy 投稿潮」——入围名单 33 条里 8 条挂着它，从掘金的「一家做 AI 的公司为什么全员都在用」到 SegmentFault 的「轻帆云 AI 员工上岗实践」，形状和去年那波 TRAE 稿一模一样，一条没收。先读 V2EX 那篇 PR 复盘：它是今天唯一一篇把「AI 帮我省下的时间去哪了」算清楚的文章，答案是转移到维护者身上了。想看机制的读另外两篇：codex-rewind 那篇把官方两次回滚实现的尸检摆出来，犀利豆那篇讲中断时怎么补上缺失的 tool_result。毙掉的除了投稿潮，还有 7 席 SEO 教程（「【2026最新】OpenCode下载安装配置一篇搞定（附官网安装包）」这类）和一篇转述 Danluu 评测的稿子——数据很硬，但动手的不是作者。","items":[{"id":"2d6dbb7179fcbc5a","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1237708","titleOriginal":"我把一个开源 PR 全权交给 AI 后，差点把维护者变成免费 Reviewer","titleZh":"把一个开源 PR 全权交给 AI 之后，我差点把维护者变成免费 Reviewer","summaryZh":"作者用 BililiveRecorder 时碰到一个偶发问题：直播已结束、录制任务却不退出，界面还显示在录、速率 0.00 Mbps。他不想为这个 bug 重新学一遍陌生仓库的状态机、网络层和 FLV 解析器，于是把排查、改码、跑测试、回复 review 几乎全权交给 AI。第一个错误是把「听起来合理」当成「已经找到原因」：AI 给出接口延迟返回直播中、取消令牌没传播、watchdog 没覆盖分支等几种解释，每一条都值得查，但都没回答「异常任务当时到底卡在哪」，改动越来越像重构。第二个错误是把 PR 当成 AI 的公开调试现场——维护者的每个追问又被原样转交给 AI，PR 变成推理流水账，维护者只好替他检查证据成不成立。最典型的一次：编译了加满 verbose 日志的诊断版本，拿到日志就开始推导修复方向，维护者指出这份日志里根本没有诊断提交新增的字段，也就是连「跑的是不是诊断版」都没证明。转折发生在异常进程还活着、先别重启而是抓 dump 的时候。最终合并的修复是两个文件 18 行，其中行为修复只有 4 行、回归测试 14 行。","whyRead":"维护者一句「这过程有点像在当 AI 的肉身代理」，逼出了一条能直接用的提交门槛：说不清「证据是什么、原因是什么、这几行为什么能解决它、测试如何证明」，就还不该把修复交给别人。","rating":5,"tools":[],"topics":[],"publishedAt":"2026-08-27T12:05:46.000Z","author":"yuiffy","preScore":12},{"id":"6f1b17fc878bdb8e","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/borui-coding-diary/p/22730973/codex-file-rewind-without-touching-git","titleOriginal":"codex-rewind 的设计与取舍:让 Codex 同时回滚对话和代码 - vibecoding日记","titleZh":"让 Codex 同时回滚对话和代码：为什么这件事不能建在 git 上","summaryZh":"Codex CLI 双击 Esc 能把对话退回几轮之前，磁盘上的文件却停在最新状态，模型于是拿着一份比文件更早的对话继续推理（issue #22100）。作者写了 RFC 并把第三种做法实现成 codex-rewind 发到 npm，这篇讲的是四个设计决策各自的代价，而最值钱的是两次官方尝试的尸检。第一次 GhostCommit 把游离 commit 写进用户的真实仓库、恢复时动用户的 index，#8214 造成数据丢失，修复两天后整体下线；为了不碰用户 index 而每次用临时 index，代价是 git 的 stat cache 完全失效，慢下来之后被迫加上异步执行、就绪门、240 秒 watchdog 和一串硬编码排除列表。第二次是 Desktop 至今在用户仓库的 refs/codex/turn-diffs/ 下存整树检查点，一个 5.7 GB 的项目里长出 102 GB 孤儿对象（#29388）。结论不是「更小心地用 git」——两次都很小心——而是会话历史是 Codex 自己的状态，不该写进项目。跟踪范围换成 git-tracked、edit-touched、recently-modified 三个有界分区：同一个 codex checkout 上完整子树遍历是 70,609 文件 / 116 GB / 1.46 s，三分区并集约 6,096 文件 / 59 MB / 425 ms；相隔几小时重测，子树多了 21% 文件、涨了约 15 GB，而 git 分区一动没动。","whyRead":"作者自己承认覆盖率不是 100% 并写清了缺口在哪——比起「我做了个能回滚的工具」，这篇更像一份把每条代价都摊开的设计文档。","rating":5,"tools":["codex","claude-code","opencode"],"topics":[],"publishedAt":"2026-08-27T18:30:00.000Z","author":"","preScore":9},{"id":"0f76617369e91125","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/27/claude-code-agent-loop-08-interrupt/","titleOriginal":"Claude Code Agent Loop 研究系列（08）—— Interrupt：从 Ctrl-C 到合成 tool_result","titleZh":"Claude Code 按下 Ctrl-C 之后：中断怎么做到不把 messages 数组搞坏","summaryZh":"这一篇拆的是「用户改主意了」这条 loop 自己永远处理不了的路径。按 Ctrl-C 时 loop 可能正处在三种状态：LLM 在流式返回、若干工具在并行执行、权限批准的 Promise 在 await——任何一种被强行打断都会破坏 messages 数组的配对不变量，下一次调 LLM 直接 400。Claude Code 的做法是每次 loop 启动时创建一个 AbortController 挂在 QueryEngine 上、全 loop 共享，interrupt() 就是 abort()；用一个而不是多个，是因为 loop 里的并行动作（API 请求、多个 tool、权限 Promise、hook 子进程）要一次全收到信号，挨个 abort 容易漏。检查点只有三处：HTTP 请求层把 signal 传给 fetch（signal-aware，立即 reject）、streaming 结束到 tool 执行之间、tool batch 之间。选这三处的理由是 signal 是 cooperative 的——IO 能立即响应，纯计算的循环就算 abort 了也会跑完，所以检查点要选在「要开始新工作」的位置。最后一步是收尾：abort 之后扫一遍 in-flight 的 tool_use，给没有结果的合成一个 content 为「Interrupted by user」、is_error 为 true 的假 tool_result，数组结构因此完整，语义上 LLM 也读得懂。","whyRead":"系列第 8 篇，讲的是那个只有真跑过 agent loop 才会遇到的问题：中断本身容易，难的是中断之后消息数组还得是合法的。","rating":5,"tools":["claude-code"],"topics":["agent-loop"],"publishedAt":"2026-08-27T10:00:00.000Z","author":"","preScore":8},{"id":"ecfc2a2ec0fe4d94","source":"姓王者的博客","kind":"blog","url":"https://xingwangzhe.fun/posts/is-agentic-blog-check/","titleOriginal":"我用 Is Agentic 给博客做了一次体检","titleZh":"拿 Is Agentic 给自己的博客做体检：61 分，8 项失败 7 项部分通过","summaryZh":"作者前阵子给博客加了 llms.txt、Markdown 输出和几个只读 API，写完不放心：这些入口到底是自己觉得有用，还是 agent 真能找到？于是没有继续凭感觉改 meta 标签，而是跑了一次 npx is-agentic xingwangzhe.fun。终端甩回来的成绩单是 61/100，Essential 45.9/80（9 项过 4 项）、Recommended 11.6/20（17 项过 7 项）、Bonus +3.3，8 项失败、7 项部分通过。他明确把这个分数和 Lighthouse、Search Console 划清界限：它量的不是浏览器性能也不是收录，而是站点作为公开资源能不能被 agent 发现、访问、理解和使用；Recommended 那部分会按站点有没有暴露 API、OAuth、GraphQL、MCP 或开发者门户来决定启不启用，所以博客没有 OAuth 不会被无条件扣分。报告里最有意思的是 agent trajectory：记录下的 8 个步骤里，agent 先访问首页，再读 /index.md、/about.md 和 /rss.xml，评估注记说它已经能解释这个站的用途、受众和业务模式。作者的收尾也克制——agent 读得懂不等于 Google 已经收录，这份报告只描述某个时间点的一次公开访问。","whyRead":"把「AI 能不能理解我的博客」从一句玄学变成一张能逐条动手改的检查单，而且作者自己按住了「看到 61 就想去刷分」的冲动。","rating":4,"tools":[],"topics":["mcp"],"publishedAt":"2026-08-22T07:00:00.000Z","author":"","preScore":13},{"id":"866213a7b9b88509","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1237621","titleOriginal":"裸辞旅居 3 年，不会代码的我用 AI 手搓了一款小程序","titleZh":"一行代码不会写，指挥 Codex 做完 80 座城市的小程序：三次推倒重来","summaryZh":"作者裸辞旅居三年，想做一份讲清楚「冬天洗澡水压够不够、短租能不能按月签」的旅居指南，但完全不会写代码，整个项目由他定义产品、指挥 Codex 及相关编程 agent 写完全部代码。一个多月里推倒重来三次：先是入口选错，从 Astro 桌面工具站改到 Vite + React 移动端网页，直到在烈日下用手机翻信息才意识到该做小程序；接着为了「跨端便利」选了 Taro，代码跑通了但真机上页面切换掉帧、长列表滚动发涩，最终把能跑的代码全部作废、改用毫无概念的 WXML/WXSS 原生重写；最后从 4 座城扩到 80 座城时撞上工程现实——微信小程序单个分包 2MB 上限，第一次点开城市详情页内存瞬间飙升约 50MB，低端机直接发热卡顿，只好把一股脑塞进前端的巨型 JSON 拆成按需请求。他给 AI 立的边界写得很具体：用 Design Tokens 锁死色彩、字号（24/28/30/34/44rpx）、间距档位，文案层面禁用「得天独厚、松弛感、无缝衔接」这类虚词，必须换成「下楼步行 5 分钟到公园与湿地」这种可核对的事实。","whyRead":"不懂代码的人怎么把「常识和体验边界」翻译成 AI 的约束条件——这篇给的是一整套可以照抄的禁令清单，而不是又一个 AI 奇迹故事。","rating":4,"tools":["codex"],"topics":["skills"],"publishedAt":"2026-08-27T06:52:43.000Z","author":"HeyMonkeyBro","preScore":8},{"id":"0a7f4c4ccf528ccc","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1236832","titleOriginal":"最近探索出来使用 GLM 的正确姿势","titleZh":"把 5 小时限额切成三段：GLM 老套餐的定时任务用法","summaryZh":"作者是 GLM V1 版本套餐的老用户，最近 Lite 档也能用上 GLM5.3，周末高强度用下来体感明显强于 5.2——之前用 Godot 做游戏只敢让 GPT 5.6 Sol 改，5.2 改完报错频率高、还得提醒它自己看编译报错且总有遗漏，5.3 基本不报错、意图理解也好很多。问题出在额度：V1 老套餐 Lite 只有 5 小时限额，配 ZCode 是 1.5 倍，大概 5000 万 token，工作日 14:00-18:00 的高峰期明显不够。他发现的关键机制是：智谱的 5 小时窗口不是自动续期，下一个周期到来时你得实际用一下才开始计时。于是可以用 ZCode 自带的定时任务把高峰期主动切开——早上一个完整的 5 小时窗口用到 10 点，10 点半到下午 3 点半是第二个，3 点半到 6 点是第三个，基本把整个工作时间覆盖住。另外两条：ZCode 的上下文上限 1000K 实际用不到，手动 /compact 压得频繁一点能有效减少消耗；真压榨完还不够就切 Codex，它现在只有周限额，关键时刻能顶。","whyRead":"「限额窗口要你主动触发才开始计时」这条机制不写在任何文档里，而它决定了你一天能拿到几个完整窗口。","rating":4,"tools":["zcode","codex"],"topics":[],"publishedAt":"2026-08-24T08:06:51.000Z","author":"codingerj","preScore":7}],"reviewed":33,"dropped":27,"stats":{"sources":268,"fetched":361,"shortlisted":33,"rejected":328,"thin":122,"enriched":43,"enrichAttempted":88,"enrichRetryAttempted":45,"enrichRetried":0,"enrichSkipped":2,"enrichMuted":["掘金搜索"],"failedSources":5,"feedRetryAttempted":8,"feedRetried":5},"errors":[{"source":"Watermelonabc的Blog","message":"HTTP 404"},{"source":"酷酷的白","message":"HTTP 403"},{"source":"如鱼饮水","message":"HTTP 503"},{"source":"Mephisto's blog","message":"HTTP 503"},{"source":"刘春龙的博客","message":"HTTP 503"}]},{"date":"2026-08-27","generatedAt":"2026-08-26T22:40:00.000Z","dailyNote":"今天只有四篇，不是挑剔，是供给塌了：33 条入围名单里掘金和 SegmentFault 两家占了 25 条，而掘金的正文补全整轮被限流熔断，97 条条目只剩标题——名单里那些一眼就对味的标题（「7 万星仓库教的安装路径是错的」「Hermes 模型路由崩溃实录」）全都读不到正文，按「不许编造」的规矩一条都不能收。先读犀利豆那篇重试与错误恢复：Claude Code 把「这个错能不能重试」整个交给了服务端响应头里的 x-should-retry，无视 status code，退避也优先听 Retry-After，理由写得比结论更值钱。iT 邦那篇 Day 25 是另一种好——他把「假的版本」和「真的版本」并排列了一张表，承认五条对话规则来自 GPT、架构救了他纯属运气，然后说五次修正零例外，真话版每次都更好。毙掉的大头是老三样：SegmentFault 上一整排「2026 企业级 AI 编程平台推荐」这类 SEO 横评、Ace Data Cloud 和 CC Switch 那串中转站教程、以及 V2EX 的产品自荐帖。掘金那篇「我拆开看了下 Codex 三层架构」卡在三四分之间没收——版本号和目录名都对得上，但拆出来的三层就是官方文档的结构，没有一处是他自己跑出来的。","items":[{"id":"fa681050c44fcd0e","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/26/claude-code-agent-loop-07-retry-recovery/","titleOriginal":"Claude Code Agent Loop 研究系列（07）—— 重试与错误恢复：8 层恢复叠加","titleZh":"Claude Code 的重试是服务端说了算：8 层错误恢复怎么叠","summaryZh":"Claude Code 每次调 LLM 都套着 withRetry：一次 call_llm 背后可能是 1 到 10 次真实 HTTP 请求，DEFAULT_MAX_RETRIES 是 10，可用环境变量 CLAUDE_CODE_MAX_RETRIES 覆盖，而 loop 只看得到最终结果。最反直觉的是「能不能重试」的判据不在客户端：Anthropic API 在错误响应里带一个 x-should-retry 头，服务端说能就能、说不能就不能，无视 status code，只有这个头缺失才回落到看 error type 和 body。理由是客户端 heuristic 在边缘 case 会错（500 里有一部分是请求本身有问题，重试也白搭），而服务端知道集群状态、能随时改语义不用等发版。退避同理：有 Retry-After 就按它睡，没有才回落到指数退避——盲目退避可能让你在服务端 5 秒就恢复时白等 32 秒。再往上还叠着模型 fallback 和 compact 三级恢复。","whyRead":"它把「这个错误能不能重试」整个决定权交给了服务端的一个响应头，而给出的三条理由可以原样搬进你自己的系统。","rating":5,"tools":["claude-code"],"topics":["agent-loop"],"publishedAt":"2026-08-26T10:00:00.000Z","author":"","preScore":8},{"id":"13bbad33c0712bc3","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/rossiXYZ/p/22643568","titleOriginal":"【OpenClaw具身硬件】ZeroClaw 源码阅读笔记（2）--- 机器人 - 罗西的思考","titleZh":"ZeroClaw 源码笔记（二）：AI 决策在主机，实时控制在 ESP32","summaryZh":"ZeroClaw 是个 100% Rust 写的 AI 助手框架，主打让 agent 伸手碰物理世界，这是作者源码阅读笔记的第二篇，讲机器人那一支。整体是三层：主机层跑完整引擎，负责 LLM 推理、决策和任务规划；ESP32 网关层跑轻量固件，把高层网络协议翻成底层硬件协议；终端外设层的传感器和执行器直接挂在 ESP32 的 GPIO / I2C / SPI 上——一句话概括就是「AI 计算在主机，实时控制在 ESP32」。人格那一层用 SOUL.md 加 AIEOS 的 [identity] 段来写。工具系统这一半拆得更细：Peripheral Trait 有哪些方法、各个外设实现怎么对照、通信协议层长什么样、工具注册流程走几步，以及 ESP32 中介模式下一次 gpio_set 调用的 JSON-RPC 报文（pin、value、id 三个字段）具体是什么形状。编译配置也点了名：opt-level=\"z\" 加 lto=\"fat\"，目标是最小二进制。","whyRead":"难得有人把「agent 怎么伸手碰硬件」这件事一路拆到 Trait 方法表和一次 gpio_set 的报文长什么样。","rating":4,"tools":["openclaw"],"topics":["soul-md"],"publishedAt":"2026-08-26T14:09:00.000Z","author":"","preScore":8},{"id":"2fe61004af73238d","source":"iT 邦幫忙 · IT 診斷 Agent 開發實錄","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10400915?sc=rss.iron","titleOriginal":"Day 25  這個系列本身，就是 Claude 協作的產物","titleZh":"Day 25：这三十篇文章的草稿是 Claude 写的","summaryZh":"铁人赛第 25 天，作者把前二十四天陆续透露过的事情一次说完：这三十篇文章的草稿是 Claude 写的，工具的代码绝大部分是 Claude 和 GSD 写的，他提供的是真实经历、事实核对、专业判断，以及决定讲什么不讲什么。最值得看的是他列的那张「假的版本 vs 真的版本」对照表——「我设计了五条对话规则」的真相是「规则来自 GPT，我判断它们在现场撑不撑得住」；「我从一开始就设计了结构性纪律」的真相是「稽核之后才发现我的树早就在做这件事」；「我遇到 API 政策风险，架构救了我」的真相是「我没被影响纯粹是运气，不是设计」；「我测过小模型但缺数据」的真相是「我根本没测 AI 对话那块」。他的账是：五次修正成真话，文章每次都变好，没有一次例外，所以那些看起来更厉害的叙事本质上是在拿可信度换形象。这一章的收尾是一句话——明确的原则是委派的前提，不管你委派的对象是 AI 还是人。","whyRead":"他把「显得更厉害的写法」和「真话」并排列成一张表，五次修正零例外，每次真话版本都是更好的那篇。","rating":4,"tools":["claude","gsd"],"topics":[],"publishedAt":"2026-08-26T08:12:43.000Z","author":"","preScore":7},{"id":"f5ecca54f6e954fe","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7677925371917238278","titleOriginal":"Cursor 工作流1.0","titleZh":"一个财务中台项目的 Cursor + OpenSpec 工作流手册","summaryZh":"作者把自己在一个财务中台项目上的 Cursor 用法写成了内部手册。骨架是 OpenSpec 六个命令：explore 只对齐方案不写代码，propose 生成 proposal / design / tasks，apply 按 tasks 实现，verify 跑 lint 和验收标准，最后 sync 和 archive。有用的是他给每一步配了 Cursor 模式：了解背景 Ask，写 requirements 用 Plan 或人工，propose 和 apply 用 Agent，verify 用 Debug，多模块并行 Multitask。config.yaml 那节强调必须补上技术栈和领域术语（Vue 2、应付账单、账期、权限码），否则 AI 乱猜。最后一条踩坑值得单记：归档过的 proposal，验收标准可能已被后续变更悄悄推翻（比如已删掉的 U8 权限码），所以要以活文档加最新 archive 为准，并在旧 proposal 顶部加一行「已被哪次变更 supersede」。","whyRead":"最值钱的是他埋在最后的那条坑：归档过的 proposal 里的验收标准，会被后来的变更悄悄推翻。","rating":4,"tools":["cursor","openspec"],"topics":["skills","agents-md","spec-driven"],"publishedAt":"2026-08-26T03:59:33.000Z","author":"promiseThen","preScore":12}],"reviewed":33,"dropped":29,"stats":{"sources":266,"fetched":450,"shortlisted":33,"rejected":417,"thin":185,"enriched":68,"enrichAttempted":171,"enrichRetryAttempted":103,"enrichRetried":0,"enrichSkipped":56,"enrichMuted":["掘金搜索"],"failedSources":2,"feedRetryAttempted":7,"feedRetried":5},"errors":[{"source":"Watermelonabc的Blog","message":"HTTP 404"},{"source":"码农刚子的开发笔记","message":"HTTP 503"}]},{"date":"2026-08-26","generatedAt":"2026-08-25T22:25:04.279Z","dailyNote":"今天的名单是「拆机的一天」：犀利豆的 Claude Code 主循环系列一口气来了两篇（第 5 篇纠正了一个很要命的命名误会——45KB 的 QueryEngine.ts 其实是 SDK 适配层，真正的循环在 query.ts 那 1700 行里），罗西开了 ZeroClaw 的源码笔记，百工蜂拆 CLAUDE.md 为什么压缩扔不掉。要先读的是 iT 邦那篇 Day 24：他让 Claude 写这三十篇文章的草稿，然后把 index.html 的 raw URL 贴过去核对，当场抓出两处被「合理推论」出来的变量名——结论不是「AI 会编东西」，是有原始资料就别让它推论。毙掉的大头还是老三样：CC Switch 那一串接第三方 API 的教程（落点全在按量计费的中转站）、V2EX 上三条「已开源，欢迎试用」的自荐帖，以及两篇 DeepSeek Harness 开源的新闻解读。掘金那篇 OpenSpec 走查卡在三四分之间，最后没收——它把四个命令生成的文档一份份贴了出来，但从头到尾没有一处是作者自己的判断或坑。","items":[{"id":"cdb9cfb1cdeae61b","source":"iT 邦幫忙 · IT 診斷 Agent 開發實錄","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10400913?sc=rss.iron","titleOriginal":"Day 24  我用 Claude 管理這 30 篇文章的草稿","titleZh":"我用 Claude 管理这 30 篇文章的草稿：授权会过期、Drive 会坏、而它会编","summaryZh":"铁人赛第 24 天，他把镜头从写程序转向「用 agent 管一个 30 篇的写作项目」：大纲是躺在 Google Drive 里的 docx，流程是 Drive → Claude → GitHub（原始码，用来核对事实）→ 人。三处坑都很具体。一是授权：connector 显示「已启用」和「授权还有效」是两件事，token 过期后的讯息只说「未完成验证」，技术上正确、实务上没用。二是 Drive 写入连续回 internal error，而前十篇都顺，所以不是权限或格式问题；改成先在本机产出、等服务恢复再补。三是核对：写 Day 11 要贴出真实的 API 呼叫程式码，Claude 凭对话脉络写了一版，看起来很合理——把 index.html 的 raw URL 贴过去比对，抓出两处是编的（localStorage 键名、model 栏位的取法都不是他实际写的那样），只有 header 名一字不差。结论不是「AI 会编东西」，是有原始资料就别让它推论。","whyRead":"最值钱的一条在核对那一段——他把 index.html 的 raw URL 贴过去，当场抓出草稿里两处被「合理推论」出来的变量名。","rating":5,"tools":["claude"],"topics":[],"publishedAt":"2026-08-25T08:14:49.000Z","author":"","preScore":14},{"id":"863b19e70ede0ada","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/24/claude-code-agent-loop-05-query-engine/","titleOriginal":"Claude Code Agent Loop 研究系列（05）—— QueryEngine 主循环：状态机全景","titleZh":"Claude Code 主循环拆解：QueryEngine 不是引擎，1700 行的 queryLoop 才是","summaryZh":"系列第 5 篇，把前四篇拆过的 tool 声明、权限、hooks、并行调度、stop_reason、错误恢复统一到一张图上。核心论点是：主循环不是那 5 行伪代码，而是一个显式状态机——每次调 LLM 之前先决定「这次走哪条路径」，调完再决定「下次走哪条」，recovery、retry、autocompact、stop-hook 阻断全是这个状态机里的一等分支，不是散在某处的异常处理。开篇先纠正一个命名误会：src/QueryEngine.ts 有 45KB，看名字像主循环，实际是给 SDK 和非交互 CLI 用的适配层；真正的主循环在 src/query.ts 的 queryLoop 里，1700 多行几乎全是分支决策。决定路
