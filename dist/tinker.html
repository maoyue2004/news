<title>Agent 折腾志</title>
<style>
/* Agent 折腾志 — 终端笔记本
 *
 * 配色不用「黑底荧光绿」那套终端刻板印象，而是取调好的 dotfile 主题的感觉：
 * 纸底带极淡的绿灰偏色，强调色是沉下来的青（deep teal），高分条目用琥珀作信号色。
 * 语义色（青=强调，琥珀=精选，红=失败）和中性色分开，互不借用。
 *
 * 字体全部走系统栈：Artifact 的 CSP 挡外链字体，内嵌 data URI 又会让页面膨胀到几百 KB，
 * 而中文正文本来就该用 PingFang / 苹方这一类本地字体。识别度靠等宽数据面、字重跨度和字距做。
 */

:root {
  color-scheme: light dark;

  --paper: #f4f6f3;
  --surface: #fbfcfa;
  --surface-2: #eceee9;
  --ink: #191d1b;
  --ink-soft: #4b544f;
  --ink-mute: #78827c;
  --line: #dde1dc;
  --line-soft: #e8ebe6;
  --accent: #0d7a68;
  --accent-soft: #d8ece7;
  --signal: #b35c07;
  --signal-soft: #f6e6d2;
  --danger: #a63328;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;

  --rail: 232px;
  --gutter: 3.25rem;
  --radius: 3px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111513;
    --surface: #171c19;
    --surface-2: #1e2421;
    --ink: #e4e9e5;
    --ink-soft: #a9b3ad;
    --ink-mute: #7c877f;
    --line: #29302c;
    --line-soft: #212724;
    --accent: #4ecdb6;
    --accent-soft: #16302b;
    --signal: #e79a4d;
    --signal-soft: #33251440;
    --danger: #e0796c;
  }
}

/* 用户手动切换主题时，data-theme 必须压过上面的媒体查询——两个方向都要压。 */
:root[data-theme="dark"] {
  --paper: #111513;
  --surface: #171c19;
  --surface-2: #1e2421;
  --ink: #e4e9e5;
  --ink-soft: #a9b3ad;
  --ink-mute: #7c877f;
  --line: #29302c;
  --line-soft: #212724;
  --accent: #4ecdb6;
  --accent-soft: #16302b;
  --signal: #e79a4d;
  --signal-soft: #33251440;
  --danger: #e0796c;
}

:root[data-theme="light"] {
  --paper: #f4f6f3;
  --surface: #fbfcfa;
  --surface-2: #eceee9;
  --ink: #191d1b;
  --ink-soft: #4b544f;
  --ink-mute: #78827c;
  --line: #dde1dc;
  --line-soft: #e8ebe6;
  --accent: #0d7a68;
  --accent-soft: #d8ece7;
  --signal: #b35c07;
  --signal-soft: #f6e6d2;
  --danger: #a63328;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--paper);
  /* 极淡的方格纸底纹。只有一层，别喧宾夺主。 */
  background-image: radial-gradient(circle at 1px 1px, var(--line-soft) 1px, transparent 0);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius);
}

.app {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 clamp(1rem, 3vw, 2.5rem) 5rem;
}

/* ---------- 报头 ---------- */

.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.75rem 1.25rem;
  padding: 2.5rem 0 1.25rem;
  border-bottom: 2px solid var(--ink);
}

.wordmark {
  margin: 0;
  font-size: clamp(1.5rem, 3.4vw, 2.1rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.wordmark .prompt {
  color: var(--accent);
  font-family: var(--mono);
  font-weight: 500;
  margin-right: 0.35em;
}

.tagline {
  color: var(--ink-mute);
  font-size: 0.82rem;
  letter-spacing: 0.02em;
  margin: 0;
  flex: 1 1 16rem;
}

.masthead-meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

.theme-toggle {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.2rem 0.55rem;
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-soft);
}

.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- 主体骨架 ---------- */

.frame {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  gap: 2.5rem;
  align-items: start;
}

.rail {
  position: sticky;
  top: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
  padding-top: 1.75rem;
  max-height: calc(100vh - 2.5rem);
  overflow-y: auto;
}

.rail-block { display: flex; flex-direction: column; gap: 0.5rem; }

.rail-label {
  margin: 0;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

.view-btn,
.chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  width: 100%;
  padding: 0.28rem 0.5rem;
  border-radius: var(--radius);
  font-size: 0.85rem;
  color: var(--ink-soft);
  text-align: left;
}

.view-btn:hover,
.chip:hover { background: var(--surface-2); color: var(--ink); }

.view-btn[aria-pressed="true"],
.chip[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

.chip .count {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

.chip[aria-pressed="true"] .count { color: var(--accent); }

.tool-list { max-height: 15rem; overflow-y: auto; }

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.cal-day {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 2px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

.cal-day[data-has="yes"] { background: var(--accent-soft); color: var(--accent); }
.cal-day[aria-pressed="true"] { outline: 1.5px solid var(--accent); }
.cal-day:hover { color: var(--ink); }

/* ---------- 内容流 ---------- */

.content { min-width: 0; padding-top: 1.75rem; }

.day-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem 1rem;
  margin-bottom: 0.75rem;
}

.day-date {
  margin: 0;
  font-family: var(--mono);
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}

.day-count {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-mute);
}

.day-note {
  margin: 0 0 2rem;
  padding: 0.85rem 1rem 0.85rem 1.1rem;
  border-left: 2px solid var(--accent);
  background: var(--surface);
  color: var(--ink-soft);
  font-size: 0.9rem;
  max-width: 62ch;
}

.day-note strong { color: var(--ink); font-weight: 600; }

.entries { display: flex; flex-direction: column; }

.entry {
  display: grid;
  grid-template-columns: var(--gutter) minmax(0, 1fr);
  gap: 0 1rem;
  padding: 1.4rem 0;
  border-top: 1px solid var(--line-soft);
}

.entry:first-child { border-top: none; }
.entry[data-read="true"] { opacity: 0.5; }
.entry[data-read="true"]:hover { opacity: 1; }

.entry-gutter {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.4rem;
  padding-top: 0.15rem;
}

.entry-rank {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

/* 评分用 5 段竖条，比星星更像仪表、也更容易一眼比较高低。 */
.meter { display: flex; gap: 2px; }

.meter i {
  display: block;
  width: 4px;
  height: 11px;
  border-radius: 1px;
  background: var(--line);
}

.meter i[data-on="1"] { background: var(--accent); }
.entry[data-pick="true"] .meter i[data-on="1"] { background: var(--signal); }

.entry-title {
  margin: 0 0 0.3rem;
  font-size: 1.06rem;
  font-weight: 650;
  line-height: 1.4;
  letter-spacing: -0.008em;
  text-wrap: balance;
}

.entry-title a { text-decoration: none; }
.entry-title a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

.pick-flag {
  display: inline-block;
  margin-right: 0.45rem;
  padding: 0.08rem 0.34rem;
  border-radius: 2px;
  background: var(--signal-soft);
  color: var(--signal);
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  vertical-align: 0.16em;
}

.why {
  margin: 0 0 0.5rem;
  color: var(--accent);
  font-size: 0.92rem;
  font-weight: 500;
  max-width: 64ch;
}

.summary {
  margin: 0 0 0.65rem;
  color: var(--ink-soft);
  font-size: 0.93rem;
  max-width: 66ch;
}

.entry-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 0.7rem;
  font-family: var(--mono);
  font-size: 0.71rem;
  color: var(--ink-mute);
}

.entry-meta .sep { color: var(--line); }

.tool-tag {
  padding: 0.05rem 0.35rem;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--ink-soft);
}

.thin-flag { color: var(--signal); }

.entry-actions { display: flex; gap: 0.6rem; margin-left: auto; }

.act {
  font-family: var(--mono);
  font-size: 0.71rem;
  color: var(--ink-mute);
  padding: 0.05rem 0.3rem;
  border-radius: 2px;
}

.act:hover { color: var(--accent); background: var(--surface-2); }
.act[aria-pressed="true"] { color: var(--signal); font-weight: 600; }

.empty {
  padding: 4rem 0;
  color: var(--ink-mute);
  text-align: center;
  font-size: 0.9rem;
}

/* ---------- 信源面板 ---------- */

.panel { display: flex; flex-direction: column; gap: 1.25rem; }

.panel-intro { margin: 0; color: var(--ink-soft); font-size: 0.9rem; max-width: 62ch; }

.table-wrap { overflow-x: auto; }

table.sources {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

table.sources th,
table.sources td {
  text-align: left;
  padding: 0.5rem 0.7rem 0.5rem 0;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: top;
}

table.sources th {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 500;
  white-space: nowrap;
}

table.sources td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.sources td.desc { color: var(--ink-mute); font-size: 0.8rem; min-width: 18rem; }

.state {
  display: inline-block;
  padding: 0.05rem 0.4rem;
  border-radius: 2px;
  font-family: var(--mono);
  font-size: 0.68rem;
}

.state[data-s="ok"] { background: var(--accent-soft); color: var(--accent); }
.state[data-s="warn"] { background: var(--signal-soft); color: var(--signal); }
.state[data-s="bad"] { background: var(--signal-soft); color: var(--danger); }

.hidden { display: none !important; }

@media (max-width: 860px) {
  .frame { grid-template-columns: 1fr; gap: 1.5rem; }
  .rail { position: static; max-height: none; padding-top: 1.25rem; }
  .tool-list { max-height: 9rem; }
  .entry { grid-template-columns: 1fr; gap: 0.5rem; }
  .entry-gutter { flex-direction: row; align-items: center; gap: 0.6rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>

cf89c7e3e02cc5ba","source":"宝玉xp","kind":"blog","url":"https://baoyu.io/blog/2026-07-28/agent-judgments","titleOriginal":"关于 Agent 的几个判断","titleZh":"关于 Agent 的几个判断","summaryZh":"宝玉转述并评论了三个判断：通用 Agent 会吃掉垂直 Agent，Codex、Claude Cowork 这类通用选手配合 Skill 和 MCP 就能搞定大部分专业任务，很多 AI-native 应用创业本身是伪命题；更开放的会吃掉更封闭的，模型能力趋同后会变成可路由的基础设施，Agent 应该让用户自选模型甚至本地部署；更下沉的会吃掉更傲慢的。","whyRead":"如果你在纠结要不要做一个垂直 Agent 产品，这三条值得先读。","rating":3,"tools":["claude-code","codex","mcp","skills"],"publishedAt":"2026-07-28T00:00:00.000Z","preScore":6},{"id":"11451feb78e4bf5d","source":"小众软件论坛搜索","kind":"search","url":"https://meta.appinn.net/t/topic/88763","titleOriginal":"〖开发者自荐〗Somvia：把 Apple 健康数据接入兼容 MCP 的 AI 客户端","titleZh":"Somvia：把 Apple 健康数据接进支持 MCP 的 AI 客户端","summaryZh":"开发者自荐。作者平时用 Claude、Codex、Hermes 处理不少事，它们能读代码看网页调工具，但想让它们看 iPhone 里的 Apple 健康数据就不顺手。睡眠、HRV、静息心率、步数、训练记录都在健康里，偶尔截图发给 Agent 也行，但要比较最近一周一个月、或者连续分析每次训练就不现实了。","whyRead":"MCP 接个人数据源的一个具体案例，作者说清了为什么截图不够用。","rating":3,"tools":["mcp","claude-desktop"],"publishedAt":"2026-07-25T09:10:06.699Z","preScore":9},{"id":"e261424ba9a7cf6a","source":"TonyBai","kind":"blog","url":"https://tonybai.com/2026/07/25/content/posts/2026/ai-code-migration-claude-code-six-steps/","titleOriginal":"百万行代码，两周搞定！Anthropic揭秘AI代码迁移六步法：秘诀不是改代码，是改流程","titleZh":"Anthropic 的 AI 代码迁移六步法：秘诀不是改代码，是改流程","summaryZh":"Anthropic 披露内部工程师用 Claude Code 在一个月内完成 10 个代码包迁移，其中 Bun 联合创始人 Jarred Sumner 把百万行 Zig 迁到 Rust 用了不到两周，Mike Krieger 把一套 Python 迁成 16.5 万行 TypeScript 花了一个周末。文章拆解背后的六步方法论，结论是关键不在让模型更会写代码，而在把迁移流程本身改掉。","whyRead":"大规模迁移这种最脏最累的活，是目前 agent 最能出成果的场景之一。","rating":3,"tools":["claude-code","subagent"],"publishedAt":"2026-07-24T23:00:00.000Z","preScore":7},{"id":"6db2326b8593c2b1","source":"Innei","kind":"blog","url":"https://innei.in/notes/217","titleOriginal":"AI 浪潮下的职业焦虑、产品实践与人生选择","titleZh":"AI 浪潮下的职业焦虑、产品实践与人生选择","summaryZh":"作者接着上一篇《在 AI 浪潮下，如何留在牌桌上》继续写。他提出两个核心问题：借助 AI 提升了效率，但公司业务并不会让你提升对 AI Agent 的理解；传统前端岗位的替代风险在增加，尤其是在大厂里做的事本来就不需要深入思考业务和设计。他的解法是自驱去做一个 AI Native 产品，或者基于 PI 这类 Agent Core 自己搭一套 Agent Loop。","whyRead":"不是工具教程，是「天天用 agent 但理解没长进」这种焦虑的一份诚实记录。","rating":3,"tools":["claude-code","agent-sdk"],"publishedAt":"2026-07-23T17:17:08.000Z","preScore":8},{"id":"eeb50bd9479d2333","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1229421","titleOriginal":"[工业边缘网关] EdgeX 更新啦，增加了 MCP，可以被 AI 接管了，可以让 AI 控制物理世界啦","titleZh":"给工业边缘网关 EdgeX 接上 MCP，让 AI 去控制物理世界","summaryZh":"作者原本只想体验一下 MCP，越折腾越觉得和工业现场挺搭。做工业项目最耗时间的从来不是写代码，而是翻协议文档、整理寄存器、配点位、抓报文、调设备，每个项目都要重来一遍。于是把 MCP 接到 EdgeX，现在 Claude、Cursor 等支持 MCP 的客户端能直接连网关，实现自动创建采集全流程、边缘计算规则部署调试、AI 诊断巡检和设备接入测试。","whyRead":"MCP 的讨论大多围着写代码转，这篇把它接到了真实的工业设备上。","rating":3,"tools":["mcp","cursor","claude-desktop"],"publishedAt":"2026-07-23T16:56:29.000Z","author":"anviod","preScore":9},{"id":"94c0cff453a68a43","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1228405","titleOriginal":"分享一个小创意，用 Agent 处理工作交接的问题","titleZh":"用 Agent 处理工作交接的一个小创意","summaryZh":"作者见过各种交接：好的能写出让人直接上手的完整文档，差的只给一个网盘链接，里面几十份文件名叫「最终版」「最终确认版」「最新最终版」的文档。现在更麻烦的是，很多人每天都在用自己的 AI 助手，一个 Agent 跟着项目跑了大半年，读过 PRD、客户记录、研究报告，人一走账号一关，这部分就全没了。","whyRead":"Agent 里沉淀的项目上下文属于谁、怎么交接，是个还没人正经回答的新问题。","rating":3,"tools":["cursor","trae","mcp"],"publishedAt":"2026-07-19T13:54:35.000Z","author":"cs1707","preScore":6},{"id":"02f2b826933e487c","source":"zhheo","kind":"blog","url":"https://blog.zhheo.com/p/94w0byur.html","titleOriginal":"screenpipe：开源本地的 AI 记忆引擎，让电脑更懂你","titleZh":"screenpipe：本地跑的开源 AI 记忆引擎","summaryZh":"作者在 B 站刷到能自动总结每天做了什么的日报助手，觉得需求成立——每天在无数标签页、聊天窗口、文档之间切换，下班时经常想不起来干了什么。但这类工具基本都是云服务，屏幕录像、音频、操作记录全传到别人服务器。于是去 GitHub 翻开源本地替代方案，找到了 YC 支持的 screenpipe。","whyRead":"「让电脑记得我今天干了什么」这件事，隐私优先的那条路走得通吗。","rating":3,"tools":["mcp","cursor","cline","claude-desktop"],"publishedAt":"2026-07-15T16:00:00.000Z","preScore":6},{"id":"85d22da93c915927","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1227484","titleOriginal":"抛砖引玉，大家觉得哪种后端语言对 vibe coding 更友好？个人认为还得是 go","titleZh":"哪种后端语言对 vibe coding 更友好？我的答案是 Go","summaryZh":"作者 <script>
/* 纯逻辑：过滤、统计、状态存取。不碰 DOM，好写测试。
 * 构建时会和 ui.js 一起内联进页面；test/tinker-logic.test.mjs 直接读这个文件求值来测。 */

const STORE_KEY = 'tinker.state.v1';

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    return { read: raw.read || {}, starred: raw.starred || {} };
  } catch {
    return { read: {}, starred: {} };
  }
}

function saveState(state) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch {
    // 隐私模式下 localStorage 会抛。读写失败只损失「已读」记录，页面本身照常可用。
  }
}

/** 把日文件摊平成一维条目流，附上所属日期。 */
function flatten(days) {
  const out = [];
  for (const day of days) {
    for (const item of day.items || []) out.push({ ...item, date: day.date });
  }
  return out;
}

/** 统计每个工具标签下有多少条目，用来在侧栏显示数量并隐藏空标签。 */
function toolCounts(items) {
  const counts = new Map();
  for (const item of items) {
    for (const tool of item.tools || []) counts.set(tool, (counts.get(tool) || 0) + 1);
  }
  return [...counts.entries()].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1));
}

function matchesQuery(item, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return [item.titleZh, item.titleOriginal, item.summaryZh, item.whyRead, item.source, item.author]
    .some((v) => v && String(v).toLowerCase().includes(q));
}

/**
 * @param {object} opts view: all|unread|starred, tool: 工具 id 或 null, date: 日期或 null
 */
function filterItems(items, opts, state) {
  const { view = 'all', tool = null, query = '', date = null } = opts || {};
  return items.filter((item) => {
    if (date && item.date !== date) return false;
    if (tool && !(item.tools || []).includes(tool)) return false;
    if (view === 'unread' && state.read[item.id]) return false;
    if (view === 'starred' && !state.starred[item.id]) return false;
    return !query || matchesQuery(item, query);
  });
}

/** 源的健康度。连续失败 3 次以内算抖动，7 次以上要人工处理。 */
function sourceState(status) {
  const n = (status && status.consecutiveFailures) || 0;
  if (n === 0) return { s: 'ok', label: '正常' };
  if (n < 7) return { s: 'warn', label: `失败 ${n} 次` };
  return { s: 'bad', label: `连续失败 ${n} 次` };
}

function lastNDates(latest, n) {
  const out = [];
  const base = Date.parse(latest + 'T00:00:00Z');
  for (let i = n - 1; i >= 0; i -= 1) out.push(new Date(base - i * 86400000).toISOString().slice(0, 10));
  return out;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { flatten, toolCounts, filterItems, matchesQuery, sourceState, lastNDates };
}

/* 渲染与交互。依赖 logic.js 里的纯函数和页面内嵌的 __TINKER__ 数据。 */

(function () {
  const data = JSON.parse(document.getElementById('tinker-data').textContent);
  const { days, sources, status, toolNames, generatedAt } = data;
  const allItems = flatten(days);
  const state = loadState();

  const ui = { view: 'all', tool: null, query: '', date: null, panel: false };

  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  /* ---------- 主题 ---------- */

  const themeBtn = $('#theme');
  themeBtn.addEventListener('click', () => {
    const now = document.documentElement.getAttribute('data-theme');
    const dark = now ? now === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('tinker.theme', dark ? 'light' : 'dark'); } catch { /* 忽略 */ }
  });
  try {
    const saved = localStorage.getItem('tinker.theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch { /* 忽略 */ }

  /* ---------- 侧栏 ---------- */

  function renderRail() {
    const views = $('#views');
    views.textContent = '';
    const unread = allItems.filter((i) => !state.read[i.id]).length;
    const starred = allItems.filter((i) => state.starred[i.id]).length;
    for (const [key, label, count] of [
      ['all', '全部', allItems.length],
      ['unread', '未读', unread],
      ['starred', '收藏', starred],
    ]) {
      const b = el('button', 'view-btn');
      b.append(el('span', null, label), el('span', 'count', String(count)));
      b.setAttribute('aria-pressed', String(!ui.panel && ui.view === key));
      b.addEventListener('click', () => { ui.view = key; ui.panel = false; render(); });
      views.append(b);
    }
    const src = el('button', 'view-btn');
    src.append(el('span', null, '信源与健康度'), el('span', 'count', String(sources.length)));
    src.setAttribute('aria-pressed', String(ui.panel));
    src.addEventListener('click', () => { ui.panel = !ui.panel; render(); });
    views.append(src);

    const tools = $('#tools');
    tools.textContent = '';
    for (const [id, count] of toolCounts(allItems).slice(0, 24)) {
      const b = el('button', 'chip');
      b.append(el('span', null, toolNames[id] || id), el('span', 'count', String(count)));
      b.setAttribute('aria-pressed', String(ui.tool === id));
      b.addEventListener('click', () => { ui.tool = ui.tool === id ? null : id; ui.panel = false; render(); });
      tools.append(b);
    }

    const cal = $('#calendar');
    cal.textContent = '';
    if (!days.length) return;
    const have = new Map(days.map((d) => [d.date, (d.items || []).length]));
    for (const date of lastNDates(days[0].date, 28)) {
      const b = el('button', 'cal-day', date.slice(8));
      const n = have.get(date);
      b.dataset.has = n ? 'yes' : 'no';
      b.title = n ? `${date}：${n} 篇` : `${date}：无`;
      b.setAttribute('aria-pressed', String(ui.date === date));
      b.setAttribute('aria-label', b.title);
      b.addEventListener('click', () => { ui.date = ui.date === date ? null : date; ui.panel = false; render(); });
      cal.append(b);
    }
  }

  /* ---------- 条目 ---------- */

  function meter(rating) {
    const m = el('span', 'meter');
    m.setAttribute('aria-label', `评分 ${rating} / 5`);
    for (let i = 1; i <= 5; i += 1) {
      const bar = el('i');
      if (i <= rating) bar.dataset.on = '1';
      m.append(bar);
    }
    return m;
  }

  function entryNode(item, rank) {
    const node = el('article', 'entry');
    node.dataset.read = String(Boolean(state.read[item.id]));
    if (item.rating >= 5) node.dataset.pick = 'true';

    const gutter = el('div', 'entry-gutter');
    gutter.append(el('span', 'entry-rank', String(rank).padStart(2, '0')), meter(item.rating || 0));
    node.append(gutter);

    const main = el('div');

    const h = el('h3', 'entry-title');
    if (item.rating >= 5) h.append(el('span', 'pick-flag', '今日精选'));
    const a = el('a', null, item.titleZh || item.titleOriginal);
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    // 点标题即视为已读：这是唯一一个「用户真的去看了」的可靠信号。
    a.addEventListener('click', () => { state.read[item.id] = true; saveState(state); render(); });
    h.append(a);
    main.append(h);

    if (item.whyRead) main.append(el('p', 'why', item.whyRead));
    if (item.summaryZh) main.append(el('p', 'summary', item.summaryZh));

    const meta = el('div', 'entry-meta');
    meta.append(el('span', null, item.source));
    if (item.author) { meta.append(el('span', 'sep', '·'), el('span', null, item.author)); }
    meta.append(el('span', 'sep', '·'), el('span', null, (item.publishedAt || item.date || '').slice(0, 10)));
    for (const t of item.tools || []) meta.append(el('span', 'tool-tag', toolNames[t] || t));
    if (item.thin) {
      const f = el('span', 'thin-flag', '⚠ 仅标题');
      f.title = '抓不到正文，摘要只依据标题撰写';
      meta.append(f);
    }

    const actions = el('div', 'entry-actions');
    const star = el('button', 'act', state.starred[item.id] ? '★ 已收藏' : '☆ 收藏');
    star.setAttribute('aria-pressed', String(Boolean(state.starred[item.id])));
    star.addEventListener('click', () => {
      if (state.starred[item.id]) delete state.starred[item.id]; else state.starred[item.id] = true;
      saveState(state); render();
    });
    const read = el('button', 'act', state.read[item.id] ? '标为未读' : '标为已读');
    read.addEventListener('click', () => {
      if (state.read[item.id]) delete state.read[item.id]; else state.read[item.id] = true;
      saveState(state); render();
    });
    actions.append(star, read);
    meta.append(actions);

    main.append(meta);
    node.append(main);
    return node;
  }

  /* ---------- 信源面板 ---------- */

  function renderPanel() {
    const wrap = $('#panel');
    wrap.textContent = '';
    const yields = new Map();
    for (const item of allItems) yields.set(item.source, (yields.get(item.source) || 0) + 1);

    wrap.append(el('p', 'panel-intro',
      `共 ${sources.length} 个信源。「近 30 天入选」为 0 的源不代表坏了——`
      + '个人博客本来就月更，而且只有真正聊 agent 的那几篇才会进来。连续失败 7 次以上的才需要处理。'));

    const table = el('table', 'sources');
    const head = el('tr');
    for (const t of ['信源', '类型', '状态', '近 30 天入选', '说明']) head.append(el('th', null, t));
    table.append(el('thead')).lastChild.append(head);
    const body = el('tbody');
    const kindLabel = { search: '按词搜索', forum: '论坛', aggregator: '聚合', weekly: '周刊', blog: '个人博客' };
    for (const s of [...sources].sort((a, b) => (yields.get(b.name) || 0) - (yields.get(a.name) || 0))) {
      const tr = el('tr');
      const nameCell = el('td');
      const link = el('a', null, s.name);
      link.href = s.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
      nameCell.append(link);
      const st = sourceState(status[s.name]);
      const badge = el('span', 'state', st.label);
      badge.dataset.s = st.s;
      const stateCell = el('td');
      stateCell.append(badge);
      tr.append(nameCell, el('td', null, kindLabel[s.kind] || s.kind), stateCell,
        el('td', 'num', String(yields.get(s.name) || 0)), el('td', 'desc', s.desc || ''));
      body.append(tr);
    }
    table.append(body);
    const scroll = el('div', 'table-wrap');
    scroll.append(table);
    wrap.append(scroll);
  }

  /* ---------- 总渲染 ---------- */

  function render() {
    renderRail();
    const panel = $('#panel');
    const stream = $('#stream');
    panel.classList.toggle('hidden', !ui.panel);
    stream.classList.toggle('hidden', ui.panel);
    if (ui.panel) { renderPanel(); return; }

    stream.textContent = '';
    const shown = filterItems(allItems, ui, state);
    if (!shown.length) {
      stream.append(el('p', 'empty', '这个筛选下还没有内容。换个工具标签或日期看看。'));
      return;
    }

    const byDate = new Map();
    for (const item of shown) {
      if (!byDate.has(item.date)) byDate.set(item.date, []);
      byDate.get(item.date).push(item);
    }
    for (const [date, items] of byDate) {
      const day = days.find((d) => d.date === date);
      const head = el('div', 'day-head');
      head.append(el('h2', 'day-date', date), el('span', 'day-count', `${items.length} 篇`));
      stream.append(head);
      if (day && day.dailyNote && !ui.tool && !ui.query) {
        const note = el('p', 'day-note');
        note.append(el('strong', null, '编者按　'), document.createTextNode(day.dailyNote));
        stream.append(note);
      }
      const list = el('div', 'entries');
      items.forEach((item, i) => list.append(entryNode(item, i + 1)));
      stream.append(list);
    }
  }

  const search = $('#search');
  let timer = null;
  search.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { ui.query = search.value.trim(); ui.panel = false; render(); }, 140);
  });

  $('#generated').textContent = `更新于 ${new Date(generatedAt).toLocaleString('zh-CN', { hour12: false })}`;
  render();
})();

</script>
