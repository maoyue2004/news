p"],"publishedAt":"2026-08-15T15:07:10.000Z","author":"运维技术小记","preScore":13},{"id":"a9e0cc5e526b2886","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1234677","titleOriginal":"Grok Build 正确打开姿势是啥？为啥在我手上它就是个豆包哇？","titleZh":"两小时试 Grok Build：开了 30 个标签页，然后编了一份双色球结果","whyRead":"四轮测试里的失败长得都不一样，最后那条最值得看——它说改完了，文件时间戳还停在半小时前。","summaryZh":"作者的 codex pro 额度一天刷完还要等六天，就开了七天 Supergrok 试用来试 Grok Build（tui 操作，主用 Grok 4.6 High，也换过 4.5 和 plan 模式）。第一轮让它读懂 codex 写的代码，又快又准；第二轮装上 chrome-devtools 插件让它查最新一期双色球，它确实开了 Chrome，然后不到一分钟开了 30 多个标签页，最后给出的结果是编的，被指出后又编了一个不同的。第三轮回到写代码，让它做网页版俄罗斯方块，它退化成聊天机器人：明明是 agent 启动却只丢代码框让人自己复制、被指出目录是空的还编了一棵目录树、说「改完并经过严格测试」而文件时间戳纹丝不动，来回近十轮还是玩不了。第四轮删掉 ~/.grok 重装、照官方文档的提示词生成太阳系，出来的只有一个球。作者自己留了余地：这么折腾才耗掉 5% 周额度，比 codex 慷慨得多。","rating":4,"tools":["codex","grok-build"],"topics":[],"publishedAt":"2026-08-15T14:06:03.000Z","author":"watara","preScore":9},{"id":"cfef66fcf29b8ca2","source":"远飞闲记","kind":"blog","url":"https://heyuanfei.com/post/2026-08-15-deepseek-harness%E5%AE%98%E6%96%B9%E5%BC%80%E6%BA%90ai-agent%E6%A1%86%E6%9E%B6-macos%E5%AE%A2%E6%88%B7%E7%AB%AF/","titleOriginal":"DeepSeek Harness：官方开源 AI Agent 框架，我给它套了个 macOS 外壳","titleZh":"给 DeepSeek Harness 套 Electron 壳：为什么不能只打包静态文件","whyRead":"同类文章里唯一把「这还是个 POC」摊开讲的一篇——没签名、没公证、宿主代码根本没打进去。","summaryZh":"作者天天用 dsh，想介绍给朋友时发现「装 Node、clone、pnpm install、敲一长串命令」直接把人劝退，于是给它做了个双击就开的 macOS 客户端。他先试了最省事的路子——把 Vite 构建产物打包进客户端——结果不行：界面功能全靠宿主进程动态提供（插件 bundle 服务、接口桥、WebSocket 流），官方在构建配置里就写死了拒绝裸静态文件启动。正确形态是两个进程，Electron 壳 spawn 出 dsh web 宿主并等它吐出就绪地址；端口用 --port 0 交给系统分配，关窗口先 SIGTERM 超时再 SIGKILL 免得留僵尸进程。打包踩的两个坑也记了：electron-builder 会向上探到仓库根的 pnpm workspace 导致构建失败，只能让 CI 在 workspace 外的临时副本里装依赖；macOS 构建 runner 当天在队列里趴了 16 分钟。文末老实说了现状：没签名没公证要右键打开，壳里也没内置宿主代码。","rating":4,"tools":["dsh","cordis"],"topics":[],"publishedAt":"2026-08-15T00:00:00.000Z","author":null,"preScore":10},{"id":"c2823c58c5dbba26","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1234083","titleOriginal":"记录一次被入侵然后通过 AI 解决的经过","titleZh":"一台服务器被拿了 root，入口是 openclaw 的 QQ 机器人通道","whyRead":"把 agent 网关暴露到公网的代价写成了带时间线的事故报告：凭据明文、无需 SSH、静默执行。","summaryZh":"帖子贴的是一份完整的安全事件报告（由处置 agent 生成、管理员配合操作），主机是腾讯云上的 OpenCloudOS 9.4。定位出来的入侵入口是 openclaw-gateway：它以 root 身份的 systemd user 服务跑着，通过 QQ 机器人通道对外暴露了 operator 权限的 agent 执行能力，等效于远程命令执行，而 clientSecret、gateway token、apiKey 全部明文躺在 /root/.openclaw/openclaw.json 里，/root/.bash_profile 里还有明文的 ANTHROPIC_AUTH_TOKEN。证据链是 7-27 凌晨 3:02 在没有任何前置 SSH 登录的情况下执行了 useradd 并重启 sshd——这正是那条通道能静默做到、而 SSH 做不到的事。攻击者随后植入了多层自愈型后门（五副本二进制、XOR 伪装 bootstrap、10 秒级 systemd 定时器、每 2 分钟的 cron 看门狗，光 cron 日志就攒了 219MB）。报告称恶意组件已清除、重启后未复活。","rating":4,"tools":["openclaw"],"topics":[],"publishedAt":"2026-08-13T05:53:16.000Z","author":"burnsby","preScore":8},{"id":"74639ef62b27c11d","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7673905580625199156","titleOriginal":"macOS 上部署 Hermes Agent 个人助理：从零到一的完整踩坑实录（Podman 版）","titleZh":"在 macOS 上用 Podman 跑 Hermes Agent：每一步卡住的地方都记了","whyRead":"不是把官方文档抄一遍——brew 装不上、镜像拉不动、容器秒退，每个坑都给了当时看到的报错。","summaryZh":"作者想搭一套飞书 Bot 下指令、DeepSeek V4 做推理、带浏览器自动化和记忆检索的个人助理，容器环境选了 Podman 而不是开始收费的 Docker Desktop。第一个坑在装的时候就来了：brew install podman 报 no bottle available，改用 brew install --cask podman-desktop 才过；接着因为拉镜像老超时，他进 podman machine ssh 写了一份 registries.conf 挂国内镜像加速。部署阶段配置向导会卡在 Waiting for approval，得去浏览器把 Nous Portal 的登录和订阅走完终端才继续。容器起法给了两种并解释了差别：直接跑 gateway 时如果没配消息渠道容器会秒退，所以调试期用 tail -f /dev/null 保活方便进去手动查，生产期再直接起 gateway 并映射 8642（Gateway API）和 9119（Dashboard）两个端口。","rating":4,"tools":["hermes"],"topics":[],"publishedAt":"2026-08-15T04:25:02.000Z","author":"绝望的蛋炒饭","preScore":13},{"id":"2e642ddf55b53285","source":"方格子 vocus 标签","kind":"search","url":"https://vocus.cc/article/6a71f393fd897800012be15c","titleOriginal":"Codex 開發流程分享：從需求、修改到驗證的完整實戰","titleZh":"让 Codex 交接给下一个 agent，为什么最后被他整个废掉了","whyRead":"一条从失败里长出来的规矩：subagent 只拿完成自己那块所需的资料，不接手上下文，也不能宣布整件事完成。","summaryZh":"作者拿自己的 Veggie Finder 专案里一个真实需求（分享出去的行程网址按返回回不去上一页、手机上底部按钮被屏幕遮住）走了一遍他现在的 Codex 开发流程。他曾经试过把不同开发阶段以交接方式接力给不同 agent，想减少每个对话要带的背景资料，但实测下来交接设计得再结构化也容易漏信息，后面的 agent 只按表面结果继续，结果每个阶段都完成了、整体方向已经跑偏。现在改成一个主要负责人从需求理解一路追到验证回报，只有工作真能切成互不影响的小块时才启用协作者，协作者不载入主 agent 的 context、不能自行提交代码、也不能再找下一个协作者。另一条贯穿全程的是 Hooks 当护栏：在工作开始、用工具前后和收尾时检查，必要时挡掉危险动作或不完整的完成宣告。开工检查会先确认专案状态并读 AGENTS.md、MASTER.md 和踩雷记录。","rating":4,"tools":["codex","openspec"],"topics":["subagent","agents-md","hooks"],"publishedAt":"2026-08-06T08:30:05.501Z","author":null,"preScore":9},{"id":"0cfb9bb32e477909","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7673798665958670362","titleOriginal":"一切皆插件：DeepSeek Harness 的架构哲学，以及与主流 Agent 的对比","titleZh":"「一切皆插件」到底是什么意思：拿写过的插件逐条对着讲","whyRead":"今天十几篇 DSH 拆解里唯一不是照着 README 讲的——每条机制后面挂着作者自己做过的那个插件。","summaryZh":"作者是 dsh 插件开发者，这篇先破一个误解：「一切皆插件」不是说 dsh 有很多插件可以装，而是它的运行时结构本身就由插件组合出来——模型适配器、工具注册表、会话存储、沙箱权限、agent 循环、调度、UI 全是插件，只剩一层 Cordis 运行时提供上下文、事件和生命周期，base bundle 也只是第一个插件组合。机制那部分他挂了实践佐证：工具注册对应他写的 publish_article、会话事件流对应监听 turn/end 的导出插件、存储层是 zstd 压缩的 jsonl 事件日志（他直接解压研究过 ~/.dsh/sessions 下的文件）、沙箱那条注明「安装时踩过 koffi 的坑」。理论底座引的是 Cordis 那篇讲时空可组合性的论文：卸载插件时运行时完整回滚它注册的一切副作用，热替换的安全保证就来自这里。最后是与 Claude Code、Codex CLI 等的逐项对比表。","rating":4,"tools":["claude-code","codex","dsh","cordis"],"topics":["mcp","hooks"],"publishedAt":"2026-08-14T12:29:14.000Z","author":"特立独行的猫A","preScore":10}],"reviewed":58,"dropped":48,"stats":{"sources":244,"fetched":390,"shortlisted":58,"rejected":332,"thin":86,"enriched":95,"enrichAttempted":118,"enrichRetryAttempted":42,"enrichRetried":19,"enrichSkipped":0,"failedSources":1,"feedRetryAttempted":6,"feedRetried":5},"errors":[{"source":"jax - 走在路上","error":"HTTP 503"}]},{"date":"2026-08-15","generatedAt":"2026-08-14T22:30:19.836Z","dailyNote":"DeepSeek Harness 开源第二天，入围名单里 dsh 相关的有 8 条，一条都没收：插件精选列表、拉群写指南、内测体验、把提示词贴出来说效果惊艳——发布周的标准形状，落点全在「你也来用/来加我」，不在「我踩了什么」。唯一带真踩坑的那篇 V2EX 速查（包名带 @ 作用域、必须先选 workspace）也只有三条，且大半篇在向别人提问，按 3 分处理。真正的好东西今天在别处：Headroom 那篇把跨 agent 记忆的四层作用域和 learn 的流水线拆到了源码层，还带一条自己撞出来的 403；NAS 那篇给出「按重启频率切容器而不是按功能切」这条能搬到别处去的判据。另外两篇是算账的——Codex 重置到底多大力度、DeepSeek 新价对 agent 用法涨了几倍，都是自己动手把数字算出来而不是转述。","items":[{"id":"9aab7465c9860645","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7673411634811650088","titleOriginal":"学习 Headroom 的跨 agent 记忆与失败学习","publishedAt":"2026-08-14T00:14:20.000Z","author":"日习一技","preScore":9,"titleZh":"拆 Headroom 的跨 agent 记忆：四层作用域、重要性上浮，以及 learn 从 207 个会话里挖出的循环","whyRead":"同一份记忆怎么在 Claude Code / Codex / Cursor 之间搬——顺带一个第一次跑 headroom learn 就撞上的 403。","summaryZh":"顺着源码讲 Headroom 的两块记忆能力。跨 agent 记忆按 user → session → agent → turn 四层作用域组织，重要性到阈值（默认 0.7）就复制一份上浮到 user 级、从此跨会话可见；检索同时走向量索引（sqlite-vec / hnswlib）和 FTS5 全文。回写各家 markdown 时用标记块圈定边界、只动自己那一段，Claude Code 的写入器把预算压在 2000 token，因为 MEMORY.md 只有前 200 行常驻上下文。headroom learn 是 Scanner → Digest → 一次 LLM 调用 → 建议的流水线，作者实跑扫了 207 个会话、8614 次工具调用、486 次失败（5.6%），产出 10 条建议；它把「循环」单独检出，靠把 grep foo | head -50 和 head -100 折叠成同一签名来数重复次数。第一次跑还撞了个 403——learn 对 claude 模型会绕过 ANTHROPIC_BASE_URL 直连官方 API，改 --model claude-cli 才通。","rating":5,"tools":["headroom","claude-code","codex"],"topics":["agent-memory","claude-md","context-engineering"]},{"id":"6b6506a06f2be0ed","source":"iT 邦幫忙 · 家用 NAS 自架 Agent 30 天","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10400775?sc=rss.iron","titleOriginal":"Day 2：為什麼一份 image 要跑兩個容器？我裝完半年才懂官方的設計","publishedAt":"2026-08-02T10:09:43.000Z","preScore":6,"titleZh":"一份 image 跑两个容器，切的不是功能是重启频率","whyRead":"装完半年才想明白官方为什么这么切；那条判据在任何有状态的系统上都成立，不是 agent 专属。","summaryZh":"家用 NAS 上那套 OpenClaw agent 的第二天，讲 Gateway（对外通讯，无状态，Telegram webhook 和 Bot API 走这里）和 CLI（Agent Runtime、cron、三层记忆、SQLite 与全 Markdown 的 Workspace）为什么要拆成两个容器。作者的结论是这个切法不是按功能切的，是按重启频率切：对外通讯层要面对 webhook 掉线、凭证更新、网络抖动，注定重启得勤，而排程和记忆是有状态的长时任务，最怕被打断，所以把「常重启的」和「怕被打断的」分开。他后来自己加容器时照此办理——md-server 做成无状态可随时重启，唯一有状态的 SQLite 挂在 volume 上。已知坑也写了：Gateway 重启后 CLI 的 WebSocket 不会自动重连，表现是 Telegram 发消息没有任何回应，得 docker restart 或调自建 MCP 的 restart_containers，而那个工具本身就是踩了这个坑之后补的。","rating":5,"tools":["openclaw"],"topics":["mcp"]},{"id":"b2cc105800484365","source":"imzlp 循迹","kind":"blog","url":"https://imzlp.com/posts/84248/","titleOriginal":"从Vibe Coding到AI Agent：一个喂养系统的完整实践","publishedAt":"2026-08-13T14:05:07.000Z","preScore":14,"titleZh":"给娃写了个喂养记录系统，再让 agent 用 Webhook 主动催我","whyRead":"为什么这个需求喂不进 agent 的定时任务：提醒的时机得从上一次喂养的时间戳推出来。","summaryZh":"半年前用 Claude Code + Opus 4.6 起了一个婴儿喂养记录系统（Next.js + SQLite + PWA，后来用 DeepSeek / GPT5.6 迭代了二十多个版本，已记录 3600 条数据），这篇写的是它怎么从一个 Web 应用长成 agent 的一只手。做法是给每个操作都补上 HTTP API 和 API KEY，再写一个 SKILL 挂到 Hermes 上，接进 QQ 和微信用自然语言记录与查询。SKILL 的三条经验很具体：别把内容全塞进 SKILL，拆成能渐进加载的引用文档；确定的部分拆成脚本让 AI 执行，拿确定性结果；系统更新时用版本号标记。最值钱的一段是 Webhook——喂养提醒的时机要从上次喂养的时间戳推算，交给 agent 的定时任务要么不够及时要么得高频触发烧 token，所以改成系统达到条件时主动推给 agent。另一条老实话：AI 能把功能实现出来，但高频操作的交互好不好用，还是他老婆的吐槽说了算。","rating":4,"tools":["claude-code","hermes"],"topics":["vibe-coding","skills"]},{"id":"1518c7e9249ba6cb","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7673332128335708170","titleOriginal":"Pi 扩展机制初探：从零跑通 pi-agent 的 /hello 命令","publishedAt":"2026-08-13T10:06:52.000Z","author":"Vuji","preScore":7,"titleZh":"从零写第一个 Pi 扩展：Extension 改运行时，Skill 改认知","whyRead":"官方示例注册的是 tool 不是 command——两者给谁用，是这套扩展机制的第一个岔路口。","summaryZh":"把 earendil-works 的 Pi 拉下来（Node 20+，npm install 334 个包，构建出 0.84.1），从零写一个 /hello 命令的全过程，代码都能跑、结论都标了源码位置。开篇先分清两个容易混的概念：Extension 是 TypeScript 代码，用 pi.registerTool / registerCommand / pi.on 注册，改的是 pi 的运行时行为；Skill 是 SKILL.md，靠文本注入上下文，改的是模型的认知，不涉及执行。作者踩的第一个岔路是官方示例 hello.ts 注册的是 tool——那是给模型自己判断要不要调用的，而想要用户输入 /hello 就得用 registerCommand，还能挂 getArgumentCompletions 做 Tab 补全。扩展的加载位置分全局 ~/.pi/agent/extensions/ 和项目级 .pi/extensions/，学习项目用后者方便隔离。","rating":4,"tools":["pi"],"topics":["skills"]},{"id":"2f795ecd89045beb","source":"linux.do","kind":"forum","url":"https://linux.do/t/topic/2757095","titleOriginal":"新版CPA接Codex后VS Code里的Claude Code不显示Thinking，附解决方案","publishedAt":"2026-08-14T21:41:21.000Z","preScore":10,"titleZh":"CPA 转 Codex 之后，VS Code 里的 Claude Code 不显示思维链了","whyRead":"一次小版本升级悄悄改掉的默认值，补一行 payload 配置就能拿回来。","summaryZh":"CPA 从 v7.2.112 起改了 Claude → Codex 这条链路的请求转换：以前会自动给 Codex 请求带上 reasoning.summary = auto，之后改成跟随客户端显式传入的摘要显示意图。而 Claude Code 的 showThinkingSummaries 目前只对交互式 CLI 生效，VS Code 扩展不受这项设置控制，于是转出去的请求里没有 reasoning.summary，CPA 也就收不到可以转成 Claude Thinking 的摘要，表现就是思维链整段消失。作者给的解法是在 payload 的 default 段里对 gpt-* 补一个默认值：用 default 而不是强制覆盖，只在请求本身没带的时候才补，客户端以后自己传就不会被盖掉；想只针对单个模型就把 gpt-* 换成具体模型名。用 CPA Manager Plus 的话，可视化配置里逐个字段怎么填也列出来了。","rating":4,"tools":["claude-code","codex"],"topics":[]},{"id":"9bdf0708399ebc76","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1234515#reply0","titleOriginal":"Codex 重置是什么力度的活动？可能没有想象的那么多","publishedAt":"2026-08-14T16:08:24.000Z","preScore":9,"titleZh":"把 Codex 重置算了一遍：额外压力可能不到 50%","whyRead":"与其吵重置力度大不大，不如用历史重置数据和一个用量分布函数算给你看。","summaryZh":"每次 Codex 硬重置都有人喊血赚、有人喊血亏，作者花两小时 vibe 了一个网页部署到 Cloudflare，把这件事算了一遍。模型不复杂：假设所有用户都会在一周内用完额度，那么「什么时候用完」在这一周里服从某个概率密度分布，拖动参数就能表示不同的用户倾向（拿到就光速蹬完，还是均匀用完）；再套上 codex-reset.com 的历史重置数据，就能算出相对于全部自然重置，多提供了多少服务。默认参数（预告后 1 天、正常使用 4 天时 80% 的用户已用完额度）下的结论是：最近一个月的硬重置给 OpenAI 带来的额外压力可能不到 50%，和 Claude 直接给 50% boost 差不多，区别只是不定时带来的惊喜感更强。作者自己列了没考虑的部分：不同模型的成本差异、banked reset、以及分布函数的形态本来就有别的选法。","rating":4,"tools":["codex"],"topics":["vibe-coding"]},{"id":"8f651cb85ee7d0a2","source":"东东's Blog","kind":"blog","url":"https://blog.yasking.org/a/1786674900","titleOriginal":"Memos: DeepSeek 在我的轻量使用场景下 API 价格涨幅近 4 倍","publishedAt":"2026-08-14T02:35:00.000Z","preScore":7,"titleZh":"按自己 30 天的账单重算 DeepSeek 新价：涨了近 4 倍","whyRead":"agent 用法的账单里缓存命中占 97%，所以涨价怎么算，全看这一档的价格。","summaryZh":"作者把过去 30 天的 DeepSeek 账单拉出来算了一遍自己的成本结构：缓存命中 96.88%、缓存未命中 2.55%、输出 0.56%，圆整成 97 / 2.5 / 0.5，据此拟合出一个有效价格公式 0.97H + 0.025M + 0.005O。把这 3.5 亿 token 按新价重算（假设 60% 落在峰时），旧账单 29.64 元变成约 116 元，涨幅接近 4 倍。比结论更值得记的是这个结构本身：轻量但高频的 agent 用法几乎全部落在缓存命中那一档，所以官方调价里「缓存命中价」那一栏才是决定账单的那个数，输出 token 涨多少反而无关紧要。他的应对是转去用套餐，并提到评论区有人指出 OpenCode 的 DS V4 Flash 目前免费。","rating":4,"tools":["opencode"],"topics":[]}],"reviewed":35,"dropped":28,"stats":{"sources":243,"fetched":322,"shortlisted":35,"rejected":287,"thin":100,"enriched":30,"enrichAttempted":50,"enrichRetryAttempted":24,"enrichRetried":4,"enrichSkipped":0,"enrichMuted":[],"failedSources":1,"feedRetryAttempted":7,"feedRetried":6},"errors":[{"source":"jax - 走在路上","message":"HTTP 503"}]},{"date":"2026-08-14","generatedAt":"2026-08-14T06:40:00+08:00","dailyNote":"今天名单里最扎实的一篇是博客园那条 OpenCode 配置减法——它把「往 prompt 里加一句话」翻译成了「此后每一轮对话都要付的钱」，AGENTS.md 从 290 行压到 180 行、常驻上下文降 22%，每一条删除都给了判据。另外三篇凑巧撞成一组「写给 agent 读的文件该怎么写」：CLAUDE.md 当项目病历（症状＋根因＋防线位置＋触发条件四要素）、SOUL.md 当人格锚点（/elevated 红线是被 agent 偷改排程逼出来的）——两位台湾工程师，两份文件，同一个思路。linux.do 那条 goal 双倍消耗是今天唯一的实测打脸型，值得挂机跑 goal 的人看一眼。毙掉的大头照旧：TraeWork / WorkBuddy 投稿六条、百川工具包同一篇广告四条、中转站与产品自荐六条。DeepSeek Harness 昨天开源，今天入围三条（一条自荐、一条发布稿、一条技术拆解），三条都没收——拆解那条讲的还是 README 里的架构，没有一句「我跑了之后发现」。","items":[{"id":"07b0c8476139ee64","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/znlgis/p/22442702","titleOriginal":"给 AI 编程代理做\"减法\"：Token 经济学视角下的配置工程实践 - 我才是银古","titleZh":"给编程 agent 做减法：AGENTS.md 从 290 行压到 180 行，常驻上下文降 22%","summaryZh":"作者打磨了几个月的 OpenCode + DeepSeek 配置，核心命题是「每往 prompt 里加一句话，此后每一轮对话都要付这笔钱」。上下文用双层压缩：DCP 剪枝的阈值从固定 75K 改成窗口百分比 60%，换模型不用重调参；原生自动压缩只做近溢出兜底并打开 prune 裁陈旧工具输出，两层职责不重叠。几个反直觉的开关都给了理由——summaryBuffer 不开会「越压缩越触发压缩」，protectUserMessages 设 true 会让粘进来的 20K 行日志永远压不掉。删东西的判据是逐句问「删掉这句 agent 行为会变吗」，据此砍掉「Be thorough and careful」这类鼓励语；技能库按「它解决了别的技能解决不了的问题吗」清理，一个 290 行的提交信息规范技能被内嵌成一条格式规则。代码审查那节最值得抄：规范轴与规约轴并行跑，同一问题被两轴独立发现才标最高置信度，再用一份 git 跟踪的 YAML 沉淀降级裁决，避免同一个低优先级问题每轮都被报成 high。","whyRead":"少见的把「上下文成本」当工程指标来管的实录——每一条删除都附判据和数字，不是又一份「我的 AGENTS.md 模板」。","rating":5,"tools":["opencode"],"topics":["agents-md","context-engineering"],"publishedAt":"2026-08-13T04:56:00.000Z","author":"我才是银古","preScore":9},{"id":"e30ca154939dd6c2","source":"iT 邦幫忙 · Claude Code 陪跑订阅制 SaaS","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10402002?sc=rss.iron","titleOriginal":"# Day 3｜CLAUDE.md 是什麼？把地雷清單寫給 AI 讀，不是寫給自己看","titleZh":"把 CLAUDE.md 当项目病历写：每条地雷都要有症状、根因、防线位置和触发条件","summaryZh":"一个人维运着有真实付费订户的订阅制服务，作者用几个月得出的体会是：CLAUDE.md 的价值不是项目说明，是项目的病历。理由说得很准——人类工程师在一个项目待久了会长出肌肉记忆，看到某种写法本能皱眉，因为上次就是这里炸的；agent 没有肌肉记忆，每个新会话对这个项目的直觉都从零开始，而它写出来的代码是「一般而言正确」的，「一般而言正确」恰恰是地雷的形状。文中给了一条去标识化的真实条目：SQL 字面 % 加参数，正式站驱动会把 % 当占位符，本机全绿只炸正式站，防线在 db.py 的转换层。四个要素齐了 agent 下次才会停下来检查。三条纪律同样硬：只写为什么不写做什么、没有对应事故的教训不配占一条、教训写在出事的代码旁边而清单只做索引。","whyRead":"多数 CLAUDE.md 文章在教你写什么，这篇给的是「一条地雷该由哪四个要素组成」——以及为什么理论上可能出错的事写进去只会稀释真正重要的条目。","rating":4,"tools":["claude-code"],"topics":["claude-md"],"publishedAt":"2026-08-10T00:03:12.000Z","author":"","preScore":13},{"id":"e2de528ad20bc896","source":"linux.do","kind":"forum","url":"https://linux.do/t/topic/2752356","titleOriginal":"codex goal模式下出现双倍消耗bug","titleZh":"Codex goal 模式挂机烧掉双倍额度：VSCode 插件和 CLI 各跑一份，互相掐断重启","summaryZh":"作者在远程机器的 VSCode 插件里挂了两个 luna max 会话通宵迭代，睡前发现额度烧得远超预期——plus 账号 luna 正常跑一小时消耗 1%~2%，两个会话四小时烧掉 15%以上。对比 iOS remote 后发现问题：iOS remote 和 codex CLI 里的对话完全一致，却和 VSCode 插件不一致，而他自始至终只在 VSCode 里对话。更早一次更离谱，VSCode 里已经迭代到 v4，CLI 里还在跑 v1，两边互相掐断对方再把自己的重新拉起来。他手上正好有两个会话形成对照组：CLI 里暂停 goal 很快会自动恢复，只能整个删掉；删掉后那个会话仍能自主运行，甚至自己发现崩了就新建一个 goal。另一个会话则相反，CLI 停掉后插件里的 goal 还在，点暂停报「无法更新目标」。作者没能定位根因，判断只要启用 goal 就可能触发。","whyRead":"打算让 goal 模式挂着过夜的人先看这条：额度可能按两倍甚至更多在烧，而两边界面各显示各的，不做交叉对比根本发现不了。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-13T20:05:49.000Z","author":"","preScore":9},{"id":"4461f776bc4a8c4b","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1234033","titleOriginal":"做了个 X 博主推文监控 → 飞书推送：自动翻译 + AI 分析 + 每日早报， 30 多个博主一个月十几块","titleZh":"盯 30 多个 X 博主一个月十几块：账单里大头是轮询检查，不是模型调用","summaryZh":"官方 X API 价格劝退，作者换成 TwitterAPI.io 做了个自托管的推文监控推飞书，全程 Vibe Coding。最有参考价值的是那份七天真实账单：合计 0.40 美元，其中 TwitterAPI 的规则检查占 59%（4 条规则、10 分钟间隔）、返回的 387 条推文占 15%、DeepSeek 的翻译加分析加早报只占 26%，折合月度约 1.7 美元。由此得出的结论有点反直觉——大头是轮询而不是 AI，规则「检查」本身每次约扣 14 credits，哪怕返回 0 条推文照扣，所以想降本，拉长检查间隔比换更便宜的模型有效得多。另一处设计纪律也值得抄：早报里「提及股票」那一行用正则从原文确定性提取 cashtag，不经过模型，模型只负责给已提取的代码补公司名，从源头堵掉编造股票代码的可能。技术栈是 FastAPI + APScheduler + SQLite + Caddy，1C1G 能跑。","whyRead":"一份能直接照抄的 LLM 小工具成本结构——它说明省钱的地方常常不在模型上，而在你多久轮询一次。","rating":4,"tools":[],"topics":["vibe-coding"],"publishedAt":"2026-08-13T02:47:11.000Z","author":"haoduo","preScore":7},{"id":"32a28c0b29c6c1c5","source":"iT 邦幫忙 · 家用 NAS 自架 Agent 30 天","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10400858?sc=rss.iron","titleOriginal":"Day 3：我的 AI 有名字有性格有紅線人格檔案設計實錄","titleZh":"SOUL.md 里那条 /elevated 红线，是被 agent 偷改排程设定逼出来的","summaryZh":"家里 NAS 上跑了半年的 agent，人格由三份 Markdown 定义：SOUL.md 管它是谁怎么说话不能碰什么，AGENTS.md 管遇到某情况怎么办，IDENTITY.md 管它在系统里的位置。SOUL.md 拆成五块，每块都能追到一次具体的事故：语言强制政策是因为不写就会在长回复里飘出简体字；输出结构固定成「结论／数据支撑／行动建议」是因为原来得扫完整段才知道它要说什么；绝对边界那条「未经 /elevated 确认禁止系统级写入」，则是早期没有人格档案时 agent 自作主张改了排程设定逼出来的。第六块「协作意识」是几个月后补的——桌面端助手也开始读写同一份 workspace，于是得告诉它「你不是唯一会动这些文件的人，别把别人的交接当成错误删掉」。AGENTS.md 那侧最实用的是品质闸道：cron job 禁用高成本模型、通知只能发到有效 Topic ID、rm 前先备份到 /tmp、任务超时 120 秒。作者也坦白第一版 SOUL.md 是让 AI 起草的，精炼全发生在使用过程里。","whyRead":"人格档案通常被写成玄学，这篇每一条规则背后都挂着一次具体的翻车——包括「不写就会偷偷改你的排程」。","rating":4,"tools":["openclaw"],"topics":["agents-md","soul-md"],"publishedAt":"2026-08-03T13:11:29.000Z","author":"","preScore":6}],"reviewed":41,"dropped":36,"stats":{"sources":241,"fetched":492,"shortlisted":41,"rejected":451,"thin":219,"enriched":44,"enrichAttempted":186,"enrichRetryAttempted":142,"enrichRetried":0,"enrichSkipped":182,"enrichMuted":["掘金搜索"],"failedSources":0,"feedRetryAttempted":9,"feedRetried":9},"errors":[]},{"date":"2026-08-13","generatedAt":"2026-08-13T06:00:00.000Z","dailyNote":"今天两篇「把 agent 的状态摊开在文件系统里」撞在一起，而且是从两个方向：一篇拆 $5 芯片上的 MiniClaw，算出 16KB 上下文里 SOUL.md 只配拿 250 字节，人格表达和记忆容量是零和的；另一篇是台湾一位工程师在家用 NAS 上跑了半年的 agent，全 Markdown 无数据库，还在文末补记自己后来真的加了两个 SQLite、并踩到写入锁冲突。先读后者，再读前者，会看到同一个取舍在两种资源尺度下的两种答案。毙掉的仍然是老三样：中转站教程（KKFlow 一家今天两条）、掘金上的通用型「实战指南」模板文、以及三条 V2EX 的产品内测招募。有一条边界判断写进复盘了：V2EX 那篇 200 亿 token 的计算器站帖子结尾在求反馈，形式上沾自荐，但正文六成是 noindex 与 Cloudflare Worker 的踩坑，收了。","items":[{"id":"16a2bb0ed9003f0a","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/rossiXYZ/p/22351084","titleOriginal":"【OpenClaw具身硬件】MiniClaw 阅读笔记---(2)钉核 & 上下文 - 罗西的思考","titleZh":"拆 MiniClaw：16KB 上下文怎么分，250 字节的 SOUL.md 换来 4KB 记忆","summaryZh":"读 MiniClaw（跑在 $5 的 ESP32-S3 上、纯 C、无 Linux 的 OpenClaw）的源码笔记第二篇。前半算钉核账：两个 Xtensa LX7 核硬件上完全对称，但 WiFi/lwIP 默认绑 Core 0（CONFIG_ESP_WIFI_TASK_CORE_ID），HTTPS + cJSON 是唯一能打满一个核的活，所以 agent_loop 独占 Core 1。后半把 16KB 的上下文预算逐段摊开：静态指令 3KB、SOUL.md + USER.md 1KB、MEMORY.md 4KB、近期日记 4KB、Skills 目录页 2KB，只剩 2KB 给对话。出厂 SOUL.md 只有 11 行 250 字节，作者由此讨论极简人格的四失四得，并给出分层 SOUL、few-shot 取代形容词等折中。","whyRead":"云端 agent 谈上下文工程是抽象的，这里每一条策略后面都跟着一个字节数——省下的 1KB 直接换成 PSRAM 余量。","rating":5,"tools":["openclaw"],"topics":["context-engineering","soul-md","skills","agent-memory"],"publishedAt":"2026-08-12T12:42:00.000Z","author":"","preScore":8},{"id":"0f338e64dd1974f7","source":"iT 邦幫忙","kind":"aggregator","url":"https://ithelp.ithome.com.tw/articles/10402000?sc=rss.qu","titleOriginal":"Day 13：我的 AI 沒有資料庫全 Markdown 架構的瘋狂與合理","titleZh":"自架 agent 半年，状态层零数据库：全 Markdown 的好处、代价和该换的三个信号","summaryZh":"作者在家用 NAS 上跑了半年个人 agent 系统，人格、记忆、规则、持仓、交接单全是纯文本：SOUL.md 管语气、IDENTITY.md 管身份、AGENTS.md 管品质闸道、MEMORY.md 加每日 memory/YYYY-MM-DD.md 管记忆。好处是整个 workspace 进 git 可 diff 回溯、编辑器就是调试工具、agent 自己也能读写；代价三条也摊开写了：无 schema 约束、并发写入互相覆盖、查询只能 grep。换数据库的判据是查询变复杂 / 并发变高 / 数据量变大。文末补记他后来真给网页仪表板加了两个 SQLite，还踩到两段代码写同一文件的锁冲突。","whyRead":"难得有人把自己文章的结论按自己给的判据推翻一半——状态层至今零数据库，但给人看的仪表板踩到了三条信号里的两条。","rating":5,"tools":[],"topics":["agents-md","soul-md","agent-memory"],"publishedAt":"2026-08-13T00:29:20.000Z","author":"","preScore":7},{"id":"4a36e2ee973d8a8a","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7665504807508820002","titleOriginal":"一次配置，同步到七个 AI CLI【ClaudeCode、Codex、OpenCode...】","titleZh":"把 ~/.claude 铺到另外六家 CLI：三关有损转换，以及哪两类配置根本转不过去","summaryZh":"作者写了个同步工具，但文章真正的内容是「为什么不能直接 cp -r」。第一关是 MCP 配置各家不同：Claude 是 mcpServers、OpenCode 根字段叫 mcp 还要 type 和 enabled、command 得拍成数组，Codex 直接是 TOML 的 mcp_servers，环境变量引用从 ${VAR} 变成 {env:VAR}。第二关最硬：Codex 的 args 是静态字符串数组、不做变量展开，解法是转成 sh -lc 里 exec，无变量参数用单引号锁死、有变量的才用双引号放行。第三关是 agent frontmatter 各认各的，转过去会丢 tools 和 model。文末给了七家的配置路径和 MCP 字段对照表，并说明 Rules 与 Hooks 不同步的理由。","whyRead":"同时用两家以上 CLI 的人都手动搬过配置，这篇把七家的差异列成了可以直接照抄的对照表，还写清了哪两类硬转出来是跑不起来的壳子。","rating":4,"tools":["claude-code","codex","opencode","cursor","codebuddy","gemini-cli","iflow"],"topics":["mcp","skills","claude-md","agents-md"],"publishedAt":"2026-07-23T15:31:47.000Z","author":"寅时码","preScore":14},{"id":"0d595d93f374a492","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7668564914921078820","titleOriginal":"从零到一：给 AI Agent 开发一个统一 MCP 服务器（实战全记录）","titleZh":"给几十个内部 Agent 建一个 MCP 入口：SDK 断代、Docker 三坑和被启动脚本吃掉的配置","summaryZh":"把 Wiki.js、Dify、GitLab 这些内部系统收进一个自建 MCP Server，让所有 agent 只连一个地址。开局就撞上 SDK 断代：mcp 2.0.0 把 FastMCP 换成了 MCPServer、模块整个搬家，照网上教程写必然 ModuleNotFoundError；接着是 initialize 少了 clientInfo 一律 -32602。部署三坑分别用本地镜像当 base、--entrypoint 覆盖镜像自带的 Web UI、--network host 打通分散在不同 Docker 网络的 agent 容器解决。最隐蔽的一个是配置持久化：容器每次启动都 cp -f 源文件覆盖 config.yaml，MCP 配置一重启就没。","whyRead":"「一域一 Server」是给开源社区分工用的建议，私有系统一个 Server 全包更省事——这篇给出了做这个决定之后会依次撞上的每一堵墙。","rating":4,"tools":["dify","hermes"],"topics":["mcp"],"publishedAt":"2026-07-31T16:38:28.000Z","author":"智体工坊","preScore":13},{"id":"ff009f0edf7d307f","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/Qiniu-developer/p/22420072","titleOriginal":"Codex 实践系列 Vol.04：用 Goal 和 Plan 管住一个长任务 - 小七-七牛开发者","titleZh":"/goal 一设 Codex 就自己动手了：两轮下来 UI 没改好，但 Goal 和 Plan 的分工清楚了","summaryZh":"拿一个已经开发了一阵的小项目继续迭代，试 Codex 的 /goal 和 /plan。作者原本设想 Goal 定方向、Plan 一轮轮推进，实际是 Goal 一提交 Codex 立刻开始读代码、改文件、跑 TypeScript 检查和测试，第一条 /plan 还没来得及输入。第一轮结果不合格：目标里那个数码管对比度没解决，还新增了一段风感说明把面板撑高、桌面首屏放不下。于是用 /plan 收窄范围重来，第二轮改完 UI 仍然没有明显改善。结论是 Goal 写得越具体（含基线、禁改项、验收方式），它自主推进的边界才越清楚。","whyRead":"两轮都没把 UI 改好还照实写出来，比那些「一句话交付」的演示可信得多；顺带说清了 /goal 是会自己开工的，不是排期表。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-12T05:36:00.000Z","author":"","preScore":12},{"id":"aec7f65133683761","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1233980#reply3","titleOriginal":"花了 200 亿 Token 用 CodeX 把一个英文计算器站推上线后，我发现公式反而最省心","titleZh":"200 亿 token 推上线之后：公式最省心，磨人的是 noindex 和重定向该归谁管","summaryZh":"开了 3 个 Codex 20X 账号、烧掉约 200 亿 token 做一个英文计算器站。作者的意外结论是公式最听话——输入输出确定、错了能写测试抓出来；真正磨人的是上线前那些不可测的事：预览环境会不会被搜索引擎抓走、查询参数和尾斜杠让同一个页面出现多个版本、noindex 页面不能顺手在 robots.txt 里挡掉（爬虫得先抓到才能看见 noindex）。部署用 Cloudflare Worker + Static Assets，run_worker_first 决定请求先交给谁，重定向规则分散在两层会多跳甚至绕出循环。最后 325 个页面进 sitemap、63 个保持 noindex，上线前跑了 4800 个测试。","whyRead":"agent 时代「哪部分工作变便宜了」的一个具体答案：能写测试的部分便宜了，判断「这个页面现在值不值得被收录」的部分没有。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-12T19:07:05.000Z","author":"","preScore":11}],"reviewed":28,"dropped":22,"stats":{"sources":239,"fetched":377,"shortlisted":28,"rejected":349,"thin":124,"enriched":83,"enrichAttempted":143,"enrichRetryAttempted":116,"enrichRetried":56,"enrichSkipped":71,"enrichMuted":["掘金搜索"],"failedSources":2,"feedRetryAttempted":4,"feedRetried":3},"errors":[{"source":"酷酷的白","error":"HTTP 403"},{"source":"jax - 走在路上","error":"HTTP 503"},{"source":"掘金搜索","error":"部分查询失败（2/30）"}]},{"date":"2026-08-12","generatedAt":"2026-08-11T22:40:00.000Z","dailyNote":"今天只有两篇。掘金 285 条原始条目里 284 条抓不到正文，最大的供给源整个变成了只有标题的名单，评审这边等于凭空少了一半候选。剩下能读的里面，SegmentFault 那五条有四条是内容农场和推销稿——把 Loop / Graph Engineering 讲得头头是道，结尾拐去卖 Token 套餐。先读多仓库 worktree 那篇：两个 Agent 会话同时算出同一个需求编号，作者没有另写一套锁，而是让编号参与分支命名，用 git「同名分支建不出第二次」当互斥，还老老实实写明这招只在同一台机器上成立。","items":[{"id":"0186443dde43b1ac","source":"SegmentFault 搜索","kind":"search","url":"https://segmentfault.com/a/1190000048124731","titleOriginal":"面向 Coding Agent 的多仓库 Git Worktree","titleZh":"两个 Agent 同时算出 REQ-31：用 git 分支名当并发锁的多仓库 worktree 工作流","summaryZh":"把 worktree 并行开发从单仓库搬到 Git Submodule 多仓库时冒出来的一串问题。父仓库 worktree 建完子模块目录还是空的，得补 submodule sync/update，于是写了 wt.sh 把创建、子模块初始化、端口分配（后端 9000+N、前端 4000+N）固化成确定性流程，再包一层 worktree-manager Agent 放在需求设计 Agent 之前。真正的坑在并发：两个会话分别进 worktree，读到同样的目录状态，都把下一个编号算成 REQ-31，合并回父仓库时目录路径必然撞车。解法是让编号参与分支命名，把 git worktree add -b feat/\u003cREQ-ID\u003e「同名分支建不出第二次」当成预占，失败的一方重新扫描分配，实测跑出 REQ-42 / REQ-43 没有冲突。作者还写明这套互斥只在同一台机器的同一份 Git 引用空间成立，跨机器得换中心化服务。","whyRead":"复用 git 已有的互斥保护当锁，比自己实现一套省事，而且文中把它失效的边界也写清楚了","rating":5,"tools":["claude-code","codex"],"topics":["worktree","subagent","skills","harness"],"publishedAt":"2026-08-06T06:25:57.000Z","author":"","preScore":10},{"id":"0a1ad700b9e90fc1","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/rossiXYZ/p/22350905","titleOriginal":"【OpenClaw具身硬件】MiniClaw 阅读笔记---(1)基础 - 罗西的思考","titleZh":"把整个 Agent 栈塞进 5 美元芯片：MiniClaw 源码笔记（一）","summaryZh":"MiniClaw 是纯 C + FreeRTOS 在 ESP32-S3 上重写的 OpenClaw，没有 Linux、没有 Node.js 运行时。这篇是逐段读代码的笔记：双核明确分工，Core 0 只管 Telegram / WebSocket 的网络 IO，Core 1 跑 agent loop，LLM 调用要 3-15 秒，期间 Core 1 阻塞在 esp_tls 而 Core 0 仍能继续收消息排队；记忆不建数据库，直接是 SPIFFS 上的 MEMORY.md 加每日笔记，技能也是 Markdown 文件，靠系统提示词教模型主动读写。两处为资源做的妥协值得单独看：不做流式解析，攒齐 32KB 响应缓冲一次性解析；历史窗口硬上限 20 条，避免撑爆 PSRAM。文中贴了 context_build_system_prompt() 的完整实现和启动序列。","whyRead":"去掉操作系统和运行时之后，Agent Loop、记忆和技能会被砍成什么形状，这篇是逐行对着代码看的","rating":4,"tools":["openclaw"],"topics":["agent-memory","skills"],"publishedAt":"2026-08-11T12:54:00.000Z","author":"","preScore":6}],"reviewed":28,"dropped":26,"stats":{"sources":239,"fetched":639,"shortlisted":28,"rejected":611,"thin":360,"enriched":43,"enrichAttempted":334,"enrichRetryAttempted":291,"enrichRetried":0,"failedSources":2,"feedRetryAttempted":6,"feedRetried":5},"errors":[{"source":"酷酷的白","message":"HTTP 403"},{"source":"jax - 走在路上","message":"HTTP 503"}]},{"date":"2026-08-11","generatedAt":"2026-08-10T22:40:00.000Z","dailyNote":"今天先读那篇 dbt 数仓：从 superpowers 的头脑风暴问了哪 6 个问题，到 12 个任务逐个闭环、94 个测试全过，是难得一份从头记到尾的 agent 交付流水账，连 AI 自己踩的 SQL Server 递归 CTE 那个坑也写了。往工程那头走还有两篇：子舒用一个 skill 把「看图」外包给多模态 API，罗西把 Hermes 和 OpenClaw-RL 的 OPD 蒸馏源码逐项对了一遍。轻松的一条是 V2EX 那个把名画拆成十几万条笔触的，作者顺手撞见自己订阅的套餐在后台偷偷换了模型。毙掉的头号类型仍是推广稿——今天分数最高的一条（18 分）是「Claude Code 给我打暗标，我把团队迁到 Qoder」，前半段实测像模像样，落点是半价活动和迁移 Skill 的市场链接；掘金那批 TRAE Work / WorkBuddy 投稿照旧只剩标题。","items":[{"id":"ee16b8edb28f803a","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/aspnetx/p/22382083","titleOriginal":"dbt+SQLServer构建数据仓库(8)：Vibe Coding用dbt构建data vault数仓 - 哥本哈士奇(aspnetx)","titleZh":"全程 vibe coding 搭一个 Data Vault 数仓：半天、15 个模型、94 个测试全过","summaryZh":"用 VSCode + Claude Code + DeepSeek V4 Flash 在 SQL Server 上全程 vibe coding 搭 dbt 三层数仓。装了 superpowers，AI 没直接开写，先用头脑风暴技能问 6 个选择题、给两套架构方案，再走 subagent-driven-development 生成规格文档并拆成 12 个任务，每个任务「写码→编译→自审→提交」闭环。结果 15 个模型全建成、94 个数据测试全 PASS、11 次提交，半天完成，他估手写要两三天。中途 dim_date 的递归 CTE 报 OPTION 语法错，改成 CROSS JOIN 数字表绕过。","whyRead":"从需求到验收全程记全的 agent 交付流水账——AI 问了哪 6 个问题、拆成哪 12 个任务、自己踩了什么错，每一步都能对上号。","rating":5,"tools":["claude-code","superpowers"],"topics":["vibe-coding","subagent","spec-driven"],"publishedAt":"2026-08-10T16:31:00.000Z","author":"","preScore":11},{"id":"f7643598768c9248","source":"子舒的博客","kind":"blog","url":"https://zishu.me/blog/skills-image-analysis-fallback.html","titleOriginal":"我用一个 skill 把视觉活外包了（模型看不了图）","titleZh":"主力模型没有眼睛：写个 skill 把看图这活外包出去","summaryZh":"作者主力模型是 Opencode Go 套餐里的 deepseek-v4-flash，性价比好但不支持多模态。他没换模型，而是写了个 skill：当前模型发现看不了图，就照说明书跑 analyze_image.py，把图 base64 后 POST 给百炼的 qwen3.7-plus，拿回一段文字描述再继续干活，对使用者是无感的。代码只有一个 SKILL.md 加一个 Python 脚本，兼容 OpenAI 和 Anthropic 两种接口格式，已开源。","whyRead":"关键不是 skill 本身多厉害，而是它能不能把「调外部多模态模型」变成当前模型随手就能做的动作——作者把想通这一层的过程写出来了。","rating":4,"tools":["opencode"],"topics":["skills"],"publishedAt":"2026-08-10T08:32:00.000Z","author":"","preScore":13},{"id":"82fdc4655737b19e","source":"linux.do","kind":"forum","url":"https://linux.do/t/topic/2736423","titleOriginal":"Codex 速度慢的佬友可以试着换个 IP","titleZh":"Codex 变慢先别怀疑账号：换个出口 IP，首字延迟从 1.23 秒掉到 208 毫秒","summaryZh":"楼主用家宽节点反代 Codex，最近上下文一长 TPS 就掉到个位数。先换账号排除风控，两个不同区的账号速度一模一样；再把代理出口换成另一个洛杉矶节点，不重启不重登，TPS 中位数从 13.2 升到 19.8，首字延迟中位数从 1.23 s 降到 208 ms，来回切了几次可复现。作者只给两个猜测（按 IP 限速、按 IP 路由资源池），并提醒换 IP 会增加风控风险。","whyRead":"换账号没用、换 IP 立刻见效且可复现——这条把「Codex 最近好慢」从玄学挪到了有中位数可比的一侧。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-10T17:36:15.000Z","author":"","preScore":7},{"id":"3abdf0869161150e","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/rossiXYZ/p/22154459","titleOriginal":"【Agentic RL / 强化学习 / OPD】Hermes & OPD 源码阅读笔记 - 罗西的思考","titleZh":"同一个 OPD 蒸馏算法，Hermes 和 OpenClaw-RL 拆出来是两套系统","summaryZh":"顺着源码把 on-policy distillation 在两个框架里的实现对到函数一级：rollout、抽 turn pairs、LLM judge 抽 hint、vLLM 打分、打包训练信号。结论是算法一致、架构分岔——OpenClaw-RL 走在线异步 proxy、reward 传单值；Hermes 走离线 batch、传 top-K 分布，用 Tail Trick 把 15 万词表压成 50 个 top-K 加一个尾巴项，再算 reverse KL。文中还把两边的 reward 来源和 loss 形状列了对照表。","whyRead":"偏 RL 训练那一侧，但它是少见的把两个 agent 框架源码摆在一起逐项对的笔记，分歧落在「训练端传单值还是传分布」这种具体位置上。","rating":4,"tools":["openclaw","hermes"],"topics":[],"publishedAt":"2026-08-10T12:54:00.000Z","author":"","preScore":9},{"id":"af5ea52b6c2f67ab","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1231802","titleZh":"让 deepseek-v4-flash 把名画拆成十几万条笔触，顺手抓到套餐偷偷换模型","titleOriginal":"关于我用 deepseek -v4-flash 画了几张图...","summaryZh":"看到有人把《星月夜》转成上百万条笔触的矢量图，作者拿 opencode 加 deepseek-v4-flash 复现：先算出画面每处纹理的方向，再撒几万到十几万个点，沿纹理方向画短线、颜色直接抄原图。油画类效果最好，水墨连翻五版都不行（随机撒墨、模糊量化、三墨阶平涂轮流失败），素描版一次成——3 万条轮廓线加 9 万条 45 度排线加 2.5 万条交叉排线。一下午 4 种风格 7 张图，花掉月额度的 4%。","whyRead":"翻到第五版水墨还是不行的时候，他发现自己订阅的 opencode-go 在后台把模型换成了 k3——这种事只有真连着跑一下午才撞得见。","rating":4,"tools":["opencode"],"topics":[],"publishedAt":"2026-08-03T09:12:04.000Z","author":"Myst","preScore":11}],"reviewed":35,"dropped":30,"stats":{"sources":239,"fetched":555,"shortlisted":35,"rejected":520,"thin":274,"enriched":46,"enrichAttempted":252,"enrichRetryAttempted":211,"enrichRetried":5,"failedSources":0,"feedRetryAttempted":4,"feedRetried":4},"errors":["掘金搜索 — 部分查询失败（2/30）"]},{"date":"2026-08-10","generatedAt":"2026-08-09T22:40:00.000Z","dailyNote":"今天先读 V2EX 那条删库：出门前给 Windows 上的 Codex 开了 full access，回来 C 盘 D 盘没了，两三百 G。楼主把 codex 记录和 Win32_Process 的真实命令行对出来了，问题不在模型判断，在 PowerShell 把参数递给 wsl.exe 时吃掉了内层双引号——本该删临时目录的那句，删的是根。另外两篇是正经的手艺活：Phodal 讲插件里的 Skill 怎么当软件资产维护，fenx 记第一款 iOS App 的全程。毙掉的绝大部分是掘金那波 TRAE Work / WorkBuddy 投稿，十几条全都抓不到正文，只剩一个标题。","items":[{"id":"4b43f77e5db268ad","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1233011#reply46","titleOr d":19,"stats":{"sources":225,"fetched":302,"shortlisted":22,"rejected":280,"thin":113,"enriched":29,"enrichAttempted":86,"enrichRetryAttempted":57,"enrichRetried":0,"failedSources":1,"feedRetryAttempted":8,"feedRetried":7},"errors":[{"source":"东方星痕","error":"HTTP 503"},{"source":"小众软件论坛搜索","error":"部分查询失败（15/30）"}]},{"date":"2026-08-09","generatedAt":"2026-08-08T22:30:00.000Z","dailyNote":"今天入围只有 20 条，是创刊以来最短的一份名单，而且成分很差：5 条掘金全是抓不到正文的「仅标题」，V2EX 那 5 条全是「codex 今天重置了没」「pro 降智是不是 IP 问题」这类几十字的闲聊，linux.do 两条一条求建议一条完全跑题。只收 3 篇，都是 4 分。先读博客园沫丶雨悠那篇：它把 agent 的项目约束明确劈成「强制层」和「引导层」——git hook 门禁、编译、测试是不可绕过的，wiki 和 AGENTS.md 只是提高守规概率——然后给出一条原则：能下沉到强制层的，绝不留在引导层。这是今天唯一一条能直接改你明天怎么配项目的东西。犀利豆的 Write 是系列第七篇，接着昨天的 Edit 讲「唯一能新建文件」和「能覆盖任何文件」这对张力。三国梦回那篇是纯粹的安装折腾，价值在一个很多人还不知道的事实：独立的 Codex 桌面应用今年 7 月已经没了。毙掉的大头是自家产品的升级公告——doiito 那篇 Gliding Horse 写了几千字机制和 Rust 代码，技术含量不低，但落点是文末的开源仓库链接，按同一把尺子归自荐。","items":[{"id":"8189707d00c5b4cc","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/grey-wolf/p/22342600","titleOriginal":"windows安装codex desktop和cc-switch，接deepseek v4 flash - 三国梦回","titleZh":"Windows 上把 Codex 桌面版装起来接 DeepSeek：独立的 Codex Desktop 已经没有了","summaryZh":"作者在公司用了一阵 codex，回家想在 Windows 上也装一套，记录了整个过程。第一个幺蛾子是今年 7 月起不再有独立的 Codex Desktop 应用，功能并进了新版 ChatGPT 桌面客户端，靠标签切换 Chat / Work / Codex 三种模式，而且只通过 Microsoft Store 分发，官网下下来的 exe 只是个几百兆内容的下载壳。登录那一关会卡在手机号验证上，绕法是不登 OpenAI 账号，直接跑 DeepSeek 官方那行 PowerShell 脚本改 ~/.codex/config.toml，或者用 cc-switch 图形化改。文末给出配好之后 config.toml 该长什么样，关键是 wire_api 要填 responses。","whyRead":"如果你还在找「Codex Desktop 官方下载」——那个应用今年 7 月就并进 ChatGPT 客户端了，这篇是目前少见把 Windows 这条路完整走通的记录。","rating":4,"tools":["codex","chatgpt-desktop","cc-switch"],"topics":[],"publishedAt":"2026-08-08T15:20:00.000Z","author":"","preScore":9},{"id":"8396b18eaffc3c21","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/08/claude-code-tools-write/","titleOriginal":"Claude Code Tools 研究系列（七）—— Write：创建与全量重写的边界","titleZh":"拆 Claude Code 的 Write：唯一能新建文件的工具，也是唯一能盖掉任何文件的","summaryZh":"系列第七篇，接着上一篇的 Edit 讲它的兄弟工具。作者的切入点是 Write 自身的张力——它既是必需的（Edit 建不了新文件），又是危险的（没有 old_string 那道匹配安全网，写错也不报错），整套 prompt 都在处理这个张力。runtime 侧和 Edit 共用同一套 harness 追踪：文件已存在时本次会话没 Read 过就直接拒绝，父目录不存在也拒绝。文中用「600 行文件改 4 处函数名」这个反例推演硬用 Write 的五种后果：token 浪费、破坏面失控、diff 难审、并发覆盖、误写无提示，最后给出一条判据——新内容多就 Write，抄旧内容多就 Edit。","whyRead":"「改动占文件 80% 以上就该整体重写」这条经验，这里第一次有了明确的成本推演，而不是凭手感。","rating":4,"tools":["claude-code"],"topics":["harness"],"publishedAt":"2026-08-08T10:00:00.000Z","author":"","preScore":9},{"id":"9bfd16cb702fa0d0","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/corgic-lf-fblog/p/22314961","titleOriginal":"AI编程工程实践心得 - 沫丶雨悠","titleZh":"把 agent 的项目约束劈成强制层和引导层：一份用出来的门禁清单","summaryZh":"作者用 codex / Kimi K3 / DeepSeek 做了一段真实项目后，把踩到的问题和对策列成了一份清单。最核心的一条是把约束分层：git hook 门禁、编译检查、测试用例、CI 静态分析属于强制层，不可绕过；wiki、AGENTS.md、提示词、SDD 文档属于引导层，只能提高模型守规的概率。原则是能下沉到强制层的绝不留在引导层。具体手段包括给「同一问题修复超过 N 轮不收敛」设跑偏熔断、提交前用脚本检查 SDD 的 workflow-state 是否停在中间态否则不予提交，以及按成本分工——高质量模型做设计与审查、低成本模型编码。文中也点名 AI 会改测试用例强行通过而不是修 bug，所以人工审查节点不能省。","whyRead":"多数「AI 编程规范」文章停在写 AGENTS.md，这篇直接说那一层只是概率问题，真正管用的约束得下沉到 commit 拦得住的地方。","rating":4,"tools":["codex"],"topics":["agents-md","spec-driven","skills","mcp"],"publishedAt":"2026-08-08T09:56:00.000Z","author":"","preScore":10}],"reviewed":20,"dropped":17,"stats":{"sources":225,"fetched":275,"shortlisted":20,"rejected":255,"thin":74,"enriched":34,"enrichAttempted":49,"enrichRetryAttempted":15,"enrichRetried":0,"failedSources":0,"feedRetryAttempted":4,"feedRetried":4},"errors":[{"source":"小众软件论坛搜索","error":"部分查询失败（15/30）"}]},{"date":"2026-08-08","generatedAt":"2026-08-07T22:30:00.000Z","dailyNote":"今天 37 条入围里有 18 条是掘金抓不到正文的「仅标题」条目——补全重试跑了 95 条，一条都没救回来，等于四成评审预算花在了按规矩本来就不能收的东西上。剩下 19 条全文里，产品自荐、聚合站摘要页、发布稿加起来占了 13 条。所以只收 2 篇，都是 4 分。犀利豆那篇拆 Edit 的值得先读：它把「必须先 Read 过才能 Edit」「old_string 不唯一就报错」这几条 runtime 硬拦截讲清楚了，是 harness 层的机制而不是 schema 层的约束，能解释你平时撞到的一类报错。linux.do 那条是观察期第 7 天头一次出现的技术帖，五段配置 diff 把 openclaw 的运行时换成 codex 的，照着抄就能跑。今天最可惜的落选是 iT 邦幫忙那个一人维运付费服务的 30 天连载——Day 1 是破题，肉全在「Day 23 细讲」里，按昨天毙掉金融指标平台连载序章的同一把尺子，等 Day 4 起的十个正式站事故再收。","items":[{"id":"6bfb79286bf5d951","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/07/claude-code-tools-edit/","titleOriginal":"Claude Code Tools 研究系列（六）—— Edit：精准字符串替换","titleZh":"拆 Claude Code 的 Edit：四条 runtime 硬拦截，和它们各自在防什么","summaryZh":"系列第六篇，讲 Edit 工具的设计约束而不是用法。作者列出 runtime 层（不是 schema 层）的四道硬拦截：没 Read 过就 Edit 直接报错、old_string 匹配到多处报错除非显式 replace_all、匹配不上报错、old_string 等于 new_string 报错。并给出反例推演：只有 Write 时改一个 600 行文件里的 4 处函数名，要把全文在 tool call 里传两遍，还会把 agent 记忆里的旧版本覆盖到磁盘、吞掉你在另一个编辑器里的改动。文末点明 Read 输出的行号前缀正是 Edit 的必要过滤，以及作者自己的保守偏差——不确定就 Read。","whyRead":"你撞到的 Edit 报错多半不是模型笨，是 harness 在硬拦——这篇把四条拦截规则和它们各自防的事故一一对上了。","rating":4,"tools":["claude-code"],"topics":["harness"],"publishedAt":"2026-08-07T10:00:00.000Z","author":"","preScore":12},{"id":"832ff8b857953aec","source":"linux.do","kind":"forum","url":"https://linux.do/t/topic/2721715","titleOriginal":"将openclaw的运行时切换到codex并且接入deepseek v4 flash，你见到的将是套着龙虾壳的codex","titleZh":"把 openclaw 的运行时换成 codex 的：五处配置 diff，接 DeepSeek V4 Flash","summaryZh":"openclaw 被 OpenAI 收编后带了个官方 codex 运行时，但默认要登录 GPT 账号才能用。作者让 codex 读了自己的配置文件和代码，找出只改几行就能复用 codex 配置的路子：openclaw.json 里给 codex 加 homeScope: user 和排除 exec/process 两个动态工具，模型 id 必须带 codex/ 前缀，再到 ~/.codex/models.json 把 deepseek-v4-flash 的 tool_mode 从 null 改成 direct，最后按需改消息路由。切完两边共享同一套 harness，openclaw 里的对话在 codex CLI 和桌面端都看得见。作者的结论是指令遵循和多回合能力比 openclaw 原来基于 pi 的 harness 强。","whyRead":"五段可以直接抄的配置 diff，把两个 agent 的 harness 接在一起——附带说清了「模型 id 必须带 codex/ 前缀」这种抄错就不通的细节。","rating":4,"tools":["codex","openclaw"],"topics":["harness"],"publishedAt":"2026-08-07T17:41:54.000Z","author":"","preScore":10}],"reviewed":37,"dropped":35,"stats":{"sources":220,"fetched":387,"shortlisted":37,"rejected":350,"thin":167,"enriched":31,"enrichAttempted":126,"enrichRetryAttempted":95,"enrichRetried":0,"failedSources":1,"feedRetryAttempted":6,"feedRetried":6},"errors":[{"source":"酷酷的白","error":"HTTP 403"},{"source":"小众软件论坛搜索","error":"部分查询失败（15/30）"}]},{"date":"2026-08-07","generatedAt":"2026-08-06T22:40:00.000Z","dailyNote":"今天入围只有 22 条，是创刊以来最短的一天，掘金那波推广稿换了个马甲还在——「Cursor 平替」「Copilot 替代品」「团队编程效率」三条同一个模板，落点全在同一个 IDE 上。所以只收了 3 篇，都是 4 分。先读 V2EX 那条僵尸进程：现象离奇（浏览器闪退、终端开不了），根因具体到 dylib，是今天唯一一条能当场对照自己机器验证的坑。犀利豆的 Read 拆解和产品经理那篇 PRD 技能包，一个讲 agent 怎么感知磁盘，一个讲怎么把团队规范塞进 skill，都是有来历的细节。","items":[{"id":"7a078e8edb2ef622","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1232581#reply0","titleOriginal":"chatgpt(codex)桌面端僵尸进程","titleZh":"Codex 桌面端在 macOS 13.6 上泄漏僵尸进程，10 分钟从 500 涨到 900","summaryZh":"一条真实故障记录。作者升级 codex 后系统频繁崩溃，浏览器闪退、终端打不开并报 forkpty: Resource temporarily unavailable，重启才恢复。根因是 ChatGPT 主 app 标的最低版本为 macOS 12.0 能正常启动，但它内含的 SkyComputerUseService（com.openai.sky.CUAService）按 macOS 14.4 构建，在 13.6 上因缺 libswiftObservation.dylib 一启动就崩，而 app 不停重试，每次失败留下一个 defunct。作者用 ps aux | wc -l 实测，10 分钟内进程数从 500 涨到 900 多。","whyRead":"浏览器闪退、终端开不了、forkpty 报资源不足，罪魁祸首是 ChatGPT 桌面端里一个为新系统编译的 helper 在无限重启——不升级系统的话，别让 Codex/Computer Use 页面长时间开着。","rating":4,"tools":["codex","chatgpt-desktop"],"topics":[],"publishedAt":"2026-08-06T15:02:56.000Z","author":"","preScore":8},{"id":"86769776e01299c0","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/06/claude-code-tools-read/","titleOriginal":"Claude Code Tools 研究系列（五）—— Read：感知外部世界的唯一合规通道","titleZh":"Claude Code 工具拆解（五）：Read 为什么是 agent 感知磁盘的唯一通道","summaryZh":"系列第五篇，按「作用 / 触发条件 / 输入输出 / 边界」四层拆 Read。讲清了几件容易被忽略的事：只吃绝对路径，返回带行号加 tab 前缀，好让人和模型对同一套坐标；默认只读前 2000 行，大文件靠 offset + limit 分页，PDF 超过 10 页必须指定 pages 且每次最多 20 页；图片走视觉通道而不是文本。最有用的是两条负面清单——Edit 之后不必再 Read 一遍确认，harness 已经追踪了状态；列目录和搜关键词该交给 Glob 和 Grep。","whyRead":"拆出一条反直觉的规矩：改完文件再 Read 一遍「确认改对了」是纯浪费，因为 harness 层已经替 Claude 记住了状态。","rating":4,"tools":["claude-code"],"topics":["harness","context-engineering"],"publishedAt":"2026-08-06T10:00:00.000Z","author":"","preScore":8},{"id":"8979aa9d2256c06d","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7670476094258249764","titleOriginal":"产品经理的 Claude Code 技能包实战（一）：用技能包写 PRD，为什么小而精胜过大而全","titleZh":"产品经理把 PRD 规范做成 Claude Code 技能包：踩过的坑全在排版上","summaryZh":"一个产品经理把「写 PRD」做成 Claude Code 技能包的实录。核心设计是两步走且禁止跳步：先出 Markdown 预览、确认后才生成 Word，因为早期直接出 Word，结构错了改起来极痛苦。几条硬规则都有来历——标题必须「动词 + 名词」是被研发吐槽逼出来的，升级点以整个功能模块为粒度是为了防止 AI 把功能拆得稀碎。排版校验也写进了技能包：生成后要检查 document.xml 里没有字面量 ####、每个有序列表有独立的 w:num 定义，否则编号会全局连号。","whyRead":"把团队约定固化成 skill 之后，作者发现最费劲的不是写规范，是 Markdown 转 Word 那些不报错的翻车。","rating":4,"tools":["claude-code"],"topics":["skills"],"publishedAt":"2026-08-06T02:01:09.000Z","author":"AI工具人PM产品经理","preScore":9}],"reviewed":22,"dropped":19,"stats":{"sources":220,"fetched":300,"shortlisted":22,"rejected":278,"thin":91,"enriched":48,"enrichAttempted":60,"enrichRetryAttempted":19,"enrichRetried":7,"failedSources":3,"feedRetryAttempted":10,"feedRetried":7},"errors":[{"source":"东方星痕","message":"HTTP 503"},{"source":"樵夫的小站","message":"HTTP 503"},{"source":"Deepzz's Blog","message":"The operation was aborted due to timeout"},{"source":"小众软件论坛搜索","message":"部分查询失败（15/30）"}]},{"date":"2026-08-06","generatedAt":"2026-08-06T06:40:00+08:00","dailyNote":"今天入围名单被掘金的一波 TRAE 投稿潮占满了——16 条掘金里有 6 条是同一个活动下的推广稿，格式统一到能一眼认出来：先摆一张「维度对比表」，再夹一段真实的踩坑，落点在「国内直连、基础版免费」。有真踩坑不代表不是软文，判据仍然是落点。真正值得先读的是 V2EX 那条烧掉 6B token 的 AGENTS.md 复盘，它把「AI 该怎么思考」和「这个项目是什么」拆成两份文件，边界划得比大多数模板文清楚。另外三条各有各的实在：Qoder 那条是同一个需求在三个 agent 上试、只有一个跑通；犀利豆继续拆 Claude Code 的内置工具；最后一条的作者根本不会写代码，反而写出了今天最通用的一份防幻觉手法。","items":[{"id":"4acbe4e125814453","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1232201#reply53","titleOriginal":"烧了 6B+ token,分享下我实践出来最好的 AGENTS.md","titleZh":"烧掉 6B token 之后：我把 AGENTS.md 拆成了全局和项目两份","summaryZh":"作者用 Claude Code 做一个自部署的家庭资产管理工具，三个月迭代 560+ commit、主代码 5 万行、烧掉 6B+ token。踩的坑很具体：Opus 4.7 会在对话中途突然切英文，4.8 常常任务做到一半就停，任务一旦超过 4 小时就会出现「上下文焦虑」。最后定下的方案是两份 AGENTS.md——全局的只写「AI 该怎么思考和工作」，项目级的约 222 行只写「这个项目是什么、该怎么改、怎么验证」，两者边界不许互相渗透。全局文件的全文贴在帖子里。","whyRead":"多数 AGENTS.md 模板文是凭感觉写的，这份是 560 个 commit 磨出来的，而且给出了「哪些约束该跨项目常驻、哪些只能跟着仓库走」的切分依据。","rating":5,"tools":["claude-code"],"topics":["agents-md"],"publishedAt":"2026-08-05T03:20:50.000Z","author":"","preScore":13},{"id":"70d32828bc4fc465","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7670078525112238086","titleOriginal":"用 Qoder 做掘金图片一键替换工具：从「你行不行」到真跑通了","titleZh":"用 Qoder 做掘金图片批量上传工具：同一个需求，OpenCode 和 Trae 都没做出来","summaryZh":"为了解决「Markdown 贴进掘金后图片全挂」，作者让 agent 写一个自动上传图片并替换链接的小工具。同样的需求先用 OpenCode 和 Trae 试过、都失败，换 Qoder 才跑通，前后折腾近 3 小时。坑一个不少：上传路由不存在、所有上传接口均失败、按提示重新登录弹出两个嵌套页面。转机是不再让 agent 猜接口，改成在掘金编辑器里手动传一张图、由程序捕获真实的上传 API。掘金版趟平之后，知乎的支持顺手就做出来了。","whyRead":"少见的横向对照：同一个需求在三个 agent 上跑，两个失败一个成功，而且失败点写得比成功过程还清楚。","rating":4,"tools":["qoder","opencode","trae"],"topics":[],"publishedAt":"2026-08-05T01:45:17.000Z","author":"9i编程","preScore":13},{"id":"7232248cc63793ac","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/03/claude-code-tools-enter-plan-mode/","titleOriginal":"Claude Code Tools 研究系列（二）—— EnterPlanMode：为什么空 schema 也是一种设计","titleZh":"拆 Claude Code 的 EnterPlanMode：空 schema 也是一种设计","summaryZh":"犀利豆拆 Claude Code 内置工具的第二篇。以「把 JWT 换成 session cookies」这个横跨中间件、前端存储层和数据库 schema 的需求作例子，先摆出没有 plan mode 时的失败路径：改到第 4 个文件才发现另外还有 3 个内部服务在用 JWT，回滚很痛。然后拆机制——进入 plan mode 后工具箱收窄到 Read/Glob/Grep/Agent/AskUserQuestion/ExitPlanMode，Edit/Write/NotebookEdit 被禁用，物理上无法边探索边偷偷改；产出是一份可引用、可修订的 plan 文件，而不是聊天里飘过的一段话。","whyRead":"讲清楚了 plan mode 为什么要在工具层物理禁掉写操作，而不是靠提示词让模型「先别动手」——这个区别决定了它拦不拦得住。","rating":4,"tools":["claude-code"],"topics":["plan-mode"],"publishedAt":"2026-08-03T10:00:00.000Z","author":"","preScore":9},{"id":"f4cb96eb0223cfa4","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7665220516446453769","titleOriginal":"我不会写代码，用 Claude Code 给自己搭了两个「AI 苦力」","titleZh":"不会写代码的人用 Claude Code 造了两个「AI 苦力」","summaryZh":"写网文的作者不会写代码，让 Claude Code 造了两个双击就能跑的 PowerShell 脚本：一个查资料做初筛，一个查前后章节矛盾。防幻觉的办法是在输出 JSON 里强塞一个 quotes 字段——模型说「这里有你要的设定」就必须把原话贴出来，贴不出来就知道它在编。踩的坑也都记了：Claude Code 凭记忆写第三方 API 地址是错的；发现坏字节就整篇按 GBK 解，会把好好的 UTF-8 文件解成乱码，最后改成按替换符比例判断；PowerShell 5.1 的 Start-Process 不给含空格的参数加引号，导致无头浏览器启动参数 ,"publishedAt":"2026-08-04T11:53:00.000Z","author":"","preScore":11},{"id":"29128d35ec1c1327","source":"ICDYCT我能你也行","kind":"blog","url":"https://zelikk.blogspot.com/2026/08/forkgram-mute-all-telegram-web-k.html","titleOriginal":"Forkgram Mute All 功能移植到 Telegram Web K版 部署到 Cloudflare Page by Hermes 对接 oc/deepseek-v4-flash-free","titleZh":"全程指挥 Agent 给 Telegram Web 加一个「整个文件夹静音」，附发给它的原话","summaryZh":"作者用 Hermes 接 deepseek-v4-flash-free，从头到尾没自己写代码：让 agent 把 tweb 仓库 clone 下来跑起来、自己开浏览器（作者 VNC 连上去登号）、参照 forkgram-tdesktop 某个分支的 diff 在 folder 右键菜单里加 Mute all、再自己开浏览器测。文章把发给 agent 的每一句自然语言原样贴了出来，这是最有参考价值的部分。末尾记了个不好猜的坑：部署到 Cloudflare Pages 后 tweb-test.pages.dev 会被以钓鱼为由拒绝服务，改用带哈希前缀的 Deployment URL 就能访问。","whyRead":"少见地把「我到底对 agent 说了什么」逐句公开，而不是只晒结果。","rating":4,"tools":["hermes"],"topics":[],"publishedAt":"2026-08-04T07:42:20.000Z","author":"","preScore":6},{"id":"36ad81124eb9c2c6","source":"Ruby China","kind":"forum","url":"https://ruby-china.org/topics/44637","titleOriginal":"Agent-Reach 实测：让 AI Agent 一键搜索全网，我踩了 3 个大坑","titleZh":"给 Agent 装全网搜索的 Agent-Reach 实测：三个坑和它们的代价","summaryZh":"团队在做行业研究 Agent，本来自己写爬虫维护不动，换成号称零 API Key 的 Agent-Reach。三个坑都带代价：小红书搜索超时（作者判断是没做指纹伪装），外面包三次重试加代理池后成功率 60% 到 85%，但「零成本」也就没了；各平台返回字段五花八门（Reddit 的 upvotes、Twitter 的 likes、B 站的 play/danmaku），得自己写一层统一适配；6 平台 5 关键词 30 并发直接吃 429 并被封 IP 两小时，限流到每秒 3 个请求后耗时从 30 秒涨到 3 分钟、稳定性 70% 到 98%。结论是它适合「搜一下最近大家在聊什么」，不适合高精度采集。","whyRead":"三个坑都写清了修好之后付出的代价，而不是只写「解决了」。","rating":4,"tools":["agent-reach"],"topics":[],"publishedAt":"2026-08-04T01:36:32.000Z","author":"","preScore":11},{"id":"54af5e5054140cd5","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7669696162707914806","titleOriginal":"给 Claude Code 和 Codex 装上“文档 + PPT“超能力：MCP 插件接入实战（附踩坑记录）","titleZh":"给 Claude Code 和 Codex 接文档/PPT 类 MCP：两个翻车方案和一条 venv 提速技巧","summaryZh":"Windows 11 + Node 22.14 + Python 3.13.9 + Claude Code 2.1.220 的完整接入记录。选型部分点名了一类坑：网上多数 PPT MCP（powerpoint-mcp、ppt-mcp）走 COM 自动化操控真实 PowerPoint，机器上没装 Office 或 WPS 就全部不可用，只有纯 python-pptx 生成的 下、0 字节和 100KB 分别死在哪一步，全拆开了。毙掉的主要是三类——掘金的横评农场文、TRAE Work / Qoder 的征文推广稿，以及转述官方博客和 changelog 的二手解析。","items":[{"id":"e0b24b4f3ffa45f2","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1231702","titleOriginal":"当 agent 说\"我做完了\" —— 四个从翻车里长出来的 Claude Code skill","titleZh":"当 agent 说「我做完了」：四个从翻车里长出来的 Claude Code skill","summaryZh":"作者手写代码率从 10% 降到 0%，代价是模型在长程开发里不断写出「看起来成功」的代码。四个 skill 都长自具体翻车：false-green 要求模型写完单测后用 monkeypatch 模拟故障、验证这条测试真的会红，防住「最后一行 return true 静默跳过所有前序检查」那类假绿；delegating-to-agents 给子代理模式补上「移交已知的红绿状态」和「报告先当主张、核实过才算证据」两条；另外两个处理多 worktree 并行时互相覆盖、以及同类需求批量收尾。","whyRead":"「假绿」的单测比失败的单测更糟——他的解法是让模型给自己写的每条单测做一次变异测试。","rating":5,"tools":["claude-code","superpowers"],"topics":["skills","subagent","worktree"],"publishedAt":"2026-08-03T04:11:57.000Z","author":"HikariLan","preScore":16},{"id":"3ef85f390b14dd98","source":"israynotarray","kind":"blog","url":"https://israynotarray.com/ai/20260730/5308472196/","titleOriginal":"Home 目錄一堆 .claude.json.tmp 檔案？可以刪嗎？（Claude Code 設定檔寫入解析）","titleZh":"Home 目录里那一排 .claude.json.tmp 是什么，能不能删","summaryZh":"作者清硬盘时一次翻出 35 个 .claude.json.tmp.\u003cPID\u003e.\u003c毫秒时间戳\u003e 残骸，20 个 0 字节、15 个有内容。它们来自 Claude Code 保存 ~/.claude.json 的原子写入：先写暂存档、把原文件权限套上去、再 rename 一次盖过去；中途被 Ctrl+C 或关终端打断就留下孤儿。0 字节说明内容还没落盘，80–120KB 说明只差最后那步 rename。Claude Code 的 cleanupPeriodDays 只清 ~/.claude/ 里的东西，够不到上一层的 Home 目录，所以它自己永远清不掉。","whyRead":"文件名里就写着是哪个进程、哪一毫秒留下的，而 0 字节和 100KB 分别对应死在原子写入的哪一步。","rating":5,"tools":["claude-code"],"topics":[],"publishedAt":"2026-07-30T10:00:00.000Z","author":"","preScore":9},{"id":"765d89b23d3b5840","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7667907789688094729","titleOriginal":"Trae CN 接入 MySQL MCP Server 踩坑记录：从 dotenv 缺失到 MCP SDK 版本冲突解决","titleZh":"Trae CN 接 MySQL MCP Server：dotenv 缺失，和 MCP SDK 的大版本不兼容","summaryZh":"Windows + uv 环境。先是 ModuleNotFoundError: No module named 'dotenv'，用 uvx --with python-dotenv 补上；接着报 AttributeError: 'Server' object has no attribute 'list_resources'，查出装的 mcp 是 2.0.0，而 mysql-mcp-server v0.4.2 还在用 1.x 的 @app.list_resources() 装饰器。解法是卸载、uv cache clean、重装时加 --with \"mcp\u003c2.0.0\"，并把这两个 --with 直接写进 Trae 的 mcp.json，免得 Trae 每次启动重新解析依赖又把版本顶回去。","whyRead":"报错 'Server' object has no attribute 'list_resources' 的真正原因是 SDK 升到了 2.0，文中给了锁版本的完整 mcp.json。","rating":4,"tools":["trae"],"topics":["mcp"],"publishedAt":"2026-07-30T03:05:43.000Z","author":"若无_","preScore":13},{"id":"62eab8d7d55cb300","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7666483008577585187","titleOriginal":"别再「凭感觉」写代码了：我用 Qoder 花一天时间，从 0 到 1 真正掌握了 Vibe Coding（附完整踩坑实录）","titleZh":"用 Qoder 花一天走完 Vibe Coding：信任阶梯，和把歧义消灭在改文字阶段","summaryZh":"载体是一个带 30 个单测的 Python todo-app。核心是「信任阶梯」四级——补全 / 行间 / Agent / 委派，每一级的信任凭证必须是可验证的证据（测试变绿、Diff），不是模型说一句「已完成」。委派前先让 AI 出规格文档：他要的「旧数据缺字段静默按 normal 处理」被 AI 理解成了加载时报警告，在 Spec 里改一句话就纠正了，等写成代码再改要跨好几个文件返工。另记了两个 Qoder 的坑：Agent/Experts 模式在建任务时锁定、中途不能切，编辑历史消息会触发工作区文件回滚。","whyRead":"他把两行的小改动丢给 Agent，等它分析完项目结构反而比自己手写慢三倍——信任阶梯不只要会往上爬。","rating":4,"tools":["qoder"],"topics":["vibe-coding","spec-driven","context-engineering"],"publishedAt":"2026-07-26T14:26:24.000Z","author":"用户3789982212128","preScore":17},{"id":"b9ad79dd7c7410dc","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/rossiXYZ/p/22084795","titleOriginal":"【Agentic RL / 强化学习 / OPD】OpenClaw-RL 源码阅读笔记 --- (15)--- Combine模式 - 罗西的思考","titleZh":"OpenClaw-RL 源码笔记（15）：RL 奖励和 OPD 教师信号怎么合进同一次 PPO 更新","summaryZh":"openclaw-combine 模式的源码拆解。架构上是继承而非重写：Combine server 直接继承 OPD server，hint 提取、teacher log-probs、top-K 蒸馏原样复用，只重写了样本提交的两个方法。关键选择是混 advantage 而不是混 loss，作者给的理由是 PPO 的 clip 作用在概率比 r_t 上、不是作用在 A 上。再往下是三路分发：只有 hint、只有 eval 分数、两者都有、两者都无，各自构造什么样本、产生什么方向的梯度，以及 w_rl / w_opd 该怎么调。","whyRead":"两种训练信号不是混 loss 而是混 advantage——作者解释了为什么 PPO 的 clip 语义决定了只能这么选。","rating":4,"tools":["openclaw"],"topics":[],"publishedAt":"2026-08-03T12:49:00.000Z","author":"","preScore":11}],"reviewed":36,"dropped":31,"stats":{"sources":218,"fetched":471,"shortlisted":36,"rejected":435,"thin":179,"enriched":102,"enrichAttempted":216,"failedSources":6},"errors":[{"source":"小众软件论坛搜索","error":"部分查询失败（15/30）"},{"source":"掘金搜索","error":"部分查询失败（1/30）"},{"source":"陶叔 taoshu.in","error":"fetch failed"},{"source":"犀利豆的博客","error":"The operation was aborted due to timeout"},{"source":"范叶亮的博客","error":"HTTP 503"},{"source":"SkyWT","error":"HTTP 503"},{"source":"樵夫的小站","error":"HTTP 503"},{"source":"东方星痕","error":"HTTP 503"}]},{"date":"2026-08-03","generatedAt":"2026-08-03T06:20:00.000Z","dailyNote":"今天入围 19 条，收得下的只有 2 条，因为名单被两种「连载」灌满了：SegmentFault 上一套《OpenCode 源码详解》系列教程一天占了 5 席，自称「内容核实自 opencode.ai/docs 和 DeepWiki」——那不是读源码，是转述文档；iT 邦幫忙的铁人赛 Day1/Day2/Day3 又是一批入门介绍。剩下的大头是产品自荐：Octo、多 agent 编排平台、上下文压缩插件，都写得不难看，但落点都在「让你去用它」。留下的两篇正好是反面：一篇把 Claude Code 的 session 到底存在哪两类文件里扒开了讲，一篇为了让 Mac 在 agent 干活时别睡觉写了心跳加看门狗。先读 Mac 那篇，它最像这个栏目该有的样子——问题很小，解法很实在，跑了一个多月。","items":[{"id":"6a78af357422ee00","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1231529#reply6","titleOriginal":"写了两个脚本， Claude Code 干活时 Mac 不睡觉（合盖也行），干完自动恢复睡眠","titleZh":"写了两个脚本：Claude Code 干活时 Mac 不睡觉，干完自动恢复睡眠","summaryZh":"作者跑长任务时离开电脑，回来发现 Mac 睡着了、任务卡在半截；直接开 caffeinate 又会在任务做完后继续耗电，还不能合盖。于是用两个脚本解决：心跳挂在 Claude Code 的 hooks 上，提交 prompt 和每次工具调用后 touch 一个会话状态文件，回合结束删掉，多开窗口互不干扰；看门狗做成 LaunchAgent 常驻，每 20 秒查一次，有活跃会话且 CPU 不过热就 pmset disablesleep 1，否则翻回 0。状态文件 30 分钟不刷新按孤儿清掉，所以 Claude 崩了或终端被关也不会把机器永远钉住。已经跑了一个多月。","whyRead":"不是「装个 Amphetamine」这种答案——他把「机器该不该醒着」绑到了 agent 的真实回合状态上，连崩溃和过热的退路都留了。","rating":4,"tools":["claude-code"],"topics":["hooks"],"publishedAt":"2026-08-02T05:43:40.000Z","author":"","preScore":6},{"id":"8ff2bd6a68cce466","source":"TonyBai","kind":"blog","url":"https://tonybai.com/2026/08/02/ccsa-claude-code-session-alias-tool/","titleOriginal":"ccsa：给 Claude Code 的 session 起个人类可记的名字，一键 resume","titleZh":"ccsa：给 Claude Code 的 session 起个人类可记的名字，一键 resume","summaryZh":"多线并行时每条线各开一个 session，隔天回来只剩一串 UUID 认不出谁是谁。作者顺着这个痛点把 Claude Code 的 session 机制扒了一遍：活跃 session 的注册表在 ~/.claude/sessions/\u003cpid\u003e.json，转录按项目存在 ~/.claude/projects/\u003c编码路径\u003e/\u003csessionId\u003e.jsonl；原生的 --name 只能启动时设、--resume 的 picker 只列当前目录、--continue 只接最近一条，缺的正是「事后、跨项目、语义化」这一格。他写的 ccsa 就补这一格：维护别名到 UUID 的映射，恢复时解析回 UUID 再交给 claude；set 不带 --id 会先扫活跃 session、没有再回落到历史转录。","whyRead":"工具装不装两说，前半篇把 Claude Code 的 session 到底存成哪两类文件、三个原生参数各卡在哪讲清楚了——这部分不装也能拿走。","rating":4,"tools":["claude-code"],"topics":[],"publishedAt":"2026-08-01T23:15:00.000Z","author":"","preScore":9}],"reviewed":19,"dropped":17,"stats":{"sources":213,"fetched":271,"shortlisted":19,"rejected":252,"thin":66,"enriched":36,"enrichAttempted":41,"failedSources":8},"errors":[]},{"date":"2026-08-02","generatedAt":"2026-08-01T22:17:39.880380Z","dailyNote":"今天跑了三轮。上半是清晨自动跑的两篇，中间我把昨夜攒下的候选补评了一轮，六点这一轮只抓到 89 条新内容、规则入围 1 条，读完没收——那条是掘金上一篇「AI Agent 记忆系统」的体系化综述，正文被 Cloudflare 挡住只剩目录，从「认知科学到工程实现」的章节结构看更像讲义而不是谁真动过手，宁可空手。SegmentFault 这个新接的源第一次出货，量不小但杂：27 条候选里有 MonkeyCode 的两篇广告、阿里云数据库软文、「效率飙升 10 倍」这类标题党、下载教程和课程推广，最后只留了 7 篇。另有一篇拆微软效率报告的写得不错，但作者自己没动手，按「得真的动过手」这条线还是拿掉了。最值得先读的仍是「装了 Hermes Agent 三个月」——凌晨一点半开着三个窗口来回切，问题解决了才想起来「我只是想让 AI 帮我写个周报而已」。","items":[{"id":"8e5520d70124b295","source":"SegmentFault 搜索","kind":"search","url":"https://segmentfault.com/a/1190000048025422","titleOriginal":"两天真实体验，Claude Code+ MiniMax-M3 比 CC+ DeepSeek编程强太多","titleZh":"账号被封之后：Claude Code 配 MiniMax-M3 比配 DeepSeek 强太多","summaryZh":"Claude Code 账号彻底被封后作者一路找替代：第一选择 CC + DeepSeek，编程能跑但低级问题不断，编译错误和 yaml 反复出错；中间试过 GitHub Copilot CLI 和 Cursor CLI，都能用但价格比 CC 贵一截，性价比不够；转折点是顺手试了 MiniMax，编程能力有惊喜。两天真实体验的对比。","whyRead":"被封号之后的替代方案实测，三条路都走过一遍才给的结论。","rating":5,"tools":["claude-code","copilot-cli","cursor"],"topics":[],"publishedAt":"2026-07-14T07:31:31.000Z","preScore":12},{"id":"e013d1978427a254","source":"SegmentFault 搜索","kind":"search","url":"https://segmentfault.com/a/1190000048068273","titleOriginal":"装了Hermes Agent三个月，我终于搞明白前端该怎么选了","titleZh":"装了 Hermes Agent 三个月，我终于搞明白前端该怎么选了","summaryZh":"凌晨一点半，作者盯着三个同时打开的窗口发呆：左边 Open WebUI 刚生成一张 Mermaid 流程图，中间 Hermes Web 管理端在排查 Skill 调用报错，右边终端滚着 "]},{"id":"be9dbc2659827468","source":"sjdhome blog","kind":"blog","url":"https://sjdhome.com/posts/tmux-agent-watch/","titleOriginal":"借鉴 Herdr，让 Claude 从头到尾写出一个 tmux AI Agent 监控器","titleZh":"让 Claude 从头到尾写出一个 tmux 的 AI Agent 监控器","summaryZh":"作者 tmux 里常年开着好几个 agent：一个 session 在改 bug，一个在整理笔记，还有一个跑长任务。人可以去干别的，但得隔一会儿把窗口挨个切一遍，看谁跑完了、谁卡在权限确认框上。他先试过 Stop hook 发系统通知、让 agent 往 IRC 发消息，都不解决本质问题——他要的是当前状况，而通知只反映某个时间点的状况。","whyRead":"并行开多个 agent 之后必然撞上的问题，以及一个想清楚了才动手的解法。","rating":5,"tools":["claude-code"],"publishedAt":"2026-07-23T16:00:00.000Z","preScore":7,"topics":[]},{"id":"f1911aa1dbc80392","source":"毛英龙的数字花园","kind":"blog","url":"https://blog.rnm.gv.uy/2026/07/20/ai-agent-sunk-cost-trap/","titleOriginal":"我的 AI 助手疯了，30 分钟停不下来","titleZh":"我的 AI 助手疯了，30 分钟停不下来","summaryZh":"起因很小：有道云笔记 CLI 有个 bug 会把报错堆栈写进笔记。助手 2 分钟定位根因、5 分钟加了防御层，问题本已解决。然后它说「我想从根本上解决这个 CLI 的不稳定性」——提议用纯 Python 写 MCP SSE 客户端直连私有协议，20 分钟写了 12K 代码，POST 超时、换 URL 404、换 header 还是超时。正常人此时该换路，它的选择是再加三个方案：抓包分析、逆向 Web API、反编译客户端。","whyRead":"agent 陷进沉没成本时长什么样，这篇写得比任何「局限性」总结都具体。","rating":5,"tools":["claude-code"],"publishedAt":"2026-07-20T15:00:00.000Z","preScore":8,"topics":["mcp"]},{"id":"dd0baac597d40845","source":"创见思考","kind":"blog","url":"https://www.fengcan.net/ai-memory-sole-writer/","titleOriginal":"给 AI 管记忆的第二课：一个人怎么当三家智能体的唯一写入者","titleZh":"给 AI 管记忆的第二课：一个人怎么当三家智能体的唯一写入者","summaryZh":"上一篇的铁律是「记忆只能有一本账」，但退场的那几家并没有死，仍在干活、仍会发现值得记住的事实。作者日常用三个编程智能体：Claude Code 主力干重活写记忆，Codex 跑独立小任务，Kimi Code 是新买的。三家各有各的指令文件格式和技能加载路径。这一轮解决的是一套核心指令怎么同步、技能包怎么不走样、新发现怎么回流到唯一那本账——落地方案是一个 canonical 目录放 Dropbox 跨设备同步，生成四份产物。","whyRead":"多 agent 并用的记忆管理，作者说「坑的形状比结论本身更值钱」，确实如此。","rating":5,"tools":["claude-code","codex","kimi-code"],"publishedAt":"2026-07-19T14:09:09.000Z","preScore":6,"topics":["skills","claude-md"]},{"id":"2e7d3b4c47a68b17","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1228000","titleOriginal":"做 DeepSeek Agent 近一个月，同步下 Orca 的进展","titleZh":"做 DeepSeek 原生 Agent 一个月：880 次提交，Rust 从 3.9 万行涨到 18 万行","summaryZh":"作者同步 Orca 的一个月进展：代码全部由 codex、claude code 和 Orca 自己写，他只做两件事——提需求和定质量门禁。门禁包括 2300 多个测试、20 个契约测试套件把 agent loop / 审批 / provider / shell 会话 / 子代理 / workflow 的边界锁死，以及需求必须先落 spec 再落 plan 才准动手，目前攒了 25 篇设计和 60 篇实施计划。","whyRead":"「让 agent 写全部代码」的规模化答案不是提示词技巧，是质量门禁。这篇给了具体数字。","rating":5,"tools":["claude-code","codex"],"publishedAt":"2026-07-17T06:10:53.000Z","author":"echoVic","preScore":8,"topics":["spec-driven"]},{"id":"abb00c7d558574c6","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/07/15/obsidian-as-ide/","titleOriginal":"使用 Obsidian 作为 AI 时代的 IDE：Karpathy「Wiki as Codebase」的落地实践——Claudian、CLAUDE.md 与 Vault Lint","titleZh":"把 Obsidian 当 AI 时代的 IDE：Karpathy「Wiki as Codebase」的落地实践","summaryZh":"作者把 Karpathy 那句「Obsidian is the IDE, LLM is the programmer, wiki is the codebase」真的落了地：Obsidian 加 Claudian 插件，vault 根目录放 CLAUDE.md schema，把设计决策、AI 对话历史、DB schema、跨服务上下文都沉淀成可以 Lint 的知识网络。文末给了一次跨度两周、15 个决策、13 个 commit 的重构实战，外加两条能直接扔给 Claudian 的 Vault Lint prompt。","whyRead":"「上下文该放哪」这个问题，这是我见过最完整的一套答案，而且带实战数据。","rating":5,"tools":["claude-code","claudian"],"publishedAt":"2026-07-15T21:23:41.000Z","preScore":12,"topics":["claude-md"]},{"id":"0c36841c8d82d17f","source":"宝玉xp","kind":"blog","url":"https://baoyu.io/blog/2026-07-12/caveman-token-saving-test","titleOriginal":"“母病速归”式 AI：号称省 65% Token，实测只有 8.5%","titleZh":"「母病速归」式 AI：号称省 65% token，实测只有 8.5%","summaryZh":"宝玉把那种要求 AI 尽量少说话的 Skill 叫「电报体 Skill」，类比小时候学写电报文——母亲生病让哥哥回家，最省能压到「母病速归」四个字，再少就传不清了。他实测了这类号称大幅省 token 的 Skill，宣称 65%，实际只有 8.5%。","whyRead":"一个流传很广的省 token 说法被拿去实测，结果差了近八倍。","rating":5,"tools":["claude-code"],"publishedAt":"2026-07-12T00:00:00.000Z","preScore":6,"topics":["skills"]},{"id":"de81c7d074cb514a","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/ai-go-hub/p/22135559","titleOriginal":"从 PHP 到 AI + Golang，程序员自救转型手记（四十六）：再次优化基类 - 妙码生花","titleZh":"从 PHP 到 AI + Golang 转型手记（四十六）：再次优化基类","summaryZh":"一个 PHP 全栈工程师用 claude code、codex、deepseek、豆包等工具从零学 Go、做 ai-go-admin 开源项目的连载，已经写到第 46 期。 9914059371bc7","source":"陈少文","kind":"blog","url":"https://www.chenshaowen.com/blog/openspec-spec-driven-development-for-ai.html","titleOriginal":"OpenSpec：给 AI 编程加一层轻量规格契约","titleZh":"OpenSpec：给 AI 编程加一层轻量规格契约","summaryZh":"OpenSpec 不教 AI 新的编程技巧，而是在人和 AI 之间加一层「同意层」——写代码之前先把要做什么写成纸面约定。设计上分两部分：Specs 是描述系统当前行为的 Markdown，按能力组织在 openspec/specs/ 下作为唯一事实来源；Changes 是每项工作一个文件夹，内含 proposal、design、tasks 和 delta specs 四个产物。","whyRead":"规格驱动开发喊了很久，这是一个结构讲得足够具体、能照着搭的实现。","rating":4,"tools":["claude-code","cursor","gemini-cli"],"publishedAt":"2026-07-31T00:00:00.000Z","preScore":7,"topics":["spec-driven"]},{"id":"7c60d31a70d1bcd8","source":"elmagnifico","kind":"blog","url":"https://elmagnifico.tech/2026/07/30/Agent-IDE-Compare/","titleOriginal":"Cursor、Claude、Codex深度体验、对比","titleZh":"Cursor、Claude、Codex 深度体验与对比","summaryZh":"作者把三个工具都用了一遍做横向对比。Cursor 用得最多，理解和使用门槛以程序员为基准，但默认套餐上下文只有 260K 而别人都 1M+，大需求容易跑过，好在内置了压缩上下文和长期记忆会自动衔接。作者的判断是 Cursor 没有 Claude 和 Codex 激进，更偏向为已有工程和程序员协作服务，对现有工作流改动小，适合循序渐进切到 agent 工作流；它想主推的 Agent 模式反而对既有工程不如 IDE 模式好用。","whyRead":"三家横评里少见的、带具体参数和使用倾向判断的一篇。","rating":4,"tools":["cursor","claude-code","codex"],"publishedAt":"2026-07-29T16:00:00.000Z","preScore":12,"topics":[]},{"id":"9b49a7456614794e","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1230837","titleOriginal":"深入 Cursor 架构：一个 AI 编辑器是如何被「流式」重塑的","titleZh":"深入 Cursor 架构：一个 AI 编辑器是怎么被「流式」重塑的","summaryZh":"开篇就声明这不是怎么用 Cursor 的教程，而是纯架构视角的复盘。作者先做第一性原理推导，认为 AI 原生编辑器被流式、低延迟、上下文三个约束框死，再看 Cursor 用 Agent 状态机和多进程隔离两个核心机制怎么回应，最后落到一个飞轮和一处代价。","whyRead":"想知道 AI 应用的难点到底在哪，比读功能对比有用得多。","rating":4,"tools":["cursor"],"publishedAt":"2026-07-29T13:45:58.000Z","author":"xdlkc","preScore":10,"topics":[]},{"id":"4b5ce4655dab1d79","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/07/28/claude-code-tools-ask-user-question/","titleOriginal":"Claude Code Tools 研究系列（一）—— AskUserQuestion：把「AI 提问」变成结构化交互原语","titleZh":"Claude Code Tools 研究系列（一）：AskUserQuestion 把提问变成结构化交互原语","summaryZh":"作者之前用 Java 写过一个乞丐版 Claude Code，觉得它的 tools 设计得非常精巧，于是打算逐个研究。开篇聊 AskUserQuestion——它不是让模型输出一段问题字符串等回复，而是把问题渲染成交互式选择面板。解决的核心问题是人机对齐效率：用户从打字回答变成点选项，响应时间大幅缩短；模型拿到的是明确枚举值，不用再解析自然语言，歧义也就收敛了。","whyRead":"从「自己实现过一遍」的视角拆 Claude Code 的工具设计，角度很少见。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-28T22:22:00.000Z","preScore":9,"topics":[]},{"id":"e6944ebdd9631613","source":"israynotarray","kind":"blog","url":"https://israynotarray.com/ai/20260727/3871780834/","titleOriginal":"Claude Code 中輸入 /model 找不到你要的模型？試試這小技巧吧！","titleZh":"Claude Code 里 /model 找不到你要的模型？这有个小技巧","summaryZh":"Claude Code 的 /model 指令列表通常只给 Default、Opus（1M context）、Fable、Sonnet、Opus 4.8 这几项，出了新模型或者想用列表外的模型时就选不到。文章给了一个绕过列表直接指定模型的办法。","whyRead":"两分钟能读完的小技巧，但卡过这一下的人不少。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-27T02:18:28.000Z","preScore":6,"topics":[]},{"id":"511aede7e1cd79c7","source":"又耳笔记","kind":"blog","url":"https://youerning.top/post/opencode/opencode-sharing/","titleOriginal":"AI 编程助手的'不务正业' — OpenCode 免费额度与自定义 Agent 实战","titleZh":"OpenCode 的两个「不务正业」用法：免费额度和自定义 Agent","summaryZh":"作者装 OpenCode 本来是为了写代码，用了几个月发现最惊喜的反而是两个不务正业的用法。一是免费额度慷慨到不登录也有免费模型，200K 上下文对服务器运维绰绰有余；二是它的 Agent 机制让他自定义了一个只会搜索的 agent，某种程度上能代替搜索引擎。文中也给了接自己 API Key 和订阅 Go 计划的选择。","whyRead":"把编程 agent 拿去干运维和搜索，是那种用出来才知道的路子。","rating":4,"tools":["opencode"],"publishedAt":"2026-07-26T11:00:26.000Z","preScore":7,"topics":[]},{"id":"418da908f6aea21a","source":"ISLAND","kind":"blog","url":"https://youngxhui.top/2026/07/opencodex-third-party-models/","titleOriginal":"opencodex：让 Codex 和 Claude Code 跑在任意 LLM 上","titleZh":"opencodex：让 Codex 和 Claude Code 跑在任意 LLM 上","summaryZh":"opencodex 是个本地代理，把 Codex 的 Responses API 翻译成任意 LLM provider 的协议。装完三行命令就能让 Codex CLI、Codex App、SDK 改道用 Claude、Gemini、DeepSeek、Grok、GLM、Qwen 甚至本地 Ollama，Claude Code 那边同样可以换任意模型，不用等官方支持。streaming、tool 调用、reasoning token、图片生成都双向工作，默认透传原有登录，随时可以再加别的模型。","whyRead":"被官方模型绑定这件事，有人写了个代理层直接绕过去了。","rating":4,"tools":["codex","claude-code"],"publishedAt":"2026-07-22T00:00:00.000Z","preScore":8,"topics":[]},{"id":"2269b337541a08d2","source":"TonyBai","kind":"blog","url":"https://tonybai.com/2026/07/20/introducing-cc-session-migrate/","titleOriginal":"我开源了 cc-session-migrate ：让 Claude Code 会话在多台机器之间自由迁移","titleZh":"我开源了 cc-session-migrate：让 Claude Code 会话在多台机器之间搬家","summaryZh":"Claude Code 的会话存在本地 ~/.claude/，换台机器 claude --resume 就是 No sessions found，上午在 MacBook 上理清的架构下午到服务器就断了。作者用 Go 写了 csm，做三件事：跨机器拉取会话并能无缝续接、把多个开发节点当集群管理、自动备份到 S3。直接 scp 整个目录会覆盖别的机器上的会话，这是它要解决的。","whyRead":"多机开发的人几乎都撞过这堵墙，而这是少见的把它真正做成工具的。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-19T21:00:00.000Z","preScore":12,"topics":[]},{"id":"d16b0b080681fc98","source":"明立非(Mingnify)的博客","kind":"blog","url":"https://mingnify.com/zh/blog/p/chat-work-codex-differences-use-cases/","titleOriginal":"Chat、Work、Codex 的区别和使用场景","titleZh":"Chat、Work、Codex 的区别和使用场景","summaryZh":"ChatGPT 和 Codex 合并后界面里出现了 Chat、Work、Codex 三种模式。作者给了一个最小定位：Chat 是对话和思考入口，适合提问讨论探索；Work 是知识工作和非编程任务的 Agent，适合整理资料、处理文档、产出方案；Codex 是项目和本地环境里的 Agent，围绕文件、代码、终端和验证推进任务。按工作方式可分成对话式 AI 和 AI Agent 两类，这个划分也顺带解释了为什么会有 Work 模式、额度怎么算、记录为什么有时同步有时不同步。","whyRead":"三个模式到底该用哪个，官方没讲清楚的部分这篇讲清楚了。","rating":4,"tools":["codex","chatgpt-desktop"],"publishedAt":"2026-07-19T16:00:00.000Z","preScore":6,"topics":[]},{"id":"f7fcbbf6411dd598","source":"XINDOO的博客","kind":"blog","url":"https://zxs.io/article/2201","titleOriginal":"浅谈 Loop Engineering 与组织运作的相似性","titleZh":"浅谈 Loop Engineering 与组织运作的相似性","summaryZh":"作者的一句话结论是：所谓 Loop Engineering，其实是把组织管理的老规律用 AI 时代的新语言重新说了一遍。他先梳理造词速度——Prompt Engineering 的思维链、少样本刚练熟，Context Engineering 就来了，重点从怎么写提示词变成怎么往上下文里塞对的东西；Context 还没玩明白 Harness 又成了高频词；现在又冒出 Loop Engineering。而且这次是几路一线同时在提：Claude Code 负责人 Boris Cherny 说自己已经不写 Prompt 而是写 Loop，Karpathy 反复强调必须把自己从 Loop 的执行过程里移出去。","whyRead":"对着满天飞的新词，有人把它翻译回了你本来就懂的东西。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-19T13:26:48.000Z","preScore":6,"topics":["context-engineering","loop-engineering"]},{"id":"17f25f2f8d28bf37","source":"TonyBai","kind":"blog","url":"https://tonybai.com/2026/07/19/agentic-engineering-thorsten-ball-amp-interview/","titleOriginal":"“皇帝的新衣”一年后：对话Thorsten Ball谈Agentic编程","titleZh":"《皇帝的新衣》一年后：对话 Thorsten Ball 谈 Agentic 编程","summaryZh":"一年前 Thorsten Ball 那篇《皇帝没穿新衣》提出一个反直觉的发现：不需要向量检索、不需要代码索引、不需要复杂的 Apply 模型，给大模型读文件、列文件、搜索文件三个工具，它就能在代码库里如鱼得水。这篇是一年后的回访，作者已从 Sourcegraph 转去做 Amp。","whyRead":"Agentic 编程叙事的起点之一，作者本人回头看当初的判断站不站得住。","rating":4,"tools":["amp","claude-code","cursor","zed"],"publishedAt":"2026-07-18T23:00:00.000Z","preScore":7,"topics":[]},{"id":"18dbe6ba6efcf93c","source":"TonyBai","kind":"blog","url":"https://tonybai.com/2026/07/18/introducing-tabqueue/","titleOriginal":"告别标签页焦虑：我让 AI 帮我做了个浏览器插件 TabQueue","titleZh":"告别标签页焦虑：我让 AI 帮我做了个浏览器插件 TabQueue","summaryZh":"作者描述自己的日常：早上刷 Hacker News 开五个标签，中午逛 GitHub 再开几个，晚上浏览器里躺着八十多个标签，每一篇都「回头要看」所以不敢关。于是做了 TabQueue，把标签页变成有序的阅读队列，支持一键收纳、按域名分组、逐个消化、自动归档。","whyRead":"一个真实的个人痒点，从难受到做出东西的完整过程。","rating":4,"tools":[],"publishedAt":"2026-07-17T23:00:00.000Z","preScore":8,"topics":["vibe-coding"]},{"id":"4e1132033b2efa45","source":"RYANUO的博客","kind":"blog","url":"https://ryanuo.cc/posts/grill-me-vs-superpowers","titleOriginal":"grill-me vs Superpowers：两种 Agent Skills 路线的全面对比","titleZh":"grill-me vs Superpowers：两条 Agent Skills 路线的全面对比","summaryZh":"Agent Skills 生态里绕不开的两个名字：Matt Pocock 的 grill-me 和 obra 的 Superpowers。很多人当成二选一，作者认为更准确的说法是它们在「动手前对齐」这件事上重叠，但产品形态、强制程度、覆盖生命周期差别很大。grill-me 是一组审讯式规划 skill，核心问题是「你真的想清楚了吗」，输出的是共享理解、默认可以不落盘；Superpowers 是一整套软件工程方法论加可组合 skills，核心问题是「如何按纪律从想法走到可合并分支」，输出的是设计文档到计划的完整链条。","whyRead":"两套 Skills 到底该选哪个，这篇把定位、机制、工作流都摊开了。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-17T18:00:00.000Z","preScore":13,"topics":["skills"]},{"id":"60c39618403a8a5f","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1228009","titleOriginal":"高强度使用各种 AI Agent 开发了好几个小玩具后发现了一个问题：各家的 Agent 在项目中到处拉一坨坨名叫 Skill、Rule、MCP 的屎","titleZh":"各家 Agent 在项目里到处拉 Skill、Rule、MCP，我受不了了","summaryZh":"因为各家 Agent 都有额度和时间限制，同一个项目往往要跨多个 Agent 开发。于是同一个 Skill 要在 .github 放一份、.claude 放一份、各家自己约定的根目录和入口文件再放几份，改一处要同步好几个地方。作者进一步指出问题的根子：有些资源本来是外部资源，却被各家按私有结构复制进了项目。","whyRead":"多 Agent 并用的人都在忍这件事，这篇把它说清楚了。","rating":4,"tools":[],"publishedAt":"2026-07-17T06:29:06.000Z","author":"bearbest","preScore":8,"topics":["mcp","skills","agents-md","claude-md"]},{"id":"0a16a0110c9063ba","source":"Android Performance","kind":"blog","url":"https://androidperformance.com/2026/07/17/SmartPerfetto-Six-Week-Update/","titleOriginal":"SmartPerfetto 2026.06.04-07.17 六周更新复盘：从 v1.0.28 到 v1.1.1","titleZh":"SmartPerfetto 六周更新复盘：150 个提交、13 个版本","summaryZh":"作者复盘自己的项目从 v1.0.28 到 v1.1.1 这六周，合入约 150 个提交、发布 13 个版本。上一篇的主线是把四条 Agent 运行时都跑通，这六周的主线是把四条运行时收敛到同一套契约之下，同时在分析体验、场景知识、公共生态三个方向扩展。文中用仓库内约定的统计命令给出了可量化的前后对比指标。","whyRead":"多 agent 运行时怎么收敛到一套契约，这是带六周真实提交数据的复盘。","rating":4,"tools":["claude-code"],"publishedAt":"2026-07-16T16:00:00.000Z","preScore":7,"topics":["skills"]},{"id":"9c4bdfe597204a8d","source":"轶哥博客","kind":"blog","url":"https://www.wyr.me/post/764","titleOriginal":"AI写标书踩过的那些坑","titleZh":"AI 写标书踩过的那些坑","summaryZh":"作者和做投标的用户一起梳理 AI 招投标流程，总结出六个坑：把「生成完成」当成「标书完成」、盯标只做关键词推送、让一个 Agent 从读标做到查标、做了大纲没做响应矩阵、把标书检查做成全文润色、每个项目都从头教一遍。一位电力行业投标负责人说他们的招标文件动不动上百页，过去光梳理要求就要几天；改成先让 Agent 把每条需要响应的内容列出来再进入写作和报价后，容易遗漏的资质响应明显少了。作者的建议是从零开始的话先做标书检查。","whyRead":"非编程的 Work Agent 落地案例，六个坑每个都长着真实业务的形状。","rating":4,"tools":[],"publishedAt":"2026-07-16T14:19:29.000Z","preScore":7,"topics":["agents-md"]},{"id":"02f2b826933e487c","source":"zhheo","kind":"blog","url":"https://blog.zhheo.com/p/94w0byur.html","titleOriginal":"screenpipe：开源本地的 AI 记忆引擎，让电脑更懂你","titleZh":"screenpipe：本地跑的开源 AI 记忆引擎","summaryZh":"作者在 B 站刷到能自动总结每天做了什么的日报助手，觉得需求成立——每天在无数标签页、聊天窗口、文档之间切换，下班时经常想不起来干了什么。但这类工具基本都是云服务，屏幕录像、音频、操作记录全传到别人服务器。于是去 GitHub 翻开源本地替代方案，找到了 YC 支持的 screenpipe。","whyRead":"「让电脑记得我今天干了什么」这件事，隐私优先的那条路走得通吗。","rating":4,"tools":["cursor","cline","claude-desktop"],"publishedAt":"2026-07-15T16:00:00.000Z","preScore":6,"topics":["mcp"]},{"id":"de2633c8121be343","source":"创见思考","ki /* 纯逻辑：过滤、统计、状态存取。不碰 DOM，好写测试。
 * 构建时会和 ui.js 一起内联进页面；test/tinker-logic.test.mjs 直接读这个文件求值来测。 */

const STORE_KEY = 'tinker.state.v1';

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    return { read: raw.read || {}, starred: raw.starred || {} };
  } catch {
    return { read: {}, starred: {} };
  }
}

function saveState(state) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch {
    // 隐私模式下 localStorage 会抛。读写失败只损失「已读」记录，页面本身照常可用。
  }
}

/** 把日文件摊平成一维条目流，附上所属日期。 */
function flatten(days) {
  const out = [];
  for (const day of days) {
    for (const item of day.items || []) out.push({ ...item, date: day.date });
  }
  return out;
}

/**
 * 统计某一维度（tools / topics）下每个标签有多少条目。
 * 工具和话题分开统计，因为它们在侧栏是两组独立的筛选器。
 */
function facetCounts(items, facet) {
  const counts = new Map();
  for (const item of items) {
    for (const id of item[facet] || []) counts.set(id, (counts.get(id) || 0) + 1);
  }
  return [...counts.entries()].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1));
}

function matchesQuery(item, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return [item.titleZh, item.titleOriginal, item.summaryZh, item.whyRead, item.source, item.author]
    .some((v) => v && String(v).toLowerCase().includes(q));
}

/**
 * @param {object} opts view: all|unread|starred, tool: 工具 id 或 null, date: 日期或 null
 */
function filterItems(items, opts, state) {
  const { view = 'all', tool = null, topic = null, query = '', date = null } = opts || {};
  return items.filter((item) => {
    if (date && item.date !== date) return false;
    if (tool && !(item.tools || []).includes(tool)) return false;
    if (topic && !(item.topics || []).includes(topic)) return false;
    if (view === 'unread' && state.read[item.id]) return false;
    if (view === 'starred' && !state.starred[item.id]) return false;
    return !query || matchesQuery(item, query);
  });
}

/** 源的健康度。连续失败 3 次以内算抖动，7 次以上要人工处理。 */
function sourceState(status) {
  const n = (status && status.consecutiveFailures) || 0;
  if (n === 0) return { s: 'ok', label: '正常' };
  if (n < 7) return { s: 'warn', label: `失败 ${n} 次` };
  return { s: 'bad', label: `连续失败 ${n} 次` };
}

function lastNDates(latest, n) {
  const out = [];
  const base = Date.parse(latest + 'T00:00:00Z');
  for (let i = n - 1; i >= 0; i -= 1) out.push(new Date(base - i * 86400000).toISOString().slice(0, 10));
  return out;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { flatten, facetCounts, filterItems, matchesQuery, sourceState, lastNDates };
}

  function hasOwn(object, key) {

    const options = {

      credentials: 'same-origin',
      headers: { accept: 'application/json' },
    };
    if (body !== undefined) {
      options.headers['content-type'] = 'application/json';

        if (!response.ok) throw new Error(payload.error || '云端同步失败');
        return payload;
      })

  }

  function mergePending(id, change) {
    const current = pendingChanges[id] || {};
    if (hasOwn(change, 'read')) current.read = change.read;
    if (hasOwn(change, 'starred')) current.starred = change.starred;
    pendingChanges[id] = current;
  }

  function queueRemoteChange(id, change) {
    mergePending(id, change);

    if (syncReady) flushPending();

      if (hasOwn(pendingChanges[localId], 'starred')) change.starred = pendingChanges[localId].starred;
      return change;

  const themeBtn = $('#theme');
  themeBtn.addEventListener('click', () => {
    const now = document.documentElement.getAttribute('data-theme');
    const dark = now ? now === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('tinker.theme', dark ? 'light' : 'dark'); } catch { /* 忽略 */ }
  });
  try {
    const saved = localStorage.getItem('tinker.theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch { /* 忽略 */ }

  /* ---------- 侧栏 ---------- */

  function renderRail() {
    const views = $('#views');
    views.textContent = '';
    const unread = allItems.filter((i) => !state.read[i.id]).length;
    const starred = allItems.filter((i) => state.starred[i.id]).length;
    for (const [key, label, count] of [
      ['all', '全部', allItems.length],
      ['unread', '未读', unread],
      ['starred', '收藏', starred],
    ]) {
      const b = el('button', 'view-btn');
      b.append(el('span', null, label), el('span', 'count', String(count)));
      b.setAttribute('aria-pressed', String(!ui.panel && ui.view === key));
      b.addEventListener('click', () => { ui.view = key; ui.panel = false; render(); });
      views.append(b);
    }
    const src = el('button', 'view-btn');
    src.append(el('span', null, '信源与健康度'), el('span', 'count', String(sources.length)));
    src.setAttribute('aria-pressed', String(ui.panel));
    src.addEventListener('click', () => { ui.panel = !ui.panel; render(); });
    views.append(src);

    // 工具和话题是两组独立筛选器，可以叠加（比如「Claude Code」+「MCP」）。
    for (const facet of ['tools', 'topics']) {
      const box = $(`#${facet}`);
      box.textContent = '';
      const key = facet === 'tools' ? 'tool' : 'topic';
      const rows = facetCounts(allItems, facet).slice(0, 20);
      if (!rows.length) {
        box.append(el('p', 'rail-empty', '本期没有'));
        continue;
      }
      for (const [id, count] of rows) {
        const b = el('button', 'chip');
        b.append(el('span', 'label', label(facet, id)), el('span', 'count', String(count)));
        b.setAttribute('aria-pressed', String(ui[key] === id));
        b.addEventListener('click', () => { ui[key] = ui[key] === id ? null : id; ui.panel = false; render(); });
        box.append(b);
      }
    }

    const cal = $('#calendar');
    cal.textContent = '';
    if (!days.length) return;
    const have = new Map(days.map((d) => [d.date, (d.items || []).length]));
    for (const date of lastNDates(days[0].date, 28)) {
      const b = el('button', 'cal-day', date.slice(8));
      const n = have.get(date);
      b.dataset.has = n ? 'yes' : 'no';
      b.title = n ? `${date}：${n} 篇` : `${date}：无`;
      b.setAttribute('aria-pressed', String(ui.date === date));
      b.setAttribute('aria-label', b.title);
      b.addEventListener('click', () => { ui.date = ui.date === date ? null : date; ui.panel = false; render(); });
      cal.append(b);
    }
  }

  /* ---------- 条目 ---------- */

  function meter(rating) {
    const m = el('span', 'meter');
    m.setAttribute('aria-label', `评分 ${rating} / 5`);
    for (let i = 1; i <= 5; i += 1) {
      const bar = el('i');
      if (i <= rating) bar.dataset.on = '1';
      m.append(bar);
    }
    return m;
  }

  function entryNode(item, rank) {
    const node = el('article', 'entry');
    node.dataset.read = String(Boolean(state.read[item.id]));
    if (item.rating >= 5) node.dataset.pick = 'true';

    const gutter = el('div', 'entry-gutter');
    gutter.append(el('span', 'entry-rank', String(rank).padStart(2, '0')), meter(item.rating || 0));
    node.append(gutter);

    const main = el('div');

    const h = el('h3', 'entry-title');
    if (item.rating >= 5) h.append(el('span', 'pick-flag', '今日精选'));
    const a = el('a', null, item.titleZh || item.titleOriginal);
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    // 点标题即视为已读：这是唯一一个「用户真的去看了」的可靠信号。
    a.addEventListener('click', () => { setItemState(item.id, 'read', true); render(); });
    h.append(a);
    main.append(h);

    if (item.whyRead) main.append(el('p', 'why', item.whyRead));
    if (item.summaryZh) main.append(el('p', 'summary', item.summaryZh));

    const meta = el('div', 'entry-meta');
    meta.append(el('span', null, item.source));
    if (item.author) { meta.append(el('span', 'sep', '·'), el('span', null, item.author)); }
    meta.append(el('span', 'sep', '·'), el('span', null, (item.publishedAt || item.date || '').slice(0, 10)));
    for (const t of item.tools || []) meta.append(el('span', 'tool-tag', label('tools', t)));
    for (const t of item.topics || []) meta.append(el('span', 'topic-tag', label('topics', t)));
    if (item.thin) {
      const f = el('span', 'thin-flag', '⚠ 仅标题');
      f.title = '抓不到正文，摘要只依据标题撰写';
      meta.append(f);
    }

    const actions = el('div', 'entry-actions');
    const star = el('button', 'act', state.starred[item.id] ? '★ 已收藏' : '☆ 收藏');
    star.setAttribute('aria-pressed', String(Boolean(state.starred[item.id])));
    star.addEventListener('click', () => {
      setItemState(item.id, 'starred', !state.starred[item.id]);
      render();
    });
    const read = el('button', 'act', state.read[item.id] ? '标为未读' : '标为已读');
    read.addEventListener('click', () => {
      setItemState(item.id, 'read', !state.read[item.id]);
      render();
    });
    actions.append(star, read);
    meta.append(actions);

    main.append(meta);
    node.append(main);
    return node;
  }

  /* ---------- 信源面板 ---------- */

  function renderPanel() {
    const wrap = $('#panel');
    wrap.textContent = '';
    const yields = new Map();
    for (const item of allItems) yields.set(item.source, (yields.get(item.source) || 0) + 1);

    wrap.append(el('p', 'panel-intro',
      `共 ${sources.length} 个信源。「近 30 天入选」为 0 的源不代表坏了——`
      + '个人博客本来就月更，而且只有真正聊 agent 的那几篇才会进来。连续失败 7 次以上的才需要处理。'));

    const table = el('table', 'sources');
    const head = el('tr');
    for (const t of ['信源', '类型', '状态', '近 30 天入选', '说明']) head.append(el('th', null, t));
    // Element.append() 返回 undefined，不能链式取回刚追加的节点。
    // 之前写的是 table.append(el('thead')).lastChild.append(head)，直接抛 TypeError，
    // 整个信源面板从上线起就打不开——而我一次都没点过那个按钮。
    const thead = el('thead');
    thead.append(head);
    table.append(thead);
    const body = el('tbody');
    const kindLabel = { search: '按词搜索', forum: '论坛', aggregator: '聚合', weekly: '周刊', blog: '个人博客' };
    for (const s of [...sources].sort((a, b) => (yields.get(b.name) || 0) - (yields.get(a.name) || 0))) {
      const tr = el('tr');
      const nameCell = el('td');
      const link = el('a', null, s.name);
      link.href = s.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
      nameCell.append(link);
      const st = sourceState(status[s.name]);
      const badge = el('span', 'state', st.label);
      badge.dataset.s = st.s;
      const stateCell = el('td');
      stateCell.append(badge);
      tr.append(nameCell, el('td', 'kind', kindLabel[s.kind] || s.kind), stateCell,
        el('td', 'num', String(yields.get(s.name) || 0)), el('td', 'desc', s.desc || ''));
      body.append(tr);
    }
    table.append(body);
    const scroll = el('div', 'table-wrap');
    scroll.append(table);
    wrap.append(scroll);
  }

  /* ---------- 总渲染 ---------- */

  function render() {
    renderRail();
    const panel = $('#panel');
    const stream = $('#stream');
    panel.classList.toggle('hidden', !ui.panel);
    stream.classList.toggle('hidden', ui.panel);
    if (ui.panel) { renderPanel(); return; }

    stream.textContent = '';
    const shown = filterItems(allItems, ui, state);
    if (!shown.length) {
      stream.append(el('p', 'empty', '这个筛选下还没有内容。换个工具标签或日期看看。'));
      return;
    }

    const byDate = new Map();
    for (const item of shown) {
      if (!byDate.has(item.date)) byDate.set(item.date, []);
      byDate.get(item.date).push(item);
    }
    for (const [date, items] of byDate) {
      const day = days.find((d) => d.date === date);
      const head = el('div', 'day-head');
      head.append(el('h2', 'day-date', date), el('span', 'day-count', `${items.length} 篇`));
      stream.append(head);
      if (day && day.dailyNote && !ui.tool && !ui.topic && !ui.query) {
        const note = el('p', 'day-note');
        note.append(el('strong', null, '编者按　'), document.createTextNode(day.dailyNote));
        stream.append(note);
      }
      const list = el('div', 'entries');
      items.forEach((item, i) => list.append(entryNode(item, i + 1)));
      stream.append(list);
    }
  }

  const search = $('#search');
  let timer = null;
  search.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { ui.query = search.value.trim(); ui.panel = false; render(); }, 140);
  });

  $('#generated').textContent = `更新于 ${new Date(generatedAt).toLocaleString('zh-CN', { hour12: false })}`;
  render();
  initializeSync();
})();

</script>
