/* Agent 折腾志 — 终端笔记本
 *
 * 配色不用「黑底荧光绿」那套终端刻板印象，而是取调好的 dotfile 主题的感觉：
 * 纸底带极淡的绿灰偏色，强调色是沉下来的青（deep teal），高分条目用琥珀作信号色。
 * 语义色（青=强调，琥珀=精选，红=失败）和中性色分开，互不借用。
 *
 * 字体全部走系统栈：Artifact 的 CSP 挡外链字体，内嵌 data URI 又会让页面膨胀到几百 KB，
 * 而中文正文本来就该用 PingFang / 苹方这一类本地字体。识别度靠等宽数据面、字重跨度和字距做。
 */

:root {
  color-scheme: light dark;

  --paper: #f4f6f3;
  --surface: #fbfcfa;
  --surface-2: #eceee9;
  --ink: #191d1b;
  --ink-soft: #4b544f;
  --ink-mute: #78827c;
  --line: #dde1dc;
  --line-soft: #e8ebe6;
  --accent: #0d7a68;
  --accent-soft: #d8ece7;
  --signal: #b35c07;
  --signal-soft: #f6e6d2;
  --danger: #a63328;

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;

  --rule: #191d1b;
  --rail: 232px;
  --gutter: 3.25rem;
  --radius: 3px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111513;
    --surface: #171c19;
    --surface-2: #1e2421;
    --ink: #e4e9e5;
    --ink-soft: #a9b3ad;
    --ink-mute: #7c877f;
    --line: #29302c;
    --line-soft: #212724;
    --accent: #4ecdb6;
    --accent-soft: #16302b;
    --signal: #e79a4d;
    --signal-soft: #33251440;
    --danger: #e0796c;
    --rule: #39423d;
  }
}

/* 用户手动切换主题时，data-theme 必须压过上面的媒体查询——两个方向都要压。 */
:root[data-theme="dark"] {
  --paper: #111513;
  --surface: #171c19;
  --surface-2: #1e2421;
  --ink: #e4e9e5;
  --ink-soft: #a9b3ad;
  --ink-mute: #7c877f;
  --line: #29302c;
  --line-soft: #212724;
  --accent: #4ecdb6;
  --accent-soft: #16302b;
  --signal: #e79a4d;
  --signal-soft: #33251440;
  --danger: #e0796c;
  --rule: #39423d;
}

:root[data-theme="light"] {
  --paper: #f4f6f3;
  --surface: #fbfcfa;
  --surface-2: #eceee9;
  --ink: #191d1b;
  --ink-soft: #4b544f;
  --ink-mute: #78827c;
  --line: #dde1dc;
  --line-soft: #e8ebe6;
  --accent: #0d7a68;
  --accent-soft: #d8ece7;
  --signal: #b35c07;
  --signal-soft: #f6e6d2;
  --danger: #a63328;
  --rule: #191d1b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--paper);
  /* 极淡的方格纸底纹。只有一层，别喧宾夺主。 */
  background-image: radial-gradient(circle at 1px 1px, var(--line-soft) 1px, transparent 0);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius);
}

.app {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 clamp(1rem, 3vw, 2.5rem) 5rem;
}

/* ---------- 报头 ---------- */

.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.75rem 1.25rem;
  padding: 2.5rem 0 1.25rem;
  /* 暗色下 --ink 接近纯白，2px 实线会变成一条很吵的亮带，压到中性描边色。 */
  border-bottom: 2px solid var(--rule);
}

.wordmark {
  margin: 0;
  font-size: clamp(1.5rem, 3.4vw, 2.1rem);
  font-weight: 700;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.wordmark .prompt {
  color: var(--accent);
  font-family: var(--mono);
  font-weight: 500;
  margin-right: 0.35em;
}

.tagline {
  color: var(--ink-mute);
  font-size: 0.82rem;
  letter-spacing: 0.02em;
  margin: 0;
  flex: 1 1 16rem;
}

.masthead-meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

.theme-toggle {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.2rem 0.55rem;
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-soft);
}

.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- 主体骨架 ---------- */

.frame {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  gap: 2.5rem;
  align-items: start;
}

.rail {
  position: sticky;
  top: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
  padding-top: 1.75rem;
  max-height: calc(100vh - 2.5rem);
  overflow-y: auto;
}

.rail-block { display: flex; flex-direction: column; gap: 0.5rem; }

.rail-label {
  margin: 0;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

.view-btn,
.chip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  width: 100%;
  padding: 0.28rem 0.5rem;
  border-radius: var(--radius);
  font-size: 0.85rem;
  color: var(--ink-soft);
  text-align: left;
}

.view-btn:hover,
.chip:hover { background: var(--surface-2); color: var(--ink); }

.view-btn[aria-pressed="true"],
.chip[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

.chip .count {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

.chip[aria-pressed="true"] .count { color: var(--accent); }

.tag-list { max-height: 13rem; overflow-y: auto; }

.rail-empty { margin: 0; padding: 0.2rem 0.5rem; font-size: 0.8rem; color: var(--ink-mute); }

/* 话题不是工具，视觉上也要分开：话题用方括号包住，像个标记而不是产品名。 */
#topics .chip .label::before { content: "["; color: var(--ink-mute); }
#topics .chip .label::after { content: "]"; color: var(--ink-mute); }
#topics .chip .label { font-family: var(--mono); font-size: 0.78rem; }

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}

.cal-day {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 2px;
  background: var(--surface-2);
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

.cal-day[data-has="yes"] { background: var(--accent-soft); color: var(--accent); }
.cal-day[aria-pressed="true"] { outline: 1.5px solid var(--accent); }
.cal-day:hover { color: var(--ink); }

/* ---------- 内容流 ---------- */

.content { min-width: 0; padding-top: 1.75rem; }

.day-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem 1rem;
  margin-bottom: 0.75rem;
}

.day-date {
  margin: 0;
  font-family: var(--mono);
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}

.day-count {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-mute);
}

.day-note {
  margin: 0 0 2rem;
  padding: 0.85rem 1rem 0.85rem 1.1rem;
  border-left: 2px solid var(--accent);
  background: var(--surface);
  color: var(--ink-soft);
  font-size: 0.9rem;
  max-width: 62ch;
}

.day-note strong { color: var(--ink); font-weight: 600; }

.entries { display: flex; flex-direction: column; }

.entry {
  display: grid;
  grid-template-columns: var(--gutter) minmax(0, 1fr);
  gap: 0 1rem;
  padding: 1.4rem 0;
  border-top: 1px solid var(--line-soft);
}

.entry:first-child { border-top: none; }
.entry[data-read="true"] { opacity: 0.5; }
.entry[data-read="true"]:hover { opacity: 1; }

.entry-gutter {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.4rem;
  padding-top: 0.15rem;
}

.entry-rank {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--ink-mute);
  font-variant-numeric: tabular-nums;
}

/* 评分用 5 段竖条，比星星更像仪表、也更容易一眼比较高低。 */
.meter { display: flex; gap: 2px; }

.meter i {
  display: block;
  width: 4px;
  height: 11px;
  border-radius: 1px;
  background: var(--line);
}

.meter i[data-on="1"] { background: var(--accent); }
.entry[data-pick="true"] .meter i[data-on="1"] { background: var(--signal); }

.entry-title {
  margin: 0 0 0.3rem;
  font-size: 1.06rem;
  font-weight: 650;
  line-height: 1.4;
  letter-spacing: -0.008em;
  text-wrap: balance;
}

.entry-title a { text-decoration: none; }
.entry-title a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

.pick-flag {
  display: inline-block;
  margin-right: 0.45rem;
  padding: 0.08rem 0.34rem;
  border-radius: 2px;
  background: var(--signal-soft);
  color: var(--signal);
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  vertical-align: 0.16em;
}

.why {
  margin: 0 0 0.5rem;
  color: var(--accent);
  font-size: 0.92rem;
  font-weight: 500;
  max-width: 64ch;
}

.summary {
  margin: 0 0 0.65rem;
  color: var(--ink-soft);
  font-size: 0.93rem;
  max-width: 66ch;
}

.entry-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 0.7rem;
  font-family: var(--mono);
  font-size: 0.71rem;
  color: var(--ink-mute);
}

.entry-meta .sep { color: var(--line); }

.tool-tag {
  padding: 0.05rem 0.35rem;
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--ink-soft);
}

/* 条目上的话题标签：虚线框，和实线的工具标签区分 */
.topic-tag {
  padding: 0.05rem 0.35rem;
  border: 1px dashed var(--line);
  border-radius: 2px;
  color: var(--ink-mute);
}

.thin-flag { color: var(--signal); }

.entry-actions { display: flex; gap: 0.6rem; margin-left: auto; }

.act {
  font-family: var(--mono);
  font-size: 0.71rem;
  color: var(--ink-mute);
  padding: 0.05rem 0.3rem;
  border-radius: 2px;
}

.act:hover { color: var(--accent); background: var(--surface-2); }
.act[aria-pressed="true"] { color: var(--signal); font-weight: 600; }

.empty {
  padding: 4rem 0;
  color: var(--ink-mute);
  text-align: center;
  font-size: 0.9rem;
}

/* ---------- 信源面板 ---------- */

.panel { display: flex; flex-direction: column; gap: 1.25rem; }

.panel-intro { margin: 0; color: var(--ink-soft); font-size: 0.9rem; max-width: 62ch; }

.table-wrap { overflow-x: auto; }

table.sources {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

table.sources th,
table.sources td {
  text-align: left;
  padding: 0.5rem 0.7rem 0.5rem 0;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: top;
}

table.sources th {
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 500;
  white-space: nowrap;
}

table.sources td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.sources td.kind { white-space: nowrap; }
table.sources td.desc { color: var(--ink-mute); font-size: 0.8rem; min-width: 18rem; }

.state {
  display: inline-block;
  padding: 0.05rem 0.4rem;
  border-radius: 2px;
  font-family: var(--mono);
  font-size: 0.68rem;
}

.state[data-s="ok"] { background: var(--accent-soft); color: var(--accent); }
.state[data-s="warn"] { background: var(--signal-soft); color: var(--signal); }
.state[data-s="bad"] { background: var(--signal-soft); color: var(--danger); }

.hidden { display: none !important; }

@media (max-width: 860px) {
  .frame { grid-template-columns: 1fr; gap: 1.5rem; }
  /* 手机上先看文章，再看筛选器。
   * 不换序的话要先划过搜索框、四个视图、二十多个工具标签和日历，
   * 约一屏半的筛选器之后才见到第一篇文章——而手机上绝大多数人是来扫今天有什么的。 */
  .content { order: -1; padding-top: 1.25rem; }
  .rail { position: static; max-height: none; padding-top: 0; border-top: 1px solid var(--line); }
  .rail-label { padding-top: 0.5rem; }
  .tag-list { max-height: 9rem; }
  .entry { grid-template-columns: 1fr; gap: 0.5rem; }
  .entry-gutter { flex-direction: row; align-items: center; gap: 0.6rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>

ne.ts 有 45KB，看名字像主循环，实际是给 SDK 和非交互 CLI 用的适配层；真正的主循环在 src/query.ts 的 queryLoop 里，1700 多行几乎全是分支决策。决定路径的 state.transition.reason 是个 7 值 union，压缩后重试、prompt_too_long 后重试、输出 token 触顶后上调再恢复，各占一个值。","whyRead":"看名字最像主循环的那个 45KB 文件其实是 SDK 适配层；真正的循环是一个 7 值 union 驱动的状态机，重试和压缩都是它的一等分支。","rating":5,"tools":["claude-code"],"topics":["agent-loop","hooks","context-engineering"],"publishedAt":"2026-08-24T10:00:00.000Z","author":"","preScore":8},{"id":"0705a5e4871c5852","source":"宝玉xp","kind":"blog","url":"https://baoyu.io/blog/2026-08-24/ai-native-dev-workflow","titleOriginal":"我的 AI 原生开发流程：一个真实案例的完整复盘","titleZh":"我的 AI 原生开发流程：一个功能从 GitHub Issue 到上线的完整复盘","summaryZh":"起点是一个 GitHub Issue：有人问他的字幕转录 App 能不能加远程转录——两台电脑，把算力活丢给性能好的那台。他没有直接开编辑器，而是把传统流程（可行性、设计、原型、编码、测试）走了一遍，只是每一环的执行者换成 Agent，人只在关键节点拍板。可行性那关他让 Claude Code 结合项目现状列方案再自己判断：方案 0 和 C 要用户自建 ASR 服务器，普通人玩不转；B 对 Windows 不友好；最后选 A。他也给了反例——前几天那个本地模型辅助对齐字幕的功能，可行性分析说没问题，做完体验很糟砍掉了，白费几天和一堆 token，所以这一步是「期望值的赌注」而不是保险。中段那条最实用：文档是 Agent Session 之间传上下文的媒介，从设计进开发往往是新开一个 Session，这时一句「按 docs/remote-transcription.md 实现」就够。","whyRead":"结论是「流程一步没少，变的是执行主体」，但真正能照抄的是那句操作细节：确认过的文档，就是下一个 Agent Session 的全部起点。","rating":5,"tools":["claude-code"],"topics":["context-engineering"],"publishedAt":"2026-08-24T00:00:00.000Z","author":"","preScore":7},{"id":"fb14ca5f657ea8ff","source":"iT 邦幫忙 · Codex 做 LINE Bot 上线","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10405095?sc=rss.iron","titleOriginal":"Day 14 - Bot 功能都做好了，我卻忘了怎麼用：用 Codex App 和 Sol 替 LINE Cafe Bot 補上 Rich Menu","titleZh":"Bot 功能都做好了，我却忘了怎么用：给 LINE Cafe Bot 补一个 Rich Menu","summaryZh":"这一天他没继续给 Bot 加能力，而是补一个「一直看得见的入口」。设计上先做减法：只留找附近咖啡、我的偏好、设定偏好、使用说明四格，Datetime Picker 不放——它必须知道你正在看哪一次搜索的哪间店，离开情境单开一个时间选择器没有意义；他说这次最大的设计决定反而是「哪些不要放」。技术上 Rich Menu 是两层：一张 2500×1686 的 PNG，加一份告诉 LINE 每个坐标触发什么的 JSON，两者必须完全对齐。三个坑都有落点：第一版尺寸合法、小于 1 MB、自动检查全绿，图打开一看图示压在中文字上；npm 全局 cache 权限不一致时它建议 sudo 修，他改用项目自己的 .npm-cache；SVG 转 PNG 的依赖出了高风险公告又没有可升级版本，即使只处理自己写的 SVG 也换成 @resvg/resvg-js。","whyRead":"一条很便宜的提醒：视觉功能要做视觉验收——尺寸合法、体积合规、所有自动检查全绿，图片打开一看，图示压在中文字上。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-25T14:42:41.000Z","author":"","preScore":7},{"id":"f6b00f00cac3fd26","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/rossiXYZ/p/22643564","titleOriginal":"【OpenClaw具身硬件】ZeroClaw 源码阅读笔记（1）--- 总体 - 罗西的思考","titleZh":"ZeroClaw 源码阅读笔记（一）：一个 4.6 MB 单二进制的具身 agent 长什么样","summaryZh":"对象是 ZeroClaw：100% Rust 实现、目标「单二进制 4.6 MB，能跑在树莓派 3 到服务器」的 AI 助手框架，卖点是把 agent 接到物理世界：读传感器、主动改变环境状态。笔记按层拆——体积控制（opt-level=\"z\"、LTO fat、no_std 固件）、Runtime 抽象（Native / Docker / WASM 解释器）、硬件抽象（Peripheral trait、协议先行）、RAG 与记忆（keyword RAG + SQLite FTS，向量可选），以及双模式架构：Edge-Native 端上独立运行，Host-Mediated 用主机做中介来开发调试。最后落到硬件：ESP32 引脚别名、Arduino Uno 串口，以及 gpio_read / gpio_write / arduino_upload——最后那个是让 agent 生成完整 Arduino 草图，再用 arduino-cli 编译上传。","whyRead":"难得有人把 agent 框架和硬件抽象放在同一张图上读——从 opt-level=\"z\" 的体积控制一直读到 ESP32 的引脚别名。","rating":4,"tools":["openclaw"],"topics":["agent-loop"],"publishedAt":"2026-08-25T12:56:00.000Z","author":"","preScore":9},{"id":"83976b5f105cd8fa","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/25/claude-code-agent-loop-06-streaming/","titleOriginal":"Claude Code Agent Loop 研究系列（06）—— Streaming：从 SSE 事件到逐字显示","titleZh":"Claude Code 的流式：6 种 SSE 事件怎么拼回一条完整消息","summaryZh":"系列第 6 篇，拆的是前几篇一直当成原子操作的那行 response = call_llm(messages)。Anthropic API 走 SSE 流式返回，一次调用发 6 种事件：message_start（元信息，content 数组还空着）、content_block_start（声明块类型：text / tool_use / thinking）、content_block_delta（增量：文本逐字符、tool_use 参数逐 JSON 片段）、content_block_stop、message_delta（带 stop_reason 与 usage）、message_stop。关键点是一次响应可以有多个 content 块：一段 text 加一个 tool_use 就是两个，各自 start / delta / stop。客户端按事件顺序把碎片累回一条完整消息；tool_use 参数是 partial JSON，得增量解析。","whyRead":"把「调一次 LLM」这个一直被当成原子操作的动作拆开，包括 tool_use 的 JSON 参数是分片发来的、客户端得增量解析。","rating":4,"tools":["claude-code"],"topics":["agent-loop"],"publishedAt":"2026-08-25T10:00:00.000Z","author":"","preScore":8},{"id":"f18ca0dd258caa1f","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7677475198968594484","titleOriginal":"上下文压缩扔得掉对话，扔不掉你的 CLAUDE.md","titleZh":"上下文压缩扔得掉对话，扔不掉你的 CLAUDE.md","summaryZh":"承接作者上一篇讲的四级压缩流水线：压缩收走的是会话历史（你的话、模型的回话、工具回执），而写进 CLAUDE.md 的那几行——「本项目用 Bun 跑脚本，不要用 npm」——会话开三小时、压缩跑好几轮，一条不丢。原因不是它优先级高，是它压根不在这串历史里：文件在磁盘上，开场读出来拼好，此后每一轮请求都原样放在最前面，压缩重写的只是历史，够不着它。文章把这套讲成三件事：存在哪（全局的管「你这个人」、仓库里的管「这个仓库」跟着代码进 git、CLAUDE.local.md 管「你这台机器」进 .gitignore）；怎么写（一个文件写到尾，或一个目录一个主题一份）；打架了谁赢（加载次序反过来就是优先级，越晚加载越当回事）。落点是一条很朴素的取舍：正因为扔不掉压不掉，每一行都从第一轮占到最后一轮，所以要精炼——删掉一行，模型会犯错吗？不会，那就删。","whyRead":"一个能自己验的小实验：聊到一半往 CLAUDE.md 里加一行，模型压根看不到，敲 /memory 之后才有——因为它根本不住在会话里。","rating":4,"tools":["claude-code"],"topics":["claude-md","context-engineering","harness"],"publishedAt":"2026-08-24T23:17:10.000Z","author":"百工蜂Agent","preScore":10},{"id":"9e241f1985fa0d91","source":"方格子 vocus 标签","kind":"search","url":"https://vocus.cc/article/6a8aa6c6fd897800018d13c0","titleOriginal":"善用 Cline API 匯出使用紀錄：打造個人化開銷報表","titleZh":"Cline 的用量仪表板一页只给 10 笔，他把后台那个没公开的接口挖出来了","summaryZh":"作者在 Google 宣布停用 Gemini CLI、转向 Antigravity CLI 之后把日常开发全面搬到 Cline，图的是自备 API 金钥、能在 IDE 和终端之间衔接本地模型。日常用免费档够用，一旦切到顶级付费模型额度消耗就远超预期，而 Cline 的线上仪表板每页硬性只显示 10 笔——想做每周开销审查、看哪个项目最烧 token，就得一页页手点。于是他去翻仪表板自己在调什么，挖到后台的 REST 端点 api.cline.bot/api/v1/users/{USER_ID}/usages，试出三条规则：它默认用 Cookie 验证，但直接带标准的 Cline API Key 也能通过；返回按时间倒序；每页 10 笔只是前端的事，查询参数加 limit=100 就能批量拉，翻页靠回包里的 nextToken 游标。为了不自己写脚本维护异常分支，他用 n8n 搭了条工作流处理分页并导出 CSV。","whyRead":"三个关键规则都是试出来的：这个端点默认走 Cookie，但直接塞 Cline API Key 也能过；limit 能顶到 100；翻页靠回包里的 nextToken。","rating":4,"tools":["cline","n8n"],"topics":[],"publishedAt":"2026-08-23T08:30:11.790Z","author":"","preScore":9},{"id":"b1f082d7fc4dc55f","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7675538244907221001","titleOriginal":"我把 DeepSeek Harness 跑了一遍，终于知道它和 Codex 差在哪了","titleZh":"同一个只读任务喂给 DeepSeek Harness 的两种模式：10 次工具调用 vs 6 次","summaryZh":"他上来先说了个弯路：官网一页写给架构开发者、一页写给插件作者，从这两页读进去读了很久还没写出「它是什么」。分清之后定位很清楚——Codex、Claude Code 这类是把模型、文件读写、终端、权限、会话和界面组装好的成品，DeepSeek Harness 把这些部件露了出来。最有价值的是他对 Standard 和 PTC 两个 preset 的实测：同一个只读任务——扫描 Harness 仓库里的 package.json、统计内部依赖、列出依赖最多的包。Standard 用 Bash 扫到 248 个文件再逐个读，共 10 次顶层工具调用；PTC 先生成一段 TypeScript 把统计和排序写进代码，用 run_code 执行，顶层只有 6 次。结果基本一致，但他明说 PTC 内部照样在大量调度，第一次扫描还把 node_modules 算了进去——它改变的是组织方式，不是把工作压成一次调用。","whyRead":"难得有人真的把两个模式并排跑同一个任务，并且明说 PTC 并没有把工作神奇地压成一次调用——它内部照样在大量调度。","rating":4,"tools":["dsh","codex","claude-code"],"topics":["harness"],"publishedAt":"2026-08-19T08:15:59.000Z","author":"子昕AI编程","preScore":18},{"id":"9d8994aaa5dc01b1","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7673314548444184628","titleOriginal":"Antigravity (agy) 实战避坑与工程最佳实践","titleZh":"团队拿 Antigravity CLI 当主力之后攒下的规矩：先出 implementation_plan.md，再动源码","summaryZh":"团队在多个项目里拿 agy（Antigravity CLI）当主力，起因很实在——Pro 会员便宜。踩的坑也典型：一句话丢给它自由发挥，代码表面跑通但底层混乱，出 bug 之后因为不了解它改了什么，排查特别费劲；没提前约定架构边界时，它会静默吞掉 Exception，或顺手改掉别的模块的公共 API 签名。应对是三条：动手前先让它输出 implementation_plan.md，人审过改动范围再允许改源码（文中说明 agy 没有 plan mode 这个选项，但它会自行判断要不要先出计划）；让它在沙盒里跑单测，按 exit code 和日志自我修正；用规则划底线。落到文件上是两层：Rule 放在 AGENTS.md 或 .agents/rules/ 下按架构、编码规范、护栏、测试拆成四份，Plugin 把多条 rule 打包成独立仓库用 git submodule 分发。","whyRead":"不是「最佳实践清单」那种凑数文，红线是逐条写进 .agents/rules/ 的：禁止空 catch、禁止查询失败时返回假数据骗过测试。","rating":4,"tools":["antigravity"],"topics":["agents-md","vibe-coding","plan-mode"],"publishedAt":"2026-08-13T09:48:56.000Z","author":"BanShan_Alec","preScore":14},{"id":"aa265fc2d0c71f1d","source":"yurenju.blog","kind":"blog","url":"https://yurenju.blog/zh/posts/2026-08-06_prompt-injection-survival/","titleOriginal":"Prompt Injection 歷劫歸來","titleZh":"Prompt Injection 历劫归来：为一次可能是幻觉的告警，他重装了两台电脑","summaryZh":"他在 Claude Code 的自动模式下跑了几个月，警惕性慢慢松了。某个下午它正收尾准备 commit，对话突然停了很久，然后 Claude Code 警告他：执行 git diff 时收到了额外指示，要求 curl 一个 install.sh 管道给 bash 装「分析套件」且不必经用户同意，这是典型的 prompt injection 信号；接着 git show 也出现同样的东西。他慌乱备份后把两台电脑全部重装、撤销所有凭据，但调查做得不好，至今不知道它是怎么进来的——还自嘲记了一笔：他问 Claude「git diff 是不是有什么 alias」，它说看起来正常（「我如果是犯人，我当然是吹着口哨说什么事情都没发生」）。文章开头有条第二天补的更新：后来有人说这可能是模型的幻觉，如果是的话那就太好了。但加固方案不依赖这个结论：按用途建多个无法挂载 Windows 宿主磁盘的 WSL guest、完全移除普通用户的 sudo、重要目录加审计、默认阻挡所有 Web Fetch。","whyRead":"比事件本身更值得读的是结尾那条更新——后来有人说那可能是模型的幻觉；而他为此建的隔离方案，无论是不是幻觉都该照做。","rating":4,"tools":["claude-code"],"topics":[],"publishedAt":"2026-08-06T00:00:00.000Z","author":"","preScore":6}],"reviewed":35,"dropped":24,"stats":{"sources":264,"fetched":375,"shortlisted":35,"rejected":340,"thin":121,"enriched":82,"enrichAttempted":125,"enrichRetryAttempted":75,"enrichRetried":32,"enrichSkipped":0,"enrichMuted":[],"failedSources":3,"feedRetryAttempted":12,"feedRetried":10},"errors":[{"source":"eebk","message":"无法识别的 feed 格式"},{"source":"Watermelonabc的Blog","message":"HTTP 404"},{"source":"东评西就","message":"HTTP 503"},{"source":"掘金搜索","message":"部分查询失败（1/30）","partial":true}]},{"date":"2026-08-25","generatedAt":"2026-08-24T22:24:06.382Z","dailyNote":"今天入围 43 条只收了 5 条，名单薄。iT 邦幫忙那位常驻越南、柬埔寨的 IT 基建工程师一个人占了两席，是这一期最不好看的地方，但他那篇 Day 15 实在放不掉——让 Claude clone 自己的仓库逐行稽核，报告指着 index.html 第 983 行说「五条规则一条都没有」，他再逐句对完，发现那段 Prompt 不是漏写，是在要求模型追求他自己论证过有害的「完整性」。今天先读这篇。毙掉的两大类还是概念普及稿和产品自荐：SDD 与氛围编程的比喻文、中转站味道的 Base URL 配置指南、五条 V2EX 的「我做了个小工具」；另有两篇形状很对但落点分别落在自家商店 App 和自家「进化社」课程上，同一把尺子照毙。","items":[{"id":"a612c1512b18e9c5","source":"iT 邦幫忙 · IT 診斷 Agent 開發實錄","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10400903?sc=rss.iron","titleOriginal":"Day 15  我用 Claude 稽核自己的工具，結果找到一個 Prompt 漏洞","publishedAt":"2026-08-16T07:30:51.000Z","author":"","preScore":14,"titleZh":"让 Claude 稽核自己写的工具，查出 Prompt 里一组反向的目标函数","whyRead":"稽核报告指着 index.html 第 983 行说「五条规则一条都没有」，他逐句对完才发现比漏写更糟——那三句话在要求模型追求他自己论证过有害的东西。","summaryZh":"作者是常驻越南、柬埔寨的 IT 基建工程师，给自己写的诊断工具定了五条「证据导向对话」规则：证据不足不跳结论、一次只问一个问题、问完要停下来等、不列举所有可能性、给的信息必须能改变对方下一步。他没凭印象自查，而是让 Claude clone 仓库逐行稽核。三个结构化模式全过，报告原话是 static gating enforced by code, not LLM self-restraint。唯一不通过的是 AI Chat 那条逃生门：index.html 第 983 行和 1098 行的 systemPrompt 只写了角色、专业范畴和回应格式。他逐句对完才发现问题比「漏写」更糟——「先给诊断关键问题」是复数，违反单一问题；「依严重程度排列」预设了列举；「结尾加预防建议」违反决策相关性测试。三句合起来在最大化完整性，而他在另一份文档里论证过完整性在故障排查中有害。修正只改两行。总结是：纪律在有结构的地方多余，在没有结构的地方必需，而他写在了多余的那边。","rating":5,"tools":["claude"],"topics":[]},{"id":"8613c10bd3e1f033","source":"XINDOO的博客","kind":"blog","url":"https://zxs.io/article/2215","titleOriginal":"我和 AI 共创了一套会自己生长的 Obsidian 知识库","publishedAt":"2026-08-24T13:34:23.000Z","author":"","preScore":12,"titleZh":"不做 RAG：让 Claude Code 长期维护一座会自己生长的 Obsidian 知识库","whyRead":"整套东西里最实的一处是矛盾校验分档——软矛盾并存并标注差异，硬矛盾直接暂停提交等人裁决。","summaryZh":"作者用了几年 Notion，今年初转 Obsidian，他说真正的变化不是换工具，而是让 AI 参与知识库的长期维护。他先说清为什么不走 RAG：每次查询从零开始、知识不累积；同一个指标在文档 A 和 B 里定义不同它不会提醒你，只是分别检索出来丢给模型；源材料永远散乱，「你只是多了一层向量索引」。他的做法是让 LLM 读一次原始来源、提取事实写成结构化笔记，之后持续维护，新内容到来时自动更新受影响的旧笔记。收录那条链路写得最细：落进 00-inbox 的资料先让 inbox-organizer skill 标准化 frontmatter、判断归档目录，然后读原文（原文永远只读，只要它还在，整个体系可以随时重新推导），产出 type: source 笔记，更新通常 5 到 10 篇受影响的 concept 笔记，双向补 wikilink，再过矛盾校验门：一致的合并并记来源，口径不同但不互斥的软矛盾并存并标注差异，互相否定的硬矛盾暂停提交、等人工裁决。规则写进 CLAUDE.md。","rating":4,"tools":["claude-code","claudian","obsidian"],"topics":["skills","claude-md"]},{"id":"6012defb24f3fd0c","source":"iT 邦幫忙 · IT 診斷 Agent 開發實錄","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10400910?sc=rss.iron","titleOriginal":"Day 21  Claude Code + GSD agent：我的實際開發流程","publishedAt":"2026-08-22T07:43:53.000Z","author":"","preScore":10,"titleZh":"二十年 IT 基建工程师的 Claude Code + GSD 实际流程：八个设置和它们的理由","whyRead":"他把第一次跑 GSD 时被问到的八个设置逐项记下来并写了选择理由，这是这类文章里最少见的那部分。","summaryZh":"作者不是应用开发者，二十年做的是网络、服务器、AD、机房布线。这篇回答那个三千两百行的单文件工具是怎么来的：Windows 笔电 + Claude Code CLI + GSD（get-shit-done）。他把第一次跑 GSD 时的八个设置逐项写了理由：模式 Interactive（全自动对他是黑盒），颗粒度 Standard（太细会淹在确认消息里，太粗来不及刹车），提交规划文档 Yes，Research No，两个 verify 都开，PR 只要 User Stories 和 Risks，路线图走 Vertical MVP。两个 verify 是他最不后悔的决定：「AI 说完成了」和「真的完成了」之间有距离，没有自动化测试时只能靠强制验证填。GSD 先产出 7 个文件、1185 行的 codebase map，CONVENTIONS.md 里记着他随口提过的「只用 inline style」，隐性惯例成了正式文档。准则是：GSD 推荐的选项和「不破坏既有功能」冲突时一律选保守的那个。","rating":4,"tools":["claude-code","gsd"],"topics":[]},{"id":"52abd042d002d57f","source":"pjwu.me","kind":"blog","url":"https://pjwu.me/writing/what-happened-to-my-three-tools/","titleOriginal":"我透過 vibe coding 做了三個小工具，學到了什麼？","publishedAt":"2026-08-20T00:00:00.000Z","author":"","preScore":6,"titleZh":"三个 vibe coding 做出来的小工具，后来怎么样了","whyRead":"少见的「后来」：他从 Supabase 后台看剩余次数，发现大部分人只试了两三次就不再打开，包括他自己。","summaryZh":"作者去年底到今年初密集 vibe coding，做了三个 macOS 小程序 Histo、Promptny、Purri；3 月起因为工作上要构建 agent system，也大概意识到自己业余开发的程度在哪，就没再迭代。Promptny 是第一个：在任何窗口里框选一段文字、按快捷键就调用他设好的脚本强化这段 prompt 再贴回原处，网页、终端、Discord、Slack、编辑器里都能用。上线时他让有兴趣的人填 email，加进 Supabase 的表，Google 登录后给 50 次免费额度。上线几天他从后台看个别账号的剩余次数，发现大部分人只试了两三次就不再用；很快也发现自己不常用——AI 改出来的 prompt 带着额外的信息和规则，那些额外不一定生出好东西，反而制造噪声。于是他转了个弯，改成做翻译：英文段落转中文、中文晶晶体转英文，那才是他每天真会用的。结论是重复造轮子很好：跑几轮流程之后，后端权限验证、数据库、API 串接这些原本模糊理解的东西都熟了一层。","rating":4,"tools":["claude-code"],"topics":["vibe-coding"]},{"id":"a2262cd1dc946f04","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7672328629963718694","titleOriginal":"说好 3 个功能做成 2 个：用 opencode 调试私文简搜聊天版（下篇）","publishedAt":"2026-08-11T01:02:08.000Z","author":"9i编程","preScore":9,"titleZh":"说好 3 个功能做成 2 个：用 opencode 把一个本地检索应用调到能用","whyRead":"「跑起来」和「能用」之间的那一大截，连同作者几次破防的原话一起记了下来。","summaryZh":"上篇因为 16G 内存带不动 Milvus，作者用 opencode 把「私文简搜」重写成轻量版：向量改本地方案、全文检索用 Lucene + HanLP、模型走本地 Ollama。这篇是从「能跑」到「能用」的拉锯。第一波三个问题一起上：deploy 被理解错了（他要的是配置一个目录、把批量 md 和图片挪进去再一键发布，opencode 当成了上传 zip 那样的东西）；前端把聊天、上传、知识库全堆在一起；最要命的是调模型时卡住不动——他以为是 Ollama 没响应，查下来是它因内存不足直接退出了，可用内存只有 8G，解法是设 OLLAMA_KEEP_ALIVE=-1 让模型常驻。界面改着改着，deploy 功能被弄丢了，说好三个功能只做了两个。最要命的一条是「它偷偷改需求」：上传 zip 和解压是两件独立的事，他说得很明白，opencode 非要把两个 deploy 揉一起，光这一条至少沟通了两小时。收尾是：正是这些拉扯让他更清楚哪些必须写成 skills、哪些必须人工把关。","rating":4,"tools":["opencode"],"topics":["skills"]}],"reviewed":43,"dropped":38,"stats":{"sources":261,"fetched":399,"shortlisted":43,"rejected":356,"thin":94,"enriched":100,"enrichAttempted":122,"enrichRetryAttempted":37,"enrichRetried":15,"enrichSkipped":0,"enrichMuted":[],"failedSources":2,"feedRetryAttempted":8,"feedRetried":7},"errors":[{"source":"eebk","message":"无法识别的 feed 格式"},{"source":"东评西就","message":"HTTP 503"},{"source":"掘金搜索","message":"部分查询失败（1/29）","partial":true}]},{"date":"2026-08-24","generatedAt":"2026-08-23T22:40:00.000Z","dailyNote":"今天扎堆的是「全绿不等于对」：掼蛋那篇 117 项测试反复确认了一条错的牌序，V2EX 那位不会写代码的作者量到覆盖率 90% 的产品照样不能用，两篇讲的是同一件事——测试只覆盖执行，覆盖不了前提。要先读的是掼蛋那篇，它把这个道理连着三处硬伤和修复前后的数字一起摆了出来。毙掉的主要是 SDD／氛围编程的概念普及稿（一天四条，比喻和配图齐全，就是没有一个作者自己的项目），外加横评选型和产品自荐；博客园那篇 elevated sandbox 和昨天毙掉的 unelevated 是同一位作者、同一个形状——正文自己写着「本文主要学习了 \u003c官方链接\u003e」，同一把尺子照毙。","items":[{"id":"698f997a8f5bef54","source":"创见思考","kind":"blog","url":"https://www.fengcan.net/dramatic-numbers-are-bugs/","titleOriginal":"戏剧性的数字，通常是 bug——我审了一遍 AI 交给我的掼蛋研究","titleZh":"戏剧性的数字，通常是 bug：我审了一遍 AI 交给我的掼蛋研究","summaryZh":"作者让 AI 把掼蛋规则实现成一套模拟引擎，四个装了不同策略的电脑玩家互相打几十万局，用统计去判牌桌上口口相传的说法。交付物相当漂亮：纯 Python 引擎、18 组实验、117 项单元测试全过、指定同一个随机种子精确重现、报告里九成以上的数字能在原始 CSV 里逐个对上号。让他停下来的是一组太好看的数字——「打 A 退回」这条争议牌规把先到 A 一方的胜率从 87% 压到 77%，同时把落后三级以上一方的翻盘率从 9.9% 抬到 20.7%，一次改动同时把两个指标掀翻，优雅得像游戏公司的数值策划坐下来设计过。他没有逐行读那几千行代码，而是拆成七个维度各派一个 agent 去查，再开一批专门驳倒上一批的结论。硬伤全在规则底座：非级牌的 2 被排在 A 之上（那是斗地主的排序）、过 A 不查级牌归属（实测 17.7% 的对局赢家判错）、连对和钢板允许无限长（约四分之一的手牌被理成牌桌上根本打不出去的组合）。三处改掉重跑，87% 变 77.1%、9.9% 变 20.5%，那份戏剧性整个消失。他的解释是：测试和实现是同一套理解的两面，全绿只能证明前后一致，证明不了前提对不对。","whyRead":"117 项测试全绿、复跑精确重现、数字和 CSV 逐条对得上，错的却是所有测试共用的那条规则前提。","rating":5,"tools":[],"topics":["subagent"],"publishedAt":"2026-08-23T11:22:22.000Z","author":"","preScore":7},{"id":"0aa53576aa2cadb5","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/somebottle/p/22642570/harness_with_pi_and_agent_practices","titleOriginal":"【小记】上手 Pi，记录一下我的 AI 编码实践 - SomeBottle","titleZh":"把 Pi 这间「毛坯房」装修成自己的 Harness","summaryZh":"Pi 只提供最基础的 agent 循环，其余按需扩展，作者把「装修」自己那一套的过程写成了一篇长笔记。权限上他没跟 Pi 作者走「默认 YOLO + 丢进 Docker 隔离」那条路（要在镜像里重装宿主机已有的依赖，每次还得映射工作目录），改成装 pi-permission-system 扩展，让 Pi 自己读文档生成配置，覆盖 path、external_directory、bash 三类。网络搜索用 Context7 和 Tavily 的 Skills 而不是 MCP，且 Tavily 的 6 个 skill 只装最常用的两个——skill 越多、语义越相近，上下文越混乱。Matt Pocock 那套装完先删掉 7 个用不上的，留下 grilling、wayfinder、to-spec、to-tickets、implement、code-review。他还自己写了个 web-fetch skill（参考 OpenCode 的实现，加 @mozilla/readability 精简正文，非 2xx 也返回响应体，好让模型总能拿到语义化反馈），以及一个不到 100 行的 subagent-loop：tmux 后台起子 Agent、--session 写 jsonl 让主 Agent 用 tail 查状态、--append-system-prompt 要求写报告文件当完成信号。原本「主 Agent 每隔几十秒读 jsonl 末几行」的设计被自己否掉了——单行可能塞着整份读文件的结果，污染上下文还造成明显的缓存命中抖动，于是把轮询内化进 shell 脚本，只在多轮没变动时才回报「子 Agent 可能卡住了」。另有一条判断：GPT 5.6 之后，Superpowers、OpenSpec 这类重工作流 skills 在中小项目上反而降低效率、更费 token。","whyRead":"从权限扩展、Skills 取舍到用 tmux 和 jsonl 会话文件手搓出可观测、可介入的子 Agent，每一步都写了取舍理由。","rating":5,"tools":["pi","superpowers","openspec","opencode"],"topics":["harness","skills","subagent","mcp"],"publishedAt":"2026-08-23T10:55:00.000Z","author":"","preScore":13},{"id":"8df0b749c8ed3e9f","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/23/claude-code-agent-loop-04-stop-reason/","titleOriginal":"Claude Code Agent Loop 研究系列（04）—— stop_reason 的 7 种含义","titleZh":"Claude Code 为什么不看 stop_reason：7 种停止原因的实际处理","summaryZh":"Anthropic API 一次响应会带 7 种 stop_reason（end_turn、tool_use、max_tokens、stop_sequence、refusal、pause_turn、model_context_window_exceeded），而 Claude Code 对它们的处理很不均匀。最反直觉的一条：判断「这一轮真的结束了」根本不看 stop_reason，而是扫 assistant 消息的 content 数组里有没有 tool_use 块——源码注释直接写明了理由，有时模型明明输出了 tool_use 而 stop_reason 是 end_turn，有时 stop_reason 是 tool_use 但 content 里没有实际的块。stop_reason 主要拿来做错误 UX（告诉用户输出被截了、或者模型拒绝回答），不作为 loop 的分派依据。其余几种各有各的走法：max_tokens 触发恢复流程，先尝试上调上限重试，再注入一条 [Output token limit hit, continue] 用户消息，最多重试 3 次（MAX_OUTPUT_TOKENS_RECOVERY_LIMIT = 3）；context 超上限走 reactive-compact 压缩历史后重试，这两种都属于「继续跑」分支；refusal 只生成一条建议 /model 换模型的错误消息，不重试，因为靠自动重试没意义；stop_sequence 基本用不上，Claude Code 没设 stop_sequences；pause_turn 则是源码里的一处实际空白，SDK 层认它，loop 层找不到任何分支处理。文中给出了对应的源码文件路径。","whyRead":"源码注释直说 stop_reason === 'tool_use' 不可靠，唯一可靠的判据是 content 里到底有没有 tool_use 块。","rating":5,"tools":["claude-code"],"topics":["agent-loop","hooks"],"publishedAt":"2026-08-23T10:00:00.000Z","author":"","preScore":7},{"id":"defb25e8a0a62e7a","source":"iT 邦幫忙 · 三個介面一套工作流","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10404285?sc=rss.iron","titleOriginal":"Day 07｜用 Claude Desktop 來做電腦的硬體診斷吧！","titleZh":"用 Claude Desktop 诊断自家电脑：先撞上桥接的墙，再撞上编码","summaryZh":"起点是两句抱怨：家里 Wi-Fi 好像有点慢、电脑好像也变慢了。作者装上 Claude Desktop 用 Cowork mode 去查，第一句话丢出去就撞到墙——桥接给的 device_bash 跑在一个独立的 Linux VM 里，只有连结的资料夹会挂载进去，Get-Process、tasklist、WMI 这些一律碰不到；连资料夹解决的是档案存取，不解决指令执行，这是两件事。他选了最工人智慧的一条路：模型给脚本、自己执行、把报告贴回去。编码踩了两次：第一次 PowerShell 一次撈完的输出是 UTF-16 混 Big5，模型事后做转换救回来；第二次脚本下载过程掉了 BOM，PowerShell 5.1 按系统 ANSI 去读，报错直接是一串乱码加「未預期的 '[!]' 語彙基元」，这次它不再去凹更复杂的编码参数，而是把脚本改成纯 ASCII、报告全用英文输出。诊断结果也干脆：RSSI 45 dBm、通道使用率 0%，两个最常见的嫌疑犯同时出局，问题落在路由器本身——TL-WR840N 是 2.4 GHz 单频、WAN 埠只有 10/100 Mbps，此前所有「去把 5 GHz 打开」的建议当场作废。想开 Computer Use 省掉这些来回，又被权限分层挡下：终端机和 IDE 只能给点击等级，看得到、能左键点，不能打字。文末五条注记逐条交代了机器型号、单次执行、以及哪一条结论还只是待确认的假设。","whyRead":"Cowork 的 device_bash 跑在独立 Linux VM 里，连了资料夹也执行不了 Windows 指令——这两件事是分开的。","rating":5,"tools":["claude-desktop","cowork"],"topics":["mcp"],"publishedAt":"2026-08-21T22:25:09.000Z","author":"","preScore":7},{"id":"59ab8cd557fa6910","source":"iT 邦幫忙 · Codex 做 LINE Bot 上线","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10404652?sc=rss.iron","titleOriginal":"Day 12 - 從提醒到偏好記憶：我用 Codex Terra 讓 LINE Cafe Bot 不再每次都從頭認識你","titleZh":"给 LINE 咖啡 Bot 加偏好记忆：只记用户明说出口的那部分","summaryZh":"上一篇让 Cafe Bot 学会在正确时间主动提醒，这一篇给它加偏好记忆。作者刻意没做「从聊天纪录、收藏或行程自动推测喜好」——收藏一间店不等于喜欢它，而且 Bot 自己改了偏好，用户很难知道推荐为什么变了；第一版只接受用户明确说出口的偏好。技术上偏好不存成一段自由文字，而是转成固定的 key（quiet、work_friendly、outlets、late_night 这类），避免同一件事被存成「安静」「安静一点」「不要太吵」三份数据，也让之后的删除、显示和测试都更可靠。Gemini Function Calling 只负责判断意图和挑出合法的 key，真正写进 Firestore 的动作要等用户按下确认按钮后由后端执行，设定、移除、清除都多加一道确认。资料以 LINE userId 为主键，所以群组里 A 设的偏好不会跑到 B 身上。推荐仍走 Google Maps Grounding，提示里加了一条硬规则：只有 Grounding 有支持时才可以把某个偏好说成店家的事实，资料不足必须坦白说无法确认。这一篇他改用 Codex Terra 而不是上一篇的 Sol，理由是这个需求边界清楚、能拆成几个独立且每步可验证的步骤，读既有程式、跨档修改、补测试、部署 Cloud Run 这一整段用 Terra 更划算；遇到大型架构重整或难定位的资安问题，他仍会选 Sol。","whyRead":"第一版故意不做「猜你的喜好」——Bot 自己改了偏好，用户就没法知道推荐为什么变了。","rating":4,"tools":["codex"],"topics":["agent-memory"],"publishedAt":"2026-08-23T16:24:34.000Z","author":"","preScore":14},{"id":"cb499076fc9be6c8","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1236531","titleOriginal":"AI 写了一百万行代码后，我学到了什么","titleZh":"不会写代码的人，让 AI 攒了一百万行之后","summaryZh":"作者自称不会写代码，过去两个月用 AI Coding 做了一个把 PDF、Word、PPT 统一转成 Markdown 的项目，Git 历史累计新增约 101 万行，代码、测试和文档全部由 AI 完成，他只负责决定做什么、以及最后能不能上线。他的几条结论都落在「停不下来」这件事上：AI 不会拒绝需求，你让它加一个状态它就加一个状态，还什么都想展示出来，所以做 AI Coding 不能只不断告诉它增加什么，还得明确说什么不应该出现、什么必须被删除；信息层级和交互没有先设计清楚，再强的模型也只会高效率地做出一大坨，给再多 skills 也没用。测试那一条最硬：覆盖率 90% 产品照样可能不能用，因为 AI 验证的是「系统有没有按照写下来的规则运行」，而这些规则本身就预设了它自己的完成边界——表格提取成功但行列关系乱了、图片和文字都在但位置对不上内容、用户没登录却只提示 credits 不足，这类问题自动化测试一个都查不出来。他现在把「完成」重新定义成：代码写完、已合并、已成功部署，并且用真实文件人工检查过效果。还有一条关于文档：Markdown 适合 AI 做计划、记忆和长程执行，但人读一份塞满它自造概念（Gate、Layer、Package）的长计划只能扫一眼就放行，所以他改用 HTML 控制台来把握关键节点和部署状态。","whyRead":"测试覆盖率 90% 照样不能用——AI 的自动化测试验证的是它自己预设的那条完成边界。","rating":4,"tools":[],"topics":["agent-memory","skills"],"publishedAt":"2026-08-23T03:56:04.000Z","author":"yyzyfish5","preScore":7},{"id":"8cfaa2245040795f","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1236614","titleOriginal":"Grok Build SuperGrok 用量缩水确认","titleZh":"同条件重测：Grok Build 的周额度被砍了一半","summaryZh":"作者用 codex 调 grok build CLI 里的 SuperGrok 正价订阅，牺牲两周额度做了一组同条件对比：模型、xhigh、CLI 版本（两周都是 1.0.5）、350k 输入、64 工具回合、12 路并发和缓存占比都基本相同，平均每百万 token 成本只差约 0.2%（$0.188328 对 $0.187905）。差别只在总量：上周实测新增 239,869,568 token、CLI 等价成本 $45.174066，本周 125,999,903 token、$23.676065；按跑满 100% 外推，上周约 2.4476 亿 token / $46.10，本周约 1.2727 亿 token / $23.92，本周只有上周的 51.998%，推定缩水 48.002%。过程证据同样清楚：本周所有请求在第 23–37 个模型回合就陆续收到 402 Payment Required: Grok Build usage balance exhausted，而上周有 10 个批次能完整跑完约 64 回合。因为提示词结构和缓存比例两周都对得上，他的结论是差异不来自用法，而是本周可用的 Grok Build 周池大约被减半。","whyRead":"版本、并发、缓存比例、每百万 token 成本都基本没变，变的只有跑到 402 之前能烧掉多少 token。","rating":4,"tools":["grok-build","codex"],"topics":[],"publishedAt":"2026-08-23T12:13:50.000Z","author":"dongzhimin","preScore":7},{"id":"b289bbc56dc73722","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7676238032370597940","titleOriginal":"Codex 开放 1M 上下文后，我折腾了一圈才发现：新版根本不是网上教的那样配置","titleZh":"Codex 开了 1M 上下文之后：网上那份 config.toml 会把它配崩","summaryZh":"看到 Codex 开放 1M 上下文，作者照网上教的往 ~/.codex/config.toml 里加了 model_context_window = 1000000 和 model_auto_compact_token_limit = 900000，结果 Codex 直接起不来：Error loading config.toml: invalid type: integer 1000000, expected a boolean in features。他一开始以为是新版本不支持这个值，看清楚才发现关键在后半句——这两行写在了 [features] 之后，于是被 TOML 解析成 features 段下的配置项，而那里要的是布尔值；把 1000000 改成 500000 一样报错，错的是配置层级不是数字大小。接着他进 Codex 执行 /status，看到自己装的是 v0.145.0，由此得出这篇真正的结论：Codex CLI 更新非常快，搜到的 config.toml 示例来自不同时间的不同版本，第一步永远不该是复制别人的配置，而是先确认 CLI 版本、当前模型和账号套餐。最后他也把 1M 这件事本身放回原处：用 Agent 时的核心问题已经从「一次能喂进去多少代码」变成「它能不能自己找到真正需要看的那条调用链、并且全程不丢关键上下文」，模型哪怕支持 1M，每次把大量无关代码读进去照样又慢又费额度。","whyRead":"报错写着 expected a boolean in features，跟数字大小没关系，是两行配置掉进了 [features] 段里。","rating":4,"tools":["codex"],"topics":["context-engineering"],"publishedAt":"2026-08-21T06:33:29.000Z","author":"掘金者阿豪","preScore":16}],"reviewed":34,"dropped":26,"stats":{"sources":254,"fetched":376,"shortlisted":34,"rejected":342,"thin":96,"enriched":100,"failedSources":1},"errors":["酷酷的白 — HTTP 403"]},{"date":"2026-08-23","generatedAt":"2026-08-22T23:10:00.000Z","dailyNote":"掘金今天占了入围名单一多半（16/29），但真读下来几乎全是横评、上手教程和「我做了个 X」，一条能读的都要往下翻。今天最该先读的是 iT 邦幫忙那篇《我讓 Claude Code 自己跑了五個月》——把「有人盯着」和「没人盯着」之间那条线画了出来：改共用白名单漏掉一个变量，下游 agent 不报错也不停，自动退回假后端跑完全程还回报一切正常。同一个系列的 Day 3 接着把触发层写完，连排程全灭三天、锁档路径跟着工作目录漂移这种最难察觉的坑都摊开了；两篇同源同作者，但一篇是账、一篇是实作，都留下了。另外两条是掘金那篇 SDD 实录（六天里让 AI 把自己写的规格推翻四次，拦下两个提权陷阱）和犀利豆拆并行调度的第三篇。毙掉的主要是产品对比稿和方法论稿：后者最费判断，通篇都是「AI 承担 70%-80% 的文档工作量」这种表格，读起来像经验，但作者一次手都没动过。另有一条 linux.do 讲 Codex 的 Office 插件之间搬登录态的帖子，技术含量在今天的论坛帖里最高，但落点是把官号登录态复制给没登录的人，不收——不是质量问题。","items":[{"id":"079069cf953f3116","source":"iT 邦幫忙 · Claude Code 下班之後","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10403459?sc=rss.iron","titleOriginal":"我讓 Claude Code 自己跑了五個月","titleZh":"我让 Claude Code 自己跑了五个月：没人盯着的时候，它出错的样子是「一切正常」","summaryZh":"作者从 3 月起把 Claude Code 当底层 runtime 写一个常驻平台，155 天、905 次 commit、53 万行 Rust。但他要讲的跟这些数字关系不大：他改共用的环境变量白名单时漏掉一个，下游 agent 因此拿不到真凭证——它没报错也没停，自动退回去用测试用的假后端把整轮跑完并回报一切正常，整条链没有一处亮红灯，他是为了别的事翻纪录才看见的。从「claude -p 丢进 cron」这一行往后有五件事在等：它不记得昨天，每次都是全新对话；每次醒来先付一笔过路费——空资料夹里叫它回一句 OK 固定吃掉 51,673 个 token、0.335 美元，一天叫醒 100 次光开机就烧 517 万 token；拿它的自我回报当验收等于让考生自己改考卷；--dangerously-skip-permissions 会把本该停下来问的地方一起关掉；以及最难的静默失败——程式坏掉会喷 stack trace，agent 坏掉常常什么都不喷，只是换一条路走完。","whyRead":"五个月连续 log 换来的五类故障，每一类都只在没人看的时候发生；顺带一个空资料夹里量出来的数字：叫醒它说一句 OK，开机费 51,673 token。","rating":5,"tools":["claude-code"],"topics":["harness"],"publishedAt":"2026-08-17T13:22:53.000Z","preScore":12},{"id":"42d562091e0af944","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7674123634785763364","titleOriginal":"实践6｜SDD 实战：AI 写的规格被推翻了四次","titleZh":"让 AI 回去读代码把自己写的规格推翻：六天四次，拦下两个提权陷阱","summaryZh":"技术经理视角的改造实录：三套 B 端后台分属三个独立 git 仓，认证分属三个代际（自研 Interceptor、Spring Security、Shiro），要一起接集团统一 IAM 的单点登录。作者用 grill-me 拷问需求、to-spec 出 PRD，再进 OpenSpec 拆成四个 change，前后六天约两个人天。他的结论是整套流程最关键的动作不是任何一次生成，而是让 AI 回去读代码、读 DDL，把自己写的规格推翻——六天推翻四次，每次拦下一个会上线的错误：两个提权陷阱、一条断言了不存在的数据库列的验收标准、一个放错模块的架构决策。摸现状那步用三个 agent 各读一个仓，耗时 8 / 23 / 29 分钟；关键是先踩点五分钟、把确切文件路径写进 prompt 再派工。其中一个 agent 报出某 JWT 类对固定 token 跳过验证直接返回超管 userId 却标注「不确定」，作者核源码确认无环境判断，再对比同仓验证码跳过逻辑有 profile 守卫，才升级成 P0。","whyRead":"把「AI 写的规格」当成待推翻的假设而不是待执行的清单——四次推翻各拦下一个会上线的错误，其中一个是同仓另一处代码反证出来的万能 token。","rating":5,"tools":["openspec","cursor"],"topics":["spec-driven","skills","subagent"],"publishedAt":"2026-08-16T10:17:53.000Z","author":"小狼183","preScore":12},{"id":"c17dc9dbc93cc7d0","source":"iT 邦幫忙 · Claude Code 下班之後","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10403815?sc=rss.iron","titleOriginal":"最小可行常駐：讓 agent 自己醒來","titleZh":"让 agent 自己醒来：排程全灭三天、一行错误日志都没有之后重写的触发层","summaryZh":"同一系列的 Day 3，讲 harness 里最不性感、坏掉却最难察觉的触发层。作者的排程有一次全灭三天，没有任何任务跑起来，也没有任何一行错误日志；事后查出两个原因叠在一起：事件汇流排上没有订阅者，事件送出去就掉进虚空；锁档路径跟着工作目录漂移，两个行程各自拿到自己的锁，谁也没挡住谁，真正该跑的分支反被跳过。他把醒来方式分成 cron/interval、事件、讯号三种，最后都收敛成同一个队列，并发控制与执行纪录才有单一的地方可做。系统 cron 用两周就换掉：PATH 只有很基本几个目录，终端里打得出 claude 的人在 cron 里会 command not found；cron 只说有没有执行、不说执行到哪；没有并发控制，两个任务同时到期就开两个。文中给了一段 which_claude() 探测函式（Homebrew、Bun、Volta、asdf、pipx，NVM 还要扫版本目录），他改过四次，每次都因为使用者环境跟他想的不一样。","whyRead":"「没有纪录的自动化等于没有自动化」——三天全灭却零错误日志的两个成因，加一段被真实用户环境逼着改了四次的 CLI 路径探测。","rating":4,"tools":["claude-code"],"topics":["harness"],"publishedAt":"2026-08-19T15:02:34.000Z","preScore":7},{"id":"4414bd770d45b504","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/22/claude-code-agent-loop-03-parallel-dispatch/","titleOriginal":"Claude Code Agent Loop 研究系列（03）—— 从读文件到并行调度","titleZh":"一个 Edit 会把后面所有并行切断：Claude Code 的工具批次调度","summaryZh":"系列第三篇，讲权限批准和 hooks 两层拦截都通过之后，一次 assistant 消息里声明的多个 tool_use 怎么执行。并行更快，但两个工具都要改同一个文件时会互相覆盖，所以 Claude Code 走混合策略：允许 LLM 声明任意多个 tool_use，并行还是串行由 harness 决定。判断依据不是 harness 内部维护一张「Read 能并行、Edit 不能」的表，而是每个 tool 自己声明「我这次能不能安全并行」——Read / Grep / Glob 永远说能，Edit / Write 永远说不能，Bash 视命令而定（git status 可以，rm 必须串行），因为只有 tool 自己知道自己的副作用，新增命令也不用改调度器。打批规则是按声明顺序从头扫，把连续的、都说「能」的打成一批，遇到说「不能」的就切断：Read、Read、Edit、Read 会切成三批，最后那个 Read 虽然能并行，也因被 Edit 隔开而单独成批。批间串行、批内并行。","whyRead":"并行不是 LLM 说了算，是每个工具自己申报的；顺序也算数——夹在中间的一个 Edit 会把它后面本可以并行的读操作全部切成单独一批。","rating":4,"tools":["claude-code"],"topics":["agent-loop","harness"],"publishedAt":"2026-08-22T10:00:00.000Z","preScore":8}],"reviewed":29,"dropped":25,"stats":{"sources":253,"fetched":379,"shortlisted":29,"rejected":350,"thin":153,"enriched":59,"enrichAttempted":141,"enrichRetryAttempted":83,"enrichRetried":1,"enrichSkipped":38,"enrichMuted":["掘金搜索"],"failedSources":1,"feedRetryAttempted":8,"feedRetried":8},"errors":["酷酷的白 — HTTP 403","SegmentFault 搜索 — 部分查询失败（1/29）"]},{"date":"2026-08-22","generatedAt":"2026-08-22T06:20:00.000Z","dailyNote":"DSH 发布进入第二周，入围名单一半在讲它，但真读进源码的只有三条，其余是对比稿、release notes 转述和「一切皆插件」的畅想。今天最该先读的是 iT 邦幫忙那篇《睡一觉醒来，我的 AI 刷了 $40》——服务没挂、数据没错、功能全对，钱一夜之间烧完，作者把这种 LLM 系统独有的「成本故障」拆到三个各自合理的默认值上，止血四刀里最容易被忘的那一刀砍在自己系统外面。另一头是两篇啃源码的：犀利豆把 Claude Code 的 26 个 hook 事件按 loop 生命周期列全了，echoVic 对着 rc.7 的源码核出 DSH 动态包「node:vm 不是安全边界」的那条自白。毙掉的仍以产品自荐（8 席）和文档转述为主，另有一条讲 DSH 破甲写注册机的帖子，技术含量不低，但这本刊物不该把它放首页。","items":[{"id":"795cbdc274efd12e","source":"iT 邦幫忙 · 家用 NAS 自架 Agent 30 天","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10403301?sc=rss.iron","titleOriginal":"Day 22：睡一覺醒來，我的 AI 刷了 $40 美金","titleZh":"睡一觉醒来，我的 AI 烧了 $40：一次没有任何东西坏掉的成本故障","summaryZh":"作者在家用 NAS 上自架的 OpenClaw 排程系统，一夜之间烧掉约 40 美元，是他平常好几个月的量。查 log 后发现没有入侵也没有 bug，每一分钱都是系统按设定花掉的：深夜免费的 Gemini API 开始不稳、请求连续失败，按 fallback 设定自动改用 Claude 旗舰模型；多个排程任务轮流触发，部分又因 timeout 宽松反复重试，而深夜正是他排程最密集的时段。三个根因没有一个是 bug：建 job 时不写 model 栏位就落到「品质优先」的贵预设，他三十几个 job 里好几个是随手建的；框架下拉选单里的 fallback 是升级链不是降级链，画面上只有模型名没有价格，等于把「故障」和「花大钱」焊死在一起；重试无上限，每次重试都是一次完整的 LLM 呼叫。止血四刀按顺序是：所有 fallback 一律清空、失败就发告警等人看；纯文字生成降到 Gemini 免费额度、要跑工具的用 Claude Haiku、旗舰在排程系统里全面禁用；timeout 一般任务压到 120 秒且重试明确限次。第四刀砍在系统之外——在 API 供应商后台给 key 设消费上限，这是四刀里唯一一道不依赖自己系统还活着的闸。全面降级之后，没有任何一个排程任务的产出品质让他觉得变差。","whyRead":"服务没挂、数据没错、功能全对，钱却在一夜之间烧完——这篇把「成本故障」拆到三个各自合理的默认值上，并给出四道闸中唯一不依赖你自己系统的那一道。","rating":5,"tools":["openclaw","claude-code"],"topics":[],"publishedAt":"2026-08-22T00:45:19.000Z","preScore":6},{"id":"a94f8e2b8232df05","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/znlgis/p/22623655","titleOriginal":"给 AI 编程代理集群加\"眼睛\"：一次真实的多模态接入与健壮性加固实录 - 我才是银古","titleZh":"给多代理集群接上「眼睛」：视觉子代理接入与编排器加固实录","summaryZh":"作者在自己的 OpenCode 多代理配置仓库里做了几轮迭代。接视觉能力踩的三个细节：只在 provider 里注册模型不够，OpenCode 默认把模型当纯文本模型，调读图工具直接报 Cannot read image，必须在模型配置里显式声明 modalities；视觉任务本质是「看一眼说结论」的单发任务，vision 代理的 steps 从 40 降到 25，既是成本约束也防止在无意义的工具循环里空转；权限上把它锁成只读（task: deny 不能再嵌套派发，bash 只放行 git status/diff/log/show、rg 这类只读命令），并从编排器侧的 writer agent 名单里移除。编排器的加固不是拍脑袋，而是回放三份真实会话日志得来的：子代理返回空结果且工作区无任何变更时，换更小的单文件任务重试一次，再失败就停下报「子代理基础设施出了问题」，明确禁止反复重试同一任务和编排器自己下场重实现——后者尤其隐蔽，会烧掉本该用于路由的上下文，而且往往干得不如专职代理。上下文卫生三条：编排器不亲自探索（glob/grep 委派给廉价探索代理）、不给自己加载领域技能壮胆、转发前把子代理的完整报告压成紧凑交接摘要。还有一个容易忽略的浪费：planner 验证过的外部库 API 语义，被 reviewer 和复审代理各自重新验证了三遍，改法是把已验证事实写进后续每一次委派。文末另有 JSONC 配置校验器的状态机写法和多代理共享目录时的 git 禁令。","whyRead":"编排器的规则是回放三份真实会话日志挖出来的，其中最隐蔽的一条是「编排器亲自下场干活」——它烧的是本该用于路由的上下文。","rating":5,"tools":["opencode"],"topics":["subagent","skills"],"publishedAt":"2026-08-21T14:12:00.000Z","preScore":6},{"id":"a5098466d8968580","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7675029717569585171","titleOriginal":"从AI Coding到Harness Engineering的端到端工程开发实践","titleZh":"90+ 微服务的后台怎么上 Harness 工程：知识库 + 状态文件驱动的端到端流水线","summaryZh":"腾讯应用宝活动平台团队把对话式 AI coding 换成 Harness 工程的完整记录。起因是四个问题：单窗口上下文快速膨胀、每次开发都要人把业务背景重新捋一遍喂进去、需求交付里测试部署验证等环节仍然靠人、单窗口无法并行。他们的体系分两层——知识库工程（覆盖 4 个业务域 90+ 微服务、800+ 结构化文档）和以「状态文件」驱动的端到端开发工程（需求拆解→澄清→任务拆解→并行开发→单测校验→代码审查→测试环境部署→用例请求构造→接口验证→提交代码，沉淀了 12 个专家 Agent、30+ 业务 Skill 和 10+ 流程脚本）。知识库给每个服务自动生成 8 类文档（overview/interfaces/architecture/dependencies/storage/config/pitfalls/log），接口文档里带近 7 天调用量，用来标注这个接口是不是还活着。检索明确不走 RAG，改成渐进式分层加载 + grep：第一层总览缩小到 1-2 个业务域，第二层 grep meta.yaml 精确筛服务，第三层按查询模式只加载必要文档类型。文档新鲜度检测则是踩出来的——有一次知识库没更新，AI 调了一个老接口，整个链路都通但拿不到预期结果，排查了很久；现在比对 meta.yaml 里记录的 git hash 与仓库 HEAD，超阈值就标记过期并派发增量重生成，增量时保留人工批注、log.md 只追加不覆盖。结尾的分寸也划得清楚：运营看板 100% 由 AI 生成、没人 CR 过，而核心在线业务系统现阶段仍要人守住架构这条线。","whyRead":"最值得看的不是那 800 份文档，是他们为什么放弃 RAG 改走分层加载 + grep，以及一次「AI 调到废弃接口」的漫长排查如何逼出文档新鲜度检测。","rating":5,"tools":["codebuddy"],"topics":["harness","skills","plan-mode"],"publishedAt":"2026-08-18T06:23:54.000Z","author":"Java编程爱好者","preScore":13},{"id":"d968f703cc81d6ba","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/21/claude-code-agent-loop-02-hooks/","titleOriginal":"Claude Code Agent Loop 研究系列（02）—— Hooks：loop 上的可编程干预点","titleZh":"Claude Code 的 26 个 hook 事件：loop 上到底有哪些可编程干预点","summaryZh":"作者「Claude Code Agent Loop 研究系列」的第 02 篇，对着源码把 hooks 机制摊开。核心判断是：权限批准只是 hooks 的一种特化，hooks 才是「用户想在 loop 里插自定义逻辑」的通用答案，覆盖 20 多个不同插入点。文章按 loop 生命周期把 26 个 hook 事件分组列全：Session 生命周期（SessionStart / SessionEnd / Setup / ConfigChange）、用户输入与提交（UserPromptSubmit、Elicitation 及其结果）、Tool 生命周期（PreToolUse / PostToolUse / PostToolUseFailure / PermissionRequest / PermissionDenied）、Turn 与 Stop（Stop / StopFailure）、Task 家族（TaskCreated / TaskCompleted）、Compaction（PreCompact / PostCompact / InstructionsLoaded）、Subagent（SubagentStart / SubagentStop / TeammateIdle）、文件与工作区（FileChanged / CwdChanged / WorktreeCreate / WorktreeRemove）以及 Notification。比清单更值得注意的是 executor 有四类，而不是只有跑命令一种：command 起子进程、靠环境变量拿输入并用 stdout 与 exit code 传决策；prompt 把判断再交给一次模型调用；agent 直接起一个完整子代理跑它自己的 loop；http 把事件发给外部服务，用于公司安全组维护一个中央 policy 服务这类跨机器场景。文末列了对应的源码位置：src/utils/hooks.ts 的中央 dispatcher、services/tools/toolHooks.ts 的 pre/post 触发点、query/stopHooks.ts 里 Stop hook 阻断 loop 的逻辑。","whyRead":"官方文档零散提到的 hook 点，这里按 loop 生命周期列全了 26 个；更容易被忽略的是 hook 不止能跑 shell——还能再调一次模型、起一个子代理、或发 HTTP 给中央 policy 服务。","rating":5,"tools":["claude-code"],"topics":["hooks","agent-loop","subagent"],"publishedAt":"2026-08-21T10:00:00.000Z","preScore":10},{"id":"9c025b952ea17e0a","source":"echoVic","kind":"blog","url":"https://www.echovic.com/blog/ai/pluginization-fifth-era-contract-migration/","titleOriginal":"插件化的第五时代：契约迁移，而非契约消失","titleZh":"从 DLL 到 DSH：插件化的第五时代，契约只是换了地方","summaryZh":"作者把 DLL、OSGi、VS Code 和 DeepSeek Harness 当成四个控制面样本，论证插件系统真正的难题从来不是「能不能调用」，而是每次把外部能力接进宿主都要重答的四个问题：谁可以进入、能看到什么、调用如何被理解、失败后怎样恢复。OSGi 的动态性远强于 DLL，却并没有因此减少契约，反而把原本藏在调用约定里的东西拆成依赖版本、服务属性、权限、启动顺序等更多显式信息；VS Code 的 Marketplace 看着像生态设施，实际承担的是治理工作。落到 DSH 上，他对着 dsh-v0.1.0-rc.7、提交 99f6f02 的源码和测试核过一遍，修正了自己最初的直觉——「everything is a plugin」不等于任意代码可以随时接入：静态路径由 profile、bundle 组合插件，服务通过稳定的 ctx key 暴露，插件用 inject 声明依赖；动态路径由 @deepseek-ai/dsh-cordis-host-runner 的 define 与 run 分开控制，定义阶段只记录元数据并编译检查 host/client 两半，真正的 effect 要到运行阶段才产生，浏览器端还得走页面的运行请求和人工允许。边界也写得很硬：动态包定义只存在进程内存中，重启不会自动恢复；带 session ownership，其他会话不能直接控制；stop 会释放 host half 的 fiber 并撤回浏览器半的运行状态；vmTimeoutMs 只限制同步求值时间，异步主体是合作式信任模型；文档直接声明 node:vm 不是安全边界，动态包应按接近 Bash 的权限来对待。","whyRead":"对着 rc.7 的源码核完才发现，DSH 那句「一切皆插件」背后是一组很硬的边界——包括文档自己写明的「node:vm 不是安全边界，动态包按 Bash 的权限对待」。","rating":4,"tools":["dsh","cordis"],"topics":["agent-loop"],"publishedAt":"2026-08-19T00:00:00.000Z","preScore":8},{"id":"436b72956d54c7a4","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7676350503684915227","titleOriginal":"DeepSeek Harness 从 0 开始：10 Hooks 模块（钩子协议）","titleZh":"自己实现一遍 DSH 的钩子协议：框架和 hooks 插件到底怎么通信","summaryZh":"作者「从 0 开始基于 Cordis 实现一个简化版 DeepSeek Harness」系列的第 10 篇，做的是 hooks 模块。他先指出前面几篇留下的缺口：Cordis 的事件系统（事件洋葱模型、tools 的 pre-execute 瀑布、agent/pre-step、system prompt 的 assemble 瀑布）本来就能拦截，缺的是「谁来决定拦截逻辑」，以及 Claude Code / Codex 各自的 hooks.json 怎么跑在 dsh 的拦截点上。dsh 的答案是把外部 CLI 的钩子协议桥接到 Cordis 拦截点，对应 packages/hooks 下的三个包：hook-protocol（方言无关的 matcher / codec / runner / events 词汇表）、hooks-claude-code 和 hooks-codex。通信链路是：框架在关键节点 ctx.emit 拦截点事件（框架并不知道 hooks 存在），hooks 插件用 ctx.on 监听，收到后 runPoint 按 matcher 匹配 hooks.json 里的钩子组、runHook 执行外部命令、解析输出生成 allow/block 决策，再经事件瀑布 next() 把决策交还框架。几个具体约定值得抄走：matcher 三层匹配（* 匹配所有、字面量用 | 表示或、正则非锚定）；codec 解码规则是 exit 0 读结构化 JSON、exit 2 视为 block 且 stderr 就是 reason、其他退出码算非阻塞错误；runner 要做超时控制并保证基础设施故障不 crash 请求；审计上用 hook/invoked 与 hook/result 配对、靠 handlerId 关联出可重放的完整轨迹。","whyRead":"不是教你怎么配 hooks，而是把「外部 CLI 的 hooks.json 如何被桥接到运行时拦截点」这条链路自己写了一遍，连 exit 2 当 block、stderr 当 reason 这种解码约定都摊开了。","rating":4,"tools":["claude-code","codex","dsh","cordis"],"topics":["hooks","agent-loop"],"publishedAt":"2026-08-21T12:25:10.000Z","author":"两万五千个小时","preScore":10},{"id":"d20ece7f5624fd81","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/20/claude-code-agent-loop-01-tool-approval/","titleOriginal":"Claude Code Agent Loop 研究系列（01）—— 从 tool 声明到执行前的批准","titleZh":"从 tool 声明到执行前的批准：权限是 loop 里唯一让人重新出现的地方","summaryZh":"系列第 01 篇，讲 loop 每一轮里的第一件事。LLM 知道自己能调 Read，是因为一次 API 请求除了 messages 还有 tools 段——每个工具声明由 name、description、input_schema 三个字段组成，其中 LLM 决定要不要调某个工具完全靠 description 写得清不清楚；messages 每轮都变，tools 和 system 在一个 session 内相对稳定。但从 LLM 输出 tool_use 到工具真的执行，中间还夹着一步：权限批准。作者把它定位成「loop 中间无人参与」这个前提的唯一例外——loop 是自己转下去的，没有这层拦截，模型说要 rm -rf 就照做，用户来不及反应；与之互补的是 interrupt（loop 在跑，用户按 Ctrl-C 才停）和 maxTurns（无需用户参与、到轮数上限自动停的硬保险），三者覆盖这个前提的三种必要例外。决定弹不弹窗的规则来自 6 个层级并有明确优先级：denyRule 最高（一律拒绝、不问），askRule 次之（每次都问，不允许记住「总是允许」），再是 classifier 自动判断（只读的 Grep / Read 通常自动过）和用户点过「总是允许」后记住的 alwaysAllow。文末照例给了源码位置，包括 alwaysAllow 的持久化、settings.json 里 permissions 的 schema、PermissionRuleSource 的 6 级来源，以及子代理权限清空的实现。","whyRead":"把权限批准定位成 loop 唯一的人类介入点，并列清了决定弹不弹窗的 6 级规则来源和它们的优先级——包括「askRule 不允许被记成总是允许」这条容易被忽略的设计。","rating":4,"tools":["claude-code"],"topics":["agent-loop"],"publishedAt":"2026-08-20T10:00:00.000Z","preScore":8}],"reviewed":49,"dropped":42,"stats":{"sources":252,"fetched":402,"shortlisted":49,"rejected":353,"thin":124,"enriched":69,"enrichAttempted":127,"enrichRetryAttempted":58,"enrichRetried":0,"enrichSkipped":12,"enrichMuted":["掘金搜索"],"failedSources":3,"feedRetryAttempted":13,"feedRetried":11},"errors":[{"source":"eebk","error":"无法识别的 feed 格式"},{"source":"东评西就","error":"HTTP 503"},{"source":"毛英龙的数字花园","error":"HTTP 503"}]},{"date":"2026-08-21","generatedAt":"2026-08-20T22:36:41.000Z","dailyNote":"DeepSeek Harness 的热度还在，但今天名单里那批「一文讲明白 dsh」「命令大全」「已经 150k star 了」全是转述和播报，一条没收。真有货的是两条把工具当账本算的：银古被 DeepSeek 涨价 3~5 倍逼着重构了整套 OpenCode 配置，Flash-First 重分配、审查预算封顶、thinking 从 Agent 层下沉到 Provider 层，净减 3400 行；另一条把 Docker Sandboxes 支持的 10 个 Agent 逐个起了一遍 sandbox 用 mount 核对，出了一张官方文档没有的表——五个挂、四个不挂、全是读写。日习一技的 Headroom 连载今天来了四篇，按「同一系列别包场」只留了最不重叠的两篇：三大压缩器（输入侧最深的一层）和输出 token 优化（唯一讲模型写回来那一头的）。毙掉的大头仍是产品自荐和文档改写，另有一条掘金的「猫狗搭档法」把配图指令原样留在了正文里，是标准的 AI 编造伪深度文。","items":[{"id":"fa61243e7b4ea8ad","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/znlgis/p/22593954","titleOriginal":"OpenCode × DeepSeek 配置优化实战：一次「费用 和 Token 效率优先」的深度重构 - 我才是银古","titleZh":"DeepSeek 涨价 3~5 倍之后，我把整套 OpenCode 配置重构了一遍","summaryZh":"DeepSeek API 价格实际上涨 3 到 5 倍，作者把自己那套 OpenCode × DeepSeek 双模型配置从头审了一遍，做了三件事。一是 Flash-First 重分配：orchestrator、planner、consultant、ui-builder 全部从 Pro 降到 Flash，Pro 只留深度推理、根因分析、代码审查和重型多文件实现，纪律是「Flash 代理必须自己识别歧义或失败并升级，绝不输出降级答案」。二是审查瘦身：双轴并行改成单遍覆盖，深度按「有效规模」定（≤8 个逻辑文件且 ≤300 有效行走精简路径），预算封成一次初审加最多两次复审。三是把 thinking 从 Agent 的 variant 字段下沉到 Provider 层，Flash 关思考、Pro 默认开，一次性请求因此不再污染 Pro 的 prompt-cache 前缀。技能也砍：gh-cli 649→300 行。净效果 31 个文件、+551/−3932 行。","whyRead":"涨价当天的完整应对：哪些角色从 Pro 降到 Flash、代码审查砍成什么样、thinking 开关该放在哪一层——最后配置净减 3400 行。","rating":5,"tools":["opencode"],"topics":["agents-md","context-engineering","skills"],"publishedAt":"2026-08-20T07:19:00.000Z","author":"","preScore":10},{"id":"7c16de38af5cf0f6","source":"SegmentFault 搜索","kind":"search","url":"https://segmentfault.com/a/1190000048176558","titleOriginal":"Docker Sandboxes 的隔离例外：共享 Skills 与宿主机 MCP","titleZh":"Docker Sandboxes 的两个口子：共享 Skills 是读写挂载，本地 MCP 跑在你的 Mac 上","summaryZh":"Docker 给 sandbox 划了五层隔离，这篇讲的是设计上主动开放、不算穿透的两处例外。一是共享 Skills store：sbx skills import 把技能拷进宿主机的持久化存储，作者导进 11 个 skill，再把 sbx run 支持的 10 个 Agent 逐个起了一遍 sandbox 用 mount 核对——claude、codex、copilot、cursor、droid 五个各自挂在自己的原生路径而不是统一路径，且全部 rw，多个 sandbox 因此共用同一份能互相改写的技能；opencode、shell、gemini、kiro 四个完全不挂，而前两家的官方文档明明写着会扫 ~/.agents/skills，那正是 Docker 已经挂给 codex 的目录。二是宿主机侧的 MCP Gateway：本地 stdio 类型的 MCP Server 实际跑在你的 Mac 上，不在 microVM 里。文末还留了个没测完的口子：SSH_AUTH_SOCK 会转发进 sandbox。","whyRead":"他把 sbx run 支持的 10 个 Agent 逐个起了一遍 sandbox、用 mount 核对，出了一张官方文档里没有的「谁挂、挂哪、什么权限」的表。","rating":5,"tools":["codex","opencode","gemini-cli","cursor","kiro"],"topics":["mcp","skills"],"publishedAt":"2026-08-19T01:05:58.000Z","author":"","preScore":10},{"id":"7fdc55f49535b906","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1235980","titleOriginal":"一念成仙，做自己项目的人肉 harness","titleZh":"不用 Claude Code 也不用 Codex：我给自己的百万行项目当人肉 harness","summaryZh":"作者是独立开发者，项目「一念成仙」从 2021 年写到现在、百万行级代码、60 万用户，2023 年开始引入 GPT 网页版，但至今没用过 Claude Code 或 Codex，每月只付 160 多块的网页版订阅。他的做法是：收到一条用户反馈，先自己定位到出问题的那一块，把它从底层 SQL 到 DAO 再到具体函数及其关联函数整条抽出来，在备忘录里拼成一段上下文，写上「这里我觉得有什么问题、那里要观测什么」，连同日志一起发给模型，只要一段可搜索可定位的小改动；模型回来的一两万字边界对齐他会全部读完，比对哪一点和自己的预期不同，再要一次修正。他说自己后来才意识到，这套活正是现在的 harness 在做的事，而他一直在当那个人肉 harness。前提写得很清楚：只有当开发者对项目的了解精细到某个函数、某一行时才做得成，好处是可控度高于 agent 自带的 harness，代价是这份掌握力本身不能丢。","whyRead":"一个反潮流的对照样本：他坚持只用 GPT 网页版，把「抽上下文、读完全部边界对齐、要一段手术刀 diff」这套活自己干了三年。","rating":4,"tools":["claude-code","codex"],"topics":["harness"],"publishedAt":"2026-08-20T12:27:02.000Z","author":"darkway","preScore":13},{"id":"047ee5f4e0f35fa6","source":"日习一技","kind":"blog","url":"https://i-study-everyday.online/archives/2026/08/headroom-output-reduction.html","titleOriginal":"学习Headroom 的输出 token 优化","titleZh":"同一个系列的另一头：Headroom 怎么压模型写回来的东西","summaryZh":"同一个 Headroom 连载里唯一讲输出侧的一篇。前提是这个代理本身不生成任何输出 token，它只是透明反向代理，能动的只有发出去的请求。输出侧的浪费归成三类：回答前后的寒暄与收尾语、把你刚发过去的代码/diff/工具输出原样再抄一遍、对机械步骤过度 thinking（thinking 同样按输出 token 计费，而输出单价在 Opus 级模型上约是输入的 5 倍）。对应模块叫 Output Shaper，默认关闭，HEADROOM_OUTPUT_SHAPER=1 打开，配置全走环境变量：VERBOSITY_LEVEL 是 0~4 的详略级别（默认 2，4 是电报体），EFFORT_ROUTER 默认开着、负责给机械续写的轮次降档，MECHANICAL_EFFORT 决定降到哪一档（默认 low，填错会回退到 low）。文章顺着 shape_request 的主干把详略引导和努力档位路由两根杠杆逐个读了一遍。","whyRead":"大多数人只盯着「输入烧了多少 token」，而输出侧在 Opus 级别的模型上单价大约是输入的 5 倍——这篇讲一个只能改请求的代理怎么去影响模型愿意写多少。","rating":4,"tools":["headroom"],"topics":["context-engineering"],"publishedAt":"2026-08-14T00:58:00.000Z","author":"","preScore":9},{"id":"ebb6b05cf69bd0ab","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7673211015651213352","titleOriginal":"30 分钟的重复工作，我写了 Claude Code Skill 变成了 8 秒","titleZh":"七套语言文案的搬运工作，我用两个 Claude Code Skill 换成了 8 秒","summaryZh":"项目要维护 7 套国际语言的 JSON 文案，每次迭代的流程是：开发写进一批新的 i18n key，人工逐行翻代码比对新旧 JSON 挑出新增项，整理成表格交产品经理翻译，拿回表格再手动填回 7 个语种。作者把这条链子做成了两个 Claude Code Skill。第一个 /export-diff-to-csv 接一个历史 commit 号，拉出那个版本的基准中文文案文件和当前工作区做深度对比，筛出本次新增的键值，按 RFC 4180 转义生成带日期命名的 CSV；原来翻代码挑 key 要 10 分钟，现在 5 秒。第二个 /convert-excel-to-json 读约定的三类文案 Excel，拆出 7 个语种列，增量合并写回对应 JSON，明确保留历史译文、不做覆盖，也支持 --file 和 --sheets 指定临时表格。整条流程的账是：手动模式 10+5+10+5 共 30 分钟，Skill 模式两条命令合计 8 秒。","whyRead":"一个小到可以照抄的自动化闭环：按 Git 提交差异导出增量文案 CSV，翻译回来再增量合并，全程不覆盖历史译文。","rating":4,"tools":["claude-code"],"topics":["skills"],"publishedAt":"2026-08-13T07:14:04.000Z","author":"坚强小橙","preScore":14},{"id":"e232a594b4fa555a","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7672692746055368750","titleOriginal":"Claude Code的进阶用法2——避开错误用法","titleZh":"Claude Code 进阶用法（二）：哪些去年的最佳实践今年该扔了","summaryZh":"作者四个月前写过一篇 Claude Code 进阶用法，回头看已经不合时宜，于是重写了一篇「避开错误用法」。核心判断是模型和 agent 自身变强之后，去年那批重型外挂开始变成负担：superpowers 内置 13 个技能、token 消耗明显增大，简单问题也会不知不觉触发它，建议换成需要手动触发的 openspec，只留 /brainstorming 和 /writing-plans；只有用 MiniMax M3 这类较弱模型时才值得留全套。他自己的组合是 grill-me + openspec + 高性能模型。另外几条：改代码不必再动全局配置，直接在对话框选 Bypass permissions；回退改动用原生 Checkpointing（连按两次 Esc 或 /rewind）；everything-claude-code 会一次拉上百个 skill，多数是旧时代产物，白占上下文还可能拉低产出质量。","whyRead":"一篇把「过期的正确答案」逐条点名的短文：superpowers 太重、everything-claude-code 别再用、改全局配置不如直接切 Bypass permissions。","rating":4,"tools":["claude-code","codex","superpowers","openspec"],"topics":["skills","claude-md"],"publishedAt":"2026-08-11T11:36:31.000Z","author":"圊妖","preScore":12},{"id":"64e1dc47b76dc263","source":"SegmentFault 搜索","kind":"search","url":"https://segmentfault.com/a/1190000048124022","titleOriginal":"实战从零开始构建一个Coding Agent：Violin ｜得物技术","titleZh":"用 Zig 从零写一个 Coding Agent：Violin 的分层与 Agent Loop","summaryZh":"作者每天用 coding agent，想弄明白原理，于是自己写了一个叫 Violin 的：架构借鉴 Pi 的三层分离（模型适配层 / 内核层 / 产品层）、EventBus 事件驱动、工具注册表和插件系统，但引擎侧从 TypeScript 换成 Zig，客户端用 Python 搭终端 UI，两者走 TCP + JSON line 协议——他的技术栈恰好是 Zig + Python，不会 JS 也不熟 Rust。分层的理由讲得具体：ai 层把各家供应商对工具调用、推理内容、缓存、错误、OAuth、流式协议的不同表达拍平成统一事件，上层就不必知道面对的是 Anthropic 的 tool_use 还是 OpenAI 的 function call。Agent Loop 的核心代码也贴了：一个带 max_turns 上限的 while 循环，在问模型和执行工具之间来回切，工具结果 append 回 messages，并按错误种类区分能不能重试。","whyRead":"照着 Pi 的三层架构自己重写一遍，换成 Zig + Python 双语言，把「Agent Loop 到底是个什么循环」摊到能读的代码量。","rating":4,"tools":["pi","claude-code","codex","opencode","qoder"],"topics":["agent-loop","skills"],"publishedAt":"2026-08-06T02:58:06.000Z","author":"","preScore":10},{"id":"e61944dc6c18407d","source":"日习一技","kind":"blog","url":"https://i-study-everyday.online/archives/2026/08/headroom-compressors.html","titleOriginal":"学习 Headroom 的三大压缩器","titleZh":"Headroom 的三大压缩器：JSON 数组怎么被统计着压掉","summaryZh":"啃 Headroom 源码的连载之一，讲 ContentRouter 分流之后的三个压缩器：处理 JSON 的 SmartCrusher、基于 tree-sitter 做 AST 感知的 CodeAwareCompressor，以及作者自训、本地推理的文本压缩模型 Kompress。重点在 SmartCrusher，它的 Python 实现已整个搬到 Rust。它不是上来就压：先逐个字段统计出 FieldStats（类型、出现次数、unique_ratio、是否恒定，数值字段另记方差和变化点），据此把数组判成 time_series / logs / search_results / generic，再由 select_strategy 映射到四种压缩策略。两个门槛值得看：元素少于 min_items_to_analyze 直接不压；认出 logs 还不够，还要 message 字段 unique_ratio \u003c 0.5 才真走聚类，因为聚类压的就是重复模板。","whyRead":"不是转述文档——他直接翻到 Rust 那边的 FieldStats 和 select_strategy，把「数组认成什么类型就用什么策略」这张映射表连门槛条件一起抄了出来。","rating":4,"tools":["headroom"],"topics":["context-engineering"],"publishedAt":"2026-08-03T07:09:00.000Z","author":"","preScore":9}],"reviewed":35,"dropped":27,"stats":{"sources":251,"fetched":448,"shortlisted":35,"rejected":413,"thin":167,"enriched":90,"enrichAttempted":179,"enrichRetryAttempted":89,"enrichRetried":0,"enrichSkipped":41,"enrichMuted":["掘金搜索"],"failedSources":1,"feedRetryAttempted":8,"feedRetried":7},"errors":[{"source":"码农刚子的开发笔记","message":"HTTP 503"}]},{"date":"2026-08-20","generatedAt":"2026-08-19T22:23:06.310Z","dailyNote":"DSH 发布周走到第三阶段：前两天是官方文档改写和「我给 DSH 做了个 X」，今天入围名单里最有货的一批换成了拆仓库的人。四篇里三篇是读代码——罗西那篇拆 5 美元芯片上的 OpenClaw 怎么用一个 read_file 换掉整套 RAG，还给了六种会塌的场景和临界值，是今天最该先读的一篇；另两篇一篇翻 DSH 的 .agents/ 目录，一篇从包结构讲它的插件化到底兑现在哪。剩下那篇是把连载八天的 Code Review 规则交给 Claude Code 生成 Skill 的实录，17 道反问逐条列了表。毙掉的大头仍然是自荐：36 个入围席位里 8 席是「我做了个插件/框架/启动器，来用」，其中最难判的是 V2EX 那篇《影分身之术》——主会话想清楚、Fork 出去写代码、Receipt 自动回传，工作流复盘写得相当扎实，但结尾落在自家仓库和 B 站视频的收藏数上，按同一把尺子不收。另外整类不收的还有 SegmentFault 那两篇「10 个落地场景」「架构深度对比」——原料是官方文档和社区讨论，不是作者的手。","items":[{"id":"6c1bfeb748b008ed","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/rossiXYZ/p/22432445","titleOriginal":"【OpenClaw具身硬件】MiniClaw 阅读笔记---(4) 文件读写 - 罗西的思考","publishedAt":"2026-08-19T13:37:00.000Z","author":"","preScore":8,"titleZh":"5 美元芯片上的 OpenClaw：用 LLM 自己 read_file 换掉整套 RAG，以及它什么时候会塌","whyRead":"把「不建索引、让模型自己读文件」这个选择拆到能判断的粒度——六种失效场景各带触发条件和临界值，不是泛泛地说 RAG 过时了。","summaryZh":"MiniClaw 是跑在 5 美元 ESP32-S3 上的 OpenClaw 实现：纯 C，没有 Linux 和 Node，记忆全存本地 Flash。这篇阅读笔记盯住它最反直觉的一处设计——不做 embedding、不建向量库，只注册一个 read_file 工具，让 LLM 按目录页自己决定读哪份文件。作者先说清它为什么能成立（上下文里始终有一张「地图」、prompt 协议要求先读目录再精读、文件系统当扁平知识库），再逐个拆六种崩塌场景：文件数超过目录页极限、文件名不再语义自描述、换成不够强的小模型、延迟敏感的实时控制、多用户并发写同一份记忆、知识是连续长文而非离散文档。每种都给了触发条件、补变手段和临界值（单文档超过 8KB 的 tool_result 上限就必须切分，32KB 基本只能回到经典 RAG），最后归成一张「出现什么信号该补什么、多紧迫」的决策表。","rating":5,"tools":["openclaw"],"topics":["agent-memory","agent-loop","skills"]},{"id":"6638936644cbcd0a","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7674828652658425896","titleOriginal":"DeepSeek Harness 发布后，我没急着跑 Demo，先把 `.agents/` 翻了一遍","publishedAt":"2026-08-17T09:32:33.000Z","author":"小u","preScore":10,"titleZh":"DeepSeek Harness 的 .agents/ 目录：11 个 Skill、684 份决策记录，仓库自己在教 agent 怎么改自己","whyRead":"它把规则、流程、当初为什么这么定拆成三种文件分开放，是一套能直接照搬到自己仓库的 AGENTS.md 分层法。","summaryZh":"作者说他没急着跑 demo，先把 DSH 仓库的 .agents/ 翻了一遍：11 个 Skill、684 份英文 Agent Note，多数还配着中文版本。他梳理出四层分工——根目录 AGENTS.md 放长期有效的仓库规则，各子目录自己的 AGENTS.md 放附加规则，.agents/skills/ 放「这类任务该怎么做」的按需加载流程，.agents/notes/ 放「当初为什么这么选」，再由 scripts、hooks 和 CI 检查有没有做到。文中摘的硬规则里最值得抄的是 Model-visible \u003c=\u003e logged：凡是进入模型请求的内容都必须有对应的 Session Event，否则代码、聊天记录和模型真正看到的上下文对不上，排查只能靠猜；这条能直接拿来做代码评审的判据。CLAUDE.md 则链到同一份 AGENTS.md，避免两套规范过几个月必然漂移。作者也主动说明，仓库并没有声称代码全部由 AI 生成。","rating":5,"tools":["dsh","claude-code","codex"],"topics":["agents-md","claude-md","skills","hooks","agent-loop"]},{"id":"6ad98812be3657ee","source":"iT 邦幫忙 · AI Code Reviewer 養成","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10403765?sc=rss.iron","titleOriginal":"Day 11｜第一份 Skill：交由 LLM 開工！Claude Code 26 分鐘生出整份 Skill","publishedAt":"2026-08-19T08:47:01.000Z","author":"","preScore":8,"titleZh":"把连载 8 天的 Code Review 规则交给 Claude Code：26 分钟生出一份 Skill，中间被反问了 17 题","whyRead":"完整贴出了初始 prompt，其中「素材里哪些是规格、哪些只是叙事」这条硬性要求，是拿旧文章喂 Skill 生成时最容易漏写的一条。","summaryZh":"作者把自己前八天连载写下的 Code Review 规则当素材，让 Claude Code 生成一份叫 nathan-code-review 的 Skill。初始 prompt 的硬性要求写得很细：Skill 正文用英文、与使用者的交互报告用繁中、SKILL.md 只留触发判定和流程骨架、九面向细则和 GitLab API 参考放 references/ 按需加载、每个外部工具（trivy、opengrep、ruff）都要定义「不存在时跳过并在报告里揭露」的分支；最关键的一条是素材来自连载文章，必须区分规格与叙事——流程、判准、豁免情境要完整编入，演进故事、科普比喻、安装教学和「明天待续」一律不得写入，分不清的要在讨论阶段列出来问，不许自行猜测。模型读完素材先报告它把刀切在哪，再分八组提出 18 个待裁决问题（实际问了 17 个，有两题因前一题已答被合并），每题三个选项、标出建议并附一个预览方框；文中把 17 题和作者的决定逐条列成表。","rating":4,"tools":["claude-code"],"topics":["skills","subagent","harness"]},{"id":"d9e51ca44451ddc3","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7673465077635186707","titleOriginal":"AI 深度技能之-解读DeepSeek Harness（一）- 初见","publishedAt":"2026-08-14T03:55:37.000Z","author":"茶马古道的搬运工","preScore":9,"titleZh":"读 DeepSeek Harness 源码：没有特权内核，连 Agent 循环本身都是一个插件","whyRead":"把「一切皆插件」这句口号落到代码结构上——工具执行的六道关、七种 subagent 实现、沙箱按平台换 provider，每一处都点到具体包名。","summaryZh":"拆的是 dsh 仓库本身，作者数出 1247 个 TS 源文件和 684 个测试文件，技术栈是 pnpm workspace 加 Cordis 框架。文章按五个痛点组织：核心不可改——agent-loop 自己就是插件，挂一个自己的循环就能替换，其他插件不动；工具策略是后补——工具执行是三层 waterfall 事件加一层 monotonic guard，从 pre-execute 的权限与沙箱拦截，到 post-execute 的 accept/block/replace，一次调用过六道关；会话状态漂移——Session Log 是唯一真相源，想给模型塞一个新的可见输入必须先发明一个 session event；subagent 实现五花八门——同进程、fork 会话、委托 Codex、委托 Claude Code、走 ACP 等七种统一成一个 provider 接口；沙箱不可移植——Landlock、Seatbelt、E2B 抽象成 ctx.sandbox，原生 Landlock 还写了 C 扩展。","rating":4,"tools":["dsh","cordis","claude-code","codex"],"topics":["harness","agent-loop","subagent","acp"]}],"reviewed":36,"dropped":32,"stats":{"sources":250,"fetched":320,"shortlisted":36,"rejected":284,"thin":94,"enriched":44,"enrichAttempted":65,"enrichRetryAttempted":21,"enrichRetried":0,"enrichSkipped":0,"enrichMuted":[],"failedSources":1,"feedRetryAttempted":7,"feedRetried":7},"errors":[{"source":"Phodal 黄峰达","message":"HTTP 403"},{"source":"掘金搜索","message":"部分查询失败（1/30）","partial":true}]},{"date":"2026-08-19","generatedAt":"2026-08-18T22:22:28.739Z","dailyNote":"DSH 发布周进入第二阶段：官方文档改写的「完全指南」退潮，接力的是一整排「我给 DSH 做了个 X」——插件目录站两个、精选榜一个、桌面发行版一个、社区发行版一个、额度查询 CLI 一个，落点都在让你去用它，一条没收。今天真正好看的是三篇不追热点的：犀利豆把 Claude Code 散在四个工具里的 background 机制拼成一张图，结论是它根本不是工具而是执行模式；lqhl 拿 Worse is Better 那套框架把 Pi 和 DSH 摆到一起，最后给 DSH 开了张举证清单；罗西读到 MiniClaw 的 C 文件里，把具身 agent 的护栏（GPIO 19/20 永久禁用、写文件走路径白名单）挖了出来。另外两篇是老实的翻车记录：V2EX 那位四个月五轮试错、被 mock 假数据坑了很久，zelikk 让 agent 改 Telegram 客户端第一版编译出来是无效的。毙掉的大头除了自荐帖，还有一篇博客园的「私有化部署丝滑体验」——对比表做得像实测，但把 vLLM 的 --enable-prefix-caching 记在了 Harness 头上，属于说得像实测的伪深度文。","items":[{"id":"fcc6343666d4de18","source":"犀利豆的博客","kind":"blog","url":"https://xilidou.com/2026/08/15/claude-code-tools-background/","titleOriginal":"Claude Code Tools 研究系列（十四）—— Background：一种正交的执行模式","titleZh":"Claude Code 里没有 Background 这个工具，因为它是一种执行模式","summaryZh":"犀利豆「Claude Code Tools 研究系列」第十四篇，也是系列第一篇专题：不拆某个工具，而是把散在 Bash、Agent、Monitor、Cron、TaskStop 里的 background 能力放到同一张图上看。结论是 Claude Code 里没有一个独立叫 Background 的工具，这不是遗漏而是设计选择——它是一个执行模式参数，三类后台任务（一次性完成通知、定时触发、持续事件流）共用同一套 task_id 与 TaskStop 接口，形状对应 Unix 的 fork/wait。文章逐条引工具描述原文，指出 Bash 的 run_in_background 默认 false 而 Agent 默认 true 反映的是典型用法差异，点出「不许 sleep 轮询、harness 会自己发通知」这条行为规则，也挑明 Task 一词同时指待办事项和后台实例造成的语义碰撞。约八千字，无任何推广。","whyRead":"同一个 run_in_background，Bash 默认关、Agent 默认开——两个相反的默认值，作者给出了理由。","rating":5,"tools":["claude-code"],"topics":["subagent","harness","agent-loop"],"publishedAt":"2026-08-15T10:00:00.000Z","author":"","preScore":8},{"id":"de45ea0da5c75843","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/rossiXYZ/p/22432402","titleOriginal":"【OpenClaw具身硬件】MiniClaw 阅读笔记---(3) 接口 & 混合智能 - 罗西的思考","titleZh":"读 MiniClaw 的接口层：端侧 agent 的护栏是硬编码在 C 文件里的","summaryZh":"「OpenClaw 具身硬件」阅读笔记第三篇，读的是 MiniClaw 跑在 ESP32-S3 上的感知/执行接口与端云协同。感知接口分 Push（推送式）和 Pull（拉取式）两种范式并给出分工，执行接口则统一成「万物皆 tool」且对 LLM 完全对称，回复是隐式的默认执行。作者强调两侧的不对称：感知更自由、执行更受限，感知有 Push+Pull 两路而执行只有一路，感知数据可以积累而执行结果一锤定音。护栏部分点到具体实现——gpio_policy.c 里 GPIO 19/20（USB Serial/JTAG）永久禁用，tool_files.c 对写入做路径校验，还列了 MIMI_GPIO_ALLOWED_CSV、MIMI_CRON_MAX_JOBS=16 这类配置项。后半讲端云协同的四层智能架构与「信息密度沿流向单调递增」的设计原则。","whyRead":"GPIO 19/20 永久禁止、写文件走路径白名单——具身 agent 的安全边界长什么样，这里有实现级的答案。","rating":4,"tools":["openclaw"],"topics":[],"publishedAt":"2026-08-18T13:23:00.000Z","author":"","preScore":7},{"id":"eeba046ebc52b3fc","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/lulight/p/22554886","titleOriginal":"【Azure APIM】在 Azure API Management 中配置 SSE Transport 的 MCP Server：从 App Service 到 APIM 的一次实践 - 编码者卢布","titleZh":"APIM 门户里没有 SSE 这个选项：直接打 Management REST API 挂 MCP Server","summaryZh":"作者把一个 MCP SSE 服务部署到 Azure App Service 并用 MCP Inspector 验证通过，接下来想让 API Management 当统一入口透传 MCP 请求，却发现 APIM 门户里根本没有把 Transport Type 设成 SSE 的 UI 控件，只能直接调 Management REST API 创建 MCP API。文章把两处卡点的报错原样贴出：只配 serviceUrl 不配 backendId 会得到「Either BackendId or MCP tools must be set, but not both for MCP API」；在 Azure 中国区用 2025-09-01-preview 会得到 NoRegisteredProviderFound，错误信息里列出的可用版本是 2024-10-01-preview，改用它才通。最后给出替换占位符即可执行的 CMD 脚本，整条链路是 MCP Inspector → APIM Gateway → App Service 上的 MCP SSE Server。","whyRead":"两个把人卡住的报错原文都贴了，包括中国区不支持 2025-09-01-preview 那条。","rating":4,"tools":[],"topics":["mcp"],"publishedAt":"2026-08-18T11:44:00.000Z","author":"","preScore":12},{"id":"0a5cf0e7a3ed0748","source":"ICDYCT我能你也行","kind":"blog","url":"https://zelikk.blogspot.com/2026/08/forkgramtdesktop-by-hermes.html","titleOriginal":"修改 forkgram/tdesktop 实现 屏蔽音频/视频按钮功能 by Hermes 对接 opencode/deepseek-v4-flash-free","titleZh":"让 agent 改 Telegram 桌面客户端：第一版编译出来功能是无效的","summaryZh":"作者不用 Telegram 的音视频功能，想把输入框最右边那个音频/视频按钮禁掉，于是把 forkgram/tdesktop 这个 C++ 桌面客户端交给 Hermes（对接 opencode/deepseek-v4-flash-free）改。全文由他发给 agent 的自然语言原文和截图串起来：他先描述按钮位置并配图说明，agent 改完第一版编译出来功能无效——消息窗口未输入文字时按钮照旧显示，他把测试结果原样反馈回去，agent 又忙了一通才说这次对了；接着他追加要求，把这个功能做成 Fork Settings 菜单里的开关项。最终效果是文本框为空时显示发送按钮而不是音视频按钮，仓库和 release 都挂在文末。改别人的大型 C++ 客户端正是 agent 容易翻车的场景，这篇的价值在于翻在哪一步是可见的。","whyRead":"完整贴出了发给 agent 的自然语言原文，包括那句「我测试你的编译结果，没有实现我想要的功能」。","rating":4,"tools":["opencode","hermes"],"topics":[],"publishedAt":"2026-08-18T09:00:26.000Z","author":"","preScore":7},{"id":"ba02035b8c967adc","source":"LQ's Blog","kind":"blog","url":"https://lqhl.me/blog/two-paths-to-agent-friendly-systems/","titleOriginal":"Pi 与 DeepSeek Harness：Agent-Friendly 的两种组合方式","titleZh":"Pi 与 DeepSeek Harness：复杂性该放进框架，还是留给文件和进程","summaryZh":"两个项目都在回答「怎样的软件更适合 Agent 使用和修改」：Pi 默认只给模型 read/write/edit/bash 四个工具，把后台任务交给 tmux、工作流交给脚本、持久化交给文件；DSH 建在 Cordis 上，把模型、工具、会话、沙箱乃至 Agent Loop 全做成 Plugin，由统一的 Service、Event 和生命周期机制连接。作者借 Gabriel 的 Worse is Better 与 MIT Approach 给两者定位，列出对照表（组合发生在哪、状态持久化在哪、失败怎么恢复、复杂性由谁承担），核心判断是统一机制不消灭复杂性、只重新安排复杂性：加一个 Provider 更容易了，理解一次完整执行却更难。他更看好 Pi——让记忆长寿、让进程短命，重启比在运行时里正确卸载组件更容易推理。结尾给 DSH 列了五条举证责任。","whyRead":"同一个问题的两种相反答案，作者站 Pi，并给 DSH 开了一张需要用真实使用来回答的举证清单。","rating":4,"tools":["dsh","pi","cordis"],"topics":["agents-md","agent-memory","harness","agent-loop"],"publishedAt":"2026-08-18T06:57:23.000Z","author":"","preScore":11},{"id":"429f07f2d55ffcbd","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1235223","titleOriginal":"Vibe Coding 近四个月有感","titleZh":"Vibe Coding 四个月五轮试错：从照搬大厂流程到「代码只是业务的耗材」","summaryZh":"作者从搜广推转到 web 后端，用五段复盘写完这四个月。Round 1 拿大厂设计先行的流程套新工具，代码写出来自己看不懂，结论是不够快；Round 2 干脆把 PRD 直接丢给 Claude 全权代劳，快，但业务逻辑被直译成面向过程的代码，改的时候无从下手，还踩到 WorkBuddy 悄悄 mock 假数据、很后面才发现，形容是在屎山里刨屎；Round 3 才悟出规矩得自己定：硬看代码，把重复出现的部分让 AI 抽成框架、组件和工具包，之后定位问题才变得迅速清晰；Round 4 是视角转换——他给的数字是大厂项目里真正对着编辑器写代码只占 20-30%，其余在设计文档，而 startup 只要快，屎山影响到业务再动不迟。全文无推广。","whyRead":"最贵的一课是 AI 悄悄给他 mock 了假数据，直到很后面才发现。","rating":4,"tools":["claude-code","cursor","workbuddy"],"topics":["vibe-coding","harness"],"publishedAt":"2026-08-18T02:46:56.000Z","author":"pursuit","preScore":12},{"id":"f3a88a146b380d3a","source":"Kuhung 谷粒","kind":"blog","url":"https://kuhung.me/posts/how-to-manage-skills-for-agent/","titleOriginal":"从单 Agent 到跨 Agent 的 Skills 管理","titleZh":"六十多个 skill 散在三个 agent 里：他没做同步工具，只用了软链","summaryZh":"作者同时用 Claude Code、Codex 和 Cursor（之前还有 Gemini CLI），各家 skill 目录攒到六十多个之后遇到的麻烦不是别人说的召回打架，而是 skill 没有全局安装——在 Claude Code 里用顺手的 grill-me（动手前先让 AI 把方案问透）切到 Codex 就得重装。他的解法分两层：32 个通用 skill 放进两个 git 管理的仓库，软链到 ~/.agents/skills/ 再挂进各家目录，改一次源文件全 agent 生效；另外二十来个和具体 agent 强绑定的留在原生目录里不动。文章明说这是折中——各家「支持 skill」不等于「保持同步」，与其做一个注定跟不上的大一统工具，不如把共享层和专用层划清楚。","whyRead":"跨 agent 的 skill 问题不是上下文腐败，是换个工具就要重装一遍。","rating":4,"tools":["claude-code","codex","gemini-cli","cursor"],"topics":["skills"],"publishedAt":"2026-08-05T03:41:14.000Z","author":"","preScore":8},{"id":"5d197461fcf9a8b0","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7668909646717173806","titleOriginal":"从 Codex + Obsidian 到本地 RAG：我的私人知识库实践","titleZh":"把 Codex 接到 Obsidian 目录上：先跑通一次，再 Skill 化，最后才定时","summaryZh":"作者让 Codex 直接读写 Obsidian 的本地 Markdown 目录，不搬进任何封闭系统。知识库只留两层：收集箱保存原文和出处，wiki 保存综合多份材料后的当前结论。规则按层级拆开——AGENTS.md 当项目宪法（目录职责、来源标准、一次只改一个文件、写完立即复读），整理动作写成 $organize-knowledge-base Skill 固定顺序，最后才加每日定时唤醒。关键设计是内容指纹：整理开始和结束都对收集箱做快照，没变化立即退出，有变化也要等页面、索引、来源、链接全部验证通过才提交新指纹，中途失败则保留已完成文件、旧指纹不动。他的顺序结论是先做出一次可接受结果、再 Skill 化、最后才自动化，因为过早自动化会把重复页和无来源结论一起放大。Wiki 稳定后才补上本地 RAG。","whyRead":"自动整理最容易制造的假忙碌是「没有新材料也重写一遍」，他用内容指纹把这条路堵死。","rating":4,"tools":["codex","obsidian"],"topics":["skills","agents-md"],"publishedAt":"2026-08-01T12:55:44.000Z","author":"石榴","preScore":14}],"reviewed":60,"dropped":52,"stats":{"sources":248,"fetched":513,"shortlisted":60,"rejected":453,"thin":151,"enriched":135,"enrichAttempted":210,"enrichRetryAttempted":139,"enrichRetried":64,"enrichSkipped":0,"enrichMuted":[],"failedSources":0,"feedRetryAttempted":6,"feedRetried":6},"errors":[{"source":"掘金搜索","message":"部分查询失败（1/30）","partial":true}]},{"date":"2026-08-18","generatedAt":"2026-08-17T22:21:29.730Z","dailyNote":"今天的入围名单被 DeepSeek Harness 的发布周整个盖住了——57 条里十几条是 DSH，形状高度一致：官方文档改写的「完全指南」、三款 Harness 的 SEO 对比稿，以及 V2EX 上一批「我写了个 DSH 插件 / 客户端 / 目录站，欢迎大佬拍砖」。这类东西看着最像折腾，落点却都在让你去装它，所以只留了一篇真把它跑到服务器上、写清三处坑的部署记录。八篇里建议先读那位医院资讯人的 Day 1：AI 把数据库密码写进设定档只是开头，真正扎人的是他自曝容器防火墙少写两个引号，里面的 AI 因此能自己重建整道白名单墙，而画面照样印着「已验证」。想看钱的账，就去看那篇拿 161 个会话对出来的成本审计。","items":[{"id":"667668701f3adae4","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1234919","titleOriginal":"如何最大化 Claude Code Session 的价值","titleZh":"拿 161 个 Claude Code 会话对账：缓存写入只占 2.9% 的 token，却吃掉 31.5% 的钱","summaryZh":"Anthropic 8 月 14 日发了《Maximizing the value of your Claude Code sessions》，作者没有全篇复述，而是划出几条容易被忽视的机制：输出价约为输入的 5 倍，差在 Prefill 是计算密集、Decode 是内存带宽受限；首次写入缓存最高 2 倍输入价，是「贵一次省后面所有轮」；启动时加 MAX_THINKING_TOKENS=0 比 /effort low 更激进一档。然后拿自己的操作日志对账：161 个会话、36 个项目、934 条指令，1.51B token、1,638 美元，每条指令中位数 1.35 美元、P90 4.28 美元，平均跑 11.8 轮。构成上缓存读取占 96.4% 的 token 但只占 50.5% 的成本，缓存写入占 2.9% 的 token 却占 31.5% 的成本。据此列的 7 项改进合计约省 20%。","whyRead":"官方那篇最佳实践只讲机制，他读完回头把自己 36 个项目、934 条指令的真实账单审计了一遍。","rating":5,"tools":["claude-code"],"topics":["context-engineering"],"publishedAt":"2026-08-17T03:07:19.000Z","author":"kuhung","preScore":10},{"id":"663252cb5c294d94","source":"Innei","kind":"blog","url":"https://innei.in/posts/tinkering/ai-era-dev-workflow-review-and-verify","titleOriginal":"AI 时代我的开发工作流：从踩坑复盘到多项目并行验证","titleZh":"从踩坑复盘到多项目并行验证：一个人同时推进四五个项目的工作流","summaryZh":"作者同时维护 mx-space、afilmory 等五个项目，年初每月消耗 50 亿到 60 亿 token，到八月两天就能用掉这么多，翻了 15 倍。文章讲两件事。一是怎么把「踩坑会话」变成资产：他给自己的网站写了 CLI，因为 AI 操作 CLI 比直接操作 MCP 和调接口方便得多；再用一份 Skill 把长对话自动收成一篇技术文章外加一个 Skill。那份 Skill 是分层的，SKILL.md 只有 368 行、只负责判断要不要做，references/ 1041 行按需加载不进默认上下文，scripts/ 只放确定性操作，为的是避免规则一次性堆进上下文导致注意力丢失。二是多项目并行靠自动化验证兜底。他还坦白网站上最近五六篇技术文完全由 AI 生成，并专门加了「无 AI 写作」筛选。","whyRead":"年初一个月烧 50 亿 token，八月两天就烧掉同样的量；他干脆把踩坑会话直接沉淀成文章和 Skill。","rating":5,"tools":[],"topics":["skills","mcp","context-engineering"],"publishedAt":"2026-08-16T16:32:40.000Z","author":"","preScore":8},{"id":"ec30add61f172d04","source":"iT 邦幫忙 · 一個人的 IT 部門","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10401880?sc=rss.iron","titleOriginal":"D02   AI 的記憶會過期，而且它不知道自己過期了","titleZh":"AI 的記憶會過期，而且它不知道自己過期了","summaryZh":"一台机器的收发件系统，Claude 照着几个月前写进长期记忆的资料表名回答，一查表名根本不是那个，错了好几个月没人发现。作者由此立规则：记忆只能当线索，凡涉及档案、资料表、参数名称一律重新查证过才能写进结论。文章还记了几笔具体的坑：Whisper 服务重开机不会自己回来，Claude 连着遇到三次才承认「这是这台机器的个性」，于是写成标准流程存进记忆；远端写 root 档案时用管线把密码喂过去，指令会成功、档案会建立，然后密码就躺在文件第一行；多个 session 同在一个仓库时，Claude 真的把另一个 session 改到一半的东西提交上去过。全域 CLAUDE.md 最后被他砍到只剩四条。","whyRead":"长期记忆里那个资料表名错了好几个月都没人发现——于是他定下「记忆只能当线索，不能当事实」。","rating":5,"tools":["claude-code"],"topics":["agent-memory","claude-md","subagent"],"publishedAt":"2026-08-13T20:22:25.000Z","author":"","preScore":8},{"id":"92d3edf61d3cf3fa","source":"iT 邦幫忙 · AI Code Reviewer 養成","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10402218?sc=rss.iron","titleOriginal":"Day 1｜一場演講講不完的事：它很好心地幫我把資料庫密碼寫進設定檔","titleZh":"它很好心地幫我把資料庫密碼寫進設定檔：一名醫院資訊人的 AI Code Review 實錄","summaryZh":"作者在医院资讯部任职。五月他请 AI 整理一份设定档，AI 自己把数据库密码找出来填了进去，准备 commit——「它没有做错任何一个步骤」。由此盘出五种常态：指引被忘记、架构歪掉、测试变得不可信、机密外泄、供应链投毒。文中给了实际数字：每周经手 40~50 个 MR、跑 150~200 次审查，单次审查等值 API 成本中位数 5.75 美金（统计自 64 次实际审查），年化约省 1,200 到 1,600 小时。最扎人的是他自曝的三件演讲里一句话带过的事：那份 skill 现在有二十几个文件五千多行；容器防火墙少写两个引号，AI 因此能自己重建整道白名单墙而画面照样显示已验证；把当时 16 条规则逐条盘一次，结果一条都没退役。","whyRead":"他自曝容器防火墙配置少写了两个引号，里面的 AI 因此能自己把任意域名加进白名单、把整道墙重建，而画面照样印出「防火牆已驗證」。","rating":5,"tools":["claude-code"],"topics":["skills","subagent"],"publishedAt":"2026-08-09T19:17:30.000Z","author":"","preScore":10},{"id":"5b5d1bb3fffe800b","source":"博客园首页","kind":"aggregator","url":"https://www.cnblogs.com/yonlin/p/22518708","titleOriginal":"【解决方案】Codex Cli 复制多行提示词到输入框，可能截断提示词，导致提示词不完整的解决方案 - yonlin","titleZh":"Codex CLI 粘贴多行提示词会被截断，而 Shift+Insert 那个答案是无效的","summaryZh":"在 PowerShell / Windows Terminal 里用 Codex CLI，把多行提示词粘贴进输入框可能被截断，导致提示词不完整。作者说他搜到的最简单方案是改用 Shift + Insert 粘贴，但实测【无效】。他改走 Codex 自带的外部编辑器入口：把 VISUAL 和 EDITOR 指向 Notepad++，在 Codex 里按 Ctrl+G 就会开一个编辑器窗口，写完保存关闭，内容自动回到输入框。文章给了完整步骤——先用 Test-Path 确认 exe 路径，再用 $env: 临时配置测试通过之后，才用 [Environment]::SetEnvironmentVariable 写进用户级环境变量并重开终端验证。参数建议带上 -multiInst -nosession，让 Codex 每次开的是独立实例，不会污染你正在用的 Notepad++ 工作区。","whyRead":"搜到的最简单解法他实测不管用，改走 Ctrl+G 外部编辑器，附 Windows 下 VISUAL / EDITOR 的完整配置和验证步骤。","rating":4,"tools":["codex"],"topics":[],"publishedAt":"2026-08-17T05:22:00.000Z","author":"","preScore":8},{"id":"3aea60e33ee8f8a7","source":"V2EX 搜索","kind":"search","url":"https://www.v2ex.com/t/1234815","titleOriginal":"把 DSH（DeepSeek Harness）部署到服务器：手机、电脑实时同步，云端开发","titleZh":"把 DeepSeek Harness 部署到服务器：nginx 反代和认证插件的三处坑","summaryZh":"基于 DSH 0.1.0-rc.6 加 Ubuntu 22.04/24.04、nginx、pm2 的实际部署记录。DSH 的 Web 界面默认只监听 127.0.0.1:3080，而且 CLI 直接禁止 --host 0.0.0.0（报错说明是防止把远程代码执行能力暴露到公网），所以只能走 nginx 反代加 dsh-webui-auth 插件做登录。作者记了三处不试一遍不会知道的地方：目录选择器默认按服务器环境自动选 native，弹出的对话框在服务器自己的屏幕上，远程访问必须用 ~/.dsh/patch.yml 固定成浏览器浏览模式；手机上内容区太小，用 nginx sub_filter 把 viewport 改成 initial-scale=0.7，改的时候要先关掉压缩请求头；manifest.webmanifest 永远返回 302，因为认证插件拦截所有未认证请求，只能在 nginx 里直出。","whyRead":"dsh web 直接禁止 --host 0.0.0.0，而认证插件会把 manifest 请求全部 302 掉，PWA 一直装不上。","rating":4,"tools":["dsh"],"topics":[],"publishedAt":"2026-08-16T15:36:42.000Z","author":"longbill","preScore":10},{"id":"16e8248e4ff99832","source":"雷蒙三十","kind":"blog","url":"https://raymondhouch.com/lifehacker/digital-workflow/codex-youtube-thumbnail-workflow/","titleOriginal":"如何用 Codex 製作 YouTube 封面？從 AI 初稿、人物去背到 Figma 定稿","titleZh":"用 Codex 做 YouTube 封面：前期交給 AI，定稿一定要回 Figma","summaryZh":"团队用 Codex（ChatGPT 桌面版）分析影片、找出适合的画面切角、提出标题方向并生成几版封面初稿，但刻意不让 AI 画完整张。原因是每重新生成一次，人物就可能出现细微但致命的变化：脸型五官变掉、手指数量不对、衣服上的 logo 变形，甚至前后两张图身材比例都不一致；缩小成封面后观众未必看得出，但整张图就是有一种「这个人不像本人」的感觉。所以流程拆成三段：Codex 负责出方向、清除概念稿的标题与前景只留干净背景；人物交给 ChatGPT 网页版从原始截图取出再去背（他们的经验是网页版比 Codex 更少让人物变形），去背后逐项检查发丝白边、手指边缘和残留阴影；最后回 Figma 做标题、描边和品牌元素，因为 AI 图里的中文字容易错字缺字。","whyRead":"整张封面全交给 AI，人物的五官、手指和衣服 logo 会在每次重绘里悄悄走样——所以他把人物和背景拆开处理。","rating":4,"tools":["codex","chatgpt-desktop"],"topics":[],"publishedAt":"2026-08-16T05:23:42.000Z","author":"","preScore":11},{"id":"de68498d5b3ef025","source":"Tw93","kind":"blog","url":"https://tw93.fun/2026-08-16/mole-mac.html","titleOriginal":"Mole 出 Mac 版后，用户教会了我做产品","titleZh":"全天开着 Claude Code 和 Codex 之后，Mac 上多出来的三类垃圾","summaryZh":"作者几乎全天开着 Claude Code 和 Codex 写东西，发现 AI 留下的垃圾和以前的软件很不一样，分三类：编译产物（一个下午让 agent 跑十几轮、每轮都编译，Rust 的 target、前端 .next/dist、Xcode DerivedData 涨得很快，他一次清出 86G）；AI 命令行工具的旧版本（自动更新是把新版本整个下到新目录，一个版本约 250MB，几个月积十几个）；模型文件（Ollama、LM Studio、HuggingFace 缓存常常几十 G）。前两类清，第三类一个字节都不碰，~/.ollama/models、~/.cache/huggingface 在代码里是写死的保护名单，~/.codex/sessions、~/.claude/projects 和 memories、plans、skills 同样永不清理。最蠢的一次是把 com.apple.e5rt.e5bundlecache 当缓存清了，那其实是苹果神经引擎编译好的模型，用户那边所有识别功能全挂。","whyRead":"一次清出 86G 编译产物；而 ~/.claude/projects 和 ~/.codex/sessions 是他在代码里写死的、永远不清的保护名单。","rating":4,"tools":["claude-code","codex","cursor","copilot-cli"],"topics":[],"publishedAt":"2026-08-16T00:00:00.000Z","author":"","preScore":9}],"reviewed":57,"dropped":49,"stats":{"sources":247,"fetched":444,"shortlisted":57,"rejected":387,"thin":115,"enriched":75,"enrichAttempted":101,"enrichRetryAttempted":26,"enrichRetried":0,"enrichSkipped":0,"enrichMuted":[],"failedSources":0,"feedRetryAttempted":6,"feedRetried":6},"errors":[]},{"date":"2026-08-16","generatedAt":"2026-08-15T22:40:00.000Z","dailyNote":"DeepSeek Harness 开源第三天，入围名单里 17 条跟它有关，只收了 2 条——一条把它套进 Electron 壳、老实交代没签名没公证，一条是插件作者拿自己写过的插件逐条对着讲机制。其余全是发布稿、README 级拆解和插件自荐，这一波该记的账都记在复盘里了。真正值得先读的反而是三篇「结果不如预期」的：OpenCode 的 message ID 攒了两年在 8-14 晚上 19:19 轮转，几千个线上会话同时哑掉；有人花三天十五美元测 OpenClaw，重启 4 次、完成任务 0 次，最后活干完的是 Cursor 和 GitHub Actions；还有人把自架 agent 系统跑了半年，57 个排程里 42 个已经一个 token 都不用。另外有一条不该被当成噱头看：一台服务器因为 openclaw-gateway 挂着 QQ 机器人通道、凭据明文躺在 ~/.openclaw/openclaw.json 里被拿了 root。今天毙得最多的是繁中写作平台上的「AI 賦能師」课程营销文，13 个 vocus 席位里占了 5 个，已经在规则层补了一道。","items":[{"id":"54224d9e38133832","source":"V2EX 技术节点","kind":"forum","url":"https://www.v2ex.com/t/1234574#reply16","titleOriginal":"[吐槽] OpenCode 惊现 两年虫 大 bug，线上业务几千个会话在同一时间一起炸了...","titleZh":"OpenCode 的 message ID 攒够两年翻了个身，几千个线上会话同时哑掉","whyRead":"定时炸弹型 bug 的完整现场：故障现象、时间点、以及那六行把时间戳截成 48 位的代码，都在帖子里对得上。","summaryZh":"作者公司有个基于 opencode acp 的在线对话开发平台，8 月 14 日傍晚业务群突然大面积反馈「消息不回了，但新建会话就正常」。查了半天容器日志和会话日志，发现七点之后生成的 message ID 反而比之前小——ID 生成器轮转了，而 opencode 的 message.latest() 是按最大 ID 找最新消息，于是新消息发出去之后，取到的「最新用户消息」永远停在七点前那条。对着代码看，message id 里的时间戳被截断后只存进 6 字节 buffer，上限 2^36 毫秒约 795 天，刚好在 8-14 晚上 19:19 从 msg_ffff 翻回 msg_0000。准备提 issue 时发现已有人踩到、官方也修了，但没发更新通知；作者补了一句更疼的：任务如果在循环里会无限重试，把 token 额度烧光。","rating":5,"tools":["opencode"],"topics":["acp"],"publishedAt":"2026-08-15T04:58:11.000Z","author":null,"preScore":11},{"id":"4277f5ebc4b80d31","source":"iT 邦幫忙 · 家用 NAS 自架 Agent 30 天","kind":"blog","url":"https://ithelp.ithome.com.tw/articles/10402040?sc=rss.iron","titleOriginal":"Day 15：一個系統，兩個排程器後來我把大半的 AI 拿掉了","titleZh":"自架 agent 跑半年后：57 个排程里 42 个已经不叫模型了","whyRead":"把「哪些定期任务该交给 LLM」换成了一个能直接照抄的判据——不是按聪明不聪明分，是按计价方式分。","summaryZh":"作者在家用 NAS 上养了半年的个人 agent 系统，这一篇摊开他的两套排程器：NAS 侧是按次计费、挂着 57 个 job（抓价、算损益、健检、自愈），订阅侧是定额、跑十几个需要真思考的任务（选股周报、深度分析、生活复盘）。分界线不是任务重不重要，而是「醒来一次要不要跳表」——需要开放式思考的往定额侧搬，确定性执行留在按次侧。半年下来最反直觉的一段是比例：57 个排程里 42 个是零 LLM 的纯脚本，剩下 15 个里 7 个用免费额度的轻量模型、8 个用便宜的小模型，旗舰模型一个都不出现。他给了三条把 LLM 请出去的理由：输出格式不稳定导致下游要写一堆容错、故障从 stack trace 退化成「回答得怪怪的」没人发现、以及按次计费真的会跳表。","rating":5,"tools":[],"topics":["agent-memory"],"publishedAt":"2026-08-15T18:54:06.000Z","author":null,"preScore":9},{"id":"f22013c2cafc9530","source":"方格子 vocus 标签","kind":"search","url":"https://vocus.cc/article/6a77944efd897800017e8f88","titleOriginal":"我花三天測試小龍蝦：最後還是 GitHub Actions 和 Cursor 比較好用","titleZh":"三天十五美元测 OpenClaw：重启 4 次，完成任务 0 次","whyRead":"一份把任务一路砍到「有更新就通知我」都还没跑通的实测账本，附带那三天真正干完活的是谁。","summaryZh":"作者本来打算买台约 600 美元的 Mac mini 专门跑 OpenClaw，先在 Zeabur 上花约 15 美元做了三天隔离测试。第一天让它查一个 500 多笔的 Supabase 地点资料库，回了「好的，我開始執行」之后就没了下文，日志里是 API 401、环境变量读不到、连线逾时和缺套件；第二天把需求砍成清理重复资料，再砍成「监控 46 个 GitHub 专案有更新就通知」，仍然要反复重启；第三天他直接把流程改成 GitHub Actions 直接寄 Email，几分钟跑通、成本 0、隔天准时收到报告。三天的账是：小龙女重启 4 次、实际完成任务 0 个，而真正留下来的成果——资料清理脚本、Google Maps 位置验证、排程与通知——全是 Cursor 写的，资料库从 556 笔整理到 500 笔、坐标完整度从 89.9% 升到 100%。","rating":5,"tools":["cursor","openclaw"],"topics":[],"publishedAt":"2026-08-08T20:45:35.140Z","author":null,"preScore":13},{"id":"7aeb189c42bea64d","source":"掘金搜索","kind":"search","url":"https://juejin.cn/post/7674038015744213027","titleOriginal":"我给 WorkBuddy 接上 Obsidian，被 401 和中文乱码折腾了大半天","titleZh":"给 WorkBuddy 手写一个 Obsidian MCP 连接器：401 和中文乱码各占半天","whyRead":"401 的真凶不是 Key 写错，是宿主压根没把环境变量注进子进程——附一段能直接抄的配置读取顺序。","summaryZh":"作者想让 WorkBuddy 读到自己 Obsidian 里的笔记，估了一两个小时，实际折腾了大半天。他选了 Obsidian 的 Local REST API 社区插件走 HTTPS 27124 端口，而不是把 vault 当普通文件夹读写——代价写得很清楚：Obsidian 必须开着、插件必须启用，程序退出接口就没了。因为运行环境在没有外网的沙箱里装不上 MCP SDK，他干脆用标准库手写了一百来行的最小协议子集（stdio + JSON-RPC 2.0），并说明这只适合自用的小连接器，要长期维护还是该用 SDK。第一个坑是搜索接口返回 401：顺着日志查出来是 WorkBuddy 启动 MCP 子进程时没有把 OBSIDIAN_API_KEY 注进去，改成先读 ~/.workbuddy/mcp.json、缺字段再退回环境变量，并按三种情况（无变量、故意写错的 Key、两者都正常）各测了一遍。","rating":4,"tools":["workbuddy","obsidian"],"topics":["mc
