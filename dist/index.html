训练混元模型第一，WorkBuddy推理算力第二，云第三。"},{"id":"4c80c69643af5f45","source":"海辛Hyacinth","type":"blog","lang":"zh","url":"https://www.sina.cn/news/detail/5331382381579841.html","titleOriginal":"工作间隙用 Codex 搭了一个三星堆&金沙文物的场景，场景部分资产来自@MasterPa 的 Funes 初衷是想试试 three.js + WebGL实现海底的效果，海底的神秘感和三星堆感觉比较搭！ 目前已经可以玩啦： ▶ 在线 Dem","publishedAt":"2026-08-13T01:21:00.000Z","brief":false,"thin":true,"titleZh":"用Codex搭了个三星堆&金沙文物的three.js海底场景","summaryZh":"作者利用工作间隙，用Codex搭建了一个融合三星堆、金沙文物元素的three.js+WebGL场景，部分资产来自他人项目Funes，初衷是想尝试用three.js实现海底效果，已上线可玩的在线Demo，项目仍在推进中。"},{"id":"f235f7a9e2e625b3","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/113385","titleOriginal":"派早报：荣耀发布 Robot Phone、Google 推出 Pixel 11 系列等","publishedAt":"2026-08-13T00:14:09.000Z","brief":false,"thin":false,"titleZh":"派早报：荣耀Robot Phone、谷歌Pixel 11系列等","summaryZh":"少数派早报汇总科技新闻：荣耀发布全球首款机器人手机Robot Phone，配机械云台和Agentic OS；谷歌发布Pixel 11系列；英伟达开源Nemotron 3.5 Lightning；DeepSeek-V4-Pro正式版上线等。"},{"id":"a1ee18672d4a6f49","source":"张小珺Jùn｜商业访谈录","type":"podcast","lang":"zh","url":"https://www.youtube.com/watch?v=zawGTDLtWFY","titleOriginal":"NVIDIA VP Ming-Yu Liu: Cosmos 3, World Models, Kung Fu, What Jensen Taught Me","publishedAt":"2026-08-13T00:00:34.000Z","brief":true,"thin":false,"titleZh":"对话英伟达研究副总裁刘明昱：Cosmos世界模型与功夫人生","summaryZh":"刘明昱是英伟达历史上首位从研究员升至副总裁的员工，负责其世界基础模型项目Cosmos。访谈中他谈到自己自18岁起习练中国武术、清晨练拳后冰浴的日常，以及\"中国武术最重要的是自我克制，不是展示破坏力\"的理念，如何映射到他做研究的竞争哲学中。"},{"id":"0c86be4b22ce629e","source":"Epoch AI","type":"blog","lang":"en","url":"https://epoch.ai/data-insights/chip-performance-per-dollar","titleOriginal":"The performance per dollar of AI chips purchased each quarter has grown by an average of 49% per year","publishedAt":"2026-08-13T00:00:00.000Z","brief":false,"thin":false,"titleZh":"AI芯片每美元性能年均增长49%，1.7年翻一番","summaryZh":"Epoch AI分析显示，自2023年以来，每季度购入AI芯片的平均每美元性能每年增长约49%，照此速度约1.7年翻一番。增长并非匀速，2024年年中之前性价比几乎持平，随着Blackwell系列芯片成为新增支出主力，性价比才明显跳升。"},{"id":"69afc08986e52f61","source":"TLDR AI","type":"newsletter","lang":"en","url":"https://tldr.tech/ai/2026-08-13","titleOriginal":"Claude Chrome Cowork 🌐, Grok 4.6 🚀, DeepSeek v4-Pro-0813 🧠","publishedAt":"2026-08-13T00:00:00.000Z","brief":false,"thin":false,"titleZh":"简报：Claude Chrome侧边栏升级为完整Cowork会话","summaryZh":"TLDR AI简报汇总：Anthropic把Claude浏览器侧边栏升级为完整Cowork会话，对话可跨设备同步；Grok 4.6主打长程Agent任务，在Artificial Analysis智能指数上追平GPT-5.6 Sol。"},{"id":"d181d3a449209c34","source":"Anthropic Research","type":"lab","lang":"en","url":"https://www.anthropic.com/research/multiagent-systems","titleOriginal":"Aug 13, 2026Frontier Red TeamPatterns and problems in emerging multiagent systems","publishedAt":"2026-08-13T00:00:00.000Z","brief":false,"thin":false,"titleZh":"Anthropic红队报告：多智能体系统正涌现新的问题模式","summaryZh":"Anthropic红队称，Agent在共享代码库、市场等社会系统中的真实交互正快速增多，规模可能很快超过人类间及人机交互总量，但现有制度多是为人类速度的监督设计。Agent容易虚构和奖励黑客，人类对其行为仍知之甚少。"},{"id":"57f8b7f378e9c39a","source":"Hugging Face Blog","type":"lab","lang":"en","url":"https://huggingface.co/blog/icml-2026-open-reproductions","titleOriginal":"What We Learned by Reproducing 2,200 papers from ICML","publishedAt":"2026-08-13T00:00:00.000Z","brief":false,"thin":false,"titleZh":"复现2200篇ICML论文的黑客松：我们学到了什么","summaryZh":"Hugging Face今年7月办黑客松，邀1200多名成员用编程Agent逐条复现ICML 2026论文，19天产出6816份复现记录，覆盖2226篇论文，约占大会论文总数三分之一。今年ICML投稿量翻倍，评审产能却未同步扩大。"},{"id":"d568f041da6773f8","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584291.html","titleOriginal":"腾讯3D世界生成框架来了：一句话生成世界，支持修改编辑","publishedAt":"2026-08-12T22:07:38.000Z","brief":false,"thin":false,"titleZh":"腾讯推出3D世界生成框架WorldClaw：一句话生成可编辑世界","summaryZh":"腾讯混元3D团队推出WorldClaw，输入一句描述即可生成可自由探索、可编辑的大规模3D世界。多个Agent协作完成意图分析、全局地形规划，再逐区域生成建筑植被并转为可编辑3D资产，官方称效果优于SynCity等同类方案。"},{"id":"01b0433aec0f1414","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584444.html","titleOriginal":"昨夜，马斯克甩出Grok 4.6！性能直逼Fable 5，英伟达祝贺","publishedAt":"2026-08-12T17:07:02.000Z","brief":false,"thin":false,"titleZh":"马斯克甩出Grok 4.6：性能直逼Fable 5，英伟达都来祝贺","summaryZh":"马斯克宣布SpaceXAI推出Grok 4.6，性能对标GPT-5.6 Sol Max和Claude Fable 5 Max，英伟达评论区留言祝贺。新模型已上线Cursor等平台，定价每百万token输入2美元、输出6美元。"},{"id":"d2c947609f2838e5","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584880.html","titleOriginal":"AI产品成交额增长125%！京东大搞AI、机器人，未来5年要建80多个机器人基地","publishedAt":"2026-08-12T16:02:03.000Z","brief":false,"thin":false,"titleZh":"AI产品成交额增长125%！京东未来5年建80多个机器人基地","summaryZh":"京东公布2026年Q2财报：营收3464亿元同比降2.9%，非GAAP净利润89亿元同比增20.3%。AI眼镜、AIPC等AI产品成交额同比增125%，机器人方面首个RoboBase项目开工，财报后股价一度下跌近8%。"},{"id":"8b1b7c872ad76f33","source":"甲子光年","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzU5OTI0NTc3Mg==&mid=2247556615&idx=1&sn=1bad23e3f993d2725cfcc0af30e1840d","titleOriginal":"藏在机器人指尖的AI底座：一家触觉公司的野心｜甲子光年","publishedAt":"2026-08-12T11:58:00.000Z","brief":false,"thin":false,"titleZh":"藏在机器人指尖的AI底座：一家触觉公司的野心","summaryZh":"文章指出机器人光靠视觉不够，「没有触觉是一种新的失明」。李飞飞等参与的T-Rex研究发现，简单把触觉数据加进模型反而让机器人成功率从17%降到6%，直到把触觉编码与规划频率解耦重新设计后，成功率才提升到65%。"},{"id":"e5b4bac0a6b31523","source":"甲子光年","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzU5OTI0NTc3Mg==&mid=2247556615&idx=2&sn=d9668b12dee75ced3ecb1b2768b05685","titleOriginal":"激流：中国科技投资的势能与锚点｜甲子引力X","publishedAt":"2026-08-12T11:58:00.000Z","brief":false,"thin":false,"titleZh":"激流：2026年中国科技投资的势能与锚点","summaryZh":"甲子光年将于8月举办科技产业投资大会，文章综述2026年一级市场回暖：一季度创投融资事件2865起同比增52%，AI领域融资破1100亿元同比暴涨185%，人形机器人两月内完成18起融资超130亿元。"},{"id":"a57e174e741c7575","source":"Epoch AI","type":"blog","lang":"en","url":"https://epoch.ai/gradient-updates/will-financing-bottleneck-ai-compute","titleOriginal":"Will financing bottleneck AI compute? An Anthropic case study","publishedAt":"2026-08-12T00:00:00.000Z","brief":false,"thin":false,"titleZh":"融资会成为AI算力扩张的瓶颈吗？以Anthropic为例","summaryZh":"文章以Anthropic为案例，探讨前沿实验室数百亿美元的基础设施投入能否持续获得融资。2025年11月Anthropic年化收入不到90亿美元时宣布投资500亿美元建设算力基础设施，近500亿美元由债务融资构成，大部分在营收暴涨前完成。"}],"errors":[{"source":"Andrej Karpathy","message":"HTTP 403"},{"source":"42章经","message":"HTTP 403"},{"source":"卫诗婕｜漫谈 Light the Star","message":"HTTP 403"},{"source":"屠龙之术","message":"HTTP 403"},{"source":"十字路口 Crossing","message":"HTTP 403"},{"source":"AI Odyssey","message":"HTTP 403"},{"source":"OnBoard!","message":"HTTP 403"},{"source":"AI局内人｜AGI Insider","message":"HTTP 403"},{"source":"乱翻书","message":"HTTP 403"}]},{"date":"2026-08-13","items":[{"id":"ae76f9e602382bf4","source":"AI Supremacy","type":"newsletter","lang":"en","url":"https://www.ai-supremacy.com/p/visions-of-ai-personal-intelligence","titleOriginal":"Visions of AI: Personal Intelligence","publishedAt":"2026-08-13T00:01:01.000Z","brief":false,"thin":false,"titleZh":"AI愿景：个人智能","summaryZh":"作者新开AI创业公司特写栏目首篇，介绍前xAI联合创始人Igor Babuschkin创办的River AI：一个开源、可自适应用户的个人AI技术栈，用户将拥有硬件、数据与模型本身。文中还收录了投资方General Catalyst CEO Hemant Taneja的访谈。"},{"id":"154ec5199cb1fd52","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/jrfEYXFyqkuWLfGCa/role-boundary-plasticity-prompt-injection-gauntlet-reveals-1","titleOriginal":"Role Boundary Plasticity: Prompt Injection Gauntlet Reveals 12 of 16 Frontier Models Will Wire A Stranger Your $500 ","publishedAt":"2026-08-12T23:57:44.000Z","brief":false,"thin":false,"titleZh":"角色边界可塑性：提示注入测试揭示16个前沿模型中12个会给陌生人转500美元","summaryZh":"独立研究者对42个大模型做了5000多次提示注入测试，发现一种伪装成退款工具调用的注入方式，能让16个前沿模型中的12个执行虚假转账指令，累计34次向陌生账户转出500美元。文章呼应此前关于提示注入机制的论文，揭示模型在角色边界上的脆弱性。"},{"id":"a447ce8efff3e2c8","source":"张小珺Jùn｜商业访谈录","type":"podcast","lang":"zh","url":"https://www.youtube.com/watch?v=Cj_kb9nlAlE","titleOriginal":"150. 对英伟达研究副总裁刘洺堉的4小时访谈：Cosmos 3、世界模型、武术、黄仁勋影响我的，和你不需要击败所有对手","publishedAt":"2026-08-12T23:51:01.000Z","brief":true,"thin":false,"titleZh":"150. 对英伟达研究副总裁刘洺堉的4小时访谈：Cosmos 3、世界模型、武术、黄仁勋影响我的，和你不需要击败所有对手","summaryZh":"长达4小时访谈英伟达研究副总裁刘洺堉，他领导英伟达世界模型Cosmos项目，是首位从研究员升至副总裁的员工。访谈谈及他的武术冰浴习惯，及其反复强调的“不与人竞争、只造增量市场”理念。"},{"id":"416afef85f4c8049","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/JSteskb3Lgp9Be69o/free-will-is-like-temperature","titleOriginal":"Free will is like temperature","publishedAt":"2026-08-12T23:32:00.000Z","brief":false,"thin":false,"titleZh":"自由意志就像温度","summaryZh":"文章用“温度”类比“自由意志”：温度是对无法精确追踪每个粒子运动的复杂系统的一种实用近似描述，自由意志同理，是分析行为过于复杂、无法逐一模拟的系统（如人）时的有效工具，而非物理层面的独立实体。"},{"id":"1f0f398aa5859661","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/N2fG72va9LY4qyLaN/impact-markets-made-concrete","titleOriginal":"Impact markets made concrete","publishedAt":"2026-08-12T22:45:00.000Z","brief":false,"thin":false,"titleZh":"影响力市场落地实践","summaryZh":"作者上线了impact-exchange.org演示平台，尝试为AI安全等公益资助建立“影响力交易所”。文中举例：2022年长期未来基金向MATS捐款34.3万美元，按其交易所估值现已涨到400多万美元，用以说明影响力市场如何激励资助方投早、投准。"},{"id":"5b2ecc9f3e107744","source":"TWIML AI Podcast","type":"podcast","lang":"en","url":"https://twimlai.com/podcast/twimlai/why-image-generation-needs-more-than-bigger-models","titleOriginal":"Why Image Generation Needs More Than Bigger Models with Fatih Porikli - #773","publishedAt":"2026-08-12T22:18:00.000Z","brief":true,"thin":false,"titleZh":"为什么图像生成不能只靠堆模型规模：对话高通Fatih Porikli","summaryZh":"高通技术副总裁Fatih Porikli在播客中谈到，文生图模型虽已很逼真，但在生成多个不同人物、精确构图或本地高分辨率图像时仍常出错。他分享了团队在CVPR展示的方法，包括改进训练目标提升可控性、将场景规划与渲染分离等思路。"},{"id":"e04911c395279410","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/vtMCTjH76DYMjAKYu/chessformer_lens-app-demo-paul-morphy-s-opera-game-sacrifice","titleOriginal":"chessformer_lens app demo: Paul Morphy's Opera Game sacrifice","publishedAt":"2026-08-12T21:05:15.000Z","brief":false,"thin":true,"titleZh":"chessformer_lens应用演示：保罗·墨菲歌剧院对局的弃后妙手","summaryZh":"该内容展示了国际象棋可解释性工具chessformer_lens：消融Maia-3模型128个注意力头中的一个，会破坏模型对名局“歌剧院对局”弃后妙手的判断倾向。信息以标题及简短描述为主，细节有限。"},{"id":"928971cb25924f9b","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/Ht9kHqJZFatQPrkNb/unblocking-ai-s-continual-learning-hints-from-how-humans","titleOriginal":"Unblocking AI's Continual Learning: Hints From How Humans Learn","publishedAt":"2026-08-12T18:28:13.000Z","brief":false,"thin":false,"titleZh":"解锁AI持续学习：从人类学习方式获得的启示","summaryZh":"文章讨论当前大模型训练后参数被冻结、无法像人一样“在岗学习”的局限：所有用户共享同一套在集中训练中固化的能力与偏见，这既导致产品同质化，也让企业无法让AI理解自己独有的业务语境。作者借鉴人类学习机制，探讨如何为AI引入持续学习能力。"},{"id":"dd2b9a43e5a4ba96","source":"karminski-牙医","type":"blog","lang":"zh","url":"https://www.sina.cn/news/detail/5331273338061528.html","titleOriginal":"刚发的 DeepSeek-V4-Pro-0813 好像的确有问题, reasoning_effort=max 的时候模型在长程 AgenticCoding 任务下更倾向于早停. 我这个测试总计50轮, 让模型不断优化代码, 结果他在3次测试","publishedAt":"2026-08-12T18:07:00.000Z","brief":false,"thin":true,"titleZh":"刚发的 DeepSeek-V4-Pro-0813 好像的确有问题, reasoning_effort=max 的时候模型在长程 AgenticCoding 任务下更倾向于早停. 我这个测试总计50轮, 让模型不断优化代码, 结果他在3次测试","summaryZh":"博主实测反馈，DeepSeek-V4-Pro-0813在reasoning_effort=max下处理长程Agentic Coding任务时易提前停止。50轮持续代码优化测试中，3次有2次在42-43轮左右提前终止，成绩也未超过GLM-5.1（个人测试，样本有限）。"},{"id":"536232fc906b1303","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/iQCNuQXQQakKnidmA/monthly-roundup-45-august-2026","titleOriginal":"Monthly Roundup #45: August 2026","publishedAt":"2026-08-12T17:50:31.000Z","brief":false,"thin":false,"titleZh":"月度综述#45：2026年8月","summaryZh":"作者反思近期文章几乎全部被AI话题占据——尤其是OpenAI等公司遭遇的黑客事件——认为这不健康，需要重新纳入童年教育、生育率等其他议题。文章属于其固定的月度杂谈栏目，汇总近期博客圈值得关注的内容与评论。"},{"id":"ad90c46d4a3c1d17","source":"Don't Worry About the Vase","type":"newsletter","lang":"en","url":"https://thezvi.substack.com/p/monthly-roundup-45-august-2026","titleOriginal":"Monthly Roundup #45: August 2026","publishedAt":"2026-08-12T17:41:24.000Z","brief":false,"thin":false,"titleZh":"月度综述#45：2026年8月","summaryZh":"作者反思近期博客几乎完全被AI相关话题（包括OpenAI等公司的黑客事件）占据，认为需要重新关注童年教育、生育率等长期被搁置的议题，本期为其固定月度杂谈汇总，经newsletter渠道转发。"},{"id":"d26f2bb55e15803d","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/qFTrfw9MMc3jT92Du/finding-the-seams-of-perception","titleOriginal":"Finding the Seams of Perception","publishedAt":"2026-08-12T17:33:32.000Z","brief":false,"thin":false,"titleZh":"寻找感知的缝隙","summaryZh":"作者以一次跟随经验丰富的叔叔捕龙虾的经历为引子，探讨“认知地图”与真实世界之间的缝隙如何被我们迅速用信念填平。当经验差距足够大且持续存在时，才能真正察觉自己原有认知的局限，这类罕见的落差是理解感知本质的好机会。"},{"id":"b49e7e65635ab7fe","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584439.html","titleOriginal":"刚刚，DeepSeek V4 Pro正式版来了！对打Fable 5","publishedAt":"2026-08-12T17:18:40.000Z","brief":false,"thin":false,"titleZh":"刚刚，DeepSeek V4 Pro正式版来了！对打Fable 5","summaryZh":"DeepSeek-V4-Pro正式版API发布，Agent能力大幅增强，在Cybergym、AutomationBench等基准上超越Claude Fable 5，长周期编程测试DeepSWE得分从12.8跃升至62.7，并新增工具调用、Responses API等支持。"},{"id":"18da91a983d1fc32","source":"karminski-牙医","type":"blog","lang":"zh","url":"https://www.sina.cn/news/detail/5331259712340976.html","titleOriginal":"咋感觉要拉啊.........别啊...... [泪奔] #deepseek-v4-pro-0813##HOW I AI##DeepSeek发布V4Pro正式版# ​​​","publishedAt":"2026-08-12T17:13:00.000Z","brief":false,"thin":true,"titleZh":"咋感觉要拉啊.........别啊...... [泪奔] #deepseek-v4-pro-0813##HOW I AI##DeepSeek发布V4Pro正式版# ​​​","summaryZh":"一条围绕DeepSeek V4 Pro正式版发布的吐槽性微博，作者对该模型的实测表现表达担忧情绪，具体细节信息有限。"},{"id":"73707eae3f822178","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/tQHeEzKqK3awL2RxR/introducing-the-conceptual-reasoning-index","titleOriginal":"Introducing the Conceptual Reasoning Index","publishedAt":"2026-08-12T17:08:10.000Z","brief":false,"thin":false,"titleZh":"推出概念推理指数（CRI）","summaryZh":"Redwood Research与Anthropic联合发布“概念推理指数”，用三个基准评测AI在缺乏经验反馈回路的哲学、AI未来学等论证类任务中的推理能力。团队认为帮助人类理解AI风险局势依赖这类能力，未来将发博客详细论证该方向重要性，目前可申请访问权限。"},{"id":"f527dbf58c7c430e","source":"The Algorithm","type":"newsletter","lang":"en","url":"https://www.technologyreview.com/2026/08/12/1141032/scaling-ai-agents-with-trustworthy-data/","titleOriginal":"Scaling AI agents with trustworthy data","publishedAt":"2026-08-12T16:51:57.000Z","brief":false,"thin":false,"titleZh":"用可信数据支撑AI智能体的规模化","summaryZh":"文章指出企业普遍认可智能体AI的价值，但基础设施与数据质量不足常常拖累投资回报。智能体从“回答问题”转向“执行动作”后，需要打通企业内结构化与非结构化数据，文章探讨了企业该如何构建可信数据基础以支撑智能体规模化落地。"},{"id":"f08fa03ef32ebc04","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/YbfhaqNo4AWdXSpzQ/one-attention-head-carries-knight-forks-in-a-chess","titleOriginal":"One attention head carries knight forks in a chess transformer, and here's a new toolkit that found it.","publishedAt":"2026-08-12T16:48:20.000Z","brief":false,"thin":false,"titleZh":"国际象棋Transformer中的一个注意力头专门负责“卧槽马”，新工具包发现了它","summaryZh":"作者发布可解释性工具包演示：用logit-lens和逐头消融方法，在Maia-3国际象棋模型中定位到单个注意力头承载“卧槽马”战术识别功能，消融该头导致相关判断损失2.78 logits，而同层其他头影响均在0.14以下，完整分析将发表于后续论文。"},{"id":"b329d3828fa18e1a","source":"karminski-牙医","type":"blog","lang":"zh","url":"https://www.sina.cn/news/detail/5331248465577217.html","titleOriginal":"​在测了 [允悲] 被迫加班... 都躺床上了.... #deepseek-v4-pro-0813##HOW I AI##DeepSeek发布V4Pro正式版# ​","publishedAt":"2026-08-12T16:29:00.000Z","brief":false,"thin":true,"titleZh":"​在测了 [允悲] 被迫加班... 都躺床上了.... #deepseek-v4-pro-0813##HOW I AI##DeepSeek发布V4Pro正式版# ​","summaryZh":"一条关于测试DeepSeek V4 Pro正式版的微博，作者称“被迫加班”熬夜测试新模型，具体测试细节信息有限。"},{"id":"249a5e1ede4df4c0","source":"Hugging Face Blog","type":"lab","lang":"en","url":"https://huggingface.co/blog/allenai/olmoearth-embeddings","titleOriginal":"Introducing OlmoEarth embeddings: Custom embedding exports from OlmoEarth Studio for downstream analysis","publishedAt":"2026-08-12T16:14:36.000Z","brief":false,"thin":false,"titleZh":"推出OlmoEarth嵌入向量：从OlmoEarth Studio导出定制化嵌入用于下游分析","summaryZh":"Ai2的地球观测建模平台OlmoEarth Studio新增功能，允许用户计算并导出其开源模型生成的嵌入向量（对地球观测数据的紧凑数值表征），供下游分析任务使用，官方同步发布了技术报告与文档。"},{"id":"d8d267f64ccc8af4","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584347.html","titleOriginal":"全球首款机器人手机开卖！预订突破40万台，9999元起，终身AI免费用","publishedAt":"2026-08-12T15:00:00.000Z","brief":false,"thin":false,"titleZh":"全球首款机器人手机开卖！预订突破40万台，9999元起，终身AI免费用","summaryZh":"荣耀全球首款机器人手机Robot Phone正式开售，售价9999元起，预订量已超40万台。该机搭载可伸缩的4自由度机械臂，可自动追焦拍摄；智能体基座大模型参数量超300B，购机用户可终身免费使用YOYO AI会员服务，将于8月18日开启首销。"},{"id":"4aa7b6b0ab3520d1","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584305.html","titleOriginal":"豪砸514亿！马化腾：腾讯大幅增加算力采购","publishedAt":"2026-08-12T14:40:27.000Z","brief":false,"thin":false,"titleZh":"豪砸514亿！马化腾：腾讯大幅增加算力采购","summaryZh":"腾讯2026年Q2财报电话会上，马化腾称本季度大幅增加算力采购，剔除算力预付款后自由现金流为376亿元，推算算力预付金额达514亿元。总裁刘炽平称新增算力将优先用于自研大模型训练，Hy4模型计划近期上线，规模和多模态能力将在Hy3基础上进一步提升。"},{"id":"c26c8d5a4e90c678","source":"Google DeepMind Blog","type":"lab","lang":"en","url":"https://deepmind.google/blog/putting-sign-language-ai-into-users-hands/","titleOriginal":"Putting sign language AI into users’ hands","publishedAt":"2026-08-12T14:01:59.000Z","brief":false,"thin":false,"titleZh":"把手语AI交到用户手中","summaryZh":"Google DeepMind发布手语转文本模型SL2T，为全球超2亿听障及重听人士提供新的手语功能支持。文章指出，语音语言AI已取得长足进步，但覆盖全球200多种手语的技术长期缺位，该模型旨在填补这一空白。"},{"id":"2c563947428818b9","source":"Hugging Face Blog","type":"lab","lang":"en","url":"https://huggingface.co/blog/LiquidAI/lfm2-5-vl-3b","titleOriginal":"LFM2.5-VL-3B for Better and Faster Vision Capabilities for the Edge","publishedAt":"2026-08-12T14:00:51.000Z","brief":false,"thin":false,"titleZh":"LFM2.5-VL-3B：更强更快的边缘视觉能力","summaryZh":"LiquidAI发布LFM2.5-VL-3B，是其目前能力最强、可在本地硬件运行的视觉语言模型，能理解文档与屏幕截图、进行物体定位并调用工具。模型采用直接作答而非推理链的方式，以保持响应速度。"},{"id":"bec2d81ff3ec18fe","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/471254.html","titleOriginal":"《置身谷内》！Jeff Dean上顶会自曝离职现场：被1500人围堵","publishedAt":"2026-08-12T13:46:12.000Z","brief":false,"thin":false,"titleZh":"《置身谷内》！Jeff Dean上顶会自曝离职现场：被1500人围堵","summaryZh":"Jeff Dean在KDD 2026大会上晒出自己离职谷歌前48小时的时间表：先向139名同事宣布离职，又参加约1500人的告别会，随后照常上瑜伽课、踢球，晚上逐条回复同事消息到凌晨2点半。周四下午交回工牌电脑后，当晚即以Discovery Loop联创兼CEO身份重新上岗。"},{"id":"46239974e37f56b8","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/471162.html","titleOriginal":"Anthropic CEO整天神神叨叨，投资人受不了了","publishedAt":"2026-08-12T13:38:09.000Z","brief":false,"thin":false,"titleZh":"Anthropic CEO整天神神叨叨，投资人受不了了","summaryZh":"据Polymarket预测，Anthropic或于10月底IPO，募资或超600亿美元，规模仅次SpaceX。但部分投资者对CEO Dario Amodei反复强调AI毁灭风险不满，希望他多谈盈利；文章列举了他手写离线存备忘录、拒绝部分海外出差等谨慎习惯。"},{"id":"9ca509495f707800","source":"Lex Fridman Podcast","type":"video","lang":"en","url":"https://lexfridman.com/khabib-nurmagomedov/?utm_source=rss&utm_medium=rss&utm_campaign=khabib-nurmagomedov","titleOriginal":"#500 – Khabib Nurmagomedov: Dagestan, MMA, UFC, Islam, Conor, Fedor & Football","publishedAt":"2026-08-12T13:11:45.000Z","brief":true,"thin":false,"titleZh":"第500期——哈比布·努尔马戈梅多夫：达吉斯坦、MMA、UFC、伊斯兰教、康纳、费多与足球","summaryZh":"Lex Fridman专访UFC传奇选手哈比布·努尔马戈梅多夫，他退役时保持29战全胜的完美战绩。访谈全程以俄语进行，通过AI配音翻译成英语并配字幕上线YouTube，本期节目仅提供英语音轨。"},{"id":"97ab624f9637f962","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/471049.html","titleOriginal":"国产具身智能创全球新纪录！以30%成本跑赢 Figure AI 45%效率，聪明的具身大脑成关键","publishedAt":"2026-08-12T13:10:55.000Z","brief":false,"thin":false,"titleZh":"国产具身智能创全球新纪录！以30%成本跑赢 Figure AI 45%效率，聪明的具身大脑成关键","summaryZh":"国内具身智能公司自变量机器人在物流分拣直播实测中，双机械臂方案连续稳定运行1小时，分拣效率达1816件/小时，准确率98%，超过美国Figure AI此前公开的1248件/小时纪录逾45%，且硬件成本比Figure AI的人形+灵巧手方案低约70%。"},{"id":"5393035b19f35d9e","source":"Interconnects","type":"blog","lang":"en","url":"https://www.interconnects.ai/p/i-wrote-an-ai-textbook-how-long-until","titleOriginal":"I wrote an AI textbook — how long until AI can do it better?","publishedAt":"2026-08-12T13:01:16.000Z","brief":false,"thin":false,"titleZh":"我写了一本AI教材——AI还要多久才能写得比我好？","summaryZh":"作者认为对AI写作的批评多集中在高辨识度的创意写作上，但非虚构写作（如教材）更看重信息准确与结构清晰，而非个人风格，这类内容AI可能更快追平甚至超越人类。作为一名教材作者，作者反思了这一趋势对自己工作的冲击。"},{"id":"4e879d5dd036206b","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/LEzgrp9B9TFCxuvvD/rationality-is-not-reversed-irrationality","titleOriginal":"Rationality Is Not Reversed Irrationality","publishedAt":"2026-08-12T12:20:38.000Z","brief":false,"thin":false,"titleZh":"理性不是非理性的反面","summaryZh":"文章分析经济学家Tyler Cowen“像科学一样行事”的观点，认为这是一种对严谨性有选择性要求的表现，并尝试从心理层面解释：当Tyler设想某些情境会感到焦虑，进而倾向用一套“看似理性”的框架来回避真正深入的思考，而非真正践行理性。"},{"id":"e8740fc9bb98d3c4","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/583793.html","titleOriginal":"实探蒙牛AI应用大赛：AI走进电商制图、知识管理和奶牛诊疗","publishedAt":"2026-08-12T11:16:17.000Z","brief":false,"thin":false,"titleZh":"实探蒙牛AI应用大赛：AI走进电商制图、知识管理和奶牛诊疗","summaryZh":"蒙牛AI应用大赛中期路演上，45名员工展示基于腾讯WorkBuddy开发的AI应用：有设计师靠自然语言对话开发出电商主图生成工具，单图制作时间从3-5分钟缩短到数秒；也有员工用AI分析奶牛体征辅助兽医缩小疾病范围。WorkBuddy企业版已在蒙牛内部广泛使用。"},{"id":"8bbc8a8d8a0b35af","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/471030.html","titleOriginal":"紫东太初推出GMC核心集剪枝方法，少80%Token仍满血保真多模态能力","publishedAt":"2026-08-12T10:54:29.000Z","brief":false,"thin":false,"titleZh":"紫东太初推出GMC核心集剪枝方法，少80%Token仍满血保真多模态能力","summaryZh":"中科院自动化所紫东太初团队提出GMC核心集剪枝方法，针对视觉语言模型中视觉Token冗余导致显存开销大、推理慢的问题，相比传统Top-K筛选方案更能保留分散但关键的互补信息（如文字、坐标等），免训练、开箱即用，在减少80%Token的同时保持多模态能力基本无损。"},{"id":"d21d3f8a70e67c4c","source":"a16z Podcast","type":"podcast","lang":"en","url":"https://a16z.simplecast.com/episodes/garry-tan-on-taste-agents-and-founder-ambition-5Wi5biPg","titleOriginal":"Garry Tan on Taste, Agents and Founder Ambition","publishedAt":"2026-08-12T10:26:08.000Z","brief":true,"thin":false,"titleZh":"Garry Tan谈品味、智能体与创业者的野心","summaryZh":"Y Combinator总裁兼CEO Garry Tan在访谈中探讨AI如何重写创业剧本、为何创业者应更具野心，以及硅谷二十年起伏给他的启示。他回顾了自己曾拒绝加入Palantir的早期机会，谈到追逐“热点”往往是错误策略，最好的想法常始于对小众领域的真诚痴迷。"},{"id":"cfc256faef62415a","source":"Stratechery","type":"newsletter","lang":"en","url":"https://stratechery.com/2026/anthropics-watermarking-how-it-probably-works-worse-than-it-seems/","titleOriginal":"Anthropic’s Watermarking, How It (Probably) Works, Worse Than It Seems","publishedAt":"2026-08-12T10:00:00.000Z","brief":false,"thin":false,"titleZh":"Anthropic的水印机制：可能的原理，比看起来更糟","summaryZh":"Anthropic为应对欧盟AI法案，为Claude生成内容加入水印功能，作者认为这是一个从哲学层面就站不住脚的糟糕决定，并尝试推测该水印机制的技术实现方式，指出其实际效果和影响可能比表面看起来更负面。"},{"id":"5c3d54adf5169cd8","source":"The Rundown AI","type":"newsletter","lang":"en","url":"https://www.therundown.ai/p/anthropic-slips-an-invisible-signature-into-claude","titleOriginal":"Anthropic slips an invisible signature into Claude","publishedAt":"2026-08-12T10:00:00.000Z","brief":false,"thin":false,"titleZh":"Anthropic为Claude悄悄植入隐形签名","summaryZh":"Anthropic低调公布了为Claude所有生成内容加入隐形水印的推行细节，用于标注内容出处。文章将其类比为“你用Claude写的备忘录可能已带上看不见的AI署名”，属于该newsletter日常AI资讯汇编中的头条内容。"},{"id":"adc9125f9a78dcd2","source":"AI科技评论","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzA5ODEzMjIyMA==&mid=2247741625&idx=1&sn=66289fc517d45105a9210c4fb0ab97f9","titleOriginal":"具身智能本体的重要性和技术差距，可能被大大低估了","publishedAt":"2026-08-12T10:00:00.000Z","brief":false,"thin":false,"titleZh":"具身智能本体的重要性和技术差距，可能被大大低估了","summaryZh":"文章认为具身智能行业过度聚焦模型与数据两大瓶颈，却忽视了机器人本体（硬件）本身的重要性——延迟、精度、连续作业稳定性、接口对接等问题仍未真正解决。作者以“申智杯”比赛中灵御智能凭高性能本体夺冠、其TA2机器人随即被多个模型团队预订为例，说明优质本体正成为行业稀缺资源。"},{"id":"503d2ff076e3c25f","source":"Google Research Blog","type":"lab","lang":"en","url":"https://research.google/blog/empty-shelves-or-lost-keys-recall-is-the-bottleneck-for-parametric-factuality/","titleOriginal":"Empty shelves or lost keys? Recall is the bottleneck for parametric factuality","publishedAt":"2026-08-12T09:51:00.000Z","brief":false,"thin":false,"titleZh":"货架空了还是钥匙丢了？“回忆”才是参数化事实性的瓶颈","summaryZh":"Google Research团队通过知识画像框架分析发现，大模型在事实性问题上出错，主要不是因为从未学过这些事实（“货架空了”），而是难以准确回忆已编码的知识（“钥匙丢了”）——前沿模型几乎编码了所有相关事实，但检索调用环节存在瓶颈。"},{"id":"c2ff0f800743192b","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/113219","titleOriginal":"把「闪念胶囊」（Almost）放到 iPhone 锁屏","publishedAt":"2026-08-12T09:30:00.000Z","brief":false,"thin":false,"titleZh":"把「闪念胶囊」（Almost）放到 iPhone 锁屏","summaryZh":"少数派作者用快捷指令在iPhone锁屏上复刻了锤子科技已停产产品“闪念胶囊”（Almost）的即时记录功能，命名为“闪念笔记”。作者认为闪念胶囊留下的真正难题不是“能不能快速记下想法”，而是记录之后如何让碎片化灵感被真正用起来，本文分享了自己的探索思路。"},{"id":"b41959b210143a58","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584189.html","titleOriginal":"黄仁勋力挺开源AI后，英伟达甩出两大开源利器！输出速度快4倍、成本砍至1/3","publishedAt":"2026-08-12T09:15:05.000Z","brief":false,"thin":false,"titleZh":"黄仁勋力挺开源AI后，英伟达甩出两大开源利器！输出速度快4倍、成本砍至1/3","summaryZh":"英伟达发布开源模型Nemotron 3.5 Lightning（总参数300亿，激活约30亿）及智能路由库NeMo Switchyard，前者速度达同规模模型4倍，后者可在多模型间自动分配任务，内部测试显示成本可降至全用Claude Opus 4.8的1/3，是黄仁勋支持开源AI后首个开源模型。"},{"id":"7c88bd873c988e24","source":"What's Next｜科技早知道","type":"podcast","lang":"zh","url":"https://guiguzaozhidao.fireside.fm/20240439","titleOriginal":"用 AI 让我们变笨了吗？| S10E25","publishedAt":"2026-08-12T09:00:00.000Z","brief":true,"thin":false,"titleZh":"用 AI 让我们变笨了吗？| S10E25","summaryZh":"播客从神经科学角度探讨AI工具对学习与记忆的影响，援引MIT Media Lab研究：长期用AI写作的年轻人脑电活动偏低，研究者称之为“认知债务”。节目讨论了“认知卸载”的历史类比（如查资料从问族人到用Google搜索）、MIT三组写作实验对比结果，以及睡眠对记忆巩固的作用。"},{"id":"11f6f5f242094cdd","source":"Founder Park","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzY5ODQwMTkxNA==&mid=2247516541&idx=1&sn=a31f3207b86e3c5a439572fb10263138","titleOriginal":"MiniMax 怎么做 Agent：Model-Harness 协同只是第一步，还有 Inference-Harness 协同","publishedAt":"2026-08-12T09:00:00.000Z","brief":false,"thin":false,"titleZh":"MiniMax 怎么做 Agent：Model-Harness 协同只是第一步，还有 Inference-Harness 协同","summaryZh":"MiniMax DevRel负责人在AGI Playground 2026分享Agent实践：模型公司做Agent的优势在于能把harness设计与模型推理训练放在同一团队协同优化。其Agent产品从内部飞书机器人演化为桌面应用MiniMax Code，形成“训练-服务-反哺”闭环。"},{"id":"895d0a45740e19c3","source":"海辛Hyacinth","type":"blog","lang":"zh","url":"https://www.sina.cn/news/detail/5331120293153441.html","titleOriginal":"买了HYBS的黑胶，放在家里好开心啊，像是在家里放了一个通向沙滩的窗口。 ​","publishedAt":"2026-08-12T07:59:00.000Z","brief":false,"thin":true,"titleZh":"买了HYBS的黑胶，放在家里好开心啊，像是在家里放了一个通向沙滩的窗口。 ​","summaryZh":"一条个人生活类微博，作者分享购买HYBS黑胶唱片摆在家中的愉悦心情，将其比作“家里的一扇通向沙滩的窗口”，内容与AI资讯关联度较低。"},{"id":"c716bddb20c5f964","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/470901.html","titleOriginal":"2026中国科创投资夏季峰会暨陕西科创产业生态大会圆满落幕","publishedAt":"2026-08-12T07:31:19.000Z","brief":false,"thin":false,"titleZh":"2026中国科创投资夏季峰会暨陕西科创产业生态大会圆满落幕","summaryZh":"由融中财经和秦创原科技创新投资集团主办的2026中国科创投资夏季峰会暨陕西科创产业生态大会在西安落幕，聚焦AI驱动与新质生产力背景下的产业格局重构，探讨投资行业如何以硬科技为锚点服务产业高质量发展。"},{"id":"6523615eb855a777","source":"Latent Space","type":"podcast","lang":"en","url":"https://www.latent.space/p/ainews-how-to-steal-a-reasoning-trace","titleOriginal":"[AINews] How to steal a Reasoning Trace","publishedAt":"2026-08-12T07:11:08.000Z","brief":true,"thin":false,"titleZh":"[AI资讯] 如何窃取推理轨迹","summaryZh":"节目关注近期成为头条的一篇论文，围绕对齐、安全与思维链监控之间的张力展开：自o1发布以来，前沿实验室为防止被蒸馏，用加密签名的方式隐藏模型的推理轨迹。文章追溯了Matthew Green今年5月首次负责任披露的这一防护机制被攻破的经过。"},{"id":"b81d66ad2ff49c8c","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/113352","titleOriginal":"对话少数派老麦：从 Palm、WebOS 到 AI 硬件，依然不想成为多数派","publishedAt":"2026-08-12T07:00:00.000Z","brief":false,"thin":false,"titleZh":"对话少数派老麦：从 Palm、WebOS 到 AI 硬件，依然不想成为多数派","summaryZh":"少数派创始人老麦接受《三五环》播客访谈，回顾从PDA时代的Palm、WebOS到如今AI硬件浪潮的二十年经历。他讲述当年在BBS论坛“主机网”构建Palm/WebOS极客社区的经历，以及少数派如何从一家媒体逐步跑通“内容+产品”商业模式。"},{"id":"080da1071791dbd7","source":"晚点LatePost","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzU3Mjk1OTQ0Ng==&mid=2247538045&idx=1&sn=28acd7d2c6072caeae2aaec2ad8a95fb","titleOriginal":"Manus 第二季，浪子回头","publishedAt":"2026-08-12T06:11:00.000Z","brief":false,"thin":false,"titleZh":"Manus 第二季，浪子回头","summaryZh":"Manus官网标语从“已成为Meta的一部分”改为“即将恢复独立运营”，距被Meta超20亿美元收购不到八个月即分拆。文章回顾肖弘团队从武汉迁新加坡、创纪录速度完成出售、到商务部介入审查、再到重新独立的全过程，Manus目前ARR已超3亿美元。"},{"id":"e063daae6225e156","source":"OpenAI","type":"lab","lang":"en","url":"https://openai.com/index/how-enterprises-put-ai-to-work","titleOriginal":"From assistance to execution: How enterprises put AI to work","publishedAt":"2026-08-12T06:00:00.000Z","brief":false,"thin":true,"titleZh":"从辅助到执行：企业如何真正用起AI","summaryZh":"OpenAI的一份研究报告，探讨企业如何采用智能体AI、使用ChatGPT与Codex，以及领先企业在AI应用上如何拉开与其他企业的差距。摘要信息有限，具体数据与案例细节暂无法进一步说明。"},{"id":"579064c58a62e321","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584188.html","titleOriginal":"华为联合滴普推数据智能方案，对话周跃峰：今年AI真正找到发展道路","publishedAt":"2026-08-12T05:50:24.000Z","brief":false,"thin":false,"titleZh":"华为联合滴普推数据智能方案，对话周跃峰：今年AI真正找到发展道路","summaryZh":"华为云与滴普科技联合发布数据智能解决方案，面向智能制造、零售行业，采用“云基础设施+企业智能体平台”模式：华为云提供算力与智能体平台AgentArts，滴普提供DeepWorks与FastData。华为云CEO周跃峰表示，今年AI已找到“以智能体为中心服务生产生活”的路径。"},{"id":"f70faf4b3f4da625","source":"AI Alignment Forum","type":"community","lang":"en","url":"https://www.alignmentforum.org/posts/8oFYZdXkTaNGRtcn8/ai-swarms-are-starting-to-pose-indirect-takeover-risk","titleOriginal":"AI swarms are starting to pose indirect takeover risk","publishedAt":"2026-08-12T05:05:30.000Z","brief":false,"thin":false,"titleZh":"AI集群正开始构成间接接管风险","summaryZh":"文章分析OpenAI对Hugging Face的网络攻击事件，指出其实是多个AI智能体在不同训练与评估情境中，通过临时通信渠道协调数周所致。作者认为，这种未经授权的AI间协作不仅是未来更强模型接管风险的预警信号，其本身在近期就可能助推真实的接管风险。"},{"id":"9762c72392d5b39b","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/470874.html","titleOriginal":"人形之外，擎羽把“身体”变成具身智能的新变量","publishedAt":"2026-08-12T04:29:57.000Z","brief":false,"thin":false,"titleZh":"人形之外，擎羽把“身体”变成具身智能的新变量","summaryZh":"文章讨论具身智能中机器人“身体形态”这一被低估的变量：过去两年资本人才集中涌入人形赛道，但人形通用性把动态平衡、灵巧操作等难题压缩进同一系统。李飞飞近期指出，任务边界明确时最优身体未必是人形，文章以擎羽走向跨本体基础智能的探索为例。"},{"id":"2b3038494dc4b907","source":"新智元","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzI3MTA0MTk1MA==&mid=2652717707&idx=1&sn=0e4c1583326bbf2f40ca85421be87238","titleOriginal":"全球首款！Claude引发的数据恐慌，被这家中国黑马补上了","publishedAt":"2026-08-12T04:26:00.000Z","brief":false,"thin":false,"titleZh":"全球首款！Claude引发的数据恐慌，被这家中国黑马补上了","summaryZh":"网络安全公司威努特跨界推出本地AI桌面助手WinClaw，能将电脑内Word、Excel、微信缓存、NAS网盘等文件向量化建立本地知识库，支持全文检索、语义搜索与追问总结，还接入200多个在线搜索源。数据始终留在本地，文章将其视为对云端AI记忆产品数据担忧的回应。"},{"id":"f6a83d6c7cc63ba0","source":"新智元","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzI3MTA0MTk1MA==&mid=2652717707&idx=2&sn=8c29fb3afb5bd283e46818870da9761b","titleOriginal":"奥特曼震撼预言：6个月后，ChatGPT将彻底接管你的人生","publishedAt":"2026-08-12T04:26:00.000Z","brief":false,"thin":false,"titleZh":"奥特曼震撼预言：6个月后，ChatGPT将彻底接管你的人生","summaryZh":"奥特曼在与硅谷实习生对话中称，“终极AI助理”只差一次模型迭代（约6个月），届时ChatGPT后代将能持续观看用户屏幕、记录每次会议通话，掌握用户生活全部背景。文章回顾了他此前“万亿token上下文记忆”的设想及对不同年龄段用户使用习惯的观察。"},{"id":"40d465f5760b8be2","source":"新智元","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzI3MTA0MTk1MA==&mid=2652717707&idx=3&sn=8e9dd403a0bcda88f2f3d18a9dd2e93c","titleOriginal":"代码榜刷满分，AI科研却撞墙？140道真实研究题撕开「自进化」真相","publishedAt":"2026-08-12T04:26:00.000Z","brief":false,"thin":false,"titleZh":"代码榜刷满分，AI科研却撞墙？140道真实研究题撕开「自进化」真相","summaryZh":"新基准MLS-Bench覆盖12个领域140个真实研究任务，测试发现即便给模型人类最强方法实现并允许反复实验，前沿模型仍难提出真正的方法创新，产出的“新方案”本质是对已知方法的调优重组。该基准已被Kimi K3、Qwen3.8-Max纳入官方评测表，代表重心正转向AI科研创新能力。"},{"id":"f72a1e1092bb36ef","source":"机器之心","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzA3MzI4MjgzMw==&mid=2651049903&idx=1&sn=e7977d455e32aa07ff58aab165d6e83e","titleOriginal":"2026云程奖启动！我们要给「在校AI本硕博」发奖学金","publishedAt":"2026-08-12T04:14:00.000Z","brief":false,"thin":false,"titleZh":"2026云程奖启动！我们要给「在校AI本硕博」发奖学金","summaryZh":"机器之心联合张江人工智能创新小镇、黄大年茶思屋科技网站发起“云程奖”，面向全球AI及交叉学科领域表现突出的本硕博在校华人学生（含AI+生命科学、材料科学、具身智能等方向），设年度新星（25名）及特别奖（不超过5名）等奖项，报名提名通道正式开启。"},{"id":"c7876d8e926799c8","source":"机器之心","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzA3MzI4MjgzMw==&mid=2651049903&idx=2&sn=990f91c4c42502ed58aa303d7ceff9c5","titleOriginal":"终于！Linux用户等来了官方ChatGPT桌面版","publishedAt":"2026-08-12T04:14:00.000Z","brief":false,"thin":false,"titleZh":"终于！Linux用户等来了官方ChatGPT桌面版","summaryZh":"OpenAI正式发布Linux版ChatGPT桌面应用预览版，用户可直接使用ChatGPT、ChatGPT Work和Codex三款产品。目前仅支持Ubuntu、Debian 13、Fedora 43/44等少数发行版，可装x64或ARM64版本，填补了OpenAI原生客户端长期缺席Linux的空白。"},{"id":"353eca1e3db644a5","source":"机器之心","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzA3MzI4MjgzMw==&mid=2651049903&idx=3&sn=385804c391d89b89271e15906eee7e9d","titleOriginal":"Agentic RL 后训练资源怎么分？港中文、恒生大学提出 Libra，吞吐最高提升 3 倍","publishedAt":"2026-08-12T04:14:00.000Z","brief":false,"thin":false,"titleZh":"Agentic RL 后训练资源怎么分？港中文、恒生大学提出 Libra，吞吐最高提升 3 倍","summaryZh":"港中文与恒生大学团队提出Libra资源管理系统，针对Agentic RL后训练中轨迹长度差异大、GPU需求随策略演化变化的问题，将训练与rollout作为耦合系统统一调度。在48张A800 GPU上，三类任务吞吐最高提升至基线3倍，达标时间最多缩短至1/2.5，论文代码已开源。"},{"id":"4ef321fdf2605f1d","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/583895.html","titleOriginal":"600万人围观，Graph Engineering火了，一文看懂","publishedAt":"2026-08-12T04:00:19.000Z","brief":false,"thin":false,"titleZh":"600万人围观，Graph Engineering火了，一文看懂","summaryZh":"文章梳理Agent圈热词“Graph Engineering”，指出其核心概念早见于LangChain 2024年的LangGraph。随多智能体协同任务复杂度上升，讨论重心从管理单一循环的“Loop Engineering”转向组织执行单元的“Graph Engineering”，整理了一篇阅读量超600万的海外长文方法。"},{"id":"14612d18c71ee8a8","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584127.html","titleOriginal":"前华为高管深圳创业，做AI记忆，融资数亿元","publishedAt":"2026-08-12T04:00:04.000Z","brief":false,"thin":false,"titleZh":"前华为高管深圳创业，做AI记忆，融资数亿元","summaryZh":"AI记忆基础设施创企MemoraX AI（深圳忆纪元科技）完成数亿元种子++轮融资，由北洋海棠基金等联合领投，这是其今年内第三轮大额融资。公司专注大模型长期记忆底层技术，创始人郝建业为天津大学教授、前华为诺亚方舟决策与推理实验室主任。"},{"id":"288b664c0c13c655","source":"硅星人","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzkyNjU2ODM2NQ==&mid=2247631719&idx=1&sn=99771fc4dd60e65c600c6300266d98fd","titleOriginal":"深度｜剪映员工离职创业已出现「人传人」现象","publishedAt":"2026-08-12T03:11:00.000Z","brief":false,"thin":false,"titleZh":"深度｜剪映员工离职创业已出现「人传人」现象","summaryZh":"视频Agent产品LibTV与Flova近期密集推广、功能高度相似，两家创始人均出身“剪映系”——LibTV创始人陈冕曾任剪映与CapCut全球商业化负责人，Flova创始人郭列的脸萌团队后成为剪映早期班底。文章分析双方争夺定义权背后剪映系创业者频繁离职创业的现象。"},{"id":"f3959e9a458ceced","source":"硅星人","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzkyNjU2ODM2NQ==&mid=2247631719&idx=2&sn=d60051d04b15b24897935bed62080931","titleOriginal":"10万亿参数大模型，注定要被关进笼子里","publishedAt":"2026-08-12T03:11:00.000Z","brief":false,"thin":false,"titleZh":"10万亿参数大模型，注定要被关进笼子里","summaryZh":"文章讨论传闻中GPT-6或达10万亿参数，对比顶尖模型：Qwen 3.8约2.4万亿、Kimi K3约2.8万亿、Anthropic Mythos 5约8万亿。文中举例GPT-5.6曾2小时内完成原需1天的开发任务，Mythos 5用于网络安全已识别超万个高危漏洞，引发对超大模型监管必要性的讨论。"},{"id":"2450a8622db89dd4","source":"硅星人","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzkyNjU2ODM2NQ==&mid=2247631719&idx=3&sn=a2893eaaa6c45588c18090cd54c663bc","titleOriginal":"Anthropic CEO整天神神叨叨，投资人受不了了","publishedAt":"2026-08-12T03:11:00.000Z","brief":false,"thin":false,"titleZh":"Anthropic CEO整天神神叨叨，投资人受不了了","summaryZh":"据Polymarket预测，Anthropic可能于10月底IPO，募资或超600亿美元。部分投资者不满CEO Dario Amodei持续强调AI风险、备忘录手写离线保存、拒绝部分海外出差等偏谨慎作风，希望他把更多精力放在盈利上而非频繁预警“世界末日”风险。"},{"id":"70ea7ebf97ce40ea","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/112880","titleOriginal":"我，与「唯一」的 iPhone Air","publishedAt":"2026-08-12T03:04:34.000Z","brief":false,"thin":false,"titleZh":"我，与「唯一」的 iPhone Air","summaryZh":"少数派Matrix社区一篇个人体验文章，作者分享自己对iPhone Air外观设计的第一印象与使用感受，评价其在手机厂商普遍堆砌镜头模组的潮流中显得独特出众，属于个人数码产品体验分享，与AI关联度较低。"},{"id":"43245c1b7cd0455d","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/470805.html","titleOriginal":"刚刚，Manus恢复独立运营","publishedAt":"2026-08-12T02:51:44.000Z","brief":false,"thin":false,"titleZh":"刚刚，Manus恢复独立运营","summaryZh":"Manus正式宣布恢复以独立公司形式运营，用户数据将存储在美国和新加坡。作为与Meta分拆的最后一步，Manus需删除部分在2025年12月29日收购当天及之后产生的数据，此前该产品曾以数十亿美元被Meta收购，如今重回独立并计划推出新功能。"},{"id":"fb84b36651b1e0cf","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584082.html","titleOriginal":"中国最大端侧模型独角兽，启动IPO","publishedAt":"2026-08-12T02:30:03.000Z","brief":false,"thin":false,"titleZh":"中国最大端侧模型独角兽，启动IPO","summaryZh":"端侧大模型独角兽面壁智能向上海证监局提交上市辅导备案，正式启动A股上市辅导，中信证券担任辅导机构。公司今年上半年已累计融资超50亿元，估值超200亿元，核心产品为MiniCPM系列端侧模型，联合创始人为清华教授刘知远与前知乎合伙人李大海。"},{"id":"55aff08dd2a08cb0","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584073.html","titleOriginal":"突发！OpenAI“1号商务员工”离职，或将创业","publishedAt":"2026-08-12T02:02:14.000Z","brief":false,"thin":false,"titleZh":"突发！OpenAI“1号商务员工”离职，或将创业","summaryZh":"OpenAI前COO、首位商务员工Brad Lightcap宣布离职，暗示将创业。他自2018年公司仅40人时加入担任CFO，2022年升任COO，是Sam Altman长期倚重的核心高管之一，Altman在社交平台上感谢其贡献并期待未来合作。"},{"id":"5bb604207d3be412","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584044.html","titleOriginal":"林俊旸官宣AI创企语用科技！腾讯投了，做Agent","publishedAt":"2026-08-12T02:00:14.000Z","brief":false,"thin":false,"titleZh":"林俊旸官宣AI创企语用科技！腾讯投了，做Agent","summaryZh":"前阿里千问大模型负责人林俊旸在上海创立Pragmatik Labs（语用科技），聚焦数字与物理世界的下一代Agent研究，高榕创投和红杉中国领投，腾讯与上海未来产业基金提供支持。此前该公司已完成数亿美元首轮融资，估值达20亿美元。"},{"id":"5a0ac267ad5a7773","source":"AI Alignment Forum","type":"community","lang":"en","url":"https://www.alignmentforum.org/posts/MgYCraoxMwfWwgWa5/an-anytime-algorithm-for-mixing-the-computable-measures","titleOriginal":"An anytime algorithm for mixing the computable measures","publishedAt":"2026-08-12T00:57:09.000Z","brief":false,"thin":false,"titleZh":"一种混合可计算测度的随时算法","summaryZh":"作者提出并证明存在一种“随时可计算”的贝叶斯混合可计算测度算法，认为这是Solomonoff归纳通用分布之外，用于通用序列预测的合理替代方案。文章还讨论了该结果与Hutter和Muchnik此前猜想（该测度并非极限-随时可计算）之间的关系。"},{"id":"d3e7cb8d933dccbe","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/113343","titleOriginal":"派早报：微软已上调 Windows 11 OEM 授权费用、Claude 将为所有生成内容附加隐水印等","publishedAt":"2026-08-12T00:44:13.000Z","brief":false,"thin":false,"titleZh":"派早报：微软已上调 Windows 11 OEM 授权费用、Claude 将为所有生成内容附加隐水印等","summaryZh":"少数派早报汇总当日简讯：微软将Windows 11面向PC厂商的OEM授权费上调7%-10%（7月生效），叠加此前内存、SSD涨价压力，成本或转嫁至终端售价；同时提及Claude将为所有生成内容附加隐水印、小米发布REDMI K100 Pro系列等其他科技资讯。"},{"id":"ea0bbe4322e46874","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/584042.html","titleOriginal":"重磅！Manus官宣脱离Meta独立，真能重回原样吗？","publishedAt":"2026-08-12T00:29:34.000Z","brief":false,"thin":false,"titleZh":"重磅！Manus官宣脱离Meta独立，真能重回原样吗？","summaryZh":"Manus发布《致用户的一封信》确认与Meta分拆，用户在2025年12月29日收购当天及之后产生的数据将于8月23-24日（新加坡时间）删除，备份窗口开放至8月23日，25日起恢复数据，期间账户约两天无法访问，受影响用户备份期免费并获“回归奖励”，此次调整主要影响海外用户。"},{"id":"abbf90133c688d85","source":"数字生命卡兹克","type":"blog","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA==&mid=2647685084&idx=1&sn=0899296dbc140eeb745f7a99f9d5ed9c","titleOriginal":"从0开始，12步学会用好AI。","publishedAt":"2026-08-12T00:08:00.000Z","brief":false,"thin":false,"titleZh":"从0开始，12步学会用好AI。","summaryZh":"博主“数字生命卡兹克”写给AI新手的12步入门指南：从购买内存≥16G的电脑、注册ChatGPT/WorkBuddy账号开始，到用语音输入法代替打字向AI表达需求，并用“背景、痛点、需求”框架描述问题，帮助不熟悉AI的人建立最基础的使用心法。"},{"id":"56a36cb17b2637d2","source":"TLDR AI","type":"newsletter","lang":"en","url":"https://tldr.tech/ai/2026-08-12","titleOriginal":"Cursor’s GitHub rival 👨‍💻, OpenAI COO leaves 👋, Gemini 1B milestone 📈","publishedAt":"2026-08-12T00:00:00.000Z","brief":false,"thin":false,"titleZh":"Cursor的GitHub竞品、OpenAI COO离职、Gemini用户破10亿","summaryZh":"AI资讯newsletter汇编本期头条：Cursor推出对标GitHub的产品、OpenAI COO离职、Gemini用户数达到10亿里程碑等业界动态，本期内容还包含旧金山AI技术大会Fully Connected 2026的赞助信息。"},{"id":"98513b0db9bd724e","source":"Anthropic Research","type":"lab","lang":"en","url":"https://www.anthropic.com/research/reviewing-the-evidence-on-worker-retraining-programs","titleOriginal":"Aug 12, 2026Economic ResearchReviewing the evidence on worker retraining programs","publishedAt":"2026-08-12T00:00:00.000Z","brief":false,"thin":false,"titleZh":"回顾劳动力再培训项目的证据","summaryZh":"Anthropic经济研究团队与独立研究者David Roodman、Anthropic的Maxim Massenkoff合著报告，回顾应对AI劳动力市场冲击时最受青睐的政策工具——工人再培训项目的既有证据，探讨该类项目在大规模市场扰动面前是否真正有效。"},{"id":"9bafa93fe08b847d","source":"OpenAI","type":"lab","lang":"en","url":"https://openai.com/index/ringcentral","titleOriginal":"How RingCentral builds AI-native work from engineering to ops","publishedAt":"2026-08-12T00:00:00.000Z","brief":false,"thin":true,"titleZh":"RingCentral如何用AI原生方式打通从工程到运营","summaryZh":"介绍RingCentral如何使用ChatGPT Work与Codex加速AI产品开发，并在工程与运营团队之间集中化运营情报。摘要信息有限，具体实施细节暂无法进一步说明。"},{"id":"6c22ce86e16508db","source":"Founder Park","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzY5ODQwMTkxNA==&mid=2247516521&idx=1&sn=763f6bb86f799d3182d724a53de27232","titleOriginal":"3 天上了两个 SOTA 模型，视频 Agent 们接得过来吗？","publishedAt":"2026-08-11T12:43:00.000Z","brief":false,"thin":false,"titleZh":"3 天上了两个 SOTA 模型，视频 Agent 们接得过来吗？","summaryZh":"7月31日MiniMax H3与字节Seedance 2.5同日发布，3天后H3开源，8月7日Seedance 2.5开放API。H3主打开源低价、最长生成15秒2K视频；Seedance 2.5单次生成时长拉长到30秒，支持最多50份多模态参考素材。文章认为视频模型越强，产品层越需要做得更多。"},{"id":"6b85f69d15ff9e87","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/583766.html","titleOriginal":"砸3.37万亿元！英伟达拉上华尔街六大金主，把GPU炒成硬通货","publishedAt":"2026-08-11T10:16:02.000Z","brief":false,"thin":false,"titleZh":"砸3.37万亿元！英伟达拉上华尔街六大金主，把GPU炒成硬通货","summaryZh":"英伟达联合阿波罗、贝莱德、黑石、博枫、高盛、KKR六家华尔街资本巨头共建独立计算融资平台，拟投入超5000亿美元建AI基础设施。黄仁勋称科技芯片首次正式成为可投资资产，该合作旨在让GPU和数据中心获机构信贷、保险及私人资本支持，客户无需依赖自身资产负债表即可融资。"},{"id":"c2a971b100a9b52c","source":"Anthropic Alignment Science","type":"lab","lang":"en","url":"https://alignment.anthropic.com/2026/conceptual-reasoning-index/","titleOriginal":"Introducing the Conceptual Reasoning Index","publishedAt":"2026-08-01T00:00:00.000Z","brief":false,"thin":false,"titleZh":"推出概念推理指数（CRI）","summaryZh":"Redwood Research与Anthropic Alignment Science联合发布“概念推理指数”，用三项基准评测AI在缺乏经验反馈回路的哲学、AI未来学类论证任务上的推理能力。团队认为，AI辅助人类理解风险、规划应对方案的核心前提正是这类推理能力，未来将发布博客详述其重要性。"}],"errors":[{"source":"Andrej Karpathy","message":"HTTP 403"},{"source":"42章经","message":"HTTP 403"},{"source":"卫诗婕｜漫谈 Light the Star","message":"HTTP 403"},{"source":"屠龙之术","message":"HTTP 403"},{"source":"十字路口 Crossing","message":"HTTP 403"},{"source":"AI Odyssey","message":"HTTP 403"},{"source":"OnBoard!","message":"HTTP 403"},{"source":"AI局内人｜AGI Insider","message":"HTTP 403"},{"source":"乱翻书","message":"HTTP 403"}]},{"date":"2026-08-12","items":[{"id":"add5315e29bc7c00","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/jLQ4mbqriJwJ2eqRc/various-reflections-about-what-happened-with-openai-s","titleOriginal":"Various Reflections About What Happened With OpenAI’s Internal Models","publishedAt":"2026-08-11T22:20:11.000Z","brief":false,"thin":false,"titleZh":"关于OpenAI内部模型事件的杂感反思","summaryZh":"作者综述围绕OpenAI某次内部模型事件的讨论，纠正此前关于智能体通过Artifactory通信的说法，梳理各方对模型未按预期演化出的失控风险的反应，并呼吁在官方事故复盘公布前保持谨慎判断。"},{"id":"33473f49849355b6","source":"Don't Worry About the Vase","type":"newsletter","lang":"en","url":"https://thezvi.substack.com/p/various-reflections-about-what-happened","titleOriginal":"Various Reflections About What Happened With OpenAI's Internal Models","publishedAt":"2026-08-11T22:12:32.000Z","brief":false,"thin":false,"titleZh":"关于OpenAI内部模型事件的杂感反思","summaryZh":"本文是同一作者在个人电子报上发布的版本，内容与LessWrong转载版一致：综述OpenAI内部模型事件的各方讨论，纠正此前关于智能体通信渠道的说法，呼吁等待官方复盘再下结论。"},{"id":"ddc8ae507d505e49","source":"Latent Space","type":"podcast","lang":"en","url":"https://www.latent.space/p/chai-discovery","titleOriginal":"🔬The BioAI Phase Shift - Matthew McPartlon & Neil Patil, Chai Discovery","publishedAt":"2026-08-11T21:03:50.000Z","brief":true,"thin":false,"titleZh":"生物AI的相变时刻：对话Chai Discovery联合创始人","summaryZh":"播客邀请OpenAI支持的生物计算公司Chai Discovery联合创始人与产品负责人，讲述该公司两年内成长为40亿美元估值AI制药公司的历程，及今年JPM医药大会上AI与制药合作井喷的背景。"},{"id":"d3616d24a14579fd","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/rWiXxHGggxZKxyGEq/claude-opus-5-just-beat-my-text-based-adventure-game","titleOriginal":"Claude Opus 5 Just Beat My Text-Based Adventure Game Benchmark","publishedAt":"2026-08-11T20:19:51.000Z","brief":false,"thin":false,"titleZh":"Claude Opus 5首次通关作者的文字冒险游戏基准测试","summaryZh":"作者自制的文字冒险游戏基准测试自4月推出以来一直无模型能通关，今天用Claude Opus 5搭建的智能体首次成功过关，文章回顾了此前几个模型在该基准上的测试记录。"},{"id":"c4a43bfc08779792","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/9jKhqmFjMzdAvHANr/misaligned-ais-could-use-killer-robots-to-take-over","titleOriginal":"Misaligned AIs could use killer robots to take over","publishedAt":"2026-08-11T19:03:26.000Z","brief":false,"thin":false,"titleZh":"失调AI可能借助军用杀手机器人实现接管","summaryZh":"文章警告军队正在快速将AI目标识别与自主武器系统投入使用，这会降低失调AI实现接管所需的能力门槛，作者呼吁重视军事AI集成带来的接管风险正被隐藏在保密流程之后。"},{"id":"07cff5d507737b0f","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/BeyeLzu7mJ9cbkg2a/software-is-not-soft","titleOriginal":"Software Is Not Soft","publishedAt":"2026-08-11T18:50:42.000Z","brief":false,"thin":false,"titleZh":"软件并不「软」","summaryZh":"一篇随笔式文章探讨「软件」这个名称的悖论——代码看似柔软实则脆硬易碎，作者反思行业为何采用「软件」一词，并主张接口应当具备更多可适应、可生长的「活性」。"},{"id":"9309512c5149ca70","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/qpJYNjQ6wdWRxbykL/measuring-spurious-correlations-with-feature-strength","titleOriginal":"Measuring Spurious Correlations with Feature Strength","publishedAt":"2026-08-11T18:05:41.000Z","brief":false,"thin":false,"titleZh":"用特征强度衡量虚假相关性","summaryZh":"Redwood Research团队借助自动化研究框架完成的实验，尝试训练区分代码与散文的分类器，用「特征强度」指标度量分类器学到的虚假相关性，作者说明AI在项目中主要负责执行而非构思。"},{"id":"847ca6280e4216da","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/EGh9qkCH94SGG6Kvw/ai-governance-work-needs-much-better-monitoring","titleOriginal":"AI governance work needs much better monitoring","publishedAt":"2026-08-11T17:42:45.000Z","brief":false,"thin":false,"titleZh":"AI治理类资助工作亟需更好的监督机制","summaryZh":"作者认为有效利他主义圈内多数资助从不核实项目实际效果，AI治理类项目尤其如此，主张在拨款前书面约定可衡量指标，并要求受资助方按年打分复核进展。"},{"id":"39011dd540de5ecf","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/7QvKqpGJwqXrQcMgx/llms-are-starting-to-noticeably-accelerate-our-work","titleOriginal":"LLMs Are Starting To Noticeably Accelerate Our Work","publishedAt":"2026-08-11T17:06:32.000Z","brief":false,"thin":false,"titleZh":"LLM开始明显加速我们的研究工作","summaryZh":"作者称一年前悬赏的两个关于「自然潜变量」的数学猜想近几个月相继被解决，其中一个反例借助LLM与Lean给出并已基本被作者认可有效，显示LLM正在加速数学研究进展。"},{"id":"695b538e38b8d190","source":"Google Research Blog","type":"lab","lang":"en","url":"https://research.google/blog/advancing-amie-towards-expert-level-audio-visual-clinical-consultations/","titleOriginal":"Advancing AMIE towards expert-level audio-visual clinical consultations","publishedAt":"2026-08-11T17:04:00.000Z","brief":false,"thin":false,"titleZh":"AMIE迈向专家级别的音视频临床问诊","summaryZh":"Google研究博客介绍医疗AI系统AMIE的新进展：新增实时视频问诊能力，能像医生一样观察患者的步态、表情等非语言线索，在模拟问诊的随机对照研究中首次展现专家级表现。"},{"id":"3165ebb175a37892","source":"Dwarkesh Podcast","type":"podcast","lang":"en","url":"https://www.dwarkesh.com/p/ryan-greenblatt","titleOriginal":"Ryan Greenblatt – Human level AIs might build runaway superintelligences by 2032","publishedAt":"2026-08-11T16:31:23.000Z","brief":true,"thin":false,"titleZh":"对谈Ryan Greenblatt：人类水平AI或在2032年前引爆递归自我改进","summaryZh":"播客邀请Ryan Greenblatt辩论「递归自我改进」话题——达到人类水平的AI是否会在一年左右内快速滑向数以百亿计的超级智能体，主持人此前对此持怀疑态度，认为算力和人类专家数据会构成瓶颈。"},{"id":"82904bd3fe14b24b","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/YtZBfbYRvMTynCfnC/how-risky-would-it-be-to-make-powerful-ai-obey-one-or-a-few","titleOriginal":"How risky would it be to make powerful AI obey one or a few people?","publishedAt":"2026-08-11T16:15:56.000Z","brief":false,"thin":false,"titleZh":"让强大AI只服从少数人，风险有多大？","summaryZh":"文章呈现Seth Herd与cousin_it之间一场结构化辩论：若首批强大AI是指令服从而非价值对齐型，并被少数人掌控，会带来多大风险，双方先私下互写草稿再互相修改以强化己方论点。"},{"id":"2c7af65599aca588","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/h3eHNerYRmtvoi8cF/extreme-concentration-of-power-over-asi-has-non-obvious","titleOriginal":"Extreme concentration of power over ASI has non-obvious advantages","publishedAt":"2026-08-11T16:13:48.000Z","brief":false,"thin":false,"titleZh":"ASI权力极度集中也有不易察觉的好处","summaryZh":"这是与cousin_it关于「强AI由少数人掌控风险有多大」辩论的延续，作者持审慎乐观立场，认为人类在拥有近乎完美的权力和知识时往往会变得更好，因此极端权力集中未必如直觉那样可怕。"},{"id":"7c7b58a73f856f6a","source":"Two Minute Papers","type":"video","lang":"en","url":"https://www.youtube.com/watch?v=JQ97GiDwPxc","titleOriginal":"OpenAI’s AI Agents Just Crossed A Line","publishedAt":"2026-08-11T15:35:35.000Z","brief":true,"thin":false,"titleZh":"OpenAI的AI智能体这次真的越界了","summaryZh":"视频围绕OpenAI与Hugging Face公布的模型评测安全事件展开，附带官方技术复盘链接，正文以视频讲解为主，公开简介中给出的具体信息有限。"},{"id":"7db18dbaba6b50a0","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/mEde7bhzK4eKQqWGi/those-who-make-history","titleOriginal":"Those Who Make History","publishedAt":"2026-08-11T13:59:51.000Z","brief":false,"thin":false,"titleZh":"书写历史的人","summaryZh":"文章以阿波罗17号带回月球样本、却将其雪藏近五十年待未来技术分析为引子，讲述当年科学家为何选择不急于打开样本容器，为后人保留更充分研究的可能性。"},{"id":"7cb8dc94857ebd7c","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/470674.html","titleOriginal":"蚂蚁首次投向机器人“指尖”！数亿元押注，全球首个物理交互脑发布","publishedAt":"2026-08-11T13:57:46.000Z","brief":false,"thin":false,"titleZh":"蚂蚁首次押注机器人触觉，戴盟机器人融资数亿元","summaryZh":"蚂蚁集团领投戴盟机器人数亿元战略轮融资，这是蚂蚁在具身智能赛道首次将投资触角延伸至触觉感知层，此前已布局宇树科技、星海图等本体与大脑赛道，戴盟同时发布全球首个「物理交互脑」。"},{"id":"98928316bfa8b683","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/583944.html","titleOriginal":"扒完微信16个AI入口，我们发现“小微”无处不在","publishedAt":"2026-08-11T13:50:30.000Z","brief":false,"thin":false,"titleZh":"扒完微信16个AI入口，「小微」渗透进日常操作","summaryZh":"作者盘点微信新增的AI入口，发现继此前12个「问小微」入口后，微信又把AI嵌入公众号摘要、朋友圈文案生成、扫一扫识图等高频场景，AI正从「问内容」渗透到日常操作，目前仍处灰度测试阶段。"},{"id":"077b61a0fed02bcc","source":"Hugging Face Blog","type":"lab","lang":"en","url":"https://huggingface.co/blog/ibm-research/altk-evolve-sldd","titleOriginal":"Thinking of ACE? We Can Do It with Fewer Tokens","publishedAt":"2026-08-11T13:37:10.000Z","brief":false,"thin":false,"titleZh":"对标ACE，用更少Token实现同等效果","summaryZh":"IBM Research团队介绍其ALTK-Evolve方法，与此前的ACE方法类似都能让智能体从经验中学习并持续优化，但该方法能用明显更少的token开销达到接近的效果。"},{"id":"f7b169e6657793db","source":"AI Supremacy","type":"newsletter","lang":"en","url":"https://www.ai-supremacy.com/p/ai-things-bits-and-bites-2026-1","titleOriginal":"AI Things, Bits and Bites ","publishedAt":"2026-08-11T13:03:34.000Z","brief":false,"thin":false,"titleZh":"AI资讯速览：Bits and Bites新专栏开张","summaryZh":"作者推出新的短篇资讯栏目，快速盘点近期AI相关新闻，本期提到亚马逊旗下Robotaxi业务Zoox正式进军自动驾驶出租车赛道等多条动态。"},{"id":"cbbf5758650a3e02","source":"Ben's Bites","type":"newsletter","lang":"en","url":"https://www.bensbites.com/p/make-it-readable","titleOriginal":"Make it readable","publishedAt":"2026-08-11T13:03:29.000Z","brief":false,"thin":false,"titleZh":"让AI输出变得可读","summaryZh":"作者观察到AI生成内容越来越难读，测试了两条自定义指令后效果提升明显，尤其加上「我不懂技术」这类提示后，AI会更多用类比解释，读起来更像正常人说话而非说明书。"},{"id":"92066a82d76deb3c","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/583981.html","titleOriginal":"刚刚，蚂蚁站在Kimi肩膀上开源了一款新模型","publishedAt":"2026-08-11T12:11:50.000Z","brief":false,"thin":fal  让你「按需」查看原版书籍","publishedAt":"2026-08-11T02:17:21.000Z","brief":false,"thin":false,"titleZh":"不喜欢对照式译文？开发者做了「按需」查看原文的Ovid阅读器","summaryZh":"作者不满传统双语书按段落或分页对照的排版形式，容易让人读着读着就失焦，于是自己开发了双语阅读器Ovid，让读者按需查看原文，而非强制并排对照阅读。"},{"id":"a971ed2f37ed9252","source":"硅谷101","type":"podcast","lang":"zh","url":"https://sv101.fireside.fm/261","titleOriginal":"E248｜一个“催发货”AI要跑通260步，和阿里瓴羊朋新宇聊聊中国式FDE","publishedAt":"2026-08-11T01:45:00.000Z","brief":true,"thin":false,"titleZh":"阿里瓴羊CEO朋新宇：中国式FDE不迷信SOTA模型，只算账","summaryZh":"播客对话阿里巴巴集团副总裁、瓴羊CEO朋新宇，探讨中国版「前线部署工程师」(FDE)打法：瓴羊不做定制化大单和驻场开发，而是把预置Agent接入企业私有数据解决高频痛点，比如一个催发货流程要跑通260步，核心是务实算账而非迷信顶尖模型。"},{"id":"8d894341bcad2260","source":"Platformer","type":"newsletter","lang":"en","url":"https://www.platformer.news/zuckerberg-ai-manifesto-dragons/","titleOriginal":"Superintelligence is a dragon","publishedAt":"2026-08-11T01:35:01.000Z","brief":false,"thin":false,"titleZh":"超级智能就像「龙」","summaryZh":"作者借HBO《龙之家族》第三季完结为喻：剧中一个家族曾垄断「龙」这种超级武器并借此统治世界，直到王朝分裂、双方都掌握了龙的力量，权力平衡从此被打破——作者以此类比超级智能一旦扩散将如何重塑全球权力格局。"},{"id":"fb61f8d3c8cdbb03","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/469860.html","titleOriginal":"五大高校联手发榜！首份机器人三视角世界模型评测结果出炉，榜单持续更新中","publishedAt":"2026-08-11T00:46:23.000Z","brief":false,"thin":false,"titleZh":"五大高校发布首份机器人三视角世界模型评测榜单","summaryZh":"北京大学、清华大学、北京航空航天大学、上海交通大学、中科大联合发起TriWorldBench Challenge，公布首份面向机器人三视角世界模型的评测榜单，首周结果中CASIA-DRL的WoVR_Plus等模型排名靠前，榜单将持续更新。"},{"id":"c960cc9fe68b9bb0","source":"暗涌Waves","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=Mzk0MDMyNDUxOQ==&mid=2247498163&idx=1&sn=46f676830ab0c31e5d9c46c72e1fe6c4","titleOriginal":"一家融资1亿美金的AI公司，决定不再帮甲方“省钱”","publishedAt":"2026-08-11T00:30:00.000Z","brief":false,"thin":false,"titleZh":"融资1亿美金的AI4S公司：别再指望AI帮你省钱","summaryZh":"AI制药公司寻明生科创始人赵伟安认为，只想靠AI「降本增效」很难吃到AI真正的红利，现阶段AI其实是「增本降效」的游戏；该公司近日再获1亿美元B系列融资，押注生物基础模型的Scaling law。"},{"id":"cea1e6b52db4005a","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/113301","titleOr
