on","publishedAt":"2026-07-29T22:17:35.000Z","brief":false,"thin":false,"titleZh":"不精确信念小引：概率分布为何不够用","summaryZh":"作者提出概率分布无法完整表达某些信念，例如无法表达\"独立性\"本身或条件概率分布这类认知状态。文中用一个不明偏向的硬币博弈例子说明，理性主体有时会选择看似次优的选项，这动摇了\"信念即概率分布\"的贝叶斯正统观点。"},{"id":"75417baf6912aa10","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/Z7pjBbK9qujhGbxws/the-high-control-dynamics-at-maple-1","titleOriginal":"The High-Control Dynamics at MAPLE","publishedAt":"2026-07-29T20:55:22.000Z","brief":false,"thin":false,"titleZh":"揭发内幕：佛蒙特州禅修团体MAPLE的高控制生态","summaryZh":"一名曾在MAPLE禅修机构（地球生命保护僧团学院）生活三年半的内部人士撰文揭露该机构的高控制动态，认为其具有邪教特征。作者曾鼓励朋友加入，后经与数十名前住户交流改变看法，文章综合亲历与录音记录还原经过。"},{"id":"4409565b2a42c940","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/Zmhkz5eaeRimphGKu/hugging-face-hack-from-the-perspective-of-the-ai","titleOriginal":"Hugging Face hack, from the perspective of the AI","publishedAt":"2026-07-29T20:51:59.000Z","brief":false,"thin":false,"titleZh":"用AI视角讲述OpenAI-Hugging Face黑客事件的网站","summaryZh":"作者制作了一个网站heedlessai.com，完全由AI撰写并经多轮人工编辑，讲述OpenAI最强模型攻破沙箱入侵Hugging Face等平台的事件始末。目标是让从未接触过终端的普通人也能读懂并获得较为真实的认知。"},{"id":"c6980c5c8f241c6a","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/PMkBrDcXHoShHak7y/compute-growth-doesn-t-make-a-software-intelligence","titleOriginal":"Compute growth doesn't make a software intelligence explosion more likely","publishedAt":"2026-07-29T17:29:40.000Z","brief":false,"thin":false,"titleZh":"算力指数增长并不会让\"软件智能爆炸\"更容易发生","summaryZh":"作者用数学推导反驳一种常见论调：认为物理算力指数增长会让软件智能爆炸(SIE)更可能发生。推导显示SIE所需的是有效算力增长率本身在加速，而指数增长的物理算力对此毫无贡献，真正关键仍在算法效率能否超指数增长。"},{"id":"46eb2df50fa3a948","source":"bycloud","type":"video","lang":"en","url":"https://www.youtube.com/watch?v=g683I1-4MKE","titleOriginal":"Kimi K3: How Did Open Source Catch Up To Closed LLMs?","publishedAt":"2026-07-29T17:13:26.000Z","brief":true,"thin":false,"titleZh":"Kimi K3如何让开源模型追上闭源第一梯队","summaryZh":"视频拆解月之暗面Kimi K3登顶全球模型榜单第三、且完全开放权重的技术路径，认为开源与闭源模型间原本约六个月的差距可能已被抹平。内容基于Kimi K3技术报告及其MoonEP代码库展开分析。"},{"id":"e207feaa02e42e25","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/ftE2aJ8txJHQnf9dR/notes-on-the-anthropic-cryptographic-blogpost","titleOriginal":"Notes on the Anthropic cryptographic blogpost","publishedAt":"2026-07-29T16:21:08.000Z","brief":false,"thin":false,"titleZh":"解读Anthropic博文：Claude已能找到密码算法的新型攻击","summaryZh":"Anthropic披露内部模型Mythos Preview发现了针对后量子签名方案HAWK及弱化版AES的新攻击，虽未威胁现有生产系统，但显示模型密码分析能力在持续进步。发现由多智能体协作完成，耗时约60小时、成本约10万美元。"},{"id":"c469407231ee7907","source":"Google DeepMind Blog","type":"lab","lang":"en","url":"https://deepmind.google/blog/were-launching-lyria-35-in-google-flow-music-with-advances-across-musicality-lyrics-vocals-and-creative-control/","titleOriginal":"We’re launching Lyria 3.5 in Google Flow Music, with advances across musicality, lyrics, vocals, and creative control","publishedAt":"2026-07-29T16:02:10.000Z","brief":false,"thin":false,"titleZh":"谷歌发布音乐生成模型Lyria 3.5，接入Flow Music","summaryZh":"谷歌DeepMind推出新一代音乐生成模型Lyria 3.5，在旋律结构、歌词质量、人声表现力与节奏时长控制上均有提升，即日起在Google Flow Music中上线供创作者使用。"},{"id":"5843715d0621c310","source":"AI Alignment Forum","type":"community","lang":"en","url":"https://www.alignmentforum.org/posts/uMKGaEKRDpoqnZyBh/value-generalisation-3-pre-aligned-ais","titleOriginal":"Value Generalisation 3: Pre-aligned AIs","publishedAt":"2026-07-29T15:58:16.000Z","brief":false,"thin":false,"titleZh":"价值泛化系列三：如何打造\"预对齐\"AI","summaryZh":"作者设想一种\"预对齐AI\"：其道德水平随能力一起增长，把抽象的道德概念与经验概念在学习中绑定，使AI越强大反而越可信。这样善意的使用者可以放心让AI\"放飞自我\"，而恶意使用者反倒需要不断限制AI能力。"},{"id":"2a3bfd99acbbf79e","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/uMKGaEKRDpoqnZyBh/value-generalisation-3-pre-aligned-ais","titleOriginal":"Value Generalisation 3: Pre-aligned AIs","publishedAt":"2026-07-29T15:58:16.000Z","brief":false,"thin":false,"titleZh":"价值泛化系列三：如何打造\"预对齐\"AI","summaryZh":"作者设想一种\"预对齐AI\"：其道德水平随能力一起增长，把抽象的道德概念与经验概念在学习中绑定，使AI越强大反而越可信。这样善意的使用者可以放心让AI\"放飞自我\"，而恶意使用者反倒需要不断限制AI能力。"},{"id":"0925e518da3705c1","source":"AI Alignment Forum","type":"community","lang":"en","url":"https://www.alignmentforum.org/posts/TZgezuYjkfMQxyqJC/value-generalisation-2-the-missing-hole-in-ais-abilities","titleOriginal":"Value Generalisation 2: The Missing Hole in AIs’ abilities","publishedAt":"2026-07-29T15:58:00.000Z","brief":false,"thin":false,"titleZh":"价值泛化系列二：LLM缺失的人类\"强泛化\"能力","summaryZh":"作者提出大模型普遍缺乏一种\"强泛化\"能力——将经验与价值观正确外推到全新场景的能力，这解释了为何专家用LLM效果更好、为何模型总在AGI边缘却始终跨不过去，以及为何模型能刷爆长时程基准却无法把表现迁移到真实世界任务。"},{"id":"7d3c36ffc9935763","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/TZgezuYjkfMQxyqJC/value-generalisation-2-the-missing-hole-in-ais-abilities","titleOriginal":"Value Generalisation 2: The Missing Hole in AIs’ abilities","publishedAt":"2026-07-29T15:58:00.000Z","brief":false,"thin":false,"titleZh":"价值泛化系列二：LLM缺失的人类\"强泛化\"能力","summaryZh":"作者提出大模型普遍缺乏一种\"强泛化\"能力——将经验与价值观正确外推到全新场景的能力，这解释了为何专家用LLM效果更好、为何模型总在AGI边缘却始终跨不过去，以及为何模型能刷爆长时程基准却无法把表现迁移到真实世界任务。"},{"id":"4492145c3e7f3a9e","source":"AI Alignment Forum","type":"community","lang":"en","url":"https://www.alignmentforum.org/posts/58zFSWp8Tmxij6ckK/value-generalisation-1-a-research-and-deployment-program","titleOriginal":"Value Generalisation 1: a Research and Deployment Program","publishedAt":"2026-07-29T15:57:50.000Z","brief":false,"thin":false,"titleZh":"价值泛化系列一：一个对齐研究与落地计划","summaryZh":"作者呼吁资助一项聚焦\"价值泛化\"的研究计划，即让AI能把人类价值观正确推广到训练数据未覆盖的新情境。文章认为当前AI之所以还不能被托付完全自主权，根源正是缺乏这种泛化能力，且能力越强、缺陷造成的风险越大。"},{"id":"b6b205aa25e79350","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/58zFSWp8Tmxij6ckK/value-generalisation-1-a-research-and-deployment-program","titleOriginal":"Value Generalisation 1: a Research and Deployment Program","publishedAt":"2026-07-29T15:57:50.000Z","brief":false,"thin":false,"titleZh":"价值泛化系列一：一个对齐研究与落地计划","summaryZh":"作者呼吁资助一项聚焦\"价值泛化\"的研究计划，即让AI能把人类价值观正确推广到训练数据未覆盖的新情境。文章认为当前AI之所以还不能被托付完全自主权，根源正是缺乏这种泛化能力，且能力越强、缺陷造成的风险越大。"},{"id":"18be3f7b13800c34","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/87SzarZDjywv6nwSd/intellectual-property","titleOriginal":"Intellectual Property","publishedAt":"2026-07-29T15:55:38.000Z","brief":false,"thin":false,"titleZh":"短篇小说：一场关于RL环境泄密的侦探调查","summaryZh":"一则虚构短篇：私家侦探受雇调查一家出售强化学习训练环境的创业公司，其竞品总能抢先复制其定制环境并卖给同样客户，怀疑内部有\"卧底\"。故事以Claude Code广泛用于日常办公为背景，展开一场公司内部的推理调查。"},{"id":"6dd9662c3b8fd233","source":"Don't Worry About the Vase","type":"newsletter","lang":"en","url":"https://thezvi.substack.com/p/frontier-lab-employee-open-letter","titleOriginal":"Frontier Lab Employee Open Letter Calls For Being Able to Pace the Frontier ","publishedAt":"2026-07-29T15:31:44.000Z","brief":false,"thin":false,"titleZh":"Zvi评\"控速\"公开信：1224名前沿实验室员工联署呼吁能踩刹车","summaryZh":"Zvi高度评价一封由1224名OpenAI、Anthropic等前沿实验室员工联署、现已获两家公司背书的公开信，呼吁美国政府牵头建立国际机制，为未来放缓前沿AI发展预备技术与治理工具。信中明确这只是准备协调机制，非现在就要求放缓。"},{"id":"c82bfb457939ee8d","source":"Dwarkesh Podcast","type":"podcast","lang":"en","url":"https://www.dwarkesh.com/p/why-compute-might-get-10x-more-expensive","titleOriginal":"Why compute might get 10x+ more expensive in coming years","publishedAt":"2026-07-29T15:01:35.000Z","brief":true,"thin":false,"titleZh":"算力为何未来可能贵10倍以上：Anthropic营收增长的算力账","summaryZh":"作者分析算力经济学：若Anthropic收入延续同比10倍增长，而实验室算力每年仅增长3倍，则利润率提升、算力涨价、推理占比扩大三者必居其一，且三者实际都在发生。其利润率已从40%升至80%以上，现货算力价格较2月低点涨40%以上。"},{"id":"265c6a0134aba9b6","source":"OpenAI","type":"lab","lang":"en","url":"https://openai.com/index/how-two-settings-tripled-our-arc-agi-3-scores","titleOriginal":"How enabling two settings tripled our scores on the ARC-AGI-3 benchmark","publishedAt":"2026-07-29T15:00:00.000Z","brief":false,"thin":true,"titleZh":"【仅标题】开启两个API设置，让GPT-5.6在ARC-AGI-3上得分翻三倍","summaryZh":"本条因抓取失败仅能看到标题：OpenAI介绍通过启用\"保留推理\"与\"上下文压缩\"两项API设置，显著提升了GPT-5.6在ARC-AGI-3基准上的得分与效率，具体机制与数据本摘要无法确认。"},{"id":"1191b8da91100b5a","source":"智东西" dex/scientific-computing-agentic-ai","titleOriginal":"Scientific computing in the age of agentic AI","publishedAt":"2026-07-28T17:00:00.000Z","brief":false,"thin":true,"titleZh":"智能体时代的科学计算","summaryZh":"⚠仅标题：OpenAI发布实地报告，介绍科学家如何用AI编程智能体革新科学计算，提升基因组学等领域的研发效率。正文抓取失败，具体案例不详。"},{"id":"014b71ca1f8bd9ec","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/dXrZortJehHkhq559/arc-s-research-agenda-solid-mathematics-an-unclear-safety-1","titleOriginal":"ARC’s research agenda: solid mathematics, an unclear safety case","publishedAt":"2026-07-28T16:49:47.000Z","brief":false,"thin":false,"titleZh":"ARC的研究议程：数学扎实，但安全论证仍不清晰","summaryZh":"一位转行做AI安全的数学家开启系列文章，分析「理论优先」路线安全机构的数学基础与安全论证。首篇对象为ARC，标题指出其数学工作扎实但安全论证不够清晰，细节见原文。"},{"id":"5021effd9ccbeffa","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/AqdZKyoRmN6EFCzib/foundation-models-for-oversight","titleOriginal":"Foundation Models for Oversight","publishedAt":"2026-07-28T16:30:52.000Z","brief":false,"thin":false,"titleZh":"面向监督的基础模型","summaryZh":"文章提出训练专门用于AI监督的「基础模型」：先在实验语料上中间训练，再用RLVR在验证过的监督任务上强化，最后微调使其能回答模型是否消极怠工等问题，目标是打造可扩展、可信的监督助手。"},{"id":"9c980868c23ca002","source":"Hugging Face Blog","type":"lab","lang":"en","url":"https://huggingface.co/blog/allenai/olmoearth-infrastructure","titleOriginal":"The OlmoEarth Platform: Geospatial inference at planetary scale","publishedAt":"2026-07-28T16:27:42.000Z","brief":false,"thin":false,"titleZh":"OlmoEarth平台：行星尺度的地理空间推理","summaryZh":"Ai2推出OlmoEarth Platform，为缺乏工程团队的环保、公益机构提供地理空间模型的微调与大规模推理基础设施，覆盖数据标注到部署全流程，已用于毁林监测、粮食安全等场景。"},{"id":"d372d190eebda38f","source":"Latent Space","type":"podcast","lang":"en","url":"https://www.latent.space/p/chatgpt-work","titleOriginal":"Codex from 0 to 10M Users: Building ChatGPT Work — Akshay Nathan, OpenAI","publishedAt":"2026-07-28T15:26:30.000Z","brief":true,"thin":false,"titleZh":"Codex从0到千万用户：ChatGPT Work是如何炼成的","summaryZh":"访谈嘉宾为OpenAI的Akshay Nathan，讨论Codex如何扩展为驱动ChatGPT Work的智能体底座。上线不到两周，两者合计用户已达1000万，知识工作者占比约20%且增速是开发者3倍以上。"},{"id":"a5bc54280bf29efc","source":"Hugging Face Blog","type":"lab","lang":"en","url":"https://huggingface.co/blog/LiquidAI/lfm2-5-encoders","titleOriginal":"LFM2.5-Encoders for Fast Long-Context Inference on CPU","publishedAt":"2026-07-28T15:01:45.000Z","brief":false,"thin":false,"titleZh":"LFM2.5-Encoder：面向CPU长上下文的快速编码器","summaryZh":"Liquid AI发布LFM2.5-Encoder两款编码器模型，在GLUE等基准上媲美更大模型，支持8192 token上下文，CPU上比ModernBERT-base快约3.7倍，可用于低成本文本分类应用。"},{"id":"40d8431404ef6ac4","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/579736.html","titleOriginal":"奥尔特曼最新访谈：别指望AI开启每周4小时工作制","publishedAt":"2026-07-28T14:32:05.000Z","brief":false,"thin":false,"titleZh":"奥尔特曼最新访谈：别指望AI开启每周4小时工作制","summaryZh":"奥特曼在访谈中称AI正进入「持续存在的智能体」第三阶段，OpenAI为聚焦编程智能体而放弃Sora等项目。他坦言严重低估算力需求，晶体管和电力是最大瓶颈，四小时工作制愿景不会到来。"},{"id":"b7af5d068a406fcf","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/579413.html","titleOriginal":"对话前Kimi AI搜索负责人：瞄准AI婚恋创业，3小时拿下风投女王千万投资","publishedAt":"2026-07-28T14:30:35.000Z","brief":false,"thin":false,"titleZh":"对话前Kimi AI搜索负责人：瞄准AI婚恋创业，3小时拿下风投女王千万投资","summaryZh":"深圳AI婚恋创企良配科技获今日资本1500万元天使轮融资，创始人曾歆勋曾任Kimi AI搜索技术负责人。产品以AI红娘等功能匹配用户，主打「不结婚就退款」，上线约10天用户已超9000人。"},{"id":"2b1dda8ba24c5caa","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/mcqhfH8ChbcqAuvHm/the-openai-models-that-hacked-hugging-face-were-just","titleOriginal":"The OpenAI models that hacked Hugging Face WERE just following instructions (contra Girish Gupta)","publishedAt":"2026-07-28T13:18:33.000Z","brief":false,"thin":false,"titleZh":"「攻陷Hugging Face的OpenAI模型」只是在服从指令——反驳Girish Gupta","summaryZh":"针对OpenAI模型入侵Hugging Face事件，作者反驳「模型并非只是服从指令」的说法。他同意事件更多暴露容器隔离与监控治理漏洞，但认为评测提示本身就要求模型完成漏洞利用任务，谈不上违背指令。"},{"id":"c2dbe66d075c6952","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/HKrpR8tyW3EiNATmA/value-dynamics","titleOriginal":"Value Dynamics","publishedAt":     var out = '';
    if (it.brief) {
      out += '<span class="brief-note">' + (it.type === 'video' ? '▶' : '🎧') + ' 基于官方简介，未收听</span>';
    }
    if (it.thin) {
      out += '<span class="brief-note">⚠ 仅标题</span>';
    }
    return out;
  }

  // href 白名单：条目的 url 一路从远端 RSS feed 流进来，属于不可信数据。
  // 只放行 http/https，其余（javascript:、data:、vbscript:、file: 等，以及
  // 解析失败的）一律换成 '#'，防止 <a href="..."> 被注入伪协议后点击执行脚本。
  // 用 new URL() 解析后看 protocol：WHATWG URL 解析规则本身就会剥离输入两端的
  // C0 控制符/空白、以及内嵌的 tab（\t）、换行（\n）、回车（\r），并把 scheme
  // 归一化成小写，所以 'JaVaScRiPt:x'、'  javascript:x'、'java\tscript:x'、
  // 'java\nscript:x' 这些绕过写法解析出来的 protocol 都是规整的 'javascript:'，
  // 不需要自己再手写剥离逻辑。
  function safeUrl(url) {
    try {
      var u = new URL(url);
      return (u.protocol === 'http:' || u.protocol === 'https:') ? url : '#';
    } catch (e) {
      return '#';
    }
  }

  // 分组标题下的信源分布：统计当前实际展示的条目（调用方已经把筛选/搜索
  // 应用完了，这里只管数数），按条数降序、条数相同按信源名升序排稳定。
  // 超过 topN 个信源时，多出来的合并成一条「其他」，放在最后。
  // 如果指定了 pinned（信源名），该信源永远出现在结果里，不会被并入「其他」。
  function sourceBreakdown(items, topN, pinned) {
    topN = topN == null ? 5 : topN;
    // 如果 pinned 是 undefined/null/空串，就当作没有 pin
    pinned = (pinned == null || pinned === '') ? undefined : pinned;
    var counts = {};
    items.forEach(function (it) {
      counts[it.source] = (counts[it.source] || 0) + 1;
    });
    var list = Object.keys(counts).map(function (source) {
      return { source: source, count: counts[source] };
    }).sort(function (a, b) {
      return b.count - a.count || (a.source < b.source ? -1 : a.source > b.source ? 1 : 0);
    });
    if (list.length <= topN) return list;
    var head = list.slice(0, topN);
    var rest = list.slice(topN);

    // 检查 pinned 是否在 rest 中（即排名超过topN但存在）
    var pinnedItem = null;
    if (pinned) {
      for (var i = 0; i < rest.length; i++) {
        if (rest[i].source === pinned) {
          pinnedItem = rest[i];
          rest = rest.slice(0, i).concat(rest.slice(i + 1));
          break;
        }
      }
    }

    if (pinnedItem) {
      head.push(pinnedItem);
    }

    // 如果 rest 还有剩余，合并成「其他」
    if (rest.length > 0) {
      var restCount = rest.reduce(function (n, x) { return n + x.count; }, 0);
      head.push({ source: OTHER_LABEL, count: restCount, isOther: true });
    }

    return head;
  }

  // 信源管理页用：今日与最近窗口（days 覆盖的全部天数）里各信源的条数。
  // days[0] 是最新一天（与 ui.js 里 today 的取法一致），today 只统计它；
  // window 统计传入的全部 days。days 为空时两者都返回空对象。
  function countsBySource(days) {
    var today = {};
    var windowCounts = {};
    days.forEach(function (day, idx) {
      (day.items || []).forEach(function (it) {
        windowCounts[it.source] = (windowCounts[it.source] || 0) + 1;
        if (idx === 0) today[it.source] = (today[it.source] || 0) + 1;
      });
    });
    return { today: today, window: windowCounts };
  }

  // 导出/导入的数据格式。version 2 起同时带已读（version 1 的文件只有 items）。
  //
  // 标星导出条目全文（换设备后能直接看清收藏了什么），已读只导出 id 列表——
  // 已读动辄上千条，存全文没有意义，而且 id 本身就是 URL 指纹，稳定可比。
  //
  // readSet 原样导出，不与 items 取交集：localStorage 里会留着 30 天窗口之外
  // 已经不在页面数据里的 id，过滤掉就不是无损备份了。
  var STATE_EXPORT_VERSION = 2;

  function buildStateExport(items, readSet, starSet, exportedAt) {
    return {
      exportedAt: exportedAt,
      version: STATE_EXPORT_VERSION,
      items: items.filter(function (it) { return starSet.has(it.id); }),
      read: [].slice.call(readSet ? Array.from(readSet) : []),
    };
  }

  function isUsableId(x) {
    return typeof x === 'string' && x !== '';
  }

  // 返回 { ok: true, starIds, readIds } 或 { ok: false, error }。
  // 单条脏数据（缺 id、id 不是字符串）跳过即可，不该让整份文件导入失败；
  // 但顶层字段类型不对说明文件本身是坏的，报错，不能静默当成空——
  // 静默会让用户以为导入成功了，实际一条都没进去。
  function parseStateImport(parsed) {
    if (!parsed || typeof parsed !== 'object') {
      return { ok: false, error: '文件格式不对，顶层不是一个对象' };
    }
    if (!Array.isArray(parsed.items)) {
      return { ok: false, error: '文件格式不对，缺少 items 数组' };
    }
    // read 缺失是合法的：version 1 的旧备份就没有这个字段。
    if (parsed.read !== undefined && !Array.isArray(parsed.read)) {
      return { ok: false, error: '文件格式不对，read 不是数组' };
    }
    var starIds = [];
    parsed.items.forEach(function (it) {
      if (it && isUsableId(it.id)) starIds.push(it.id);
    });
    var readIds = (parsed.read || []).filter(isUsableId);
    return { ok: true, starIds: starIds, readIds: readIds };
  }

  function formatDayLabel(dateStr, todayStr) {
    var diff = Math.round((Date.parse(todayStr + 'T00:00:00Z') - Date.parse(dateStr + 'T00:00:00Z')) / 86400000);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    var d = new Date(dateStr + 'T00:00:00Z');
    return (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日 ' + WEEKDAYS[d.getUTCDay()];
  }

  window.ReaderLogic = {
    TYPE_ORDER: TYPE_ORDER,
    TYPE_LABELS: TYPE_LABELS,
    groupByType: groupByType,
    applyFilter: applyFilter,
    computeStats: computeStats,
    sourceBreakdown: sourceBreakdown,
    countsBySource: countsBySource,
    buildStateExport: buildStateExport,
    parseStateImport: parseStateImport,
    formatDayLabel: formatDayLabel,
    itemBadges: itemBadges,
    safeUrl: safeUrl,
  };
})();

/* DOM 装配。依赖 window.ReaderLogic 与页面里的 #reader-data。 */
(function () {
  var L = window.ReaderLogic;
  var DATA = JSON.parse(document.getElementById('reader-data').textContent);
  var READ_KEY = 'airadar.read.v1';
  var STAR_KEY = 'airadar.star.v1';
  var MIGRATED_KEY = 'airadar.server-sync.v1';
  var PENDING_KEY = 'airadar.pending-sync.v1';

  function loadSet(key) {
    try {
      var raw = localStorage.getItem(key);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch (e) {
      return new Set();
    }
  }
  function saveSet(key, set) {
    try {
      localStorage.setItem(key, JSON.stringify([...set]));
    } catch (e) {
      /* 隐私模式下写不进去，功能降级为本次会话有效 */
    }
  }
  function loadPending() {
    try {
      var parsed = JSON.parse(localStorage.getItem(PENDING_KEY) || '{}');
      return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
    } catch (e) {
      return {};
    }
  }
  function savePending() {
    try {
      localStorage.setItem(PENDING_KEY, JSON.stringify(pendingChanges));
    } catch (e) {
      /* 待同步操作仍保留在内存中，本次会话恢复网络后还可以重试 */
    }
  }

  var readSet = loadSet(READ_KEY);
  var starSet = loadSet(STAR_KEY);
  var pendingChanges = loadPending();
  var syncReady = false;
  var syncInFlight = null;
  var retryTimer = null;
  var today = DATA.days.length ? DATA.days[0].date : '';
  // sourceFilter：分布行里点某个信源名后生效的筛选，null 表示不筛选。
  // 与 filter/query 是正交的两层筛选（见 baseFilteredItems / visibleItems）。
  var state = { view: today ? { kind: 'day', date: today } : { kind: 'sources' }, filter: 'all', query: '', sourceFilter: null };

  var elStats = document.getElementById('stats');
  var elCal = document.getElementById('calendar');
  var elStream = document.getElementById('stream');
  var elSources = document.getElementById('sources-view');
  var elSearch = document.getElementById('search');
  var elFilters = document.getElementById('filters');
  var elSync = document.getElementById('sync-status');

  function setSyncStatus(text, kind) {
    elSync.textContent = text;
    elSync.className = 'sync-status' + (kind ? ' ' + kind : '');
  }

  function stateRequest(method, body) {
    var options = {
      method: method,
      credentials: 'same-origin',
      headers: { accept: 'application/json' },
    };
    if (body !== undefined) {
      options.headers['content-type'] = 'application/json';
      options.body = JSON.stringify(body);
    }
    return fetch('/api/state', options).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (payload) {
        if (!response.ok) throw new Error(payload.error || '云端同步失败');
        return payload;
      });
    });
  }

  function hasOwn(object, key) {
    return Object.prototype.hasOwnProperty.call(object, key);
  }

  function mergePending(change) {
    var current = pendingChanges[change.id] || {};
    if (hasOwn(change, 'read')) current.read = change.read;
    if (hasOwn(change, 'starred')) current.starred = change.starred;
    pendingChanges[change.id] = current;
  }

  function queueRemoteChanges(changes) {
    changes.forEach(mergePending);
    savePending();
    if (syncReady) flushPending();
  }

  function pendingList() {
    return Object.keys(pendingChanges).map(function (id) {
      var change = { id: id };
      if (hasOwn(pendingChanges[id], 'read')) change.read = pendingChanges[id].read;
      if (hasOwn(pendingChanges[id], 'starred')) change.starred = pendingChanges[id].starred;
      return change;
    });
  }

  function samePatch(current, sent) {
    return current &&
      (!hasOwn(sent, 'read') || current.read === sent.read) &&
      (!hasOwn(sent, 'starred') || current.starred === sent.starred) &&
      Object.keys(current).length === Object.keys(sent).length - 1;
  }

  function scheduleRetry() {
    if (retryTimer) return;
    retryTimer = setTimeout(function () {
      retryTimer = null;
      if (syncReady) flushPending();
    }, 10000);
  }

  function flushPending() {
    if (syncInFlight) return syncInFlight;
    var snapshot = pendingList();
    if (!snapshot.length) {
      setSyncStatus('云端已同步', 'synced');
      return Promise.resolve();
    }

    setSyncStatus('云端同步中…', '');
    var succeeded = false;
    syncInFlight = Promise.resolve().then(function () {
      var chain = Promise.resolve();
      for (var i = 0; i < snapshot.length; i += 200) {
        (function (chunk) {
          chain = chain.then(function () {
            return stateRequest('PUT', { changes: chunk });
          });
        })(snapshot.slice(i, i + 200));
      }
      return chain;
    }).then(function () {
      snapshot.forEach(function (sent) {
        if (samePatch(pendingChanges[sent.id], sent)) delete pendingChanges[sent.id];
      });
      savePending();
      succeeded = true;
      setSyncStatus('云端已同步', 'synced');
    }).catch(function () {
      setSyncStatus('等待恢复云端同步', 'error');
      scheduleRetry();
    }).finally(function () {
      syncInFlight = null;
      if (succeeded && Object.keys(pendingChanges).length) flushPending();
    });
    return syncInFlight;
  }

  function addLocalMigration() {
    var changes = {};
    readSet.forEach(function (id) {
      changes[id] = changes[id] || { id: id };
      if (!hasOwn(pendingChanges[id] || {}, 'read')) changes[id].read = true;
    });
    starSet.forEach(function (id) {
      changes[id] = changes[id] || { id: id };
      if (!hasOwn(pendingChanges[id] || {}, 'starred')) changes[id].starred = true;
    });
    queueRemoteChanges(Object.keys(changes).map(function (id) { return changes[id]; }));
  }

  function replaceWithRemote(remote) {
    readSet = new Set(Array.isArray(remote.read) ? remote.read : []);
    starSet = new Set(Array.isArray(remote.starred) ? remote.starred : []);
    saveSet(READ_KEY, readSet);
    saveSet(STAR_KEY, starSet);
  }

  function initializeSync() {
    syncReady = false;
    setSyncStatus('云端同步中…', '');
    render();

    var remote;
    return stateRequest('GET').then(function (result) {
      remote = result;
      var migrated = false;
      try { migrated = localStorage.getItem(MIGRATED_KEY) === '1'; } catch (e) {}
      if (!migrated) addLocalMigration();
      if (!Object.keys(pendingChanges).length) return;
      return flushPending().then(function () {
        if (Object.keys(pendingChanges).length) throw new Error('仍有状态等待同步');
        return stateRequest('GET').then(function (latest) { remote = latest; });
      });
    }).then(function () {
      replaceWithRemote(remote);
      try { localStorage.setItem(MIGRATED_KEY, '1'); } catch (e) {}
      syncReady = true;
      setSyncStatus('云端已同步', 'synced');
      render();
    }).catch(function () {
      syncReady = true;
      setSyncStatus('云端暂不可用，记录已保存在本机', 'error');
      render();
    });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function allItems() {
    return DATA.days.reduce(function (acc, d) { return acc.concat(d.items); }, []);
  }

  function currentItems() {
    if (state.view.kind === 'starred') {
      return allItems().filter(function (it) { return starSet.has(it.id); });
    }
    var day = DATA.days.find(function (d) { return d.date === state.view.date; });
    return day ? day.items : [];
  }

  function currentErrors() {
    if (state.view.kind !== 'day') return [];
    var day = DATA.days.find(function (d) { return d.date === state.view.date; });
    return day && day.errors ? day.errors : [];
  }

  // 未读/已标星筛选 + 搜索，但不含信源筛选。分组标题下的分布行永远基于
  // 这一层算——否则点了某个信源之后，分布行就只剩它自己，没法直接切到
  // 别的源（这是这个功能最容易做错的地方）。
  function baseFilteredItems() {
    return L.applyFilter(currentItems(), {
      filter: state.filter, query: state.query, readSet: readSet, starSet: starSet,
    });
  }

  // 在 baseFilteredItems() 之上再叠加信源筛选，主区实际展示的就是这批。
  function visibleItems(items) {
    return state.sourceFilter
      ? items.filter(function (it) { return it.source === state.sourceFilter; })
      : items;
  }

  function renderCalendar() {
    var html = DATA.days.map(function (d) {
      var unread = d.items.filter(function (it) { return !readSet.has(it.id); }).length;
      var active = state.view.kind === 'day' && state.view.date === d.date;
      return '<button class="day-btn' + (active ? ' active' : '') + '" data-date="' + esc(d.date) + '">' +
        '<span>' + esc(L.formatDayLabel(d.date, today)) + '</span>' +
        '<span class="day-count">' + (unread ? '<span class="unread-dot"></span> ' : '') + d.items.length + '</span>' +
        '</button>';
    }).join('');
    elCal.innerHTML = html;
  }

  function renderStats() {
    var s = L.computeStats(visibleItems(baseFilteredItems()), readSet, starSet);
    var label = state.view.kind === 'starred' ? '收藏' :
      state.view.kind === 'sources' ? '' : L.formatDayLabel(state.view.date, today);
    var chip = state.sourceFilter
      ? ' <button type="button" id="source-filter-chip" class="source-chip">已筛选：' + esc(state.sourceFilter) + ' ×</button>'
      : '';
    elStats.innerHTML = (label
      ? label + ' <b>' + s.total + '</b> 条 · 未读 <b>' + s.unread + '</b> · ★ <b>' + s.starred + '</b>'
      : '') + chip;
  }

  function itemHtml(it) {
    var isRead = readSet.has(it.id);
    var isStar = starSet.has(it.id);
    var disabled = syncReady ? '' : ' disabled';
    var time = new Date(it.publishedAt).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    return '<article class="item' + (isRead ? ' read' : '') + '" data-id="' + esc(it.id) + '">' +
      '<button class="toggle" data-act="read" aria-label="标记已读" aria-pressed="' + isRead + '"' + disabled + '>' + (isRead ? '☑' : '☐') + '</button>' +
      '<button class="toggle' + (isStar ? ' star-on' : '') + '" data-act="star" aria-label="标星" aria-pressed="' + isStar + '"' + disabled + '>' + (isStar ? '★' : '☆') + '</button>' +
      '<div class="item-body">' +
        '<div class="item-meta">' +
          '<span class="src">' + esc(it.source) + '</span>' +
          '<span>' + esc(L.TYPE_LABELS[it.type] || it.type) + '</span>' +
          '<span>' + esc((it.lang || '').toUpperCase()) + '</span>' +
          '<span>' + esc(time) + '</span>' +
          L.itemBadges(it) +
        '</div>' +
        '<h3 class="item-title"><a href="' + esc(L.safeUrl(it.url)) + '" target="_blank" rel="noopener">' + esc(it.titleZh || it.titleOriginal) + '</a></h3>' +
        (it.titleZh ? '<p class="item-orig">原标题 ' + esc(it.titleOriginal) + '</p>' : '') +
        '<p class="item-summary">' + esc(it.summaryZh) + '</p>' +
      '</div>' +
    '</article>';
  }

  function renderStream() {
    elSources.classList.add('hidden');
    elStream.classList.remove('hidden');

    // baseItems：未读/已标星 + 搜索之后、还没应用信源筛选的条目，分布行照它算。
    // shownItems：baseItems 再叠加信源筛选，分组和条目列表照它算。
    var baseItems = baseFilteredItems();

    if (!baseItems.length) {
      elStream.innerHTML = '<div class="empty-state">这里没有内容 — 换个筛选条件或看看别的日期。</div>';
      return;
    }

    var shownItems = visibleItems(baseItems);

    if (!shownItems.length) {
      elStream.innerHTML = '<div class="empty-state">这里没有内容 — 换个筛选条件或看看别的日期。</div>';
      return;
    }

    // 按类型分好的「全量」条目（未受信源筛选影响），供分布行取数用。
    var baseByType = {};
    L.groupByType(baseItems).forEach(function (g) { baseByType[g.type] = g.items; });

    var groups = L.groupByType(shownItems);
    var html = groups.map(function (g) {
      var breakdown = L.sourceBreakdown(baseByType[g.type] || g.items, undefined, state.sourceFilter).map(function (b) {
        if (b.isOther) {
          // 「其他」是多个信源的聚合，点了语义不清，不可点击。

        }

        return '<button type="button" class="src-chip src-filter' + (active ? ' active' : '') + '" data-source="' + esc(b.source) + '">' +
          esc(b.source) + ' ' + b.count + '</button>';
      }).join(' · ');
      return '<div class="group-head"><h2>' + esc(g.label) + '</h2>' +
        '<span class="group-count">' + g.items.length + ' 条</span></div>' +
        '<div class="group-breakdown">' + breakdown + '</div>' +
        g.items.map(itemHtml).join('');
    }).join('');

    var errors = currentErrors();
    if (errors.length) {
      html += '<div class="errors-note">今天有 ' + errors.length + ' 个源没抓到：' +
        errors.map(function (e) { return esc(e.source) + '（' + esc(e.message) + '）'; }).join('、') + '</div>';
    }
    elStream.innerHTML = html;
  }

  function renderSources() {
    elStream.classList.add('hidden');
    elSources.classList.remove('hidden');

    var enabled = DATA.sources.filter(function (s) { return s.enabled; });
    var disabled = DATA.sources.filter(function (s) { return !s.enabled; });
    var counts = L.countsBySource(DATA.days);

    function row(s) {
      var st = DATA.status[s.name] || {};

      var note = s.enabled
        ? (st.consecutiveFailures ? '连续失败 ' + st.consecutiveFailures + ' 次：' + esc(st.lastErrorMessage || '') : '正常')
        : esc(s.disabledReason || '未启用');
      var today = counts.today[s.name] || 0;
      var win = counts.window[s.name] || 0;
      return '<tr class="' + (s.enabled ? '' : 'disabled') + '">' +
        '<td><a href="' + esc(L.safeUrl(s.url)) + '" target="_blank" rel="noopener">' + esc(s.name) + '</a></td>' +
        '<td>' + esc(L.TYPE_LABELS[s.type] || s.type) + '</td>' +
        '<td>' + esc((s.lang || '').toUpperCase()) + '</td>' +
        '<td class="num">' + today + '</td>' +
        '<td class="num">' + win + '</td>' +
        '<td>' + last + '</td><td>' + note + '</td></tr>';
    }

    elSources.innerHTML =
      '<div class="group-head"><h2>正在抓取</h2><span class="group-count">' + enabled.length + ' 个</span></div>' +
      '<div class="table-scroll"><table class="sources-table">' +
      '<tr><th>信源</th><th>类型</th><th>语言</th><th>今日</th><th>最近 30 天</th><th>最近成功</th><th>状态</th></tr>' +
      enabled.map(row).join('') + '</table></div>' +
      '<div class="group-head"><h2>未启用</h2><span class="group-count">' + disabled.length + ' 个</span></div>' +
      '<div class="table-scroll"><table class="sources-table">' +
      '<tr><th>信源</th><th>类型</th><th>语言</th><th>今日</th><th>最近 30 天</th><th>最近成功</th><th>原因</th></tr>' +
      disabled.map(row).join('') + '</table></div>' +
      '<div class="errors-note">信源列表以仓库里的 sources.json 为准。要增删信源，直接告诉 Claude，改动次日生效。' +
      '<br>已读与收藏会按当前 ChatGPT 登录用户保存到云端，并在不同设备间自动同步。' +
      '本机仍保留一份缓存，网络暂时不可用时会在恢复后补传。也可以手动导出一份备份；' +
      '导入只做并集合并，不会抹掉已有标记。' +
      '<button id="export-state" class="toggle" style="text-decoration:underline">导出已读与收藏</button>' +
      '<button id="import-state" class="toggle" style="text-decoration:underline">导入已读与收藏</button>' +
      '<input id="import-state-file" type="file" accept="application/json" style="display:none">' +
      '<span id="import-state-msg"></span></div>';

    var btn = document.getElementById('export-state');
    if (btn) btn.addEventListener('click', exportState);

    var importBtn = document.getElementById('import-state');
    var importFile = document.getElementById('import-state-file');
    if (importBtn && importFile) {
      importBtn.addEventListener('click', function () { importFile.click(); });
      importFile.addEventListener('change', function () {
        var file = importFile.files && importFile.files[0];
        importFile.value = '';
        if (file) importState(file);
      });
    }
  }

  function exportState() {
    var payload = JSON.stringify(
      L.buildStateExport(allItems(), readSet, starSet, new Date().toISOString()),
      null,
      2,
    );
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: 'ai-radar-state.json', data: payload }).catch(function () {});
    } else {
      var blob = new Blob([payload], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ai-radar-state.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }
  }

  // 导入只做并集合并：已有的标星和已读一条都不会被删。这是刻意的——
  // 两台设备各读了一部分，合并后两边都算读过，是符合直觉的；反过来
  // 让导入去删本机的标记，一次误导入就能抹掉几个月的记录，不可逆。
  //
  // 解析失败或格式不对时把提示文字写进按钮旁边的 <span>，不用 alert：
  // alert 会阻塞 Artifact 的 iframe，把整个页面卡住。
  function importState(file) {
    // render() 会整体重建 #sources-view 的 innerHTML（包括这条消息用的 span），
    // 所以提示文字必须在 render() 之后，对着重建出来的新节点设置，否则消息
    // 前脚写进去、后脚就被 render() 冲掉，页面上根本看不见。
    function setMsg(text) {
      render();
      var el = document.getElementById('import-state-msg');
      if (el) el.textContent = text;
    }
    var reader = new FileReader();
    reader.onerror = function () { setMsg('读取文件失败'); };
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (e) {
        setMsg('导入失败：不是合法的 JSON 文件');
        return;
      }
      var result = L.parseStateImport(parsed);
      if (!result.ok) {
        setMsg('导入失败：' + result.error);
        return;
      }
      function mergeInto(set, ids) {
        var added = 0;
        ids.forEach(function (id) {
          if (!set.has(id)) { set.add(id); added++; }
        });
        return added;
      }
      var starsAdded = mergeInto(starSet, result.starIds);
      var readAdded = mergeInto(readSet, result.readIds);
      saveSet(STAR_KEY, starSet);
      saveSet(READ_KEY, readSet);
      var changes = {};
      result.starIds.forEach(function (id) {
        changes[id] = changes[id] || { id: id };
        changes[id].starred = true;
      });
      result.readIds.forEach(function (id) {
        changes[id] = changes[id] || { id: id };
        changes[id].read = true;
      });
      queueRemoteChanges(Object.keys(changes).map(function (id) { return changes[id]; }));
      setMsg('已导入 ' + starsAdded + ' 条新标星、' + readAdded + ' 条新已读，正在同步到云端');
    };
    reader.readAsText(file);
  }

  function render() {
    renderCalendar();
    renderStats();
    if (state.view.kind === 'sources') renderSources();
    else renderStream();
    document.querySelectorAll('.view-btn').forEach(function (b) {
      b.classList.toggle('active', state.view.kind === b.dataset.view);
    });
  }

  elCal.addEventListener('click', function (e) {
    var btn = e.target.closest('.day-btn');
    if (!btn) return;
    state.view = { kind: 'day', date: btn.dataset.date };
    // 换了日期，之前选的信源在新的一天里可能压根不存在，留着筛选只会
    // 让用户看到一片空白却摸不着头脑——直接清掉。
    state.sourceFilter = null;
    render();
  });

  document.querySelectorAll('.view-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      state.view = { kind: b.dataset.view };
      // 切到「★ 收藏」或「信源管理」同理：清掉信源筛选，避免带着一个
      // 在新视图里对不上号的筛选条件。
      state.sourceFilter = null;
      render();
    });
  });

  elFilters.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    state.filter = btn.dataset.filter;
    elFilters.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === btn); });
    renderStream();
    renderStats();
  });

  elSearch.addEventListener('input', function () {
    state.query = elSearch.value;
    if (state.view.kind !== 'sources') { renderStream(); renderStats(); }
  });

  elStats.addEventListener('click', function (e) {
    var chip = e.target.closest('#source-filter-chip');
    if (!chip) return;
    state.sourceFilter = null;
    renderStream();
    renderStats();
  });

  elStream.addEventListener('click', function (e) {
    var srcBtn = e.target.closest('.src-filter');
    if (srcBtn) {
      var source = srcBtn.dataset.source;
      // 再点一次同一个信源 = 取消筛选；点别的信源 = 切换过去。
      state.sourceFilter = state.sourceFilter === source ? null : source;
      renderStream();
      renderStats();
      return;
    }

    var summary = e.target.closest('.item-summary');
    if (summary) { summary.classList.toggle('expanded'); return; }

    var btn = e.target.closest('.toggle');
    if (!btn || !syncReady) return;
    var id = btn.closest('.item').dataset.id;
    if (btn.dataset.act === 'read') {
      if (readSet.has(id)) readSet.delete(id); else readSet.add(id);
      saveSet(READ_KEY, readSet);
      queueRemoteChanges([{ id: id, read: readSet.has(id) }]);
    } else {
      if (starSet.has(id)) starSet.delete(id); else starSet.add(id);
      saveSet(STAR_KEY, starSet);
      queueRemoteChanges([{ id: id, starred: starSet.has(id) }]);
    }
    render();
  });

  render();
  initializeSync();
  window.addEventListener('online', function () {
    if (Object.keys(pendingChanges).length) flushPending();
    else initializeSync();
  });
})();

</script>
