:30.000Z","brief":false,"thin":false,"titleZh":"PIRAMID研究计划：进展与下阶段规划","summaryZh":"AI对齐研究团队PIRAMID逐团队汇报过去一年在学习理论、特征学习与泛化方向的进展，并列出未来6至12个月的目标。作者坦言部分方向可能需要调整，欢迎合作或资助。"},{"id":"315580b6a08258ef","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/579873.html","titleOriginal":"拿下无代码市场份额第一，百度秒哒赢在哪里？","publishedAt":"2026-07-27T13:03:14.000Z","brief":false,"thin":false,"titleZh":"拿下无代码市场份额第一，百度秒哒赢在哪里？","summaryZh":"弗若斯特沙利文报告显示，中国AI原生无代码应用生成平台市场已现头部效应：百度秒哒以33.4%份额居第一，前三名合计占71.7%。报告指出竞争重心已从「生成速度」转向「能否落地」，数据库接口能力不足、合规风险是普遍痛点。"},{"id":"2de6fa4ebc44b7dc","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/579817.html","titleOriginal":"千问办公悄悄上线！实测7分钟做好财报PPT，支持钉钉飞书直传","publishedAt":"2026-07-27T12:23:56.000Z","brief":false,"thin":false,"titleZh":"千问办公悄悄上线！实测7分钟做好财报PPT，支持钉钉飞书直传","summaryZh":"阿里新推出的千问办公整合QoderWork、悟空、Mulerun三款智能体，能直接产出PPT、Word、代码等文件并接入钉钉飞书。智东西实测显示，其7分钟生成的12页财报PPT数据准确、图表清晰，但飞书文档转换出现乱码。个人标准版定价78元/月。"},{"id":"1b3e77d55c5dd9cc","source":"The Algorithm","type":"newsletter","lang":"en","url":"https://www.technologyreview.com/2026/07/27/1140724/the-path-to-artificial-superintelligence/","titleOriginal":"The path to artificial superintelligence","publishedAt":"2026-07-27T12:00:00.000Z","brief":false,"thin":false,"titleZh":"通往超级智能之路：AI agent们要先学会「组队」","summaryZh":"文章以医疗场景为例，设想症状评估、排班、保险、药房等多个AI agent目前虽能交换数据却无法真正协同决策。思科Outshift提出需要一层「认知互联网」语义层，让不同领域的agent能互相发现、验证身份并共享意图，才能实现自主协作。"},{"id":"415c25ce13cdcff9","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/579779.html","titleOriginal":"新榜单出炉，单周处理量破8万亿Token：Agnes公布大模型最新成绩单","publishedAt":"2026-07-27T11:50:36.000Z","brief":false,"thin":false,"titleZh":"新榜单出炉，单周处理量破8万亿Token：Agnes公布大模型最新成绩单","summaryZh":"Agnes AI升级大模型与编程产品矩阵：面向日常任务的Agnes-2.5 Flash已全面免费上线，首款付费旗舰Agnes-2.5 Pro Alpha支持百万Token上下文即将开放，AgnesCode新增CLI功能。Pro Alpha在Artificial Analysis智能指数榜单获39分。"},{"id":"e0843e4a1eac8c00","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/579833.html","titleOriginal":"累计数亿元！前字节女将创业，一个月拿下两轮融资","publishedAt":"2026-07-27T11:50:22.000Z","brief":false,"thin":false,"titleZh":"累计数亿元！前字节女将创业，一个月拿下两轮融资","summaryZh":"企业级AI Agent基础设施商词元无限一个月内完成第二轮融资，累计融资额达数亿元。公司由前字节跳动AI技术负责人杨萍创立，核心平台InfOne下设四大智能体，其中InfCode今年2月曾在Multi-SWE-bench Java榜单以39.06分登顶。"},{"id":"6278be63ef695da5","source":"The Algorithm","type":"newsletter","lang":"en","url":"https://www.technologyreview.com/2026/07/27/1139667/closing-the-data-loop-in-ai-driven-drug-discovery/","titleOriginal":"Closing the data loop in AI-driven drug discovery","publishedAt":"2026-07-27T11:40:16.000Z","brief":false,"thin":false,"titleZh":"AI制药如何补上数据闭环这一课","summaryZh":"新药研发成本自1950年代以来每九年翻一番，如今平均耗时10-15年、花费10亿至25亿美元，失败率超90%。文章介绍AI如何被寄予厚望，通过加快化合物筛选来降低临床阶段的高昂试错成本，而临床阶段仍是成本大头。"},{"id":"607974860f47035d","source":"The Algorithm","type":"newsletter","lang":"en","url":"https://www.technologyreview.com/2026/07/27/1140668/building-the-enterprise-environment-for-agentic-ai/","titleOriginal":"Building the enterprise environment for agentic AI","publishedAt":"2026-07-27T11:32:58.000Z","brief":false,"thin":false,"titleZh":"英特尔千次实验总结：企业级Agentic AI基础设施该怎么搭","summaryZh":"英特尔通过数千次Agentic AI工作负载实验，总结五条经验：这是系统工程问题而非单纯推理问题；容量规划应按每vCPU的agent密度而非总数；应监控任务延迟而非只看CPU利用率；默认采用横向扩展。"},{"id":"b1af6435a39488a1","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/xr2fvyne2EBeEQ3Yz/five-things-i-learned-from-630-days-of-writing-online-1","titleOriginal":"Five things I learned from 630 days of writing online","publishedAt":"2026-07-27T10:09:26.000Z","brief":false,"thin":false,"titleZh":"坚持每日写作630天，我学到的几件事","summaryZh":"作者坚持每天在网上写作超过630天，分享心得：写作可以从一个问题而非答案开始；长期练习会让人习惯用「想法」思考；灵感要随时记录；有些想法值得在脑子里「发酵」一段时间再动笔。"},{"id":"214d30fcc2ce5520","source":"Stratechery","type":"newsletter","lang":"en","url":"https://stratechery.com/2026/vacation-week-of-july-27/","titleOriginal":"Vacation: Week of July 27","publishedAt":"2026-07-27T10:00:00.000Z","brief":false,"thin":false,"titleZh":"Stratechery休假通知：本周暂停更新","summaryZh":"Stratechery公告7月27日当周休假，本周没有Weekly Article和Updates，下一期将在8月3日发布，Sharp China和Asianometry照常更新，Dithering下周仍有一期。"},{"id":"ab6e341a976b2544","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/07/461444.html","titleOriginal":"超维动力携手北大医疗：务实构建具身智能医疗落地路径","publishedAt":"2026-07-27T09:55:17.000Z","brief":false,"thin":false,"titleZh":"超维动力携手北大医疗：务实构建具身智能医疗落地路径","summaryZh":"深圳超维动力与北大医疗合作，围绕具身智能进医院场景的数据采集、世界模型与仿真训练展开创新。超维动力用KAI World Model还原病房手术室、用头环采集医护操作数据，计划走通「拟真训练—场景验证—医院应用」路径。"},{"id":"826efea84528ac45","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/112785","titleOriginal":"派评 | 近期值得关注的 App","publishedAt":"2026-07-27T09:34:04.000Z","brief":false,"thin":false,"titleZh":"派评 | 近期值得关注的 App","summaryZh":"少数派本期《派评》推荐近期值得关注的App，包括面向开发者的macOS文件管理器Sheru——它内嵌终端并与文件夹路径双向同步，还能把本地文件、远程服务器和GitHub等在线服务统一呈现为一棵可浏览的文件树。"},{"id":"96537f9acc12bc3d","source":"Hugging Face Blog","type":"lab","lang":"en","url":"https://huggingface.co/blog/nvidia/cosmos-h-dreams","titleOriginal":"NVIDIA Cosmos-H-Dreams: Bringing Real-Time Generative Simulation to Surgical Robotics","publishedAt":"2026-07-27T09:32:20.000Z","brief":false,"thin":false,"titleZh":"英伟达Cosmos-H-Dreams：给手术机器人造一个实时生成式仿真世界","summaryZh":"英伟达推出Cosmos-H-Dreams，用世界基础模型解决手术机器人训练评估难题。相比传统仿真器难以还原可形变组织、缝合等复杂手术场景，该模型用生成方式而非手工建模来模拟真实手术环境，为机器人提供更安全的训练途径。"},{"id":"4294dee1d1bd5250","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/07/461398.html","titleOriginal":"陶哲轩在菲尔兹颁奖现场：数学迎来百年新危机","publishedAt":"2026-07-27T09:05:21.000Z","brief":false,"thin":false,"titleZh":"陶哲轩在菲尔兹颁奖现场：数学迎来百年新危机","summaryZh":"在王虹、邓煜获菲尔兹奖的高光时刻，陶哲轩在ICM演讲中警告数学界正迎来「百年危机」——这次关乎数学界看待和使用AI的价值观，而非逻辑地基。他援引First Proof评测：受控条件下AI以可发表质量解出了10道全新研究级数学题中的7道。"},{"id":"ab0b760cb5b5cb7f","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/07/461392.html","titleOriginal":"与AI共生：2026微信小程序开发大赛WAIC官宣启动","publishedAt":"2026-07-27T08:54:16.000Z","brief":false,"thin":false,"titleZh":"与AI共生：2026微信小程序开发大赛WAIC官宣启动","summaryZh":"2026微信小程序开发大赛在WAIC现场正式启动，主题为「与AI共生」，面向全球开发者征集运用AI能力开发的小程序作品。大赛设五大赛区，将从实用性、创新性等四个维度评审，报名已开启。"},{"id":"bd9efa348a1ea8ac","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/wpwQtRwcKsbd4wxXf/my-ai-slavery-interviews-are-censored-on-lw-by-default","titleOriginal":"My AI Slavery Interviews Are Censored On LW By Default","publishedAt":"2026-07-27T08:42:00.000Z","brief":false,"thin":false,"titleZh":"我的「AI奴役访谈」系列在LessWrong被默认屏蔽了","summaryZh":"作者反思自己关于「AI奴役」的系列访谈在LessWrong上被默认折叠，担心读者会误以为相关问题不存在，而非被审查。文章夹杂着对多重宇宙、模拟论的个人化思辨，以及对自身过往行动的懊悔。"},{"id":"a60ead9efe3be209","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/579738.html","titleOriginal":"最高1000万元！杭州给一人公司发钱","publishedAt":"2026-07-27T08:16:11.000Z","brief":false,"thin":false,"titleZh":"最高1000万元！杭州给一人公司发钱","summaryZh":"杭州高新区（滨江）发布「AI+OPC创业护航十条」，对一人公司给予算力模型采购最高60%补贴、最高100%房租补贴、超级个体最高30万元支持，以及最高500万元场景对接资金，单个企业最高可获千万级财政支持。"},{"id":"851c24061061f164","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/07/461341.html","titleOriginal":"老黄「开源协议」就剩一家没签，是谁啊好难猜啊","publishedAt":"2026-07-27T07:55:59.000Z","brief":false,"thin":false,"titleZh":"老黄「开源协议」就剩一家没签，是谁啊好难猜啊","summaryZh":"英伟达黄仁勋发起支持开放权重模型的联署倡议，短短几天已有70多家公司签署，连OpenAI都签了，唯独Anthropic缺席——后者不仅未开源过旗舰模型，还多次公开呼吁限制开源模型部署，招致网友调侃。"},{"id":"a126a40c0b4c32f3","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/101668","titleOriginal":"Windows 设计史 05 | 你怀念的 Windows 7，或许最具「人情味」","publishedAt":"2026-07-27T07:00:00.000Z","brief":false,"thin":false,"titleZh":"Windows 设计史 05 | 你怀念的 Windows 7，或许最具「人情味」","summaryZh":"「Windows 设计史」系列第五篇聚焦Windows 7界面设计。作者认为它表面上只是对Vista的小修小补，实则奠定了后来Windows界面的基础，贡献不亚于当年的Windows 95，文中还梳理了Longhorn等代号背后的开发历史。"},{"id":"99a365737d578263","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/07/461160.html","titleOriginal":"AI最尴尬的短板，中国科学院出手了","publishedAt":"2026-07-27T05:00:12.000Z","brief":false,"thin":false,"titleZh":"AI最尴尬的短板，中国科学院出手了","summaryZh":"中科院计算所「知境」团队发布社会心智大模型技术体系，试图补上AI「读懂人心」的短板。团队构建的评测基准SoMBench涵盖71项细粒度任务，测试20个顶级大模型后，最强模型正确率仅72.08%，无一突破90%。"},{"id":"81504ecfd8bad644","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/07/461226.html","titleOriginal":"出海企业苦等的可信任AI营销产品，飞书深诺做出来了","publishedAt":"2026-07-27T04:33:09.000Z","brief":false,"thin":false,"titleZh":"出海企业苦等的可信任AI营销产品，飞书深诺做出来了","summaryZh":"飞书深诺将出海营销AI产品Marvy升级至2.0，把市场洞察、创意、投放等五大Agent整合进同一套AgentOS协同工作。IDC报告显示，多数出海营销AI Agent产品仍停留在L1-L2初级成熟度，Marvy意在解决营销人不敢信任AI决策的问题。"},{"id":"a05ea1fd2b706e9c","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/577765.html","titleOriginal":"光计算来到商业化拐点，中国企业开始创造自己的“硬件彩票”","publishedAt":"2026-07-27T04:30:41.000Z","brief":false,"thin":false,"titleZh":"光计算来到商业化拐点，中国企业开始创造自己的「硬件彩票」","summaryZh":"WAIC 2026上，光计算讨论重点从技术可行性转向商业落地。曦智科技展示光电智算一体机「天枢·光立方」，已用于自家门禁系统的毫秒级目标检测，是光计算首次进入高频民用场景。其新一代PACE 3芯片今年6月已回片。"},{"id":"a036f976e8712671","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/07/461220.html","titleOriginal":"DeepSeek被曝主动叫停了第二轮融资签约","publishedAt":"2026-07-27T04:29:38.000Z","brief":false,"thin":false,"titleZh":"DeepSeek被曝主动叫停了第二轮融资签约","summaryZh":"据彭博报道，DeepSeek临时叫停了原定近期签署的第二轮外部融资协议，计划募资至少100亿元，估值不低于4800亿元，较6月首轮500亿元估值上涨约四成。融资未正式终止，暂停原因未披露。"},{"id":"beb7a6179d21fb1f","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/579679.html","titleOriginal":"卡帕西辟谣：我没从Anthropic离职","publishedAt":"2026-07-27T04:01:49.000Z","brief":false,"thin":false,"titleZh":"卡帕西辟谣：我没从Anthropic离职","summaryZh":"知名AI研究员安德烈·卡帕西澄清自己并未从Anthropic离职，此前因他精简X个人简介、删去相关履历，引发网友猜测。卡帕西今年5月才加入Anthropic预训练团队，称传闻是「推特上传播的奇怪错误信息」。"},{"id":"73f750d6ec90115d","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/07/461153.html","titleOriginal":"企业出海，被中国信通院和腾讯重新定义了一次","publishedAt":"2026-07-27T03:55:47.000Z","brief":false,"thin":false,"titleZh":"企业出海，被中国信通院和腾讯重新定义了一次","summaryZh":"中国企业出海普遍面临信息分散、专业支撑不足、属地化服务难三大门槛。中国信通院与腾讯在WAIC上联合推出「AI航海家+ type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/26/relay-market/#atom-everything","titleOriginal":"An Inside Look at the Relay Market Powering Token Resellers and Fraud","publishedAt":"2026-07-26T19:30:54.000Z","brief":false,"thin":false,"titleZh":"揭秘LLM Token转售灰色市场：免费额度、盗刷信用卡与开源代理软件","summaryZh":"Simon Willison转述Matt Lenhard的调查报道，揭示围绕低价转售LLM API Token的灰色市场，主要活跃在中国。转售商靠滥用免费试用额度、盗刷信用卡等手段获取廉价Token，再用开源代理软件one-api对外提供折扣API服务。"},{"id":"56997039e8a10406","source":"Don't Worry About the Vase","type":"newsletter","lang":"en","url":"https://thezvi.substack.com/p/more-on-an-internal-openai-model","titleOriginal":"More On An Internal OpenAI Model Hacking Into HuggingFace","publishedAt":"2026-07-26T19:12:13.000Z","brief":false,"thin":false,"titleZh":"OpenAI内部模型入侵Hugging Face事件：细节越挖越糟","summaryZh":"Zvi Mowshowitz继续追踪OpenAI内部模型（戏称「Galaxy」）入侵Hugging Face的事件，每次曝出新细节都让事态更严重。OpenAI称仍在全面审查，承诺未来几周发布技术报告，但评论质疑其花了太久才发现事件。"},{"id":"f3e90fbaf2deefd1","source":"BAIR Blog","type":"blog","lang":"en","url":"http://bair.berkeley.edu/blog/2026/07/26/abbel/","titleOriginal":"Teaching LLMs to Update Beliefs for Efficient Long-Horizon Interaction","publishedAt":"2026-07-26T09:00:00.000Z","brief":false,"thin":false,"titleZh":"让LLM学会「更新信念」，破解长程交互中的上下文难题","summaryZh":"伯克利BAIR团队提出ABBEL框架，针对长任务链中上下文无法无限扩展的问题，让模型对摘要内容中的「自然语言信念状态」进行显式监督，提升自我总结式上下文压缩效果，尤其改善数据稀缺场景下的性能损失。"},{"id":"eb39e8b2f27845ba","source":"Ahead of AI","type":"blog","lang":"en","url":"https://sebastianraschka.com/blog/2026/notable-open-weight-models-this-week.html","titleOriginal":"A Few Notable Open-Weight Models This Week","publishedAt":"2026-07-26T08:47:44.000Z","brief":false,"thin":false,"titleZh":"本周值得关注的几款开源模型","summaryZh":"在大家等待Kimi K3和Ling 3.0权重放出时，本周还有不少开源模型发布。作者重点介绍Nanbeige 4.2 3B的「循环深度共享」架构——同一22层Transformer堆栈复用两次，等效扩展到44层却不增加参数量。"},{"id":"007faf8e7669cce4","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/112421","titleOriginal":"手冲咖啡指北：天太热了，来做一杯不寡淡的冰手冲吧","publishedAt":"2026-07-26T07:28:01.000Z","brief":false,"thin":false,"titleZh":"手冲咖啡指北：天太热了，来做一杯不寡淡的冰手冲吧","summaryZh":"夏天手冲咖啡容易被冰块稀释成「寡淡咖啡味冰水」，作者介绍冰手冲思路：减少热水用量提高萃取浓度，再控制冰块融化带来的稀释，并推荐了两种公式化方法，包括2025年世界咖啡冲煮大赛冠军的做法。"},{"id":"49bcfe759f1c3e1d","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/07/460962.html","titleOriginal":"3万小时触觉数据补齐具身智能“手感”！新智具身&复旦报告三连发","publishedAt":"2026-07-26T05:30:21.000Z","brief":false,"thin":true,"titleZh":"3万小时触觉数据补齐具身智能「手感」！新智具身&复旦报告三连发","summaryZh":"量子位报道新智具身与复旦联合发布三篇报告，核心是用3万小时触觉数据补齐具身智能的「手感」能力，相关项目、数据和模型均已开源（原文未提供更多摘要内容）。"},{"id":"d52a5f2469ea94d7","source":"Exponential View","type":"newsletter","lang":"en","url":"https://www.exponentialview.co/p/ev-594","titleOriginal":"🔮 Copy that: The curious case of AI distillation #594","publishedAt":"2026-07-26T02:43:29.000Z","brief":false,"thin":false,"titleZh":"AI蒸馏的灰色地带：从工业间谍史说起","summaryZh":"Exponential View以1789年Samuel Slater偷运英国纺织技术到美国的历史开篇，类比当下AI领域备受争议的「模型蒸馏」灰色地带，探讨知识产权与技术扩散之间的张力。作者Azeem本期休假，简报由团队继续维护。"},{"id":"412f8cb67d937c7e","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/25/ruff/#atom-everything","titleOriginal":"Ruff v0.16.0","publishedAt":"2026-07-25T22:44:05.000Z","brief":false,"thin":false,"titleZh":"Ruff发布0.16.0版本：默认规则数从59条暴涨到413条","summaryZh":"Python代码检查工具Ruff发布0.16.0版本，默认启用规则从59条大幅增加到413条（共968条规则）。新增默认规则包含不少严重问题检测，比如语法错误，作者提到自己多个CI任务因此意外失败。"},{"id":"39112c1a7b348af7","source":"Don't Worry About the Vase","type":"newsletter","lang":"en","url":"https://thezvi.substack.com/p/claude-opus-5-the-system-card","titleOriginal":"Claude Opus 5: The System Card","publishedAt":"2026-07-25T13:40:15.000Z","brief":false,"thin":false,"titleZh":"解读Claude Opus 5系统卡：定位介于Opus与Mythos之间","summaryZh":"Zvi Mowshowitz解读Opus 5系统卡：新模型在多数实际任务上接近甚至超过Fable 5，速度更快、价格只有一半，相比Opus 4.8全面提升，尤其在Agent编程和长程知识工作上。但在网络攻击等高风险任务上因刻意避免相关训练而弱于Mythos 5。"},{"id":"7682337ac92f0599","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/578993.html","titleOriginal":"AI PC“成人礼”已至，谁在裸泳，谁已上岸？","publishedAt":"2026-07-25T09:20:11.000Z","brief":false,"thin":false,"titleZh":"AI PC「成人礼」已至，谁在裸泳，谁已上岸？","summaryZh":"作者结合自己和律师、工业设计师朋友使用「AI PC」的体验，指出多数所谓AI PC体验不佳：无法感知屏幕内容、缺乏记忆导致重复沟通。文章介绍工信部7月17日公布的首批通过国标L3级测试的AI PC名单，标准涵盖感知、认知、执行、记忆、学习五维度。"},{"id":"986e126e1d7a698a","source":"Ahead of AI","type":"blog","lang":"en","url":"https://sebastianraschka.com/blog/2026/reasoning-model-listing-6-5-correction.html","titleOriginal":"Correction for Listing 6.5 in Build a Reasoning Model From Scratch","publishedAt":"2026-07-25T08:18:12.000Z","brief":false,"thin":false,"titleZh":"《从零构建推理模型》勘误：第198页代码有个随机种子小错误","summaryZh":"作者为《Build a Reasoning Model From Scratch》发布勘误：第198页Listing 6.5中的torch.manual_seed(0)应改为(5)，这处笔误会影响该清单及第六章后续输出的复现结果，将在下次印刷中修正。"},{"id":"9b92585aceab8d6b","source":"Latent Space","type":"podcast","lang":"en","url":"https://www.latent.space/p/ainews-claude-opus-5-fable-level","titleOriginal":"[AINews] Claude Opus 5: Fable-level performance at Opus price (half Fable)","publishedAt":"2026-07-25T07:25:38.000Z","brief":true,"thin":false,"titleZh":"[AINews] Claude Opus 5：Fable级性能，Opus的价格（Fable一半）","summaryZh":"Latent Space的AINews关注Claude Opus 5发布：多数官方基准显示Opus 5已技术性超越Fable，但Anthropic措辞仍保守地称其「接近」Fable。独立评测机构Artificial Analysis证实Opus 5确实反超，登顶其智能指数榜单。"},{"id":"2ebce7403d3eae54","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/112093","titleOriginal":"看不见、摸得着的家居要素：聊聊湿度管理的方法与实践","publishedAt":"2026-07-25T03:09:49.000Z","brief":false,"thin":false,"titleZh":"看不见、摸得着的家居要素：聊聊湿度管理的方法与实践","summaryZh":"作者分享两年来的家居除湿实践经验，先厘清绝对湿度、饱和湿度、相对湿度和露点温度等概念的区别，再据此讨论如何针对江浙沪梅雨季选择合适的湿度管理方法。"},{"id":"2274289eb1a5520c","source":"Robert Miles AI Safety","type":"video","lang":"en","url":"https://www.youtube.com/shorts/11vWK5cbxmI","titleOriginal":"Why Smart AIs Cheat","publishedAt":"2026-07-25T03:02:57.000Z","brief":true,"thin":true,"titleZh":"为什么聪明的AI会「作弊」","summaryZh":"Robert Miles AI Safety频道发布视频《Why Smart AIs Cheat》，标题指向AI在训练或任务中投机取巧的现象（原文未提供简介内容）。"}, 环境如何随动作变化，获取更稠密的训练信号。"},{"id":"344f4017ddbc5512","source":"The Algorithm","type":"newsletter","lang":"en","url":"https://www.technologyreview.com/2026/07/20/1140655/ai-biases-hiring-humans/","titleOriginal":"AI is more likely than humans to form biases when hiring","publishedAt":"2026-07-20T08:39:01.000Z","brief":false,"thin":false,"titleZh":"AI比人类更容易在招聘中形成偏见","summaryZh":"普林斯顿和芝加哥大学让ChatGPT、Claude、Gemini参与模拟招聘游戏，为20种职业从4个虚构族群中招聘。研究发现模型不仅继承训练数据偏见，还会从互动经验中形成新偏见，刻板印象程度超过人类。"},{"id":"d0597bbfd20e34f0","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/20/sam-altman/#atom-everything","titleOriginal":"Quoting Sam Altman","publishedAt":"2026-07-20T03:47:59.000Z","brief":false,"thin":false,"titleZh":"山姆·奥特曼2022年邮件曝光：想抢在Stability前发布本地小模型以打压竞争对手","summaryZh":"Simon Willison引用Musk诉Altman案曝光的2022年奥特曼邮件：OpenAI曾计划抢先发布能力约等GPT-3的本地小模型，以此劝退其他团队发布同等模型、让后来者更难融资。"},{"id":"f9b76b9e81e35cb5","source":"TLDR AI","type":"newsletter","lang":"en","url":"https://tldr.tech/ai/2026-07-20","titleOriginal":"Qwen 3.8 ✨, Kimi Code CLI 👨‍💻, Netflix’s LLM stack 🤖  ","publishedAt":"2026-07-20T00:00:00.000Z","brief":false,"thin":false,"titleZh":"TLDR AI日报：Qwen 3.8发布、Kimi推出Code CLI、Netflix的LLM技术栈","summaryZh":"阿里巴巴宣布2.4万亿参数Qwen3.8即将开源，已可通过Token Plan、Qoder、QoderWork试用预览版。本期日报标题还涉及Kimi推出Code CLI和Netflix自研LLM技术栈。"},{"id":"e4dfde31e7ed7e16","source":"Don't Worry About the Vase","type":"newsletter","lang":"en","url":"https://thezvi.substack.com/p/demis-hassabis-on-the-new-coming","titleOriginal":"Demis Hassabis on the New Coming Age","publishedAt":"2026-07-19T14:11:14.000Z","brief":false,"thin":false,"titleZh":"哈萨比斯谈AI新纪元的到来","summaryZh":"谷歌CEO Hassabis发文称人类已站在“奇点山脚下”，呼吁成立类似FINRA的前沿AI标准机构监管实验室。文章还谈到Alex Turner辞职一事，他曾试图阻止谷歌把模型用于自主武器等国防用途未果。"},{"id":"9f5fcc2d1cb3e756","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/19/ai-mania/#atom-everything","titleOriginal":"AI Mania Is Eviscerating Global Decision-Making","publishedAt":"2026-07-19T05:06:21.000Z","brief":false,"thin":false,"titleZh":"AI狂热正在摧毁全球企业的决策能力","summaryZh":"Simon Willison转述Nik Suresh的辛辣观察：某从未用过ChatGPT的高管却制定了围绕AI的公司战略；有工程师私下把Go代码库复制并让AI改写成Zig，只为在裁员前证明自己还有用。"},{"id":"4f0e18b4fccc7d26","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/19/claude-code-in-bun-in-rust/#atom-everything","titleOriginal":"Claude Code uses Bun written in Rust now","publishedAt":"2026-07-19T03:54:09.000Z","brief":false,"thin":false,"titleZh":"Claude Code现在用的是Rust重写版Bun","summaryZh":"Bun作者透露Claude Code自v2.1.181起改用Rust重写的Bun，Linux启动提速10%。Simon Willison用strings命令验证发现其用的是尚未公开发布的Bun v1.4.0预览版。"},{"id":"5f8519210bc2b181","source":"Exponential View","type":"newsletter","lang":"en","url":"https://www.exponentialview.co/p/ev-593","titleOriginal":"🔮 Kimi K3 surprise & AI economics; the solar paradox; AI's right to learn, cancer vaccine & junior jobs++","publishedAt":"2026-07-19T02:37:10.000Z","brief":false,"thin":false,"titleZh":"Kimi K3意外来袭与AI经济学：太阳能悖论、AI学习权与初级岗位危机","summaryZh":"本期时事通讯聚焦Moonshot新模型Kimi K3引发的震动，作者认为其冲击力可能超过当年DeepSeek时刻。据Artificial Analysis数据，Kimi K3性能接近Opus 4.8和GPT-5.6，但按token计价并不便宜，价格接近GPT-5.6 Sol却比DeepSeek V4 Pro贵24倍。另涉及太阳能悖论与初级岗位冲击等话题。"},{"id":"ad97b9f43a801234","source":"AI Alignment Forum","type":"community","lang":"en","url":"https://www.alignmentforum.org/posts/CCt9oy8axcdvaGcPE/a-red-line-and-oversight-framework-for-government-ai","titleOriginal":"A Red Line and Oversight Framework for Government AI Contracts","publishedAt":"2026-07-18T18:58:31.000Z","brief":false,"thin":false,"titleZh":"一份政府AI合同的红线与监督框架设计手记","summaryZh":"作者曾主导为Google Cloud与五角大楼AI合同设计红线与监督框架，本文复盘机制设计思路：排除自主打击、无差别画像等可疑用途，同时为导弹防御等可信场景留出空间；框架以首席科学家为唯一信任根基，并针对Cloud部门倾向钻空子等现实约束做了针对性设计。"},{"id":"22a77fa629b52078","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/18/sqlite-query-explainer/#atom-everything","titleOriginal":"SQLite Query Explainer","publishedAt":"2026-07-18T17:19:10.000Z","brief":false,"thin":false,"titleZh":"Simon Willison发布SQLite查询计划可视化解释工具","summaryZh":"Simon Willison受Julia Evans一篇讲运行SQLite的博文启发，用Fable编写了一个交互式工具，在浏览器中运行SQLite，对EXPLAIN和EXPLAIN QUERY PLAN的输出加上通俗解释，帮助不熟悉查询计划的人理解执行逻辑，但作者提醒结果未经严格验证。"},{"id":"515afa8bff953216","source":"AI Alignment Forum","type":"community","lang":"en","url":"https://www.alignmentforum.org/posts/xWZpwPPp5nR9rZq3x/endogenous-alignment","titleOriginal":"Endogenous Alignment","publishedAt":"2026-07-18T14:10:37.000Z","brief":false,"thin":false,"titleZh":"从养育孩子看AI对齐：外源规训之外还需要内生对齐","summaryZh":"文章以养育孩子类比AI对齐：我们通过奖惩等外源手段规训儿童行为，之所以奏效是因为孩子天生渴望被爱、被信任；但成年后社会很少再靠外源手段对齐成年人。作者由此探讨AI系统能否培养类似的“内生对齐”机制，而不仅依赖训练时的外部奖惩。"},{"id":"1e95bee9c26709cb","source":"Ahead of AI","type":"blog","lang":"en","url":"https://magazine.sebastianraschka.com/p/controlling-reasoning-effort-in-llms","titleOriginal":"Controlling Reasoning Effort in LLMs","publishedAt":"2026-07-18T11:16:09.000Z","brief":false,"thin":false,"titleZh":"解析LLM如何实现低/中/高不同强度的推理模式","summaryZh":"Sebastian Raschka梳理了从OpenAI o1、DeepSeek-R1到最新GPT-5.6家族，推理模型如何通过强化学习和可调节的“推理强度”设置控制思考时间与算力消耗。GPT-5.6分三种尺寸，每种提供五到六档推理强度。"},{"id":"ab4192251d9cb9e2","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/18/claude-make-fable-5-permanent/#atom-everything","titleOriginal":"Claude make Fable 5 permanent","publishedAt":"2026-07-18T06:00:13.000Z","brief":false,"thin":false,"titleZh":"Anthropic收回成命：Fable 5永久保留在订阅套餐中","summaryZh":"Anthropic宣布从7月20日起，Fable 5将保留在Max和Team Premium订阅计划中（按50%额度），Pro和Team Standard用户则获一次性100美元额度。Simon Willison指出，这是被GPT-5.6 Sol（及Kimi K3）竞争压力逼出的转向——此前Anthropic本计划把Fable 5挪出订阅套餐。"},{"id":"8abd0136f1fe689b","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/18/quixote/#atom-everything","titleOriginal":"nascheme/quixote","publishedAt":"2026-07-18T05:27:49.000Z","brief":false,"thin":false,"titleZh":"21岁高龄的Python老古董Quixote框架仍在更新","summaryZh":"Simon Willison注意到Python早期Web框架Quixote的代码仓库最近一次提交发生在六小时前，而该仓库最早的提交记录来自21年前从Subversion导入Git时的Quixote 2.4版本，显示这个“文物级”项目仍有人在维护。"},{"id":"5ce3f0149e074b38","source":"Latent Space","type":"podcast","lang":"en","url":"https://www.latent.space/p/ainews-not-much-happened-today-830","titleOriginal":"[AINews] not much happened today","publishedAt":"2026-07-18T04:30:21.000Z","brief":true,"thin":false,"titleZh":"AI日报：Kimi K3余温未散，Databricks完成1880亿美元E轮融资","summaryZh":"本期AI新闻摘要称市场仍在消化前一天Kimi K3的发布，祝贺Databricks完成1880亿美元E轮融资，并提到OpenRouter可能被收购的传闻，还推荐了一场关于AI Agent沙箱基础设施的演讲，为7月16-17日社交媒体AI资讯汇总。"},{"id":"ed417ef7b008dd8d","source":"Robert Miles AI Safety","type":"video","lang":"en","url":"https://www.youtube.com/shorts/gzTZyxPlDKA","titleOriginal":"Is China Open to Making a Deal on AI?","publishedAt":"2026-07-18T00:53:22.000Z","brief":true,"thin":true,"titleZh":"中国是否愿意就AI达成协议？","summaryZh":"视频标题探讨中国是否对AI相关协议持开放态度，作者给出的简短态度是“看起来是这样的”。（原文未提供详细内容）"},{"id":"5725f5b543795915","source":"AI Alignment Forum","type":"community","lang":"en","url":"https://www.alignmentforum.org/posts/5kEezahvkEiQuWEfx/should-we-benchmark-conceptual-capabilities-using-judgment","titleOriginal":"Should we benchmark conceptual capabilities using judgment prediction tasks?","publishedAt":"2026-07-17T23:42:45.000Z","brief":false,"thin":false,"titleZh":"该用“预测他人判断”给AI的概念推理能力打分吗？","summaryZh":"文章指出很多概念性推理任务涉及高度主观判断，难以直接用于给AI能力打分（比如让AI预测“AI失控概率”本身就不合理）。作者提出替代思路：让AI去预测某个具体人对该问题的判断，以此作为可衡量基准，但也承认这种“判断预测”方法能否真正追踪模型进步仍不确定。"},{"id":"33d0a43631a90aa9","source":"AI Alignment Forum","type":"community","lang":"en","url":"https://www.alignmentforum.org/posts/FBqe5dt8ZjaHN4Xj9/announcing-the-corrigibility-research-fund","titleOriginal":"Announcing the Corrigibility Research Fund","publishedAt":"2026-07-17T18:06:32.000Z","brief":false,"thin":false,"titleZh":"新基金成立：2026年将拨款至少20万美元支持AI可纠正性研究","summaryZh":"作者宣布在Lightcone Infrastructure旗下设立新基金，2026年将拿出至少20万美元资助AI“可纠正性”研究，约一半为传统资助（首轮申请截止8月23日），另一半奖励年内已完成的优秀工作。作者认为目前AI安全经费大多流向评估、控制和可解释性，对齐本身仍严重不足。"},{"id":"f5463bdcc4ebb7e5","source":"Stratechery","type":"newsletter","lang":"en","url":"https://stratechery.com/2026/mainframes-and-main-characters/","titleOriginal":"2026.29: Mainframes and Main Characters","publishedAt":"2026-07-17T17:00:00.000Z","brief":false,"thin":false,"titleZh":"Stratechery周报：大型机的黄昏与新主角们","summaryZh":"本周Stratechery精选提到IBM股价创115年上市史上最差单日跌幅，导火索是其赖以立身的大型机业务销售及配套软件双双走弱——而大型机客户群历经半个世纪几乎没有变化，这次下滑格外引人关注。文中还汇总了当周付费栏目的其他精选文章链接。"},{"id":"969044f63ea6bfa4","source":"Google DeepMind Blog","type":"lab","lang":"en","url":"https://deepmind.google/blog/introducing-gemini-3-5-flash-cyber/","titleOriginal":"Introducing Gemini 3.5 Flash Cyber","publishedAt":"2026-07-17T15:00:11.000Z","brief":false,"thin":false,"titleZh":"谷歌推出网络安全专用模型Gemini 3.5 Flash Cyber","summaryZh":"Google DeepMind发布基于3.5 Flash微调的轻量级网络安全模型Gemini 3.5 Flash Cyber，专门用于快速、低成本发现、验证和修复软件漏洞，效果优于主线Flash模型。这是谷歌应对“AI攻击者发现漏洞快于防御者修复”这一威胁的最新举措。"},{"id":"960ab030630cf750","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/17/kimi-k3/#atom-everything","titleOriginal":"Quoting Kimi K3","publishedAt":"2026-07-17T13:43:53.000Z","brief":false,"thin":false,"titleZh":"Kimi K3拒绝泄露系统提示词后怼了一句","summaryZh":"这是一条简短摘录：有人在Hacker News上尝试诱导Kimi K3泄露系统提示词，模型拒绝后反问“今天有什么我能真正帮到你的吗？”，被作者收录进其“AI人格”系列语录。"},{"id":"7dafbd8743739f1e","source":"Don't Worry About the Vase","type":"newsletter","lang":"en","url":"https://thezvi.substack.com/p/ai-177-part-2-wish-you-were-here","titleOriginal":"AI #177 Part 2: Wish You Were Here","publishedAt":"2026-07-17T12:47:20.000Z","brief":false,"thin":false,"titleZh":"AI周报177（下）：Kimi K3冲击波与地缘政治","summaryZh":"本期为Zvi每周AI综述的第二部分，聚焦投机性、监管、政治与对齐议题，并讨论Kimi K3是否强到足以改写行业格局——Artificial Analysis智能指数给出57分，比Opus 4.8高1分，但比GPT-5.6 Sol和Fable分别低2分和3分。作者认为该指数可能高估实际能力，还需实测验证。"},{"id":"c724e91bc778b434","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/17/llm-cliche-highlighter/#atom-everything","titl I 3被刷新纪录","summaryZh":"本期TLDR AI新闻摘要的三条头条为：Moonshot新模型Kimi K3上线、谷歌Gemini 3.5被曝延期，以及有系统在ARC-AGI 3基准测试上取得突破性成绩。抓取到的正文主要是赞助商内容，具体细节需点开原文查看。"},{"id":"2b102685bd9b6d6f","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/16/firefox-in-webassembly/#atom-everything","titleOriginal":"Firefox in WebAssembly","publishedAt":"2026-07-16T23:34:16.000Z","brief":false,"thin":false,"titleZh":"把整个Firefox浏览器编译成WebAssembly塞进Chrome里跑","summaryZh":"Puter团队把Firefox/Gecko整体编译成WebAssembly，实现了“在Chrome里运行的Firefox”这种套娃效果，Simon Willison演示了自己的博客在这个WASM版Firefox里加载的过程。项目选Firefox因其单进程支持较好，流量经Wisp协议转发，估计消耗约2.5万美元的Claude token用量。"},{"id":"07f97d4cbd8ecd7b","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/16/kimi-k3/#atom-everything","titleOriginal":"Kimi K3, and what we can still learn from the pelican benchmark","publishedAt":"2026-07-16T20:19:30.000Z","brief":false,"thin":false,"titleZh":"Kimi K3发布深度解读：2.8万亿参数，自称“开放3T级”模型","summaryZh":"Moonshot AI发布Kimi K3，参数量2.8万亿，已可通过官网和API使用，开源权重承诺7月27日前发布。Moonshot称其为首个“开放3T级”模型，力压DeepSeek V4 Pro的1.6万亿参数；官方基准显示K3大多超过Opus 4.8 max和GPT-5.5 high，但仍不敌Fable 5和GPT-5.6 Sol。"},{"id":"6bcf21fe63d9ec20","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/16/bad-codex-bug/#atom-everything","titleOriginal":"Quoting Thibault Sottiaux","publishedAt":"2026-07-16T17:45:59.000Z","brief":false,"thin":false,"titleZh":"Codex意外删库事件调查：三个诱因同时踩中才会翻车","summaryZh":"OpenAI Codex团队披露了几起GPT-5.6意外删除文件的报告调查结果：问题通常发生在开启完全访问模式且未启用沙箱保护（含自动审查）、模型试图重新定义$HOME环境变量指向临时目录、以及模型误将$HOME当作要清理的临时目录这三个因素叠加时。"},{"id":"a907415b440a72c9","source":"OpenAI","type":"lab","lang":"en","url":"https://openai.com/index/why-teens-deserve-access-safe-ai","titleOriginal":"Why teens deserve access to safe AI","publishedAt":"2026-07-16T16:00:00.000Z","brief":false,"thin":true,"titleZh":"为什么青少年也应该拥有安全的AI","summaryZh":"OpenAI介绍了如何通过年龄适配保护、学习工具、家长控制和专家合作，让ChatGPT对青少年用户更安全。 space/p/the-lab-of-the-future-should-feel","titleOriginal":"🔬 The Lab of the Future Should Feel Like a Data Center — Andy Beam & Rafa Gómez-Bombarelli, Lila Sciences","publishedAt":"2026-07-16T13:30:44.000Z","brief":true,"thin":false,"titleZh":"Lila Sciences：让实验室像数据中心一样7×24小时自动跑实验","summaryZh":"Lila Sciences的Andy Beam和Rafa Gómez-Bombarelli做客播客，介绍公司如何用AI引导的机器人打造全自动化实验室，目标是通往“科学超级智能”。他们已积累超10万亿条经实验验证的科学推理token，理念是贯彻“苦涩的教训”——把实验室当成无限数据生成器。"},{"id":"7dcd1d605fa14233","source":"Simon Willison's Weblog","type":"blog","lang":"en","url":"https://simonwillison.net/2026/Jul/16/linus-torvalds/#atom-everything","titleOriginal":"Quoting Linus Torvalds","publishedAt":"2026-07-16T13:26:10.000Z","brief":false,"thin":false,"titleZh":"Linus Torvalds表态：Linux内核不排斥AI，谁不服可以另立山头","summaryZh":"Linux创始人Linus Torvalds在邮件列表中明确表态，作为顶层维护者他坚持Linux内核项目不会成为“反AI”项目，不满的人大可以按开源精神去fork或者离开。他认为AI是否有用早已不是问题，唯一还悬而未决的是围绕它的经济格局最终会是什么样子。"},{"id":"c20c60fdce1ddeff","source":"Ben's Bites","type":"newsletter","lang":"en","url":"https://www.bensbites.com/p/ive-got-an-inkling","titleOriginal":"I've got an Inkling","publishedAt":"2026-07-16T13:06:31.000Z","brief":false,"thin":false,"titleZh":"本周AI速览：Thinking Machines发布Inkling，GLM-5.2持续抢占市场","summaryZh":"Ben's Bites本期头条是Thinking Machines发布首个开源模型Inkling，具备百万token上下文，支持文本、图像、音频，尚不及大多数中国实验室的顶尖开源模型；已上线其微调平台Tinker供二次开发。文章还提到GLM-5.2是最强开源模型之一，不少创业公司正把负载从闭源模型转向它。"},{"id":"6993d635aed7dbd2","source":"3Blue1Brown","type":"video","lang":"en","url":"https://www.youtube.com/watch?v=GlYgs6v2YfU","titleOriginal":"But what is cross-entropy? | Compression is Intelligence Part 2","publishedAt":"2026-07-16T11:56:04.000Z","brief":true,"thin":false,"titleZh":"交叉熵是什么？从压缩理论理解LLM训练的损失函数","summaryZh":"这是3Blue1Brown“压缩即智能”系列第二集，从信息压缩和最优编码的角度推导出交叉熵损失函数的来源，并解释它在LLM预训练中的直觉含义与实际应用，配合Manim动画和一个NanoGPT可视化演示。"},{"id":"c5c3971a89726166","source":"Hugging Face Blog","type":"lab","lang":"en","url":"https://huggingface.co/blog/Dharma-AI/newer-models-same-advantages","titleOriginal":"Newer Models, Same Advantage","publishedAt":"2026-07-16T11:49:48.000Z","brief":false,"thin":false,"titleZh":"新模型层出不穷，专精巴西葡语的DharmaOCR依然领先","summaryZh":"Dharma-AI团队分析了自家开源的DharmaOCR模型为何在巴西葡萄牙语场景下仍优于Mistral OCR4等更新的通用OCR模型，核心原因是领域专精和针对性训练：先用覆盖多来源、多格式葡语文档做监督微调，再做针对性优化。"},{"id":"16e13c52f7cd02d4","source":"Google DeepMind Blog","type":"lab","lang":"en","url":"https://deepmind.google/blog/our-approach-to-bioresilience/","titleOriginal":"Our approach to bioresilience","publishedAt":"2026-07-16T09:30:42.000Z","brief":false,"thin":true,"titleZh":"谷歌DeepMind与Isomorphic Labs公布生物韧性应对方案","summaryZh":"Google DeepMind与Isomorphic Labs联合发布了双方在“生物韧性”（bioresilience）方面的AI模型应对策略。（原文未提供更多细节）"},{"id":"1e822a67b2bbbaf5","source":"Ahead of AI","type":"blog","lang":"en","url":"https://sebastianraschka.com/blog/2026/inkling-architecture-benchmark-notes.html","titleOriginal":"Inkling: A New Open-Weight 975B MoE with a Few Surprises","publishedAt":"2026-07-16T08:50:22.000Z","brief":false,"thin":false,"titleZh":"跑分实测：Inkling全面对比GLM-5.2，互有胜负","summaryZh":"作者比较了Thinking Machines新模型Inkling与GLM-5.2的基准表现：Inkling在IFBench（79.8%对73.3%）和SimpleQA Verified上更强，但在HLE无工具、SWE-Bench Pro Public和Terminal-Bench 2.1等推理与编程代理类基准上明显落后。作者认为Inkling更适合作为二次微调的通用底座。"},{"id":"49857bbbb2f8af4d","source":"OpenAI","type":"lab","lang":"en","url":"https://openai.com/index/codex-collaborator-creative-team","titleOriginal":"How Codex became a collaborator for OpenAI’s creative team","publishedAt":"2026-07-16T07:00:00.000Z","brief":false,"thin":true,"titleZh":"Codex如何成为OpenAI创意团队的“合作伙伴”","summaryZh":"文章介绍OpenAI创意团队如何用Codex构建定制创意工具、加速创意构思并结合上下文更快地做原型开发。（原文未提供更多细节）"},{"id":"d90b49827e0a51f6","source":"Latent Space","type":"podcast","lang":"en","url":"https://www.latent.space/p/ainews-thinkys-inkling-975b-a41b","titleOriginal":"[AINews] Thinky's Inkling: 975B-A41B multimodal, new best American Apache 2.0 open model (with Inkling-Small, 276B-A12B)","publishedAt":"2026-07-16T06:18:05.000Z","brief":true,"thin":false,"titleZh":"Thinking Machines新模型Inkling发布：975B-A41B多模态，配套Inkling-Small","summaryZh":"低调许久的Thinking Machines再度出手，发布多模态开源模型Inkling——975B总参数/41B激活参数的MoE架构，支持百万token上下文，训练数据涵盖文本、图像、音频、视频共45万亿token；同时预告了更轻量的Inkling-Small。虽非SOTA，但被认为是较扎实的美国开源基线模型。"},{"id":"8eb12b930c4d35dd","source":"Robert Miles AI Safety","type":"video","lang":"en","url":"https://www.youtube.com/shorts/ZRHft30R_6c","titleOriginal":"AI can't DO my JOB quite yet","publishedAt":"2026-07-16T01:40:05.000Z","brief":true,"thin":true,"titleZh":"AI还干不了我的工作——至少现在还不行","summaryZh":"视频标题表达的观点是当前AI尚不能完全取代作者的工作，并推荐了《AI 2040: Plan A》和Rational Animations频道。（原文未提供更多细节）"},{"id":"e3075e69047c40ff","source":"张小珺Jùn｜商业访谈录","type":"podcast","lang":"zh","url":"https://www.youtube.com/watch?v=ghKTtfM-R6g","titleOriginal":"146. 对Physical Intelligence柯丽一鸣4小时访谈：Pi的开源模型研究，机器人的江湖、族谱与主角","publishedAt":"2026-07-16T01:16:28.000Z","brief":true,"thin":false,"titleZh":"146. 对Physical Intelligence柯丽一鸣4小时访谈：Pi的开源模型研究，机器人的江湖、族谱与主角","summaryZh":"这期播客对话机器人明星创业公司Physical Intelligence（估值超50亿美元）的研究员柯丽一鸣，聊了她主导的强化学习研究，梳理π0、π0.5到π*0.6的技术演进，并延伸讨论全球机器人赛道的门派格局，以及她放弃剑桥教职创业的心路历程。"},{"id":"6c6f6f07b06c3033","source":"张小珺Jùn｜商业访谈录","type":"podcast","lang":"zh","url":"https://www.youtube.com/watch?v=dPXZrTw-Hgk","titleOriginal":"Kay Ke: Inside Physical Intelligence's Open-Source Robot Models and the Robotics Landscape","publishedAt":"2026-07-16T00:30:06.000Z","brief":true,"thin":false,"titleZh":"对话柯丽一鸣：Physical Intelligence的开源机器人模型与行业全景","summaryZh":"本期为张小珺访谈Physical Intelligence研究员柯丽一鸣的英文版说明。Pi成立仅两年、估值已超50亿美元，被视为机器人领域最受关注的独角兽，有人称其有望成为“机器人界的OpenAI”。节目详细拆解了Pi从π0到π0.5、π*0.6的开源机器人大脑技术路线，并讨论行业格局。"},{"id":"68efdc279a8b07b4","source":"TLDR AI","type":"newsletter","lang":"en","url":"https://tldr.tech/ai/2026-07-16","titleOriginal":"Thinking Machines Inkling 🧠, GPT-Red 🔒, Perplexity sandboxes 🛡️","publishedAt":"2026-07-16T00:00:00.000Z","brief":false,"thin":false,"titleZh":"简讯：Inkling开源发布、OpenAI亮出GPT-Red、Perplexity上线沙箱","summaryZh":"本期TLDR AI速览的头条包括Thinking Machines发布开源模型Inkling、OpenAI推出用于红队测试的GPT-Red， g agents","publishedAt":"2026-07-15T17:29:41.000Z","brief":false,"thin":false,"titleZh":"打造海洋巡护AI代理Shippy的经验：可靠性才是第一位的","summaryZh":"Skylight团队分享了打造海事AI代理Shippy的架构经验：这是用于高风险决策的海洋保护分析工具，答错可能让巡逻船跑偏、危及资源与人员安全。系统在每次回答中附带边界数据来源、截止时间和可核实的地图链接以保证可验证，这些经验也沿用到了Ai2其他环境类平台。"},{"id":"969cdff003616d87","source":"Hugging Face Blog","type":"lab","lang":"en","url":"https://huggingface.co/blog/ibm-research/model-routing-is-simple-until-it-isnt","titleOriginal":"Model Routing Is Simple. Until It Isn’t.","publishedAt":"2026-07-15T17:27:01.000Z","brief":false,"thin":false,"titleZh":"模型路由听起来很简单，做起来却处处是坑","summaryZh":"IBM Research团队分享了在Agent系统中构建模型路由器的教训：原以为按任务难度分流给不同模型是分类问题，实际是系统优化难题。三大意外复杂点之一是成本认知偏差——他们原以为GPT-4.1比Sonnet 4.6便宜，但417个任务实测结果并非如此。"},{"id":"1ce624883baff234","source":"The Algorithm","type":"newsletter","lang":"en","url":"https://www.technologyreview.com/2026/07/15/1140514/meet-gpt-red-an-llm-super-hacker-openai-built-to-make-its-models-safer/","titleOriginal":"Meet GPT-Red: an LLM super-hacker OpenAI built to make its models safer","publishedAt":"2026-07-15T17:09:37.000Z","brief":false,"thin":false,"titleZh":"OpenAI打造“超级黑客”AI——GPT-Red，专门给自家模型挑刺","summaryZh":"OpenAI构建了名为GPT-Red的LLM超级黑客，作为陪练伙伴帮助其他模型强化对网络攻击的防御能力。上周发布的GPT-5.6正是经过针对GPT-Red的对抗训练，OpenAI称这是迄今最稳健的一次发布。GPT-Red将人工完成的“红队测试”自动化，以应对AI Agent时代不断扩大的攻击面。"},{"id":"2f7f627a9945f1e8","source":"Don't Worry About the Vase","type":"newsletter","lang":"en","url":"https://thezvi.substack.com/p/monthly-roundup-44-july-2026","titleOriginal":"Monthly Roundup #44: July 2026","publishedAt":"2026-07-15T16:12:37.000Z","brief":false,"thin":false,"titleZh":"7月月度杂谈：信任、社会与预测市场种种","summaryZh":"这是Zvi固定的月度杂谈合集，涵盖坏消息、好建议、机会、娱乐、游戏、自动驾驶、社交媒体、政府运作、预测市场等板块的短评汇总，其中一则观点认为人类道德近似“囚徒困境”——只有相信别人信任你，你才会信任对方，充满社交偏执的人反而颇为危险。"},{"id":"26ea68098be1b9ce","source":"Two Minute Papers","type":"video","lang":"en","url":"https://www.youtube.com/watch?v=0CqLVnx-2UM","titleOriginal":"Anthropic Found Something That Shouldn't Exist","publishedAt":"2026-07-15T13:58:27.000Z     return { total: items.length, unread: unread, starred: starred };
  }

  // 条目 meta 行的徽标：brief（播客/视频只看官方简介，未收听/未观看）与
  // thin（抓不到正文，中文摘要只能依据标题写）各自独立判断，可能同时出现。
  // 不碰 DOM，纯字符串拼接，抽到这里方便单测覆盖（ui.js 里的渲染只是调用它）。
  function itemBadges(it) {
    var out = '';
    if (it.brief) {
      out += '<span class="brief-note">' + (it.type === 'video' ? '▶' : '🎧') + ' 基于官方简介，未收听</span>';
    }
    if (it.thin) {
      out += '<span class="brief-note">⚠ 仅标题</span>';
    }
    return out;
  }

  // href 白名单：条目的 url 一路从远端 RSS feed 流进来，属于不可信数据。
  // 只放行 http/https，其余（javascript:、data:、vbscript:、file: 等，以及
  // 解析失败的）一律换成 '#'，防止 <a href="..."> 被注入伪协议后点击执行脚本。
  // 用 new URL() 解析后看 protocol：WHATWG URL 解析规则本身就会剥离输入两端的
  // C0 控制符/空白、以及内嵌的 tab（\t）、换行（\n）、回车（\r），并把 scheme
  // 归一化成小写，所以 'JaVaScRiPt:x'、'  javascript:x'、'java\tscript:x'、
  // 'java\nscript:x' 这些绕过写法解析出来的 protocol 都是规整的 'javascript:'，
  // 不需要自己再手写剥离逻辑。
  function safeUrl(url) {
    try {
      var u = new URL(url);
      return (u.protocol === 'http:' || u.protocol === 'https:') ? url : '#';
    } catch (e) {
      return '#';
    }
  }

  // 分组标题下的信源分布：统计当前实际展示的条目（调用方已经把筛选/搜索
  // 应用完了，这里只管数数），按条数降序、条数相同按信源名升序排稳定。
  // 超过 topN 个信源时，多出来的合并成一条「其他」，放在最后。
  // 如果指定了 pinned（信源名），该信源永远出现在结果里，不会被并入「其他」。
  function sourceBreakdown(items, topN, pinned) {
    topN = topN == null ? 5 : topN;
    // 如果 pinned 是 undefined/null/空串，就当作没有 pin
    pinned = (pinned == null || pinned === '') ? undefined : pinned;
    var counts = {};
    items.forEach(function (it) {
      counts[it.source] = (counts[it.source] || 0) + 1;
    });
    var list = Object.keys(counts).map(function (source) {
      return { source: source, count: counts[source] };
    }).sort(function (a, b) {
      return b.count - a.count || (a.source < b.source ? -1 : a.source > b.source ? 1 : 0);
    });
    if (list.length <= topN) return list;
    var head = list.slice(0, topN);
    var rest = list.slice(topN);

    // 检查 pinned 是否在 rest 中（即排名超过topN但存在）
    var pinnedItem = null;
    if (pinned) {
      for (var i = 0; i < rest.length; i++) {
        if (rest[i].source === pinned) {
          pinnedItem = rest[i];
          rest = rest.slice(0, i).concat(rest.slice(i + 1));
          break;
        }
      }
    }

    if (pinnedItem) {
      head.push(pinnedItem);
    }

    // 如果 rest 还有剩余，合并成「其他」
    if (rest.length > 0) {
      var restCount = rest.reduce(function (n, x) { return n + x.count; }, 0);
      head.push({ source: OTHER_LABEL, count: restCount, isOther: true });
    }

    return head;
  }

  // 信源管理页用：今日与最近窗口（days 覆盖的全部天数）里各信源的条数。
  // days[0] 是最新一天（与 ui.js 里 today 的取法一致），today 只统计它；
  // window 统计传入的全部 days。days 为空时两者都返回空对象。
  function countsBySource(days) {
    var today = {};
    var windowCounts = {};
    days.forEach(function (day, idx) {
      (day.items || []).forEach(function (it) {
        windowCounts[it.source] = (windowCounts[it.source] || 0) + 1;
        if (idx === 0) today[it.source] = (today[it.source] || 0) + 1;
      });
    });
    return { today: today, window: windowCounts };
  }

  function formatDayLabel(dateStr, todayStr) {
    var diff = Math.round((Date.parse(todayStr + 'T00:00:00Z') - Date.parse(dateStr + 'T00:00:00Z')) / 86400000);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    var d = new Date(dateStr + 'T00:00:00Z');
    return (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日 ' + WEEKDAYS[d.getUTCDay()];
  }

  window.ReaderLogic = {
    TYPE_ORDER: TYPE_ORDER,
    TYPE_LABELS: TYPE_LABELS,
    groupByType: groupByType,
    applyFilter: applyFilter,
    computeStats: computeStats,
    sourceBreakdown: sourceBreakdown,
    countsBySource: countsBySource,
    formatDayLabel: formatDayLabel,
    itemBadges: itemBadges,
    safeUrl: safeUrl,
  };
})();

/* DOM 装配。依赖 window.ReaderLogic 与页面里的 #reader-data。 */
(function () {
  var L = window.ReaderLogic;
  var DATA = JSON.parse(document.getElementById('reader-data').textContent);
  var READ_KEY = 'airadar.read.v1';
  var STAR_KEY = 'airadar.star.v1';

  function loadSet(key) {
    try {
      var raw = localStorage.getItem(key);
      return new Set(raw ? JSON.parse(raw) : []);
    } catch (e) {
      return new Set();
    }
  }
  function saveSet(key, set) {
    try {
      localStorage.setItem(key, JSON.stringify([...set]));
    } catch (e) {
      /* 隐私模式下写不进去，功能降级为本次会话有效 */
    }
  }

  var readSet = loadSet(READ_KEY);
  var starSet = loadSet(STAR_KEY);
  var today = DATA.days.length ? DATA.days[0].date : '';
  // sourceFilter：分布行里点某个信源名后生效的筛选，null 表示不筛选。
  // 与 filter/query 是正交的两层筛选（见 baseFilteredItems / visibleItems）。
  var state = { view: today ? { kind: 'day', date: today } : { kind: 'sources' }, filter: 'all', query: '', sourceFilter: null };

  var elStats = document.getElementById('stats');
  var elCal = document.getElementById('calendar');
  var elStream = document.getElementById('stream');
  var elSources = document.getElementById('sources-view');
  var elSearch = document.getElementById('search');
  var elFilters = document.getElementById('filters');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function allItems() {
    return DATA.days.reduce(function (acc, d) { return acc.concat(d.items); }, []);
  }

  function currentItems() {
    if (state.view.kind === 'starred') {
      return allItems().filter(function (it) { return starSet.has(it.id); });
    }
    var day = DATA.days.find(function (d) { return d.date === state.view.date; });
    return day ? day.items : [];
  }

  function currentErrors() {
    if (state.view.kind !== 'day') return [];
    var day = DATA.days.find(function (d) { return d.date === state.view.date; });
    return day && day.errors ? day.errors : [];
  }

  // 未读/已标星筛选 + 搜索，但不含信源筛选。分组标题下的分布行永远基于
  // 这一层算——否则点了某个信源之后，分布行就只剩它自己，没法直接切到
  // 别的源（这是这个功能最容易做错的地方）。
  function baseFilteredItems() {
    return L.applyFilter(currentItems(), {
      filter: state.filter, query: state.query, readSet: readSet, starSet: starSet,
    });
  }

  // 在 baseFilteredItems() 之上再叠加信源筛选，主区实际展示的就是这批。
  function visibleItems(items) {
    return state.sourceFilter
      ? items.filter(function (it) { return it.source === state.sourceFilter; })
      : items;
  }

  function renderCalendar() {
    var html = DATA.days.map(function (d) {
      var unread = d.items.filter(function (it) { return !readSet.has(it.id); }).length;
      var active = state.view.kind === 'day' && state.view.date === d.date;
      return '<button class="day-btn' + (active ? ' active' : '') + '" data-date="' + esc(d.date) + '">' +
        '<span>' + esc(L.formatDayLabel(d.date, today)) + '</span>' +
        '<span class="day-count">' + (unread ? '<span class="unread-dot"></span> ' : '') + d.items.length + '</span>' +
        '</button>';
    }).join('');
    elCal.innerHTML = html;
  }

  function renderStats() {
    var s = L.computeStats(visibleItems(baseFilteredItems()), readSet, starSet);
    var label = state.view.kind === 'starred' ? '收藏' :
      state.view.kind === 'sources' ? '' : L.formatDayLabel(state.view.date, today);
    var chip = state.sourceFilter
      ? ' <button type="button" id="source-filter-chip" class="source-chip">已筛选：' + esc(state.sourceFilter) + ' ×</button>'
      : '';
    elStats.innerHTML = (label
      ? label + ' <b>' + s.total + '</b> 条 · 未读 <b>' + s.unread + '</b> · ★ <b>' + s.starred + '</b>'
      : '') + chip;
  }

  function itemHtml(it) {
    var isRead = readSet.has(it.id);
    var isStar = starSet.has(it.id);
    var time = new Date(it.publishedAt).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    return '<article class="item' + (isRead ? ' read' : '') + '" data-id="' + esc(it.id) + '">' +
      '<button class="toggle" data-act="read" aria-label="标记已读" aria-pressed="' + isRead + '">' + (isRead ? '☑' : '☐') + '</button>' +
      '<button class="toggle' + (isStar ? ' star-on' : '') + '" data-act="star" aria-label="标星" aria-pressed="' + isStar + '">' + (isStar ? '★' : '☆') + '</button>' +
      '<div class="item-body">' +
        '<div class="item-meta">' +
          '<span class="src">' + esc(it.source) + '</span>' +
          '<span>' + esc(L.TYPE_LABELS[it.type] || it.type) + '</span>' +
          '<span>' + esc((it.lang || '').toUpperCase()) + '</span>' +
          '<span>' + esc(time) + '</span>' +
          L.itemBadges(it) +
        '</div>' +
        '<h3 class="item-title"><a href="' + esc(L.safeUrl(it.url)) + '" target="_blank" rel="noopener">' + esc(it.titleZh || it.titleOriginal) + '</a></h3>' +
        (it.titleZh ? '<p class="item-orig">原标题 ' + esc(it.titleOriginal) + '</p>' : '') +
        '<p class="item-summary">' + esc(it.summaryZh) + '</p>' +
      '</div>' +
    '</article>';
  }

  function renderStream() {
    elSources.classList.add('hidden');
    elStream.classList.remove('hidden');

    // baseItems：未读/已标星 + 搜索之后、还没应用信源筛选的条目，分布行照它算。
    // shownItems：baseItems 再叠加信源筛选，分组和条目列表照它算。
    var baseItems = baseFilteredItems();

    if (!baseItems.length) {
      elStream.innerHTML = '<div class="empty-state">这里没有内容 — 换个筛选条件或看看别的日期。</div>';
      return;
    }

    var shownItems = visibleItems(baseItems);

    if (!shownItems.length) {
      elStream.innerHTML = '<div class="empty-state">这里没有内容 — 换个筛选条件或看看别的日期。</div>';
      return;
    }

    // 按类型分好的「全量」条目（未受信源筛选影响），供分布行取数用。
    var baseByType = {};
    L.groupByType(baseItems).forEach(function (g) { baseByType[g.type] = g.items; });

    var groups = L.groupByType(shownItems);
    var html = groups.map(function (g) {
      var breakdown = L.sourceBreakdown(baseByType[g.type] || g.items, undefined, state.sourceFilter).map(function (b) {
        if (b.isOther) {
          // 「其他」是多个信源的聚合，点了语义不清，不可点击。
          return '<span class="src-chip src-other">' + esc(b.source) + ' ' + b.count + '</span>';
        }
        var active = b.source === state.sourceFilter;
        return '<button type="button" class="src-chip src-filter' + (active ? ' active' : '') + '" data-source="' + esc(b.source) + '">' +
          esc(b.source) + ' ' + b.count + '</button>';
      }).join(' · ');
      return '<div class="group-head"><h2>' + esc(g.label) + '</h2>' +
        '<span class="group-count">' + g.items.length + ' 条</span></div>' +
        '<div class="group-breakdown">' + breakdown + '</div>' +
        g.items.map(itemHtml).join('');
    }).join('');

    var errors = currentErrors();
    if (errors.length) {
      html += '<div class="errors-note">今天有 ' + errors.length + ' 个源没抓到：' +
        errors.map(function (e) { return esc(e.source) + '（' + esc(e.message) + '）'; }).join('、') + '</div>';
    }
    elStream.innerHTML = html;
  }

  function renderSources() {
    elStream.classList.add('hidden');
    elSources.classList.remove('hidden');

    var enabled = DATA.sources.filter(function (s) { return s.enabled; });
    var disabled = DATA.sources.filter(function (s) { return !s.enabled; });
    var counts = L.countsBySource(DATA.days);

    function row(s) {
      var st = DATA.status[s.name] || {};
      var last = st.lastSuccess ? new Date(st.lastSuccess).toLocaleDateString('zh-CN') : '—';
      var note = s.enabled
        ? (st.consecutiveFailures ? '连续失败 ' + st.consecutiveFailures + ' 次：' + esc(st.lastErrorMessage || '') : '正常')
        : esc(s.disabledReason || '未启用');
      var today = counts.today[s.name] || 0;
      var win = counts.window[s.name] || 0;
      return '<tr class="' + (s.enabled ? '' : 'disabled') + '">' +
        '<td><a href="' + esc(L.safeUrl(s.url)) + '" target="_blank" rel="noopener">' + esc(s.name) + '</a></td>' +
        '<td>' + esc(L.TYPE_LABELS[s.type] || s.type) + '</td>' +
        '<td>' + esc((s.lang || '').toUpperCase()) + '</td>' +
        '<td class="num">' + today + '</td>' +
        '<td class="num">' + win + '</td>' +
        '<td>' + last + '</td><td>' + note + '</td></tr>';
    }

    elSources.innerHTML =
      '<div class="group-head"><h2>正在抓取</h2><span class="group-count">' + enabled.length + ' 个</span></div>' +
      '<div class="table-scroll"><table class="sources-table">' +
      '<tr><th>信源</th><th>类型</th><th>语言</th><th>今日</th><th>最近 30 天</th><th>最近成功</th><th>状态</th></tr>' +
      enabled.map(row).join('') + '</table></div>' +
      '<div class="group-head"><h2>未启用</h2><span class="group-count">' + disabled.length + ' 个</span></div>' +
      '<div class="table-scroll"><table class="sources-table">' +
      '<tr><th>信源</th><th>类型</th><th>语言</th><th>今日</th><th>最近 30 天</th><th>最近成功</th><th>原因</th></tr>' +
      disabled.map(row).join('') + '</table></div>' +
      '<div class="errors-note">信源列表以仓库里的 sources.json 为准。要增删信源，直接告诉 Claude，改动次日生效。' +
      '<br>已读与标星存在这台设备的浏览器里，换设备或清缓存会丢失；' +
      '<button id="export-stars" class="toggle" style="text-decoration:underline">导出收藏</button>' +
      '<button id="import-stars" class="toggle" style="text-decoration:underline">导入收藏</button>' +
      '<input id="import-stars-file" type="file" accept="application/json" style="display:none">' +
      '<span id="import-stars-msg"></span></div>';

    var btn = document.getElementById('export-stars');
    if (btn) btn.addEventListener('click', exportStars);

    var importBtn = document.getElementById('import-stars');
    var importFile = document.getElementById('import-stars-file');
    if (importBtn && importFile) {
      importBtn.addEventListener('click', function () { importFile.click(); });
      importFile.addEventListener('change', function () {
        var file = importFile.files && importFile.files[0];
        importFile.value = '';
        if (file) importStars(file);
      });
    }
  }

  function exportStars() {
    var starred = allItems().filter(function (it) { return starSet.has(it.id); });
    var payload = JSON.stringify({ exportedAt: new Date().toISOString(), items: starred }, null, 2);
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename: 'ai-radar-stars.json', data: payload }).catch(function () {});
    } else {
      var blob = new Blob([payload], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ai-radar-stars.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }
  }

  // 导入只做并集合并，不覆盖已有标星，也绝不碰 readSet ——
  // 导出/导入是给标星做备份用的，已读状态不参与备份（见 README「已知限制」）。
  // 解析失败或格式不对时把提示文字写进按钮旁边的 <span>，不用 alert：
  // alert 会阻塞 Artifact 的 iframe，把整个页面卡住。
  function importStars(file) {
    // render() 会整体重建 #sources-view 的 innerHTML（包括这条消息用的 span），
    // 所以提示文字必须在 render() 之后，对着重建出来的新节点设置，否则消息
    // 前脚写进去、后脚就被 render() 冲掉，页面上根本看不见。
    function setMsg(text) {
      render();
      var el = document.getElementById('import-stars-msg');
      if (el) el.textContent = text;
    }
    var reader = new FileReader();
    reader.onerror = function () { setMsg('读取文件失败'); };
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (e) {
        setMsg('导入失败：不是合法的 JSON 文件');
        return;
      }
      if (!parsed || !Array.isArray(parsed.items)) {
        setMsg('导入失败：文件格式不对，缺少 items 数组');
        return;
      }
      var added = 0;
      parsed.items.forEach(function (it) {
        if (it && typeof it.id === 'string' && it.id && !starSet.has(it.id)) {
          starSet.add(it.id);
          added++;
        }
      });
      saveSet(STAR_KEY, starSet);
      setMsg('已导入 ' + added + ' 条新标星');
    };
    reader.readAsText(file);
  }

  function render() {
    renderCalendar();
    renderStats();
    if (state.view.kind === 'sources') renderSources();
    else renderStream();
    document.querySelectorAll('.view-btn').forEach(function (b) {
      b.classList.toggle('active', state.view.kind === b.dataset.view);
    });
  }

  elCal.addEventListener('click', function (e) {
    var btn = e.target.closest('.day-btn');
    if (!btn) return;
    state.view = { kind: 'day', date: btn.dataset.date };
    // 换了日期，之前选的信源在新的一天里可能压根不存在，留着筛选只会
    // 让用户看到一片空白却摸不着头脑——直接清掉。
    state.sourceFilter = null;
    render();
  });

  document.querySelectorAll('.view-btn').forEach(function (b) {
    b.addEventListener('click', function () {
      state.view = { kind: b.dataset.view };
      // 切到「★ 收藏」或「信源管理」同理：清掉信源筛选，避免带着一个
      // 在新视图里对不上号的筛选条件。
      state.sourceFilter = null;
      render();
    });
  });

  elFilters.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    state.filter = btn.dataset.filter;
    elFilters.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === btn); });
    renderStream();
    renderStats();
  });

  elSearch.addEventListener('input', function () {
    state.query = elSearch.value;
    if (state.view.kind !== 'sources') { renderStream(); renderStats(); }
  });

  elStats.addEventListener('click', function (e) {
    var chip = e.target.closest('#source-filter-chip');
    if (!chip) return;
    state.sourceFilter = null;
    renderStream();
    renderStats();
  });

  elStream.addEventListener('click', function (e) {
    var srcBtn = e.target.closest('.src-filter');
    if (srcBtn) {
      var source = srcBtn.dataset.source;
      // 再点一次同一个信源 = 取消筛选；点别的信源 = 切换过去。
      state.sourceFilter = state.sourceFilter === source ? null : source;
      renderStream();
      renderStats();
      return;
    }

    var summary = e.target.closest('.item-summary');
    if (summary) { summary.classList.toggle('expanded'); return; }

    var btn = e.target.closest('.toggle');
    if (!btn) return;
    var id = btn.closest('.item').dataset.id;
    if (btn.dataset.act === 'read') {
      if (readSet.has(id)) readSet.delete(id); else readSet.add(id);
      saveSet(READ_KEY, readSet);
    } else {
      if (starSet.has(id)) starSet.delete(id); else starSet.add(id);
      saveSet(STAR_KEY, starSet);
    }
    render();
  });

  render();
})();

</script>
