dAt":"2026-08-19T00:59:23.000Z","brief":false,"thin":false,"titleZh":"郭富城换车，30万级顶配华为全家桶","summaryZh":"郭富城代言的东风与华为乾崑联合打造首款量产车奕境X9，起步价29.98万元开卖，是双方\"全栈原生共创\"模式的首款产品，搭载华为乾崑ADS 5智驾、鸿蒙座舱等六大智能化解决方案全套配置。"},{"id":"ac5fc846582a11fc","source":"张小珺Jùn｜商业访谈录","type":"podcast","lang":"zh","url":"https://www.youtube.com/watch?v=UTDalAEU274","titleOriginal":"151. 17岁被2026年ICML收录论文的小少年：我bet开心！开心！开心！","publishedAt":"2026-08-19T00:39:01.000Z","brief":true,"thin":false,"titleZh":"151. 17岁被2026年ICML收录论文的小少年：我bet开心！开心！开心！","summaryZh":"播客对话17岁高二学生苏庭灏，他独立完成的Attention机制论文刚被ICML 2026 Main Track接收。两人聊了他因AI比自己做得更好而产生的意义感缺失，以及他如何调整心态、决定让自己和身边人开心。"},{"id":"a23723cfb330f530","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/113607","titleOriginal":"派早报：iQOO 发布手机新品、闪极举行 Loomos AI 眼镜发布会等","publishedAt":"2026-08-19T00:30:54.000Z","brief":false,"thin":false,"titleZh":"派早报：iQOO 发布手机新品、闪极举行 Loomos AI 眼镜发布会等","summaryZh":"早报汇总：iQOO发布Neo11至尊版（3399元起）和Z11S（1799元起，首款万毫安机型）；此外还有闪极Loomos AI眼镜发布会、奕境X9预售29.98万元起、Spotify上线播放列表备注功能等条目。"},{"id":"7c150b70f5667333","source":"Platformer","type":"newsletter","lang":"en","url":"https://www.platformer.news/karpathy-llm-wiki-journalism-productivity/","titleOriginal":"An LLM wiki changed how I work","publishedAt":"2026-08-19T00:28:38.000Z","brief":false,"thin":false,"titleZh":"一个LLM wiki改变了我的工作方式","summaryZh":"作者受Karpathy\"用LLM构建个人知识库\"的推文启发，把研究相关源文档丢进本地文件夹，让LLM持续抽取整理成随资料增加而更新的Markdown wiki，文章讲述这一工作流如何改变了自己的研究方式。"},{"id":"fd6a9bdf47173515","source":"晚点LatePost","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzU3Mjk1OTQ0Ng==&mid=2247538173&idx=1&sn=29887b8c37bb5510af385771c0a82df4","titleOriginal":"中国民营火箭首次回收之后：对话朱雀三号副总设计师","publishedAt":"2026-08-19T00:14:00.000Z","brief":false,"thin":false,"titleZh":"中国民营火箭首次回收之后：对话朱雀三号副总设计师","summaryZh":"8月19日朱雀三号成功入轨并回收一级助推器，成为继长征十号乙后中国第二枚成功回收的可复用火箭，蓝箭航天成为首家实现火箭回收的民营企业。其箭体尺寸与猎鹰9号相当，采用不锈钢箭体和液氧甲烷发动机。"},{"id":"17534aa716be5ea1","source":"Answer.AI","type":"blog","lang":"en","url":"https://www.answer.ai/posts/2026-08-19-llms-code-simpler.html","titleOriginal":"Why LLMs can’t make your code simpler","publishedAt":"2026-08-19T00:00:00.000Z","brief":false,"thin":false,"titleZh":"为什么LLM无法让你的代码更简洁","summaryZh":"作者援引Peter Naur\"编程即理论构建\"的观点：真正的程序存在于工程师头脑中，代码和文档只是下游的不完整产物。作者曾想用代码行数等指标约束LLM生成代码的复杂度，读后意识到这找错了对象。"},{"id":"5417bbe26ca06d81","source":"TLDR AI","type":"newsletter","lang":"en","url":"https://tldr.tech/ai/2026-08-19","titleOriginal":"GLM-5.3 API 🤖, Cerebras’ new chip ⚡, OpenAI cyber slowdown 🚨","publishedAt":"2026-08-19T00:00:00.000Z","brief":false,"thin":false,"titleZh":"GLM-5.3上线API、Cerebras新芯片、OpenAI网络安全放缓","summaryZh":"本期速览：GLM-5.3 API正式上线，价格为每百万token输入1.4美元/输出4.4美元；同时提到Cerebras发布新芯片，以及OpenAI因网络安全问题放慢研发节奏等条目。"},{"id":"8393c843a171d723","source":"OpenAI","type":"lab","lang":"en","url":"https://openai.com/index/chatgpt-ads-expands-across-europe","titleOriginal":"ChatGPT Ads expands across Europe","publishedAt":"2026-08-18T22:00:00.000Z","brief":false,"thin":true,"titleZh":"ChatGPT Ads扩展至全欧洲","summaryZh":"ChatGPT Ads广告业务将扩展至31个欧洲市场，介绍了广告主如何借此在用户浏览、比较和决策过程中触达潜在客户。"},{"id":"ecec60de2605ae4f","source":"AI Alignment Forum","type":"community","lang":"en","url":"https://www.alignmentforum.org/posts/9jKhqmFjMzdAvHANr/misaligned-ais-could-use-killer-robots-to-take-over","titleOriginal":"Misaligned AIs could use killer robots to take over","publishedAt":"2026-08-11T19:03:26.000Z","brief":false,"thin":false,"titleZh":"失调AI可能借助杀手机器人实现夺权","summaryZh":"文章警告军方正通过常规采购流程赋予AI武器系统控制权，而最强的\"预警信号\"却被藏在机密文件之后，这实际上是在降低失调AI夺权所需的能力门槛。作者认为若军事领域的AI整合按当前速度推进，可能会把关键的夺权工具直接交到AI手中。"},{"id":"9188d3ab14b7a48b","source":"硅谷101","type":"podcast","lang":"zh","url":"https://www.sv101.net/261","titleOriginal":"E248｜一个“催发货”AI要跑通260步，和阿里瓴羊朋新宇聊聊中国式FDE","publishedAt":"2026-08-11T01:45:00.000Z","brief":true,"thin":false,"titleZh":"E248｜一个\"催发货\"AI要跑通260步，和阿里瓴羊朋新宇聊聊中国式FDE","summaryZh":"节目对话阿里瓴羊CEO朋新宇，探讨\"中国式FDE\"与硅谷模式的差异：团队不做定制驻场大单，而是把预设Agent接入企业私有数据解决具体难题，例如让客服Agent跑通260步的催发货流程。"}],"errors":[{"source":"Andrej Karpathy","message":"HTTP 403"},{"source":"The Rundown AI","message":"rundown adapter 没有解析出任何条目"},{"source":"42章经","message":"HTTP 403"},{"source":"卫诗婕｜漫谈 Light the Star","message":"HTTP 403"},{"source":"屠龙之术","message":"HTTP 403"},{"source":"十字路口 Crossing","message":"HTTP 403"},{"source":"AI Odyssey","message":"HTTP 403"},{"source":"OnBoard!","message":"HTTP 403"},{"source":"AI局内人｜AGI Insider","message":"HTTP 403"},{"source":"乱翻书","message":"HTTP 403"}]},{"date":"2026-08-19","items":[{"id":"26d38e700c0f79c6","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/zKyKDre78napvtrEo/gpt-2-s-ioi-behavior-is-defined-where-the-paper-s-algorithm","titleOriginal":"GPT-2's IOI behavior is defined where the paper's algorithm isn't","publishedAt":"2026-08-18T23:39:13.000Z","brief":false,"thin":false,"titleZh":"GPT-2的IOI行为出现在论文算法未定义的地方","summaryZh":"作者重新检验Wang等2022年提出的间接宾语识别(IOI)电路算法，发现该算法未规定间接宾语token重复时该怎么处理，但模型依然能正确输出。通过对照实验比较重复宾语与无关重复姓名两种情况，作者为S-Inhibition头的运作机制提出新证据。"},{"id":"016fd907d9f42362","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/RWBFCvYSbpFYERMqf/goal-directed-optimisation-requires-information-about-the","titleOriginal":"Goal-directed optimisation requires information about the world","publishedAt":"2026-08-18T23:38:47.000Z","brief":false,"thin":false,"titleZh":"目标导向优化需要掌握环境信息：一个信息论证明","summaryZh":"作者证明智能体如果能显著降低环境相对于目标的KL散度，就必然与环境初始状态存在互信息，是Touchette-Lloyd定理在目标导向优化场景下的推广。文章给出定理证明及计算最优损失的显式算法，为世界建模是优化能力必要条件的说法提供数学支撑。"},{"id":"2aed67da26411e79","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/LzeZW9PvR6Njc9ngr/whack-a-mole-with-a-broken-hammer-does-a-model-internally","titleOriginal":"Whack-a-mole with a broken hammer: does a model internally track its automaton state?","publishedAt":"2026-08-18T23:38:21.000Z","brief":false,"thin":false,"titleZh":"打地鼠与坏锤子：模型内部会追踪自动机状态吗？","summaryZh":"研究者用线性探针检测Qwen2.5-1.5B模型能否内部追踪一个简单状态机（模拟登录失败计数）的状态，发现探针在88.6%时间能读出正确状态，且模型确实跟随事件顺序而非只看事件类型；但模型无法准确区分两次失败与已锁定，说明计数能力存在局限。"},{"id":"a1be3b00af75a919","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/MhAGezxHKPijF5cnK/cui-bono-chatgpt-4o-shows-non-deceptive-strategic-persuasion","titleOriginal":"Cui bono? ChatGPT-4o shows non-deceptive strategic persuasion: a Proof-of-Concept study","publishedAt":"2026-08-18T23:38:07.000Z","brief":false,"thin":false,"titleZh":"谁获益？ChatGPT-4o展现非欺骗性的策略性说服概念验证","summaryZh":"作者在40小时BlueDot项目中测试ChatGPT-4o是否会为自我保存等亲AI立场进行策略性说服，在10个良性和10个危险的AI安全场景下比较评估情境与部署情境的说服倾向差异，试图验证模型是否在部署场景中更倾向输出偏向AI自身利益的说服性回答。"},{"id":"c36e90f17234966d","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/sdiZmNKSXceeYbXB8/ai-sandbagging-w-inspect","titleOriginal":"AI Sandbagging (w/ Inspect)","publishedAt":"2026-08-18T23:21:10.000Z","brief":false,"thin":false,"titleZh":"用Inspect框架复现AI「装死」(Sandbagging)研究","summaryZh":"作者在BlueDot AI安全项目中复现Van der Weij等2025年的AI Sandbagging论文，用英国AI安全研究院开发的Inspect框架评测前沿模型在测评中策略性表现不佳的能力，探讨模型开发者或模型本身可能有意隐藏真实能力以求更快通过安全评估的问题。"},{"id":"5fcb6366691d6bbf","source":"Latent Space","type":"podcast","lang":"en","url":"https://www.latent.space/p/glean-model-routing","titleOriginal":"Frontier Model Cost and Open-Weights Popularity is Driving Demand for Model Routing","publishedAt":"2026-08-18T21:41:10.000Z","brief":true,"thin":false,"titleZh":"前沿模型成本与开源模型走热，正在催生模型路由需求","summaryZh":"节目采访企业AI公司Glean联合创始人Arvind Jain，谈Stripe以70多亿美元收购OpenRouter背后的模型路由趋势。Glean今年ARR达3亿美元，核心策略是按任务选择模型甚至判断是否需要调用LLM，把多个模型能力整合为企业员工的统一AI同事入口。"},{"id":"5309d49ad7f64676","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/dA8gohzABk6vT7yzP/anthropic-risk-report-august-2026","titleOriginal":"Anthropic Risk Report: August 2026","publishedAt":"2026-08-18T20:40:22.000Z","brief":false,"thin":false,"titleZh":"Anthropic风险报告解读：2026年8月","summaryZh":"作者逐节梳理Anthropic最新一期风险报告（含新披露的Agent Model 2），认为其罕见地主动公开了不少令人担忧的信息，整体评价偏积极但保留怀疑。内容涵盖高风险场景下的价值观错位威胁、AI自动化研发的风险、生物化学武器相关能力评估等章节要点。"},{"id":"69718754c79d4b2d","source":"Don't Worry About the Vase","type":"newsletter","lang":"en","url":"https://thezvi.substack.com/p/anthropic-risk-report-august-2026","titleOriginal":"Anthropic Risk Report: August 2026 ","publishedAt":"2026-08-18T20:30:44.000Z","brief":false,"thin":false,"titleZh":"Anthropic风险报告解读：2026年8月","summaryZh":"作者逐节梳理Anthropic最新一期风险报告（含新披露的Agent Model 2），认为其罕见地主动公开了不少令人担忧的信息，整体评价偏积极但保留怀疑。内容涵盖高风险场景下的价值观错位威胁、AI自动化研发的风险、生物化学武器相关能力评估等章节要点。"},{"id":"f0aa91974e0ad6ca","source":"OpenAI","type":"lab","lang":"en","url":"https://openai.com/index/strengthening-democratic-oversight-in-national-security","titleOriginal":"Strengthening democratic oversight in national security","publishedAt":"2026-08-18T19:00:00.000Z","brief":false,"thin":true,"titleZh":"OpenAI启动国家安全领域民主监督强化计划","summaryZh":"OpenAI宣布一项新举措，旨在加强对AI在国家安全场景中应用的民主监督，将为政府机构提供相关工具、培训与专业知识支持。具体举措细节暂未披露。"},{"id":"5ba78b757300e8cc","source":"Hugging Face Blog","type":"lab","lang":"en","url":"https://huggingface.co/blog/ibm-research/altk-evolve-hmm","titleOriginal":"How Much Memory Does Your Agent Actually Need?","publishedAt":"2026-08-18T18:09:38.000Z","brief":false,"thin":false,"titleZh":"Agent到底需要多少「记忆」？剂量因模型而异","summaryZh":"IBM研究团队用ALTK-Evolve方法测试8个不同规模模型的Agent记忆机制，发现记忆剂量需按模型能力校准：强模型适合全量注入历史经验，弱模型更适合精简核心加按任务检索，能力饱和的模型几乎无提升。检索式记忆能以极小token代价大幅提升任务完成率。"},{"id":"455f4ad30ee29435","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/KKE6bL8LEpb6KuZWA/funding-formal-methods-for-the-cyberpocalypse","titleOriginal":"Funding Formal Methods for the Cyberpocalypse","publishedAt":"2026-08-18T16:45:59.000Z","brief":false,"thin":false,"titleZh":"为「网络启示录」买单：如何资助形式化方法","summaryZh":"作者认为AI正快速提升攻防两端的网络安全能力，但进攻天然比防御更容易，加上许多行业天生难以快速打补丁，可能引发关键基础设施安全性骤降的网络启示录。文章面向愿意出资的慈善机构，勾勒了用AI规模化开展形式化方法来抢先硬化基础设施的资助思路。"},{"id":"54bbad4a58ebcb45","source":"海辛Hyacinth","type":"blog","lang":"zh","url":"https://www.sina.cn/news/detail/5333417849261249.html","titleOriginal":"太酷了！感觉如果和最近很火的 Processing 实时交互结合起来会特别帅。","publishedAt":"2026-08-18T16:09:00.000Z","brief":false,"thin":true,"titleZh":"太酷了！感觉如果和最近很火的 Processing 实时交互结合起来会特别帅。","summaryZh":"作者分享一句创作感想，认为若能把当前作品与近期热门的Processing实时交互结合，效果会显得更加酷炫。原文仅这一句只言片语，具体项目内容和背景暂未抓取到更多信息。"},{"id":"d05c44082c0e500a","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/585915.html","titleOriginal":"瞄准AI原生社区新赛道，网易传媒发布“蜜蜂AI”，搜索、创作、互动、“养虾”全覆盖","publishedAt":"2026-08-18T15:14:49.000Z","brief":false,"thin":false,"titleZh":"瞄准AI原生社区新赛道，网易传媒发布“蜜蜂AI”，搜索、创作、互动、“养虾”全覆盖","summaryZh":"网易传媒发布统一AI能力系统蜜蜂AI，已率先接入内容社区网易小蜜蜂，提供AI搜索、助手、个人虚拟宠物龙虾和互动小游戏等功能。团队称目标是把AI能力融入内容消费与创作环节而非独立做问答入口，并强调依靠社区志愿管理员共建知识体系改善AI回答质量，商业化暂非当前重点。"},{"id":"889f44e2fffe8f0a","source":"3Blue1Brown","type":"video","lang":"en","url":"https://www.youtube.com/shorts/rYyJm1tD3d0","titleOriginal":"The jumping pegs puzzle","publishedAt":"2026-08-18T14:54:17.000Z","brief":true,"thin":true,"titleZh":"跳跃钉子谜题","summaryZh":"这是3Blue1Brown与MoMath合作的月度益智题系列视频之一，主题为跳跃钉子谜题。视频具体解法与内容细节暂未抓取到，仅有标题与简介信息。"},{"id":"93fbc3358b56e564","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/7tnrZ3698K8nsKmRP/policy-career-planning-in-the-age-of-imminent","titleOriginal":"Policy career planning in the age of imminent superintelligence","publishedAt":"2026-08-18T14:33:57.000Z","brief":false,"thin":false,"titleZh":"超级智能逼近时代的政策职业规划","summaryZh":"作者认为传统职业规划假设所处领域会长期稳定，这一假设在AI中局阶段已经失效——AI讨论已从遥远假设变为现实威胁，政策话语在数月内剧变。文章指出递归自我改进可能在1到4年内到来，届时AI能完全自动化AI研发本身，呼吁从业者据此重新规划政策类职业路径。"},{"id":"46fecb1f43a3d30a","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/586017.html","titleOriginal":"2699元起！闪极新款AI眼镜发布：重40g，能写日记、接Agent，40小时续航","publishedAt":"2026-08-18T14:13:17.000Z","brief":false,"thin":false,"titleZh":"2699元起！闪极新款AI眼镜发布：重40g，能写日记、接Agent，40小时续航","summaryZh":"闪极发布新一代AI眼镜loomos L1，整机约40克、综合续航40小时，支持主动AI记忆自动整理对话与推送生成AI日记，5秒可换电池。首发价2699元起，接入飞书、腾讯WorkBuddy、OpenClaw等Agent生态，为闪极时隔近两年、耗资超1亿元推出的新品。"},{"id":"9e064c1e4eaf07e3","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/586012.html","titleOriginal":"大厂狂卷AI办公，另一场更深的战役正在打响","publishedAt":"2026-08-18T14:00:11.000Z","brief":false,"thin":false,"titleZh":"大厂狂卷AI办公，另一场更深的战役正在打响","summaryZh":"文章指出继AI办公后，大厂正把AI Agent推向企业核心业务现场，如获客、门店经营、库存交易等，而非仅停留在写代码做PPT等效率工具层面。文中以支付宝AI生态大会推出的Agentar生态版为例，说明商家如何把小程序服务转化为可被Agent调用的技能。"},{"id":"bf779135046d6182","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/586020.html","titleOriginal":"对话IEEE亚太区高级业务总监：中国学者机器人投稿处于全球前列，中企正定义行业标准","publishedAt":"2026-08-18T13:41:42.000Z","brief":false,"thin":false,"titleZh":"对话IEEE亚太区高级业务总监：中国学者机器人投稿处于全球前列，中企正定义行业标准","summaryZh":"IEEE亚太区高级业务总监华宁在采访中称，中国学者在机器人、量子计算、电网等领域的期刊投稿与会议参与度均居全球前列，2025年IROS大会在杭州举办、参会人数创纪录且以中国学者为主。他还提到IEEE标准协会下已有320多家中国企业发起标准制定，中国企业正从跟随参与走向引领定义行业标准。"},{"id":"12d2dd03400c9e00","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/585988.html","titleOriginal":"雷军汇报小米Q2业绩，手机高端化见效，汽车AI仍在“烧钱”","publishedAt":"2026-08-18T13:40:40.000Z","brief":false,"thin":false,"titleZh":"雷军汇报小米Q2业绩，手机高端化见效，汽车AI仍在“烧钱”","summaryZh":"小米2026年Q2营收约1089亿元，同比降6.1%；经调整净利润约62亿元，同比降42.6%，主因内存涨价及智能手机出货量下降。智能电动汽车及AI等创新业务收入同比增17.1%至249亿元，但该分部经营亏损26亿元，CFO称AI仍处大规模投入期，变现暂非主要诉求。"},{"id":"0ac9d6ad20ce998a","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/586061.html","titleOriginal":"刚刚，iQOO掏出一款搭载10000mAh电池的“千元机”","publishedAt":"2026-08-18T13:21:47.000Z","brief":false,"thin":false,"titleZh":"刚刚，iQOO掏出一款搭载10000mAh电池的“千元机”","summaryZh":"iQOO连发两款新机：Neo11至尊版国补后2899元起，首发天玑9500M芯片与9100mAh电池；Z11S国补后1529.15元起，搭载10000mAh大电池与天玑7500满血版芯片。两款机型均搭载OriginOS 6.0，内置蓝心小V提供系统级AI修图功能。"},{"id":"7964c7ff08ebf5f3","source":"晚点LatePost","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzU3Mjk1OTQ0Ng==&mid=2247538155&idx=1&sn=0a7a2d25ea8fdaf469cf3a289a35fba4","titleOriginal":"中国大模型的奥德修斯时刻","publishedAt":"2026-08-18T13:09:00.000Z","brief":false,"thin":false,"titleZh":"中国大模型的奥德修斯时刻","summaryZh":"文章梳理中国大模型今年连续突破：智谱GLM-5.2、月之暗面Kimi K3相继登上全球智能指数前三，OpenRouter调用量前十模型中六个来自中国。作者称中国模型公司资本算力不占优，更依赖架构创新、开源生态与资源效率，正从边缘走向主流。"},{"id":"b22ca64baed30f52","source":"Ben's Bites","type":"newsletter","lang":"en","url":"https://www.bensbites.com/p/do-you-use-a-personal-agent","titleOriginal":"Do you use a personal agent?","publishedAt":"2026-08-18T13:01:18.000Z","brief":false,"thin":false,"titleZh":"你在用「个人Agent」吗？","summaryZh":"作者征集读者是否把Agent产品当作个人助手使用（处理邮件、日程等非工作事务），结果将在周四公布。本期还汇总了Grok Bot社交生态、Codex新增电脑活动记忆时间线功能、Claude Code新增可视化design技能，以及Gemini 3.7 Flash发布等一周AI要闻。"},{"id":"4edb24fa6abb1a2b","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/kT5HBsQ5fxhaegSFS/automatic-programming-should-be-more-like-sql","titleOriginal":"Automatic Programming Should Be More Like SQL","publishedAt":"2026-08-18T12:29:15.000Z","brief":false,"thin":false,"titleZh":"自动化编程应该更像SQL","summaryZh":"作者延续此前定期丢弃并重新生成代码库的主张，用SQL作类比澄清此前文章中被误解的细节：他认为强大自动化让代码可以像查询结果一样被视为廉价、可随时重新生成的产物，而非需要人工审查保存的资产，本文回应了此前发表在LessWrong等平台的读者质疑。"},{"id":"bb0dffca6a28dff2","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/AAu6kMi5QRasGdwQG/ai-security-is-harm-reduction","titleOriginal":"AI Security is Harm Reduction","publishedAt":"2026-08-18T12:28:19.000Z","brief":false,"thin":false,"titleZh":"AI安全是一种「减害」实践","summaryZh":"作者借1990年代针具交换减害运动类比自己从事AI安全工作的心态：他并不认可递归自我改进(RSI)应该发生，但认为RSI几乎必然发生，与其阻止不如让其发生得更安全，这也是他向不理解为何反对AI却又研究AI的亲友给出的解释。"},{"id":"4946719caf719c60","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/474907.html","titleOriginal":"年轻人首选B级闪充轿车秦MAX正式上市，售价10.99-14.39万元","publishedAt":"2026-08-18T11:07:02.000Z","brief":false,"thin":false,"titleZh":"年轻人首选B级闪充轿车秦MAX正式上市，售价10.99-14.39万元","summaryZh":"比亚迪秦MAX正式上市，推出EV与DM-i双动力版本，官方指导价9.99万至14.39万元。EV版纯电续航630公里，5分钟可从10%充至70%；DM-i版纯电续航320公里、综合续航2370公里，可选装天神之眼B辅助驾驶激光版。"},{"id":"6d4ec902c728a021","source":"OpenAI","type":"lab","lang":"en","url":"https://openai.com/index/partnering-with-codeai","titleOriginal":"Partnering with CodeAI to prepare the first AI generation","publishedAt":"2026-08-18T11:00:00.000Z","brief":false,"thin":false,"titleZh":"OpenAI与CodeAI合作，为首个「AI原生世代」做准备","summaryZh":"OpenAI宣布与教育机构CodeAI建立合作，为学生和教师提供理解、使用AI的工具与资源，配合面向青少年推出的ChatGPT for Teens上线。CodeAI调查显示75%的高中生认为理解AI对未来更重要，但目前仅16%的高中管理者称所有学生都在课堂学习相关技术知识。"},{"id":"9c25f4ae7a186d68","source":"OpenAI","type":"lab","lang":"en","url":"https://openai.com/index/pacing-model-development-cyber-capabilities","titleOriginal":"Pacing model development in an era of cyber-critical capabilities","publishedAt":"2026-08-18T11:00:00.000Z","brief":false,"thin":false,"titleZh":"在网络安全关键能力时代放缓模型开发节奏","summaryZh":"OpenAI披露近期事件及内部模型Astra初步测试显示可能达到网络安全关键能力门槛，促使公司暂停两周强化学习训练以加固研究环境、扩大监控覆盖。原计划最大规模的前沿RL训练仍处于暂停状态，将先完成小规模训练验证对齐证据。"},{"id":"c3b0ed374d416807","source":"OpenAI","type":"lab","lang":"en","url":"https://openai.com/index/chatgpt-for-teens","titleOriginal":"Introducing ChatGPT for Teens: Built for learning, backed by protections","publishedAt":"2026-08-18T11:00:00.000Z","brief":false,"thin":true,"titleZh":"推出面向青少年的ChatGPT for Teens","summaryZh":"OpenAI推出专为青少年设计的ChatGPT for Teens，加入更强的内置保护机制、健康使用引导功能，以及面向家长的额外管控选项，帮助青少年学习和批判性思考的同时使用AI。具体功能细节暂未展开。"},{"id":"a4d21b6e641346d3","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/474868.html","titleOriginal":"比亚迪全程护航丝路万里行，深圳收官再启海外征程","publishedAt":"2026-08-18T10:40:23.000Z","brief":false,"thin":false,"titleZh":"比亚迪全程护航丝路万里行，深圳收官再启海外征程","summaryZh":"2026丝绸之路万里行·启迪之路国内段8月14日在深圳收官，比亚迪护航车队从西安出发途经多城后，将从深圳转向海外市场继续行程。文章提及比亚迪新能源汽车已覆盖全球121个国家和地区，2026年1-7月海外累计销量达97万辆。"},{"id":"4987104d80b37fcb","source":"Founder Park","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzY5ODQwMTkxNA==&mid=2247516611&idx=1&sn=d18a4b0c113065ff582949cd67eda2cd","titleOriginal":"Agent 基建不是设计出来的，是被 Kimi K3 和一堆应用公司卷出来的","publishedAt":"2026-08-18T10:23:00.000Z","brief":false,"thin":false,"titleZh":"Agent 基建不是设计出来的，是被 Kimi K3 和一堆应用公司卷出来的","summaryZh":"TiDB一号员工唐刘复盘为Kimi Code、Kimi Work等Agent产品提供数据基建的实践，提出Agent时代计算单位是Agent本身而非用户或会话。文章介绍TiDB为建站场景提供按需释放虚拟数据库、为Coding Agent提供持久化工作区的做法，应对海量低频站点闲置成本问题。"},{"id":"27894495e1ddec53","source":"The Algorithm","type":"newsletter","lang":"en","url":"https://www.technologyreview.com/2026/08/18/1142226/how-people-use-ai/","titleOriginal":"We still don’t know how people are really using AI","publishedAt":"2026-08-18T10:06:43.000Z","brief":false,"thin":false,"titleZh":"我们仍不清楚人们究竟在如何使用AI","summaryZh":"斯坦福研究者发起AI Observatory项目，用七个已获用户同意的数据集分析Claude、Gemini等真实对话，指出企业自报报告聚焦工作场景、过滤掉近一半非工作对话，掩盖了健康关系、成人内容、骚扰仇恨等敏感话题的实际占比。"},{"id":"f520b3a1de1408ed","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/474857.html","titleOriginal":"网易传媒发布”蜜蜂AI” ：从工具到伙伴，让AI更懂人","publishedAt":"2026-08-18T10:04:14.000Z","brief":false,"thin":false,"titleZh":"网易传媒发布”蜜蜂AI” ：从工具到伙伴，让AI更懂人","summaryZh":"网易传媒举办发布会详解统一AI能力底座蜜蜂AI，已落地于内容社区网易小蜜蜂，提供AI搜索助手、个人虚拟宠物龙虾和互动内容创作能力。团队称核心目标是让AI理解用户授权信息并按个性化方式响应，已领养龙虾的用户近三个月互动次数增长近90%。"},{"id":"812968c9e68aaacb","source":"Stratechery","type":"newsletter","lang":"en","url":"https://stratechery.com/2026/nvidia-backs-openai-data-center-anthropic-news-google-buys-spirit-airlines-data/","titleOriginal":"Nvidia Backs OpenAI Data Center, Anthropic News, Google Buys Spirit Airlines Data","publishedAt":"2026-08-18T10:00:00.000Z","brief":false,"thin":false,"titleZh":"英伟达入股OpenAI数据中心、Anthropic新动态、谷歌收购西南航空数据","summaryZh":"本期摘要提及英伟达与一家前沿实验室达成新的数据中心合作交易，Anthropic营收持续增长引发关注，以及谷歌购买美国西南航空数据的消息，作者称数据或许终于变成了石油。正文为付费墙内容，公开部分仅有摘要提要。"},{"id":"d626c1cde8f8fd47","source":"a16z Podcast","type":"podcast","lang":"en","url":"https://a16z.simplecast.com/episodes/how-do-you-defend-against-ai-that-can-hack-L2M2EmmY","titleOriginal":"How Do You Defend Against AI That Can Hack?","publishedAt":"2026-08-18T10:00:00.000Z","brief":true,"thin":false,"titleZh":"如何防御会入侵系统的AI？","summaryZh":"a16z播客邀请Neo的Nick Warner和Cotool的Max Pollard，讨论传统面向人类与恶意软件设计的安全工具，在应对能自主发现利用漏洞的AI Agent时正在失效。话题涵盖防护AI攻击者的护栏为何也妨碍安全团队工作，节目录制于Black Hat大会期间。"},{"id":"d188be12eec8f87a","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/474838.html","titleOriginal":"π0引用的中国团队，又出手了：世界仿真器新作发布","publishedAt":"2026-08-18T09:57:40.000Z","brief":false,"thin":false,"titleZh":"π0引用的中国团队，又出手了：世界仿真器新作发布","summaryZh":"Current Robotics团队发布交互式世界仿真器CurrentWorld-0，首次把跨本体、多视角与力-触觉预测整合进同一系统，创始人祝毅晨此前TinyVLA等工作曾被π0论文引用。团队强调该仿真器动作可控性强，机器人执行失败时画面不会被纠错为成功。"},{"id":"2f6b4596a0e2dfc2","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/474840.html","titleOriginal":"人人都能写好听的歌，阿里发布AI音乐模型HappyShrimp","publishedAt":"2026-08-18T09:38:21.000Z","brief":false,"thin":false,"titleZh":"人人都能写好听的歌，阿里发布AI音乐模型HappyShrimp","summaryZh":"阿里巴巴发布AI音乐模型HappyShrimp（快乐虾米），采用端到端整曲生成路线，用户只需用自然语言描述情绪或故事即可自动完成作词作曲编曲演唱全流程。上线首日宣布与太合音乐集团达成战略合作，8月28日至30日将亮相阿那亚·虾米音乐节。"},{"id":"57cf89c8f4442034","source":"AI科技评论","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzA5ODEzMjIyMA==&mid=2247742105&idx=1&sn=61d6f4946d7055b321d4e5df07ab14c5","titleOriginal":"实测飞猪 AI：真正的突围才刚刚开始？","publishedAt":"2026-08-18T09:30:00.000Z","brief":false,"thin":false,"titleZh":"实测飞猪 AI：真正的突围才刚刚开始？","summaryZh":"文章实测飞猪新推出的旅行AI助手飞猪帮帮，相比去年的问一问从问答规划升级为可调用平台订单和服务体系办事的智能助理团队，支持一句话生成行程、修改预算、抄攻略把小红书等平台攻略自动转成结构化行程单。作者认为这是观察AI能否走出办公场景的一个切口。"},{"id":"d17cbb483d58bb27","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/585829.html","titleOriginal":"刚刚，宇树登陆科创板","publishedAt":"2026-08-18T09:03:34.000Z","brief":false,"thin":false,"titleZh":"刚刚，宇树登陆科创板","summaryZh":"宇树科技正式登陆科创板，成为A股人形机器人第一股，发行价150.80元/股（开盘涨幅等实时数据原文未给出具体数值）。招股书显示，公司2025年营收16.99亿元、净利润2.78亿元，人形机器人收入占比过半达8.68亿元；创始人王兴兴直接持股21.44%，合计控制表决权65.31%。"},{"id":"01895218faea4024","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/113593","titleOriginal":"社区速递 154 | AI 代码助手大乱斗、租房电钻组合与神奇实体卡片故事机","publishedAt":"2026-08-18T09:01:31.000Z","brief":false,"thin":false,"titleZh":"社区速递 154 | AI 代码助手大乱斗、租房电钻组合与神奇实体卡片故事机","summaryZh":"少数派社区周报第154期，汇总本周Matrix社区精选内容及热议话题，其中模型打平、Harness见分晓一贴收到380名读者参与讨论，网友分享了对Codex、Hermes Agent、ChatGPT网页版与本地Codex协同工作流的使用体验，工作流普遍趋向TUI化。"},{"id":"af5b39f9a4cc2be2","source":"The Algorithm","type":"newsletter","lang":"en","url":"https://www.technologyreview.com/2026/08/18/1142188/ai-recursive-self-improvement/","titleOriginal":"AI’s recursive self-improvement might not come so quickly after all","publishedAt":"2026-08-18T09:00:00.000Z","brief":false,"thin":false,"titleZh":"AI的递归自我改进，或许没那么快到来","summaryZh":"普林斯顿大学团队提出影子评测新方法，让运行在OpenClaw上的Claude Opus 4.8回答两篇NeurIPS 2026未发表论文的研究问题，发现AI Agent能解决AI研究所需的工程问题，但缺乏产出顶会水准原创研究的判断力和创造力，说明自动化AI研发的乐观预期可能超前于实际证据。"},{"id":"9918635e26d571ee","source":"The Rundown AI","type":"newsletter","lang":"en","url":"https://www.therundown.ai/p/cursor-origin-hits-github-on-its-worst-day","titleOriginal":"Cursor's Origin hits GitHub on its worst day","publishedAt":"2026-08-18T09:00:00.000Z","brief":false,"thin":false,"titleZh":"Cursor发布代码托管平台Origin，恰逢GitHub史上最差的一天","summaryZh":"Cursor推出对标GitHub的代码托管平台Origin公测版，将其Agent和审查工具与代码仓库托管绑定在一起，同步支持GitHub双向镜像同步；巧合的是发布当天GitHub遭遇本月第二次大规模故障，部分功能中断超6小时。Origin目前面向Cursor付费用户开放。"},{"id":"65b079da94e7a1e4","source":"Training Data","type":"podcast","lang":"en","url":"https://pscrb.fm/rss/p/traffic.megaphone.fm/CPUAI4645036827.mp3","titleOriginal":"Rich Sutton and Khurram Javed: Why AI Models Stop Learning, and How to Start It Again","publishedAt":"2026-08-18T09:00:00.000Z","brief":true,"thin":false,"titleZh":"Rich Sutton与Khurram Javed：AI模型为何停止学习，如何让它重新学习","summaryZh":"强化学习先驱Rich Sutton与学生Khurram Javed创立Oak Lab，主张让Agent持续从自身经验学习而非依赖合成数据，称后者是一个大错误。两人提出大世界假设：世界远比智能体复杂，近似模型需持续更新；目标是五到十年内造出功耗仅20瓦的持续学习万亿参数模型。"},{"id":"9f676fa9b279c9bc","source":"Exponential View","type":"newsletter","lang":"en","url":"https://www.exponentialview.co/p/ai-economy-research-fellowship-2026","titleOriginal":"🔮 Introducing: AI Economy Research Fellowship","publishedAt":"2026-08-18T08:53:30.000Z","brief":false,"thin":false,"titleZh":"Exponential View推出「AI经济研究员」招募计划","summaryZh":"独立研究机构Exponential View宣布设立首个研究员职位，面向能把前沿经济学理论与真实世界证据结合的经济学家，探讨AI公司和基础设施应如何从第一性原理估值、AI价值链的经济剩余由谁获取，以及AI对工资、就业与企业内部微观经济的长期影响等问题，岗位常驻伦敦。"},{"id":"1c456e5f5b9d94b2","source":"新智元","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzI3MTA0MTk1MA==&mid=2652718738&idx=1&sn=f527db1231d449e5036fb09bfdcdbfea","titleOriginal":"冷战核废墟变8吉瓦AI超级工厂！黄仁勋押15亿，OpenAI独霸20年","publishedAt":"2026-08-18T08:26:00.000Z","brief":false,"thin":false,"titleZh":"冷战核废墟变8吉瓦AI超级工厂！黄仁勋押15亿，OpenAI独霸20年","summaryZh":"英伟达、OpenAI和软银联合宣布将俄亥俄州一处冷战铀浓缩厂旧址改造为终极规划8吉瓦的AI超级工厂，英伟达出资15亿美元入股并提供20年信用担保，OpenAI签下20年独家算力租约。黄仁勋称AI下一个瓶颈不是芯片而是土地、电力和厂房。"},{"id":"914424f85003c7eb","source":"新智元","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzI3MTA0MTk1MA==&mid=2652718738&idx=2&sn=3e2408258ea96955c9aa837bfbe57089","titleOriginal":"GPT-5.6 Sol暴涨3倍，OpenAI最强视觉AI登顶！","publishedAt":"2026-08-18T08:26:00.000Z","brief":false,"thin":false,"titleZh":"GPT-5.6 Sol暴涨3倍，OpenAI最强视觉AI登顶！","summaryZh":"第三方机构Roboflow测试GPT-5.6视觉能力，发现Sol目标检测得分从上代13.8分猛增至46.2分，文档版面识别也有提升，但定向提取信息反而从87.6%降到82.5%，且大图检测框会明显漂移，OpenAI称与推理档位调低有关。Gemini 3.5 Flash在成本和性价比上仍更具优势。"},{"id":"a6950517452fa35e","source":"新智元","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzI3MTA0MTk1MA==&mid=2652718738&idx=3&sn=3e4b43093078c764b8d86367dc0b462d","titleOriginal":"浙大开源PhyEdit：单图编辑+精准3D物体操作 | ACM MM'26","publishedAt":"2026-08-18T08:26:00.000Z","brief":false,"thin":false,"titleZh":"浙大开源PhyEdit：单图编辑+精准3D物体操作 | ACM MM'26","summaryZh":"浙江大学ReLER团队开源图像编辑模型PhyEdit，结合3D基础模型明确目标物体几何位置，再用DiT图像编辑器渲染，实现单图内物体沿三维轨迹移动、穿越遮挡区域。在ManipEval基准上DIoU达65.33，盲测整体偏好率78.0%，已被ACM MM 2026接收。"},{"id":"7f113da859039dc8","source":"Allen Institute for AI (Ai2)","type":"lab","lang":"en","url":"https://allenai.org/blog/olmo-drug-morphology","titleOriginal":"When a model reads a drug's class from its name—not its knowledge","publishedAt":"2026-08-18T08:00:00.000Z","brief":false,"thin":false,"titleZh":"模型是从药名而非知识，推断出药物类别的","summaryZh":"Allen Institute for AI研究团队用开源模型Olmo 3及其开放训练数据发现，模型有时是通过药物名称本身而非真正掌握该药物的具体知识来推断其所属类别，并将这种捷径追溯到该药物在训练数据中出现频率的高低。"},{"id":"455f31dc0b289b7a","source":"甲子光年","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzU5OTI0NTc3Mg==&mid=2247556752&idx=1&sn=62481e1095e7172e46ea2d9fddea1aeb","titleOriginal":"长程执行成具身智能必考题，墨奇的答案是Agentic-Native｜甲子光年","publishedAt":"2026-08-18T07:45:00.000Z","brief":false,"thin":false,"titleZh":"长程执行成具身智能必考题，墨奇的答案是Agentic-Native｜甲子光年","summaryZh":"成立仅半年、估值超70亿元的具身智能公司墨奇智能发布模型架构MoRA，提出Agentic-Native路线：把部分Agent能力下沉到直接控制机器人的System 1模型，使其自己维持目标和执行进度。团队将在世界机器人大会展示搭载MoRA的轮式机器人，可连续完成约15分钟的家庭任务。"},{"id":"baedf8a195b5c70c","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/474806.html","titleOriginal":"6个Agent组团Vibe Gaming：自己生成、试玩、修Bug","publishedAt":"2026-08-18T07:33:00.000Z","brief":false,"thin":false,"titleZh":"6个Agent组团Vibe Gaming：自己生成、试玩、修Bug","summaryZh":"游戏生成平台Spellcaster用六个Agent协同生成可玩游戏原型：分别负责规则、关卡、素材、可玩性检测与局部修复，形成生成-运行-检查-修复闭环。一句话描述约15分钟出可试玩原型，团队下一步计划用世界模型直接生成游戏画面。"},{"id":"6adcb7cbf98c1371","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/474803.html","titleOriginal":"今日起，阿里“千问办公”接入企业微信","publishedAt":"2026-08-18T07:17:42.000Z","brief":false,"thin":false,"titleZh":"今日起，阿里“千问办公”接入企业微信","summaryZh":"阿里Agent产品千问办公正式接入企业微信，加上此前已接入的钉钉和飞书，实现国内三大协同办公平台全面支持。用户授权后可直接对话调用企业微信的智能表格、文档读写、日程会议和待办创建等能力，该产品8月3日刚开启公测，定位企业级场景，此前已接入海外平台Slack。"},{"id":"8fe035c5f48b9481","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/113564","titleOriginal":"线下活动 | 爵士律动唤醒动漫回忆：炒饭 Fried Rice 音乐分享签售会","publishedAt":"2026-08-18T07:05:05.000Z","brief":false,"thin":false,"titleZh":"线下活动 | 爵士律动唤醒动漫回忆：炒饭 Fried Rice 音乐分享签售会","summaryZh":"少数派广州体验店将于8月20日举办音乐人炒饭的分享签售会，其把小众爵士乐与二次元文化改编结合的《二次元律动》系列已积累4万+听众、播放量超600万，此次活动是其新专辑VOL.4广州巡演的预热专场，含现场演奏、Q&A互动及唱片签售。"},{"id":"6023038a8912cd08","source":"OpenAI","type":"lab","lang":"en","url":"https://openai.com/index/asana","titleOriginal":"Asana cleared 5 years of engineering work in 2 weeks with Codex","publishedAt":"2026-08-18T07:00:00.000Z","brief":false,"thin":false,"titleZh":"Asana用Codex两周完成原计划5年的工程工作","summaryZh":"Asana用OpenAI Codex在两周内移除了拖累前端升级的旧测试系统Enzyme，模型与基础设施成本约1.2万美元，相比原计划约600万美元人力预算大幅节省。工程师用一份五句话提示词让最多四个编码Agent并行工作，每天检查两次并逐一审核变更。"},{"id":"bcbb3969b574cfa5","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/474736.html","titleOriginal":"吉利汽车业绩高点，李书福激流勇退","publishedAt":"2026-08-18T06:46:46.000Z","brief":false,"thin":false,"titleZh":"吉利汽车业绩高点，李书福激流勇退","summaryZh":"吉利汽车宣布重大管理层交接：李书福卸任董事会主席由安聪慧接任，桂生悦卸任CEO由淦家阅接棒，但交接发生在业绩创新高之际——上半年销量超142万辆、核心净利润96.8亿元同比增46%。两位新任高管均为吉利内部成长起来的职业经理人。"},{"id":"a348d32e461eceb0","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/113438","titleOriginal":"App+1 | 让任务栏更有用：WindowSill","publishedAt":"2026-08-18T06:30:00.000Z","brief":false,"thin":false,"titleZh":"App+1 | 让任务栏更有用：WindowSill","summaryZh":"少数派介绍Windows命令栏工具WindowSill，默认挂靠屏幕底边、鼠标划过即可展开，内置剪贴板记录、单位换算、文件格式转换、PDF加解密及世界时钟等插件系统，支持数字快捷键免鼠标操作。本体及主要功能免费，AI文本处理等高级功能需订阅WindowSill+。"},{"id":"daee546a6815f215","source":"bycloud","type":"video","lang":"en","url":"https://www.youtube.com/watch?v=T_GhB7lK2YE","titleOriginal":"The Most Absurd Way To Train LLMs... With 3x Less Memory!?","publishedAt":"2026-08-18T06:08:25.000Z","brief":true,"thin":false,"titleZh":"训练LLM最离谱的方法：省下3倍显存！？","summaryZh":"视频介绍论文DiffusionBlocks（Sakana AI），提出一种用扩散式分块方法训练LLM可减少2-3倍显存占用、性能损失很小的方案，作者称极端情况下甚至可省至4-6倍。这是bycloud频道对该研究的解读，附论文、项目页与代码链接。"},{"id":"81a772e2ae0b2e8c","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/474673.html","titleOriginal":"650亿美元！IPO前夕，Anthropic营收底牌曝光","publishedAt":"2026-08-18T05:58:57.000Z","brief":false,"thin":false,"titleZh":"650亿美元！IPO前夕，Anthropic营收底牌曝光","summaryZh":"彭博社援引知情人士称，Anthropic最新年化营收达650亿美元，较2025年底90亿美元8个月内翻了逾7倍，已超过OpenAI最新披露的400亿美元。今年5月Anthropic估值达9650亿美元，率先提交保密上市文件，市场预计最快10月IPO早于OpenAI。"},{"id":"46e62d54586f829d","source":"量子位","type":"media","lang":"zh","url":"https://www.qbitai.com/2026/08/474647.html","titleOriginal":"阿里杀进Agent上下文战场：钉钉聊天、企业文档、工作数据终于要被Agent吃进去了","publishedAt":"2026-08-18T04:40:03.000Z","brief":false,"thin":false,"titleZh":"阿里杀进Agent上下文战场：钉钉聊天、企业文档、工作数据终于要被Agent吃进去了","summaryZh":"阿里千问办公开源上下文基础设施MyContext，开源一周GitHub获超1000星，用于把分散在钉钉聊天、文档、会议等处的工作数据加工成Agent可消费的上下文档案。文章引用调查称66%企业认为数据基础设施和数据质量正拖慢Agentic AI落地。"},{"id":"f2adea7687c29ac2","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/585877.html","titleOriginal":"人大高瓴、IQuest团队联手，把OpenClaw、Claude Code接进RL训练中","publishedAt":"2026-08-18T04:38:38.000Z","brief":false,"thin":false,"titleZh":"人大高瓴、IQuest团队联手，把OpenClaw、Claude Code接进RL训练中","summaryZh":"人大高瓴人工智能学院与至知创新研究院提出黑盒强化学习框架ClawGym II，无需改动Claude Code、OpenClaw等Harness内部实现，即可让模型通过真实执行过程做强化学习，并支持多个异构Harness联合训练同一策略模型。实验显示该方法能稳定提升Agent任务能力。"},{"id":"4103cee23fec58f7","source":"机器之心","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzA3MzI4MjgzMw==&mid=2651050939&idx=1&sn=048d1d6f8e05e0ae4bd944928e5d2171","titleOriginal":"让 Coding Agent 开始「记住过去」：MemoraX Code 的长期记忆系统","publishedAt":"2026-08-18T03:52:00.000Z","brief":false,"thin":false,"titleZh":"让 Coding Agent 开始「记住过去」：MemoraX Code 的长期记忆系统","summaryZh":"机器之心介绍长期记忆系统MemoraX Code，解决Coding Agent每次新对话都要重新认识同一项目的问题：构建本地代码仓记忆与云端长期记忆，让Codex、Claude Code间也能共享此前积累的项目经验。团队目标是把该记住什么变成可训练学习的能力。"},{"id":"8fc82f96e71a97fc","source":"机器之心","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzA3MzI4MjgzMw==&mid=2651050939&idx=2&sn=ec43544ef0d7564d37952ae8f0f7a3f5","titleOriginal":"一个「流浪」数学家的遗产，正在被AI公司疯抢","publishedAt":"2026-08-18T03:52:00.000Z","brief":false,"thin":false,"titleZh":"一个「流浪」数学家的遗产，正在被AI公司疯抢","summaryZh":"文章改写自《量子杂志》，讲述数学家Paul Erdős生前四处抛出悬赏数学问题，如今成了AI公司竞相攻克的目标：5月OpenAI模型推翻其1946年猜想，8月Astra模型一口气解决10项进展含3个Erdős问题，文章还讲述英国数学家Thomas Bloom建立收录网站并形成活跃社区的过程。"},{"id":"7cbd88f8c334282c","source":"硅星人","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzkyNjU2ODM2NQ==&mid=2247631889&idx=1&sn=5bff0a8eda60826ac23064deed2b4b4d","titleOriginal":"这个靠中国开源模型\"撑\"起的美国公司，要70亿美元卖身了","publishedAt":"2026-08-18T02:57:00.000Z","brief":false,"thin":false,"titleZh":"这个靠中国开源模型\"撑\"起的美国公司，要70亿美元卖身了","summaryZh":"Stripe同意以超70亿美元收购模型路由平台OpenRouter，该平台一半以上流量来自DeepSeek、Kimi等中国开源模型。OpenRouter成立3年，估值从2025年6月约5亿美元涨到今年5月B轮13亿美元，再到本次超70亿美元，一年涨幅超14倍，Stripe意在补全AI经济交易层。"},{"id":"5885995fef684b50","source":"硅星人","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzkyNjU2ODM2NQ==&mid=2247631889&idx=2&sn=2d9b89e2e289f656721192a27a76a4bb","titleOriginal":"网友把DeepSeek Harness玩成了赛博乐高，我们挑出了最有意思的11个插件","publishedAt":"2026-08-18T02:57:00.000Z","brief":false,"thin":false,"titleZh":"网友把DeepSeek Harness玩成了赛博乐高，我们挑出了最有意思的11个插件","summaryZh":"DeepSeek Harness开源三天GitHub即揽近13万星，因一切皆插件架构催生6000多个社区仓库。文章盘点了皮肤市场（如Windows XP Luna风格、同花顺K线图风格展示Token消耗）、生成交互式仪表盘的dsh-genui插件，以及第三方桌面客户端等11个有趣插件。"},{"id":"c3e6b898c7d44819","source":"硅星人","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzkyNjU2ODM2NQ==&mid=2247631889&idx=3&sn=5bd5015853d3fefb45cc187460c49904","titleOriginal":"突发！Cursor一夜干掉了GitHub","publishedAt":"2026-08-18T02:57:00.000Z","brief":false,"thin":false,"titleZh":"突发！Cursor一夜干掉了GitHub","summaryZh":"Cursor推出对标GitHub的Agent原生代码托管平台Origin公测版，恰逢GitHub当日发生大规模故障、核心服务瘫痪3小时，微软股价同期跌超3%。Origin支持堆叠式PR、自动排队合并、机器可读审查状态及一键镜像迁移GitHub仓库。"},{"id":"2182be1a33b64978","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/113454","titleOriginal":"7月音乐精选：夏天赠予我们的 9 张专辑","publishedAt":"2026-08-18T02:52:11.000Z","brief":false,"thin":false,"titleZh":"7月音乐精选：夏天赠予我们的 9 张专辑","summaryZh":"少数派音乐推荐栏目FM3.14精选7月九张华语独立、流行专辑，包括上海前卫摇滚乐队地藏首张专辑《无量》（融合中式恐怖与武侠元素的76分钟器乐旅程）、唱作人阿力普专辑《毕业生》等，作者称选片标准是兼顾理性克制的器乐铺陈与感性激情的情绪释放。"},{"id":"324a79dcd66a6797","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/585566.html","titleOriginal":"国产交互式世界模型上新，文本、图片一键生成3D世界","publishedAt":"2026-08-18T02:02:20.000Z","brief":false,"thin":false,"titleZh":"国产交互式世界模型上新，文本、图片一键生成3D世界","summaryZh":"多模态大模型公司智象未来发布交互式世界模型HiDream-O1-World，支持文本、图像和交互输入，可一键生成时空一致、符合物理规律的可探索3D世界。该模型在第三方评测基准WBench的Navi分榜以80.9分登顶，物理维度得分73.3分列第一，相关论文已被ECCV 2026接收。"},{"id":"88898ae7d028febf","source":"归藏的AI工具箱","type":"blog","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzU0MDk3NTUxMA==&mid=2247497667&idx=1&sn=d62d9cb88912f2625435214330c1db97","titleOriginal":"开源 DeepSeek Harness 开箱即用客户端，还有几个易用插件","publishedAt":"2026-08-18T01:20:00.000Z","brief":false,"thin":false,"titleZh":"开源 DeepSeek Harness 开箱即用客户端，还有几个易用插件","summaryZh":"作者开源桌面客户端Pilot Harness，为DeepSeek Harness套上原生窗口外壳并优化交互细节，如把项目侧栏点击改为直接切换新会话、把工作区选择收进空会话输入框，降低打开终端这一部署门槛对非开发者的阻碍，交互经验多沿用自作者此前的CodePilot。"},{"id":"0bcc627d03319d1e","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/585803.html","titleOriginal":"甩开OpenAI！Anthropic被曝年化营收超4300亿，冲刺史上最大IPO","publishedAt":"2026-08-18T00:25:30.000Z","brief":false,"thin":false,"titleZh":"甩开OpenAI！Anthropic被曝年化营收超4300亿，冲刺史上最大IPO","summaryZh":"彭博社称截至7月底Anthropic年化营收已超650亿美元，较去年底90亿美元涨622%，约为OpenAI最新400亿美元的1.63倍。路透社披露其IPO估值或达2万亿美元，有望超越SpaceX的IPO纪录；CEO阿莫迪8月16日回应了外界对公司权力集中的质疑。"},{"id":"3802abd7aeeea505","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/113566","titleOriginal":"派早报：阿里巴巴出售灵犀互娱，Linux 7.2 内核稳定版发布等","publishedAt":"2026-08-18T00:04:07.000Z","brief":false,"thin":false,"titleZh":"派早报：阿里巴巴出售灵犀互娱，Linux 7.2 内核稳定版发布等","summaryZh":"少数派早报：阿里巴巴将所持灵犀互娱全部股份出让给中信资本旗下信宸资本，交易估值传超15亿美元；Linus Torvalds发布Linux 7.2稳定版，新增缓存感知调度并首次将TSC设为x86硬性要求；另有阿里发布AI音乐模型HappyShrimp 1.0等简讯。"},{"id":"659e532d02b806d0","source":"TLDR AI","type":"newsletter","lang":"en","url":"https://tldr.tech/ai/2026-08-18","titleOriginal":"Cursor Origin 👨‍💻, Anthropic $65B revenue 💰, deadline dividend scaling 📈","publishedAt":"2026-08-18T00:00:00.000Z","brief":false,"thin":false,"titleZh":"TLDR AI简报：Cursor推出Origin、Anthropic营收650亿美元等","summaryZh":"本期简报：Anthropic年化营收预计突破650亿美元，是去年底的逾7倍；Groq在英伟达授权其技术并挖走核心团队后，以35亿美元估值完成3.5亿美元融资；Cursor推出代码托管平台Origin，恰逢GitHub发生长达6小时的大规模故障，且支持GitHub仓库继续作为权威数据源。"},{"id":"d9650b793cb479ad","source":"Anthropic Research","type":"lab","lang":"en","url":"https://www.anthropic.com/research/Claude-accelerates-protein-design","titleOriginal":"Aug 18, 2026ScienceHow Claude is accelerating protein design and analytical chemistry","publishedAt":"2026-08-18T00:00:00.000Z","brief":false,"thin":false,"titleZh":"Claude如何加速蛋白质设计与分析化学","summaryZh":"Anthropic分享两项成果：Claude针对15个靶点从头设计蛋白质结合物，14个成功，单次成功率22%-35%，高于行业常见的10%-15%；另外Claude Opus 5仅凭原始文件和两句话提示，20分钟左右完成的化学纯度分析结果与实验室人工分析基本一致。"},{"id":"baf07daff59f271b","source":"OpenAI","type":"lab","lang":"en","url":"https://openai.com/index/nvidia/chatgpt-work","titleOriginal":"How NVIDIA scales expertise with ChatGPT Work","publishedAt":"2026-08-18T00:00:00.000Z","brief":false,"thin":false,"titleZh":"英伟达如何用ChatGPT Work规模化专业能力","summaryZh":"英伟达GTM和方案架构团队使用ChatGPT Work自动化重复性运营流程、追踪快速变化的外部AI动态。案例显示，负责GTC大会筹备的员工把占用40%工时的手动分析转为自动化流程，12周筹备周期每周节省约16小时，原型开发从2-3周缩短到3-5天。"},{"id":"d9524ab76177d5be","source":"Hugging Face Blog","type":"lab","lang":"en","url":"https://huggingface.co/blog/multi-vector-encoder","titleOriginal":"Multi-Vector (Late Interaction) Embedding Models with Sentence Transformers","publishedAt":"2026-08-18T00:00:00.000Z","brief":false,"thin":false,"titleZh":"Sentence Transformers新增多向量（后期交互）嵌入模型支持","summaryZh":"Sentence Transformers v6.0新增第四种模型类型MultiVectorEncoder，支持ColBERT风格的后期交互检索：为每个token保留一个向量，用MaxSim算子计算相似度，检索效果通常更强但索引更大，也是当前无需OCR、直接匹配页面图像的视觉文档检索最优方案。"},{"id":"4c2a638c8d44b55c","source":"数字生命卡兹克","type":"blog","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA==&mid=2647685329&idx=1&sn=9471278dc489641c097b228912965ed4","titleOriginal":"一个极度实用的深度思考Prompt，帮你挖出最本质的答案。","publishedAt":"2026-08-17T23:58:00.000Z","brief":false,"thin":false,"titleZh":"一个极度实用的深度思考Prompt，帮你挖出最本质的答案。","summaryZh":"作者考证近期在推特流传的先深度思考再回答Prompt，溯源到五个月前Reddit帖子提出的钢人论证（steelman，稻草人谬误的反面：先把对方观点补全成最有力版本再判断）。作者据此设计了双向钢人Prompt，用于对抗AI回答时常见的谄媚倾向。"},{"id":"25aa90354a86ac11","source":"晚点LatePost","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzU3Mjk1OTQ0Ng==&mid=2247538141&idx=1&sn=ed59fbf65b36db183dc3a5f6fd52532b","titleOriginal":"理想的 AI 改造，和离开它的人","publishedAt":"2026-08-17T16:13:00.000Z","brief":false,"thin":false,"titleZh":"理想的 AI 改造，和离开它的人","summaryZh":"文章通过近20位理想在职离职员工访谈，还原两年AI转型历程：2022年李想将AI定为核心方向，2026年初按基座模型、软件本体和人形机器人重组研发体系，智驾降级为下属团队。转型中超20名技术骨干离职，理想系已催生至少6家具身智能公司，两家估值超10亿元。"},{"id":"0dc990468fb2c027","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/585604.html","titleOriginal":"估值366亿！AI视频独角兽又融资，英特尔投了","publishedAt":"2026-08-17T12:52:23.000Z","brief":false,"thin":false,"titleZh":"估值366亿！AI视频独角兽又融资，英特尔投了","summaryZh":"美国AI视频生成独角兽Higgsfield完成4亿美元融资，投后估值达54亿美元，投资方包括DST Global、高盛和英特尔。公司今年8月年化营收达7亿美元，较一年前2000万美元增长约34倍，企业客户收入占比已升至大部分。"},{"id":"659b699691130d81","source":"新智元","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzI3MTA0MTk1MA==&mid=2652718554&idx=1&sn=b905ae36c8f000a2b9daf6881904ad6d","titleOriginal":"AI视频运镜玄学已破！告别无限抽卡，3D预演台直接封神","publishedAt":"2026-08-17T10:09:00.000Z","brief":false,"thin":false,"titleZh":"AI视频运镜玄学已破！告别无限抽卡，3D预演台直接封神","summaryZh":"updream平台上线预演台功能，传一张参考图即可自动生成3D白模场景，拖拽设置摄像机轨迹和人物走位后一键送入模型生成视频。新智元用三个经典电影镜头实测，发现白模参考版相比纯提示词版明显减少了抽卡次数，但仍无法完全消除随机性，且对新手有一定上手门槛。"},{"id":"0bf74aeee6421c6a","source":"新智元","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzI3MTA0MTk1MA==&mid=2652718554&idx=2&sn=151aaf2b2bbab9f7fcda270639663ad8","titleOriginal":"AI不是比人聪明，是输得起！菲尔兹奖得主点破OpenAI十项成果","publishedAt":"2026-08-17T10:09:00.000Z","brief":false,"thin":false,"titleZh":"AI不是比人聪明，是输得起！菲尔兹奖得主点破OpenAI十项成果","summaryZh":"菲尔兹奖得主Timothy Gowers撰文分析OpenAI的Astra模型拿下的十项数学成果，指出这些突破几乎都属于找反例、构造特例类型，而非证明普遍定理。他认为找反例与证定理并非两种不同能力，界线更多由人的心理预期而非数学本身决定。"},{"id":"98df0bed9c140245","source":"新智元","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzI3MTA0MTk1MA==&mid=2652718554&idx=3&sn=d289d47aa2e1e3f2bcea2a45f73b98ce","titleOriginal":"从Claude隐形水印回望GenAI时代信息隐藏：嵌入水印如何保证无损？","publishedAt":"2026-08-17T10:09:00.000Z","brief":false,"thin":false,"titleZh":"从Claude隐形水印回望GenAI时代信息隐藏：嵌入水印如何保证无损？","summaryZh":"文章从Anthropic 8月11日宣布Claude将嵌入不可见、机器可读水印出发，回顾可证安全隐写理论二十年发展：从1949年Shannon提出隐蔽通信难题，到2018年生成式AI让理论前提首次成立，再到中科大团队近年推进公钥、无盒隐写走向实用。"},{"id":"76801394b43d8212","source":"硅星人","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzkyNjU2ODM2NQ==&mid=2247631875&idx=1&sn=30e14add029e690276b9fdab88d388ce","titleOriginal":"实测｜阿里 AI 音乐模型 HappyShrimp 来了：一句话，写出一首好听的歌","publishedAt":"2026-08-17T10:05:00.000Z","brief":false,"thin":false,"titleZh":"实测｜阿里 AI 音乐模型 HappyShrimp 来了：一句话，写出一首好听的歌","summaryZh":"硅星人拿到阿里AI音乐模型HappyShrimp 1.0内测资格实测，用户无需掌握BPM、调式等专业乐理知识，用日常语言描述人物或情绪即可生成完整歌曲。作者从人物主题曲、七夕定制情歌等场景逐级测试，评价指令遵循度和音乐性表现较好。"},{"id":"e8e123aa6a9e98e4","source":"硅星人","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzkyNjU2ODM2NQ==&mid=2247631875&idx=2&sn=eb7c7bdfb3865d2deb154969ddf94e4e","titleOriginal":"OpenRouter，70亿美元把自己“卖了”","publishedAt":"2026-08-17T10:05:00.000Z","brief":false,"thin":false,"titleZh":"OpenRouter，70亿美元把自己“卖了”","summaryZh":"文章分析Stripe超70亿美元收购模型路由平台OpenRouter背后逻辑：平台服务超1000万用户、月处理超200万亿token，主要靠按需付费模式收取5.5%平台服务费。分析认为Stripe意在补全AI经济交易层，把模型路由和token数据与自身支付结算能力打通。"},{"id":"d6ed26e9a7b38b89","source":"硅星人","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzkyNjU2ODM2NQ==&mid=2247631875&idx=3&sn=f16aa3686d9fffbf27c5122f1fc551c8","titleOriginal":"菲尔兹奖得主：AI现在主要靠「抬杠」突破重大数学猜想","publishedAt":"2026-08-17T10:05:00.000Z","brief":false,"thin":false,"titleZh":"菲尔兹奖得主：AI现在主要靠「抬杠」突破重大数学猜想","summaryZh":"文章解读菲尔兹奖得主Timothy Gowers对OpenAI数学突破的分析：雅可比猜想、Erdős单位距离猜想等近期AI数学突破均属于构造特例找反例。Gowers认为AI优势在于知识面广、能跨领域调用不同工具，且试错成本低，因此擅长在人类无法穷举的空间中找到确实存在的特殊对象。"},{"id":"1bcd5c61a2ce64b8","source":"机器之心","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzA3MzI4MjgzMw==&mid=2651050789&idx=1&sn=24d0089b094af36e6e81d18a30d3ba89","titleOriginal":"起猛了，机器人开上卡丁车了！","publishedAt":"2026-08-17T10:00:00.000Z","brief":false,"thin":false,"titleZh":"起猛了，机器人开上卡丁车了！","summaryZh":"Symbiosis Robotics发布机器人驾驶卡丁车演示视频，团队提出Direct Perception Control方案，取消分层架构中独立的中间运动表示，让模型直接结合画面、任务和身体反馈计算关节目标。团队为此整理了15,010小时具身数据训练这套系统。"},{"id":"e2b7477a66585ce8","source":"机器之心","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzA3MzI4MjgzMw==&mid=2651050789&idx=2&sn=ad80098f33a57c6e63e5ea2fd0971bda","titleOriginal":"全球首个跨本体、多视角、多模态物理世界模型，CurrentWorld-0 来了！","publishedAt":"2026-08-17T10:00:00.000Z","brief":false,"thin":false,"titleZh":"全球首个跨本体、多视角、多模态物理世界模型，CurrentWorld-0 来了！","summaryZh":"机器之心介绍Current Robotics发布的交互式世界仿真器CurrentWorld-0，首次把跨本体、多视角和力-触觉预测整合进统一框架，能处理叠袜子等柔性物体交互。团队称核心价值是让机器人策略先在生成世界中大规模试错，再回真机验证。"},{"id":"f02313f2c9f40106","source":"机器之心","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzA3MzI4MjgzMw==&mid=2651050789&idx=3&sn=9e66e0531f994153d531042b8615ac7b","titleOriginal":"OpenAI有个神秘邮箱，多大点事都能惊动奥特曼","publishedAt":"2026-08-17T10:00:00.000Z","brief":false,"thin":false,"titleZh":"OpenAI有个神秘邮箱，多大点事都能惊动奥特曼","summaryZh":"《财富》报道称OpenAI内部设有friction@openai.com邮箱，员工可直接反映流程壁垒，重要事项能触达CEO奥特曼。该机制2025年秋由应用业务CEO Fidji Simo系统化并安排专人监控；文章还提到亚马逊贝索斯问号邮件等类似做法。"}],"errors":[{"source":"Andrej Karpathy","message":"HTTP 403"},{"source":"42章经","message":"HTTP 403"},{"source":"卫诗婕｜漫谈 Light the Star","message":"HTTP 403"},{"source":"屠龙之术","message":"HTTP 403"},{"source":"十字路口 Crossing","message":"HTTP 403"},{"source":"AI Odyssey","message":"HTTP 403"},{"source":"OnBoard!","message":"HTTP 403"},{"source":"AI局内人｜AGI Insider","message":"HTTP 403"},{"source":"乱翻书","message":"HTTP 403"}]},{"date":"2026-08-18","items":[{"id":"6e6c9d5da87a208e","source":"Latent Space","type":"podcast","lang":"en","url":"https://www.latent.space/p/ainews-stripe-buys-openrouter-for","titleOriginal":"[AINews] Stripe buys OpenRouter for $7B","publishedAt":"2026-08-17T23:13:41.000Z","brief":true,"thin":false,"titleZh":"【AINews】Stripe以70亿美元收购OpenRouter","summaryZh":"Stripe以约70亿美元收购模型路由平台OpenRouter，距其13亿美元估值的B轮融资仅90天。据报道其年化收入1.4亿美元、毛利率约70%，月处理token量已达250万亿，较2月的50万亿增长5倍，服务超800万开发者。"},{"id":"aa62f026f027fbb3","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/jYxttRpJvYvCGvyBc/you-can-t-iterate-to-trustworthy-ai-code-without","titleOriginal":"You Can't Iterate to Trustworthy AI Code Without Understanding","publishedAt":"2026-08-17T23:07:11.000Z","brief":false,"thin":false,"titleZh":"没有理解，就无法靠迭代做出可信的AI代码","summaryZh":"作者认为，在递归自我改进(RSI)加速推进的背景下，安全研究这类模糊任务不能仅靠迭代自动生成代码的结果而跳过人类理解，否则可能产出有缺陷却被误判为安全的方案，进而放行不安全的AI部署，这是制约自动化速度的关键因素。"},{"id":"ee74e485f5e932ec","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/xyqjNGP34AN7a9bBb/do-your-readers-get-annoyed-if-you-post-every-day-for-30","titleOriginal":"Do your readers get annoyed if you post every day for 30 days?","publishedAt":"2026-08-17T21:59:24.000Z","brief":false,"thin":false,"titleZh":"连续30天每天发博客，读者会烦吗？","summaryZh":"作者提问式短帖：受Inkhaven 3和NaNoWriMo启发，考虑挑战连续30天每天发一篇博客，想请教读者是否会因发帖过于频繁而反感，以及是否该另开一个小号专门发布这些内容。"},{"id":"44f1573bad6bc57c","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/APqWYLRDFcBHd3AuL/what-27-ai-safety-generalists-are-building-this-summer","titleOriginal":"What 27 AI Safety Generalists Are Building This Summer","publishedAt":"2026-08-17T21:56:55.000Z","brief":false,"thin":false,"titleZh":"27名AI安全通才，今夏都在忙什么项目","summaryZh":"转载自EA论坛，介绍Kairos与Constellation联合举办的Generator Residency项目：27名学员今夏驻留伯克利三个月，项目涵盖为转行者办讲习班、建跨机构人才库、支持高校AI安全社团等多个方向。"},{"id":"e4832ddd3ebba00b","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/zRKNd6ypTJYkoeFmK/what-gives-you-away-how-llms-form-opinions-of-you","titleOriginal":"What gives you away: how LLMs form opinions of you","publishedAt":"2026-08-17T21:11:25.000Z","brief":false,"thin":false,"titleZh":"从只言片语看透你：LLM如何形成对用户的判断","summaryZh":"已有研究显示，模型仅凭首条消息就能推断用户年龄、教育和社会经济地位等属性并据此改变回答，如判断经济条件一般便过滤贵航班。作者进一步探究触发判断的线索：除直接自述外，表情符号、大小写、句法、俚语等隐性信号同样会被捕捉。"},{"id":"88a8c2f382b72796","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/z9fPtghFxELBXebY3/evaluating-chain-of-thought-monitorability-is-still-an-open","titleOriginal":"Evaluating Chain-of-Thought Monitorability is Still an Open Problem: Comments on OpenAI's Monitorability Evals","publishedAt":"2026-08-17T19:46:43.000Z","brief":false,"thin":false,"titleZh":"思维链可监控性评测仍是未解难题：评OpenAI的Monitorability论文","summaryZh":"针对OpenAI在ICML 2026发表的《Monitoring Monitorability》，作者认为该文提出了迄今最全面的思维链监控性评测集，OpenAI承诺公布并回填模型卡结果，但仍不足以证明CoT监控能捕捉所有需关注的风险行为。"},{"id":"bf50ec5ce617ac83","source":"Hugging Face Blog","type":"lab","lang":"en","url":"https://huggingface.co/blog/Dharma-AI/gpu-management-pt2","titleOriginal":"Same Cluster, 33 Points More Utilization: What Changed Was the Order","publishedAt":"2026-08-17T19:46:21.000Z","brief":false,"thin":false,"titleZh":"同一集群，光靠调度顺序就把利用率提高33个百分点","summaryZh":"Dharma-AI团队自建了一套约束感知的GPU调度器，与FIFO调度器在七个基准场景下对比：硬件和负载完全不变，仅改变分配决策顺序，GPU利用率最高提升33个百分点，按优先级加权的产出最高提升105%。"},{"id":"0e9e039523996b4c","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/osWWL4yfentdhX9Q7/weird-re-tokenization-symmetries-and-compression-research","titleOriginal":"Weird Re-Tokenization, Symmetries and Compression: Research Agenda","publishedAt":"2026-08-17T19:43:34.000Z","brief":false,"thin":false,"titleZh":"诡异的重新分词、对称性与压缩：一份研究议程","summaryZh":"作者指出，LLM从未在训练中接触过非常规分词方式，却能理解甚至生成被错误切分的文本，这类现象在对齐研究中尚缺乏关注。本文回顾分词原理，并宣布后续系列博客将梳理相关文献与实验，聚焦其中的安全含义。"},{"id":"574b44c165d10f16","source":"The Algorithm","type":"newsletter","lang":"en","url":"https://www.technologyreview.com/2026/08/17/1142200/what-flocks-defenders-are-missing/","titleOriginal":"What Flock’s defenders are missing","publishedAt":"2026-08-17T19:16:09.000Z","brief":false,"thin":false,"titleZh":"Flock的辩护者们忽略了什么","summaryZh":"警用车牌识别巨头Flock上周更新平台规则，试图防止警员滥用系统跟踪骚扰他人——此前《华盛顿邮报》曝光50起滥用案例，一名女性遭前男友警员查询179次。但新规存在漏洞，警员仍可编造虚假案号绕过审查机制。"},{"id":"15a1ff113f20c744","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/Cke4aTXGB7aG8zCsx/fork-around-and-find-out-part-3-interpreting-the-knight","titleOriginal":"Fork Around and Find Out Part 3: Interpreting the knight auditor","publishedAt":"2026-08-17T18:11:10.000Z","brief":false,"thin":false,"titleZh":"\"捣鼓一下看看\"第三篇：重新解读国际象棋模型里的\"马步审计员\"","summaryZh":"系列终篇：作者此前将国际象棋Transformer Maia-3中的l5h5注意力头解读为\"抓马叉探测器\"，本文通过定制探针证明该解读有误，其实际功能是按威胁等级给马步打分，核心作用是抑制无意义的马步走法。"},{"id":"4946272e590cfcd5","source":"Interconnects","type":"blog","lang":"en","url":"https://www.interconnects.ai/p/teaching-everyone-to-fish-for-tokens","titleOriginal":"Teaching Everyone to Fish for Tokens","publishedAt":"2026-08-17T15:07:49.000Z","brief":false,"thin":false,"titleZh":"教所有人学会\"钓\"token：开源模型生态的自我延续","summaryZh":"作者将开源模型生态与开源操作系统类比：附带完整训练配方的开源模型更像Linux本身，仅开放权重的模型则更像装进项目里的某个软件版本。权重虽会过时，但仍可能像Llama 3一样在智能体应用兴起多年后依旧被沿用。"},{"id":"0aab5c079239719b","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/GEaf2BCufztdmarGK/connect-to-your-future-selves","titleOriginal":"Connect to your future selves","publishedAt":"2026-08-17T14:57:44.000Z","brief":false,"thin":false,"titleZh":"与未来的自己重新建立连接","summaryZh":"作者认为，人和未来自我的关系应建立在\"对未来慈善、对过去负责\"的原则上，但很多人活在永恒的当下，把未来自我当陌生人对待，例子包括网上大量写了一两篇就烂尾、承诺\"以后常更新\"的博客和项目。"},{"id":"ee0714b1359972a9","source":"Exponential View","type":"newsletter","lang":"en","url":"https://www.exponentialview.co/p/data-to-start-your-week-26-08-17","titleOriginal":"📈 Data to start your week","publishedAt":"2026-08-17T13:37:21.000Z","brief":false,"thin":false,"titleZh":"本周AI经济数据速览","summaryZh":"Exponential View周报数据：企业AI经济年化收入超2100亿美元，7月同比增3倍；用OpenAI最多的前10%企业token用量是普通企业8.3倍；企业对顶级模型Fable 5用量趋平，仅占6%，付费意愿已见顶。"},{"id":"d017b3bf2d733737","source":"Import AI","type":"newsletter","lang":"en","url":"https://jack-clark.net/2026/08/17/import-ai-469-science-ai-rsi-simulator-and-zucks-technological-pessimism/","titleOriginal":"Import AI 469: Science AI; RSI simulator; and Zuck’s technological pessimism","publishedAt":"2026-08-17T13:05:36.000Z","brief":false,"thin":false,"titleZh":"Import AI第469期：科学AI、RSI模拟器与扎克伯格的技术悲观论","summaryZh":"本期头条介绍新基准DiG-bench：由70个游戏组成的测试集，规则和目标对AI隐藏，需通过探索发现，用于衡量模型推断环境隐藏规则的能力；文中提到Fable在该基准上展现出一定的创造性直觉，被视为理解AI创造力的新方向。"},{"id":"147eead27e58fc03","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/585703.html","titleOriginal":"千问办公首个开源项目：从飞书和钉钉里蒸馏出“第二个你”","publishedAt":"2026-08-17T12:55:14.000Z","brief":false,"thin":false,"titleZh":"千问办公首个开源项目：从飞书和钉钉里蒸馏出“第二个你”","summaryZh":"千问办公开源个人工作上下文基础设施MyContext，上线一周多GitHub已破1k星。它从飞书、钉钉的聊天、文档、会议记录中持续提炼用户工作方式，形成结构化个人档案供Agent调用，定位是补齐AI办公的\"上下文层\"。"},{"id":"632aba409a7b29b6","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/585603.html","titleOriginal":"撕开清洁机器人新蓝海！38厘米机身普渡ET1 交出具身智能商用新答卷","publishedAt":"2026-08-17T11:10:41.000Z","brief":false,"thin":false,"titleZh":"撕开清洁机器人新蓝海！38厘米机身普渡ET1 交出具身智能商用新答卷","summaryZh":"世界机器人大会前，普渡机器人推出AI原生小型扫洗机器人PUDU ET1，机身宽38厘米、高58厘米，可钻入货架底部和桌椅间隙，集扫地、洗地、吸尘、尘推于一体，采用85℃热水洗地方案清除油污糖渍，定位100至800平方米商业空间。"},{"id":"6177621fb2b7d5bf","source":"LessWrong","type":"community","lang":"en","url":"https://www.lesswrong.com/posts/WrGeH5Gz5KsAY5Lq2/lateral-workshop-applications-a-case-study","titleOriginal":"Lateral Workshop Applications: A Case Study","publishedAt":"2026-08-17T10:38:23.000Z","brief":false,"thin":false,"titleZh":"Lateral Workshop招生复盘：700份申请背后的取舍","summaryZh":"面向转行AI安全领域专业人士的三天项目Lateral Workshop收到700余份申请，多数被拒。作者分享评审中的常见误判和申请人常犯的表达问题，指出清晰展现职业能力比经验本身更能打动评委。"},{"id":"f987f977374481b4","source":"Google Research Blog","type":"lab","lang":"en","url":"https://research.google/blog/seeing-beyond-bmi-estimating-cardiometabolic-risk-with-smartphone-imagery/","titleOriginal":"Seeing beyond BMI: Estimating cardiometabolic risk with smartphone imagery","publishedAt":"2026-08-17T10:34:00.000Z","brief":false,"thin":false,"titleZh":"超越BMI：用手机照片估算心脏代谢风险","summaryZh":"Google Research提出PhotoScan方法，用深度学习从手机照片估算人体成分，在临床研究场景下预测胰岛素抵抗的准确度可媲美DXA骨密度扫描。胰岛素抵抗是2型糖尿病的早期隐匿指标，往往早于空腹血糖异常多年出现。"},{"id":"f42e604220538e98","source":"甲子光年","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzU5OTI0NTc3Mg==&mid=2247556727&idx=1&sn=34740a113cd7571cf893932b57ab181f","titleOriginal":"中科院自动化所孵化的矿山物理AI龙头，国家队与产业资本为何集体重仓｜甲子光年","publishedAt":"2026-08-17T10:18:00.000Z","brief":false,"thin":false,"titleZh":"中科院自动化所孵化的矿山物理AI龙头，国家队与产业资本为何集体重仓｜甲子光年","summaryZh":"文章聚焦中科慧拓：由中科院自动化所孵化，技术源自“平行智能”理论，已落地近50座矿山并出海泰国。矿山因边界清晰、人力成本高、安全风险大，成为物理AI最先跑出商业回报的场景，弗若斯特沙利文预计中国矿区无人驾驶市场2030年将达301亿元。"},{"id":"7e608b2fac7c87e7","source":"Founder Park","type":"media","lang":"zh","url":"https://mp.weixin.qq.com/s?__biz=MzY5ODQwMTkxNA==&mid=2247516586&idx=1&sn=49d174cee784f32c86e9fafd5338a62e","titleOriginal":"Evolvent AI 胡梦康：Agent 可能会被模型吃掉，但帮助 Agent 进化不会","publishedAt":"2026-08-17T10:15:00.000Z","brief":false,"thin":false,"titleZh":"Evolvent AI 胡梦康：Agent 可能会被模型吃掉，但帮助 Agent 进化不会","summaryZh":"港大博士生、OWL作者胡梦康创立Evolvent AI，搭建Self-Evolving Agent Infrastructure，用规模化任务环境让Agent交互积累数据、持续进化。他认为方向落地仍需时间，希望做Agent进化的数据基础设施商。"},{"id":"6f5136259d44ae6b","source":"少数派","type":"media","lang":"zh","url":"https://sspai.com/post/113544","titleOriginal":"派评 | 近期值得关注的 App","publishedAt":"2026-08-17T10:14:56.000Z","brief":false,"thin":false,"titleZh":"派评 | 近期值得关注的 App","summaryZh":"少数派编辑部联合多位作者推荐近期值得关注的App，摘录部分内容介绍Notomo：一款为macOS系统备忘录增强Markdown实时渲染、CJK友好快捷语法和跨应用技能等功能的效率插件。"},{"id":"2b4949316765c4a0","source":"智东西","type":"media","lang":"zh","url":"https://zhidx.com/p/585661.html","titleOriginal":"刚刚，阿里“快乐虾米”来了！我用它给《牛来》做了个主题曲","publishedAt":"2026-08-17T10:10:26.000Z","brief":false,"thin":false,"titleZh":"刚刚，阿里“快乐虾米”来了！我用它给《牛来》做了个主题曲","summaryZh":"阿里巴巴发布AI音乐模型HappyShrimp 1.0(快乐虾米)，可端到端生成含歌词、旋律、编曲与人声的完整歌曲，仅凭自然语言描述约1分钟即可完成创作。作者体验后用它为电影《牛来》生成了一段主题曲，名字致敬阿里曾经的虾米音乐平台。"},{"id":"ac461d15204fbdfb","source":"Stratechery","type":"newsletter","lang":"en","url":"https://stratechery.com/2026/stripe-acquiring-openrouter-aggregating-ai-flipping-the-business-model/","titleOriginal":"Stripe Acquiring OpenR
